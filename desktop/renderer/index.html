<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch Fiber Desktop — Setup</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b1220;
        color: #f0f4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .setup-card {
        background: #131c2f;
        border-radius: 10px;
        padding: 28px 32px;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .setup-card h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      .setup-card p.subtitle {
        margin: 0 0 18px;
        color: #94a3b8;
        font-size: 13px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #cbd5e1;
      }
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        background: #0b1220;
        color: #f0f4ff;
        border: 1px solid #334155;
        border-radius: 6px;
        box-sizing: border-box;
      }
      input[type='text']:focus {
        outline: none;
        border-color: #60a5fa;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        flex: 1;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
      }
      button.primary:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: #334155;
        color: #f0f4ff;
      }
      button.secondary:hover {
        background: #475569;
      }
      .error {
        color: #f87171;
        font-size: 13px;
        margin-top: 10px;
        min-height: 16px;
      }
      .hint {
        font-size: 12px;
        color: #64748b;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="setup-card">
      <h1>Launch Fiber Desktop</h1>
      <p class="subtitle">Set the server URL to connect to.</p>

      <label for="serverUrl">Server URL</label>
      <input
        type="text"
        id="serverUrl"
        placeholder="https://launchfiberadminportal.xyz"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="hint">
        Default: <code>https://launchfiberadminportal.xyz</code>. For local development use
        <code>http://localhost:3000</code>.
      </p>

      <div class="actions">
        <button id="saveBtn" class="primary">Save and Continue</button>
        <button id="defaultBtn" class="secondary">Use Default</button>
      </div>
      <div id="errorMsg" class="error"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
