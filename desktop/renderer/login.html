<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Launch Fiber Desktop</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="loginApp">
      <div class="login-container">
        <div class="login-card">
          <h1>Launch Fiber Desktop</h1>
          <p class="login-subtitle">Sign in to your workspace</p>

          <form id="loginForm">
            <div class="form-group">
              <label for="server">Server URL</label>
              <input
                type="text"
                id="server"
                name="server"
                placeholder="https://launchdb-production.up.railway.app"
                required
                value="https://launchdb-production.up.railway.app"
              />
            </div>

            <div class="form-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="your@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" class="login-btn">Sign In</button>
          </form>

          <div id="errorMessage" class="error-message" style="display: none;">
            <!-- Error message appears here -->
          </div>
        </div>

        <footer class="login-footer">
          <p>
            Launch Fiber Services — Internal Beta
          </p>
        </footer>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
