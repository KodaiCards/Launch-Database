<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Fiber Services — Client Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/launcher-back.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
/* Token system mirrors the admin app + 3 internal portals. Surfaces,
   text, status colors, and brand all flip in dark mode without per-
   component overrides. Legacy aliases preserved for inline styles. */
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;--primary-text:#FFFFFF;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --gray-light:#F5F7FA;--white:#FFFFFF;--row-alt:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;--gray-border:#DEE2E6;--gray:#6B6B6B;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#B71C1C;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;--primary-text:#FFFFFF;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --gray-light:#1A1F26;--white:#1D2430;--row-alt:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#EF5350;--danger-light:#3D1F23;--danger-text:#F8B4BD;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text);min-height:100vh}
html[data-theme="dark"] body{background:var(--bg-deep)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* Header */
.header{background:var(--surface-2);border-bottom:1px solid var(--gray-border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{font-size:14px;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:8px}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:all .15s;text-decoration:none;color:inherit}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--surface-1)}
.btn-icon{padding:6px 8px}
.btn-sm{padding:6px 10px;font-size:12px}

.account-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid var(--gray-border);background:var(--surface-2)}
.account-pill:hover{background:var(--surface-1)}
.account-pill strong{color:var(--text)}

/* Main */
.container{max-width:1100px;margin:20px auto;padding:0 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-border);margin-bottom:14px}
.tabs button{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.card{background:var(--surface-2);border:1px solid var(--gray-border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-title{font-size:14px;font-weight:600;color:var(--text)}

/* Stat tiles */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.stat-card{padding:14px;background:var(--surface-2);border:1px solid var(--gray-border);border-radius:10px}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:700;color:var(--text);margin-top:4px}

/* Project rows */
.proj-row{padding:12px 14px;border-bottom:1px solid var(--gray-border);display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;cursor:pointer}
.proj-row:hover{background:var(--surface-1)}
.proj-row:last-child{border-bottom:none}
.proj-name{font-weight:600;color:var(--text)}
.proj-sub{font-size:11px;color:var(--text-muted)}
.status-pill{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:inline-block}
.status-active{background:var(--info-light);color:var(--info-text)}
.status-completed{background:var(--success-light);color:var(--success-text)}
.status-billed{background:var(--success);color:#fff}
.status-on_hold{background:var(--warning-light);color:var(--warning-text)}

/* Progress bar */
.progress-track{width:140px;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark))}

/* Service-area cards (Phase 6 — status/progress only, no $) */
.sa-prog-line{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.sa-team{margin-top:12px}
.sa-team-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.job-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:500;margin:0 6px 6px 0;background:var(--surface-1);border:1px solid var(--gray-border);color:var(--text-secondary)}
.job-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex:none}
.job-chip.done .dot{background:var(--success)}
.job-chip.cancelled{opacity:.5;text-decoration:line-through}
.badge-rus{background:var(--info-light);color:var(--info-text);padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:6px;vertical-align:middle}
.badge-prog{background:var(--surface-3);color:var(--text-muted);padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.sa-toggle{margin-top:12px;font-size:12px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:6px;padding:4px 0;background:none;border:none;cursor:pointer}
.sa-detail{margin-top:4px;overflow-x:auto}
.sa-detail th{white-space:nowrap}
.sa-map-ph{margin-top:12px;padding:10px 12px;border:1px dashed var(--gray-border);border-radius:8px;color:var(--text-muted);font-size:12px;display:flex;align-items:center;gap:8px}
.sa-map-link{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--gray-border);border-radius:8px;color:var(--primary);font-size:12px;font-weight:600;text-decoration:none;background:var(--surface-1)}
.sa-map-link:hover{background:var(--primary-light)}
.sa-map-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Per-area timeline + stage progression */
.sa-timeline{margin-top:12px}
.sa-dates{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sa-stages{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sa-stage{font-size:11px;color:var(--text-muted);padding:2px 8px;border-radius:8px;background:var(--surface-1);border:1px solid var(--gray-border)}
.sa-stage.past{color:var(--text-secondary)}
.sa-stage.current{color:var(--primary);border-color:var(--primary);background:var(--primary-light);font-weight:700}
.sa-stage-sep{font-size:9px;color:var(--text-muted)}
.sa-feed{margin-top:12px}
.sa-feed-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.sa-feed-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:3px 0}
.sa-feed-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none}
.sa-feed-date{margin-left:auto;color:var(--text-muted);font-size:11px;white-space:nowrap}

/* Portal landing summary (above the tabs, across all areas) */
.cp-landing{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;padding:16px;margin-bottom:14px;align-items:start}
.cp-landing-num{font-size:26px;font-weight:700;color:var(--text);line-height:1.1}
.cp-landing-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* Service Areas summary header */
.sa-summary{padding:14px 16px;margin-bottom:14px}
.sa-summary-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sa-summary-total{font-size:18px;font-weight:700;color:var(--text)}
.sa-summary-sub{font-size:12px;color:var(--text-muted)}
.sa-summary-prog{flex:1;min-width:180px;max-width:300px}

/* Invoice status pills */
.inv-status{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:inline-block}
.inv-sent{background:var(--info-light);color:var(--info-text)}
.inv-paid{background:var(--success-light);color:var(--success-text)}
.inv-overdue{background:var(--danger-light);color:var(--danger-text)}
.inv-partial{background:var(--warning-light);color:var(--warning-text)}
.inv-void{background:var(--surface-3);color:var(--text-muted)}

/* Printable invoice layout */
.cp-inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--gray-border)}
.cp-inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin-bottom:18px}
.cp-inv-lbl{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
@media print {
  body * { visibility: hidden !important; }
  .cp-printable, .cp-printable * { visibility: visible !important; }
  .cp-printable { position: absolute; left: 0; top: 0; width: 100%; padding: 0 12px; }
  .cp-no-print { display: none !important; }
  .modal-overlay { position: static !important; display: block !important; background: none !important; padding: 0 !important; }
  .modal-content { box-shadow: none !important; max-width: 100% !important; max-height: none !important; border: none !important; }
  .modal-body { overflow: visible !important; max-height: none !important; }
}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:var(--modal-backdrop);z-index:100;align-items:center;justify-content:center;padding:14px}
.modal-content{background:var(--surface-2);border-radius:10px;max-width:680px;width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600;color:var(--text)}
.modal-body{padding:18px;flex:1;overflow:auto}
.modal-footer{padding:12px 18px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:8px}
.empty-state{padding:40px 20px;text-align:center;color:var(--text-muted)}
.empty-state i{font-size:36px;margin-bottom:10px;opacity:.3}
/* a11y */
.skip-nav{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999;text-decoration:none}
.skip-nav:focus{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:auto;height:auto;padding:10px 20px;background:var(--primary);color:#fff;font-weight:600;border-radius:6px;font-size:14px;z-index:9999}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Loading skeletons */
.sk{position:relative;overflow:hidden;background:var(--surface-3);border-radius:6px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sk-shimmer 1.4s infinite}
html[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
@keyframes sk-shimmer{100%{transform:translateX(100%)}}
.cp-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* SA filter + search bar (task 16) */
.sa-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sa-filter-bar input{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--gray-border);border-radius:6px;font-size:13px;background:var(--surface-2);color:var(--text);font-family:inherit}
.sa-filter-bar input:focus{outline:none;border-color:var(--primary)}
.sa-filter-bar select{padding:7px 10px;border:1px solid var(--gray-border);border-radius:6px;font-size:13px;background:var(--surface-2);color:var(--text);font-family:inherit;cursor:pointer}
.sa-filter-bar select:focus{outline:none;border-color:var(--primary)}

/* Multi-client switcher (task 15) */
.cp-client-switcher{display:flex;align-items:center;gap:8px;padding:8px 0 12px;flex-wrap:wrap}
.cp-client-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--gray-border);background:var(--surface-2);color:var(--text-muted);cursor:pointer;transition:all .15s}
.cp-client-btn.active{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.cp-client-btn:hover:not(.active){background:var(--surface-1)}

/* Responsive / mobile */
@media (max-width:600px){
  .container{margin:12px auto;padding:0 12px}
  .cp-landing{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
  .cp-landing-num{font-size:21px}
  .tabs{gap:0;overflow-x:auto}
  .tabs button{padding:9px 10px;font-size:12px;white-space:nowrap}
  .proj-row{grid-template-columns:1fr}
  .cp-inv-meta{grid-template-columns:1fr}
  .cp-inv-head{flex-direction:column;gap:8px}
  .cp-inv-head>div:last-child{text-align:left}
  .sa-summary-row{flex-direction:column;align-items:flex-start}
  .sa-summary-prog{max-width:100%;width:100%}
  .modal-content{max-height:94vh}
  .header{padding:10px 14px}
}
</style>
<script src="/toast.js" defer></script>
<script src="/js/change_password_modal.js" defer></script>
</head>
<body>

<a href="#main-content" class="skip-nav">Skip to main content</a>

<header class="header">
  <a href="/client/" class="launcher-back-btn" data-launcher-back style="display:none">
    &#8592; Launcher
  </a>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="header-title">Launch Fiber Services</span>
    <span style="font-size:12px;color:var(--text-muted)">Client Portal</span>
  </div>
  <div class="header-right">
    <button class="btn btn-secondary btn-sm btn-icon" onclick="toggleDarkMode()" title="Toggle dark mode" aria-label="Toggle dark mode">
      <i class="fa-solid fa-moon" id="dm-icon" aria-hidden="true"></i>
    </button>
    <div class="account-pill" id="user-pill" style="display:none" role="button" tabindex="0" aria-haspopup="dialog" aria-label="Account menu" onclick="showAccountMenu()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showAccountMenu();}">
      <i class="fa-solid fa-user-circle" aria-hidden="true"></i>
      <span id="user-pill-text"></span>
    </div>
  </div>
</header>

<main class="app-content container" id="main-content">
  <!-- ═════════════ UNDER CONSTRUCTION ═════════════
       Owner explicitly asked that the client portal stay un-populated
       until they finalize the UI + decide what data should surface.
       The schema (customer_clients), the role ('customer'), the API
       endpoints (/api/customer/*), and the admin link-management
       endpoints are all wired up below — the only thing held back is
       the customer-visible UI. When ready, replace this block with the
       real Projects / Invoices tabs (the original render code lives in
       git history at the commit just before this one). -->
  <!-- WIP preview: shim lifted by CEO 2026-06-23 so the live URL shows the
       in-progress portal. Service-area data appears only for areas marked
       client-visible (admin toggle on the service-area editor). -->
  <div class="card" style="margin-top:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:3px solid var(--warning)">
    <i class="fa-solid fa-screwdriver-wrench" style="color:var(--warning)"></i>
    <span style="font-size:12px;color:var(--text-muted)">Preview — work in progress. Service areas show only when marked client-visible.</span>
  </div>
  <div id="cp-client-switcher"></div>
  <div id="cp-landing"></div>
  <div>
    <div class="tabs" id="cp-tabs" role="tablist" aria-label="Portal sections">
      <button class="active" role="tab" id="cp-tabbtn-projects" aria-selected="true" aria-controls="cp-tab-projects" data-tab="projects" onclick="cpSelectTab('projects')">Projects</button>
      <button role="tab" id="cp-tabbtn-invoices" aria-selected="false" aria-controls="cp-tab-invoices" data-tab="invoices" onclick="cpSelectTab('invoices')">Invoices</button>
      <button role="tab" id="cp-tabbtn-service-areas" aria-selected="false" aria-controls="cp-tab-service-areas" data-tab="service-areas" onclick="cpSelectTab('service-areas')">Service Areas</button>
    </div>
    <div id="cp-tab-projects" class="cp-tab" role="tabpanel" aria-labelledby="cp-tabbtn-projects" tabindex="0">
      <div class="stats-grid" id="cp-stats"></div>
      <div id="cp-projects-body"></div>
    </div>
    <div id="cp-tab-invoices" class="cp-tab" role="tabpanel" aria-labelledby="cp-tabbtn-invoices" tabindex="0" style="display:none">
      <div id="cp-invoices-body"></div>
    </div>
    <div id="cp-tab-service-areas" class="cp-tab" role="tabpanel" aria-labelledby="cp-tabbtn-service-areas" tabindex="0" style="display:none">
      <div id="cp-sa-header"></div>
      <div class="stats-grid" id="cp-sa-stats"></div>
      <div id="cp-sa-filter"></div>
      <div id="cp-sa-body"></div>
    </div>
  </div> <!-- /display:none wrapper closing the under-construction shim -->
</main>

<!-- Project detail modal — opens on row click -->
<div class="modal-overlay" id="cp-detail-modal" role="dialog" aria-modal="true" aria-labelledby="cp-detail-title">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="cp-detail-title">Project</span>
      <button class="btn btn-icon btn-secondary" aria-label="Close dialog" onclick="document.getElementById('cp-detail-modal').style.display='none'"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="modal-body" id="cp-detail-body"></div>
  </div>
</div>

<!-- Map preview modal — inline image/PDF viewer (served via ?inline=1) -->
<div class="modal-overlay" id="cp-map-modal" role="dialog" aria-modal="true" aria-labelledby="cp-map-title">
  <div class="modal-content" style="max-width:900px;width:100%">
    <div class="modal-header">
      <span class="modal-title" id="cp-map-title">Map</span>
      <button class="btn btn-icon btn-secondary" aria-label="Close dialog" onclick="cpCloseMap()"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="modal-body" id="cp-map-body"></div>
  </div>
</div>

<script>
// ─── Dark mode (mirrors other portals) ────────────────────────────────
function applyDarkMode(on){
  document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light');
  const icon = document.getElementById('dm-icon');
  if (icon) icon.className = on ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function toggleDarkMode(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = !isDark;
  try { localStorage.setItem('lfs-theme', next ? 'dark' : 'light'); } catch(e){}
  applyDarkMode(next);
  fetch('/api/auth/me/theme', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ theme: next ? 'dark' : 'light' })
  }).catch(()=>{});
}
(function(){
  try {
    const saved = localStorage.getItem('lfs-theme');
    if (saved === 'dark') applyDarkMode(true);
    else if (saved === 'light') applyDarkMode(false);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applyDarkMode(true);
    }
  } catch(e){}
})();

function esc(s){ if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtHours(n){ return (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' hrs'; }
function fmtDate(d){ if (!d) return '—'; return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }

async function api(url, opts){
  const r = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}));
  if (r.status === 401){ window.location.href = '/login'; return; }
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.error || `HTTP ${r.status}`); }
  return r.json();
}

// a11y: open a modal with focus moved inside; ESC closes any open modal and
// restores focus to the trigger.
let _lastFocus = null;
function cpShowModal(el){
  if (!el) return;
  _lastFocus = document.activeElement;
  el.style.display = 'flex';
  const f = el.querySelector('.modal-header button') || el.querySelector('button, a[href], input');
  if (f) { try { f.focus(); } catch (e) {} }
}
function cpCloseModals(){
  let closed = false;
  document.querySelectorAll('.modal-overlay').forEach(m => {
    if (getComputedStyle(m).display !== 'none') {
      if (m.id === 'account-modal') m.remove(); else m.style.display = 'none';
      closed = true;
    }
  });
  const mapBody = document.getElementById('cp-map-body'); if (mapBody) mapBody.innerHTML = '';
  if (closed && _lastFocus) { try { _lastFocus.focus(); } catch (e) {} _lastFocus = null; }
  return closed;
}

// ─── Service Areas (Phase 6 — keystone status view, no $) ─────────────
// Backed by GET /api/customer/service-areas, which returns ONLY
// status/progress (no rates, amounts, or invoices). Render mirrors that:
// per-area status + a jobs-done/total progress bar + per-team job statuses.
let _customerServiceAreas = [];
const SA_TEAM_LABELS = { permitting: 'Permitting', design: 'Design', construction: 'Construction', other: 'Other' };
const SA_DONE = new Set(['complete', 'billed']);
const SA_STAGES = ['Not started', 'In progress', 'Complete', 'Billed'];
// Coarse area stage derived from its (non-cancelled) job statuses.
function saStageIndex(jobs){
  const live = (jobs || []).filter(j => j.status !== 'cancelled');
  if (!live.length) return 0;
  if (live.every(j => j.status === 'billed')) return 3;
  if (live.every(j => j.status === 'complete' || j.status === 'billed')) return 2;
  if (live.some(j => j.status !== 'potential')) return 1;
  return 0;
}
// Naive projected completion: extrapolate elapsed time by current % done.
// Only when in progress (no completed_date), started, and 0 < pct < 100.
function saProjectedCompletion(a){
  if (a.completed_date || !a.start_date) return null;
  const pct = a.completion_pct;
  if (pct == null || pct <= 0 || pct >= 100) return null;
  const start = new Date(a.start_date + 'T00:00:00');
  const elapsed = (Date.now() - start.getTime()) / 86400000;
  if (!(elapsed > 0)) return null;
  const proj = new Date(start.getTime() + (elapsed / (pct / 100)) * 86400000);
  return isNaN(proj.getTime()) ? null : proj.toISOString().slice(0, 10);
}
// Derived "recent updates" feed from job start/completed dates we already
// fetch (no new endpoint, no history table). Newest first, top few.
function saRecentUpdates(a){
  const ev = [];
  (a.jobs || []).forEach(j => {
    const name = j.job_name || 'Job';
    if (j.start_date) ev.push({ d: j.start_date, t: `${name} started` });
    if (j.completed_date) ev.push({ d: j.completed_date, t: `${name} completed` });
  });
  if (a.completed_date) ev.push({ d: a.completed_date, t: 'Service area completed' });
  ev.sort((x, y) => (x.d < y.d ? 1 : x.d > y.d ? -1 : 0));
  return ev.slice(0, 4);
}

}

// Landing summary above the tabs — aggregates across ALL the client's
// service areas. Renders whenever SA data (re)loads (init lands on the SA
// tab, so it populates on first paint).
function cpRenderLanding(){
  const el = document.getElementById('cp-landing');
  if (!el) return;
  const areas = (_customerServiceAreas || []).filter(a => !_selectedClientId || a.client_id === _selectedClientId);
  if (!areas.length){ el.innerHTML = ''; return; }
  const isDone = s => ['completed','billed','complete'].includes(String(s || '').toLowerCase());
  const active = areas.filter(a => String(a.status || '').toLowerCase() === 'active').length;
  const done = areas.filter(a => isDone(a.status)).length;
  const totalJobs = areas.reduce((s, a) => s + (Number(a.jobs_total) || 0), 0);
  const totalDone = areas.reduce((s, a) => s + (Number(a.jobs_done) || 0), 0);
  const overall = totalJobs > 0 ? Math.round(totalDone / totalJobs * 100) : null;
  el.innerHTML = `
    <div class="cp-landing card">
      <div class="cp-landing-item"><div class="cp-landing-num">${areas.length}</div><div class="cp-landing-lbl">Service areas</div></div>
      <div class="cp-landing-item"><div class="cp-landing-num">${active}</div><div class="cp-landing-lbl">Active</div></div>
      <div class="cp-landing-item"><div class="cp-landing-num">${done}</div><div class="cp-landing-lbl">Completed</div></div>
      <div class="cp-landing-item cp-landing-prog">
        <div class="cp-landing-num">${overall != null ? overall + '%' : '—'}</div>
        <div class="cp-landing-lbl">Overall complete</div>
        ${overall != null ? `<div class="progress-track" style="width:100%;margin-top:6px"><div class="progress-fill" style="width:${overall}%"></div></div>` : ''}
      </div>
    </div>`;
}

function renderServiceAreas(){
  const body = document.getElementById('cp-sa-body');
  const header = document.getElementById('cp-sa-header');
  const stats = document.getElementById('cp-sa-stats');
  const areas = (_customerServiceAreas || []).filter(a => !_selectedClientId || a.client_id === _selectedClientId);
  cpRenderLanding();
  if (!areas.length){
    cpSaClearChrome();
    cpRenderSaCards();
    return;
  }
  const isDone = s => ['completed','billed','complete'].includes(String(s || '').toLowerCase());
  const activeCount = areas.filter(a => String(a.status || '').toLowerCase() === 'active').length;
  const doneCount = areas.filter(a => isDone(a.status)).length;
  const totalJobs = areas.reduce((s, a) => s + (Number(a.jobs_total) || 0), 0);
  const totalDone = areas.reduce((s, a) => s + (Number(a.jobs_done) || 0), 0);
  // Overall completion is aggregate (all jobs done / all jobs), not an average
  // of per-area %, so big areas weigh proportionally.
  const overallPct = totalJobs > 0 ? Math.round(totalDone / totalJobs * 100) : null;
  if (header) header.innerHTML = `
    <div class="sa-summary card">
      <div class="sa-summary-row">
        <div>
          <div class="sa-summary-total">${areas.length} service area${areas.length === 1 ? '' : 's'}</div>
          <div class="sa-summary-sub">${activeCount} active · ${doneCount} completed</div>
        </div>
        <div class="sa-summary-prog">
          <div class="sa-summary-sub" style="margin-bottom:4px">${overallPct != null ? overallPct + '% complete overall' : 'No jobs yet'}</div>
          ${overallPct != null ? `<div class="progress-track" style="width:100%"><div class="progress-fill" style="width:${overallPct}%"></div></div>` : ''}
        </div>
      </div>
    </div>`;
  stats.innerHTML = `
    <div class="stat-card"><div class="stat-label">Active Areas</div><div class="stat-value">${activeCount}</div></div>
    <div class="stat-card"><div class="stat-label">Completed Areas</div><div class="stat-value">${doneCount}</div></div>
    <div class="stat-card"><div class="stat-label">Total Jobs</div><div class="stat-value">${totalJobs}</div></div>
  `;
  cpRenderSaFilter(areas.length);
  cpRenderSaCards();
}

function cpRenderSaCard(a){
    const status = String(a.status || 'active').toLowerCase();
    const pct = a.completion_pct;
    const projDate = saProjectedCompletion(a);
    const prog = pct != null
      ? `<div class="sa-prog-line">
           <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
           <span style="font-size:12px;color:var(--text-muted)">${a.jobs_done} of ${a.jobs_total} jobs done · ${pct}%</span>
         </div>
         ${projDate ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px"><i class="fa-regular fa-calendar-check" aria-hidden="true"></i> Est. completion ~ ${esc(fmtDate(projDate))}</div>` : ''}`
      : `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">No jobs yet.</div>`;
    // Timeline: date range + a coarse stage progression from job statuses.
    const sIdx = saStageIndex(a.jobs);
    let dateText;
    if (a.start_date && a.completed_date) dateText = `Started ${fmtDate(a.start_date)} → Completed ${fmtDate(a.completed_date)}`;
    else if (a.start_date) dateText = `Started ${fmtDate(a.start_date)} → In progress`;
    else if (a.completed_date) dateText = `Completed ${fmtDate(a.completed_date)}`;
    else dateText = 'No dates set yet';
    const stages = SA_STAGES.map((label, i) =>
      `<span class="sa-stage ${i < sIdx ? 'past' : ''} ${i === sIdx ? 'current' : ''}">${label}</span>`
    ).join('<i class="fa-solid fa-chevron-right sa-stage-sep" aria-hidden="true"></i>');
    const timeline = `<div class="sa-timeline">
      <div class="sa-dates"><i class="fa-regular fa-calendar" aria-hidden="true"></i> ${esc(dateText)}</div>
      <div class="sa-stages">${stages}</div>
    </div>`;
    const byTeam = {};
    (a.jobs || []).forEach(j => { const t = j.team || 'other'; (byTeam[t] = byTeam[t] || []).push(j); });
    const teams = ['permitting','design','construction','other'].filter(t => byTeam[t]).map(t => {
      const chips = byTeam[t].map(j => {
        const cls = 'job-chip' + (SA_DONE.has(j.status) ? ' done' : '') + (j.status === 'cancelled' ? ' cancelled' : '');
        return `<span class="${cls}"><span class="dot"></span>${esc(j.job_name || 'Job')} — ${esc(String(j.status || '').replace(/_/g,' '))}</span>`;
      }).join('');
      return `<div class="sa-team"><div class="sa-team-label">${esc(SA_TEAM_LABELS[t] || t)}</div><div>${chips}</div></div>`;
    }).join('');
    const badge = a.program === 'rus'
      ? '<span class="badge-rus">RUS</span>'
      : (a.program ? `<span class="badge-prog">${esc(a.program)}</span>` : '');
    // Expandable job-by-job detail: status + start/completed dates.
    const detailRows = (a.jobs || []).map(j => {
      const cls = 'job-chip' + (SA_DONE.has(j.status) ? ' done' : '') + (j.status === 'cancelled' ? ' cancelled' : '');
      return `<tr style="border-top:1px solid var(--gray-border)">
        <td style="padding:6px 10px">${esc(j.job_name || '—')}</td>
        <td style="padding:6px 10px;color:var(--text-muted)">${esc(SA_TEAM_LABELS[j.team] || j.team || '—')}</td>
        <td style="padding:6px 10px"><span class="${cls}"><span class="dot"></span>${esc(String(j.status || '').replace(/_/g,' '))}</span></td>
        <td style="padding:6px 10px">${fmtDate(j.start_date)}</td>
        <td style="padding:6px 10px">${fmtDate(j.completed_date)}</td>
      </tr>`;
    }).join('');
    const th = 'padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase';
    const detail = (a.jobs && a.jobs.length)
      ? `<button class="sa-toggle" type="button" aria-expanded="false" onclick="cpToggleArea('${esc(a.id)}', this)">
           <i class="fa-solid fa-chevron-right" aria-hidden="true"></i> Job details
         </button>
         <div class="sa-detail" id="sa-det-${esc(a.id)}" hidden>
           <table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:6px">
             <thead><tr style="background:var(--surface-1)">
               <th style="${th}">Job</th><th style="${th}">Team</th><th style="${th}">Status</th>
               <th style="${th}">Started</th><th style="${th}">Completed</th>
             </tr></thead>
             <tbody>${detailRows}</tbody>
           </table>
         </div>`
      : '';
    // Map: when one is on file (area is already client_visible), offer an
    // inline preview for image/PDF types plus a scoped download; otherwise
    // keep the Phase-7 placeholder.
    let mapBlock;
    if (a.has_map) {
      const ext = (String(a.map_filename || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [, ''])[1];
      const kind = ext === 'pdf' ? 'pdf' : (['png','jpg','jpeg','gif','webp'].includes(ext) ? 'image' : '');
      const dl = `<a class="sa-map-link" href="/api/customer/service-areas/${esc(a.id)}/map"><i class="fa-solid fa-download" aria-hidden="true"></i> Download map${a.map_filename ? ' — ' + esc(a.map_filename) : ''}</a>`;
      const view = kind
        ? `<button class="sa-map-link" type="button" onclick="cpOpenMap('${esc(a.id)}','${kind}')"><i class="fa-solid fa-map-location-dot" aria-hidden="true"></i> View map</button>`
        : '';
      mapBlock = `<div class="sa-map-actions">${view}${dl}</div>`;
    } else {
      mapBlock = `<div class="sa-map-ph"><i class="fa-solid fa-map" aria-hidden="true"></i> Map view coming soon.</div>`;
    }
    const updates = saRecentUpdates(a);
    const feed = updates.length
      ? `<div class="sa-feed">
           <div class="sa-feed-label">Recent updates</div>
           ${updates.map(u => `<div class="sa-feed-row"><span class="sa-feed-dot"></span><span>${esc(u.t)}</span><span class="sa-feed-date">${esc(fmtDate(u.d))}</span></div>`).join('')}
         </div>`
      : '';
    return `<div class="card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div>
          <div class="proj-name">${esc(a.name)}${badge}</div>
          <div class="proj-sub">
            ${a.work_order_number ? `<span style="font-family:monospace;margin-right:8px">WO# ${esc(a.work_order_number)}</span>` : ''}
            ${esc(a.client_name || '')}
          </div>
        </div>
        <span class="status-pill status-${esc(status)}">${esc(status.replace('_',' '))}</span>
      </div>
      ${prog}
      ${timeline}
      ${teams}
      ${feed}
      ${detail}
      ${mapBlock}
    </div>`;
}

function cpToggleArea(id, btn){
  const d = document.getElementById('sa-det-' + id);
  if (!d) return;
  const opening = d.hasAttribute('hidden');
  if (opening) d.removeAttribute('hidden'); else d.setAttribute('hidden', '');
  btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
  const ic = btn.querySelector('i');
  if (ic) ic.className = opening ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-right';
}

// Inline map preview. kind ('image'|'pdf') is decided client-side from the
// filename, but the server independently enforces the safe-inline allowlist
// (+ nosniff) on ?inline=1, so a mismatch can only break the preview, not
// execute anything. The src carries only our own UUID.
function cpOpenMap(id, kind){
  const area = (_customerServiceAreas || []).find(a => a.id === id);
  const body = document.getElementById('cp-map-body');
  document.getElementById('cp-map-title').textContent = (area && area.map_filename) ? area.map_filename : 'Map';
  const url = '/api/customer/service-areas/' + encodeURIComponent(id) + '/map?inline=1';
  body.innerHTML = kind === 'pdf'
    ? `<iframe src="${url}" title="Map preview" style="width:100%;height:72vh;border:none"></iframe>`
    : `<img src="${url}" alt="Map preview" style="max-width:100%;max-height:72vh;display:block;margin:0 auto">`;
  cpShowModal(document.getElementById('cp-map-modal'));
}
function cpCloseMap(){
  document.getElementById('cp-map-body').innerHTML = ''; // stop the iframe/img fetch
  document.getElementById('cp-map-modal').style.display = 'none';
}

function cpSelectTab(name){
  document.querySelectorAll('#cp-tabs button').forEach(b => {
    const sel = b.dataset.tab === name;
    b.classList.toggle('active', sel);
    b.setAttribute('aria-selected', sel ? 'true' : 'false');
  });
  document.querySelectorAll('.cp-tab').forEach(d => d.style.display = (d.id === 'cp-tab-' + name) ? '' : 'none');
  if (name === 'invoices') cpLoadInvoices();
  if (name === 'service-areas') cpLoadServiceAreas();
}

function showAccountMenu(){
  const existing = document.getElementById('account-modal');
  if (existing){ existing.remove(); return; }
  const u = _currentUser || {};
  const clients = _currentClients || [];
  _lastFocus = document.activeElement;
  const overlay = document.createElement('div');
  overlay.id = 'account-modal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Account');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="modal-content" style="max-width:380px">
      <div class="modal-header">
        <span class="modal-title"><i class="fa-solid fa-user-circle"></i> Account</span>
        <button class="btn btn-icon btn-secondary" onclick="document.getElementById('account-modal').remove()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="text-align:center;padding:8px 0 16px 0;border-bottom:1px solid var(--gray-border);margin-bottom:16px">
          <div style="font-size:18px;font-weight:600;margin-bottom:4px">${esc(u.full_name || u.username || '')}</div>
          <div style="font-size:12px;color:var(--text-muted)">${esc(u.email || u.username || '')}</div>
        </div>
        <div style="margin-bottom:16px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:6px">${clients.length === 1 ? 'Client' : 'Clients'}</div>
          ${clients.length ? clients.map(c => `<div style="font-size:13px;padding:2px 0">${esc(c.name)}</div>`).join('') : '<div style="font-size:13px;color:var(--text-muted)">—</div>'}
        </div>
        <div style="background:var(--surface-1);border:1px solid var(--gray-border);border-radius:8px;padding:12px;margin-bottom:16px">
          <div style="font-size:12px;font-weight:600;margin-bottom:4px"><i class="fa-solid fa-headset" style="margin-right:6px;color:var(--primary)" aria-hidden="true"></i>Need help?</div>
          <div style="font-size:12px;color:var(--text-muted)">Contact your Launch Fiber project manager with any questions about your service areas or invoices.</div>
        </div>
        <button class="btn btn-secondary" style="width:100%;justify-content:flex-start;padding:12px;margin-bottom:8px" onclick="document.getElementById('account-modal').remove();openChangePasswordModal()">
          <i class="fa-solid fa-key" style="margin-right:10px"></i><span>Change Password</span>
        </button>
        <button class="btn btn-secondary" style="width:100%;justify-content:flex-start;padding:12px;color:var(--danger)" onclick="signOut()">
          <i class="fa-solid fa-right-from-bracket" style="margin-right:10px"></i><span>Sign Out</span>
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  const cb = overlay.querySelector('.modal-header button'); if (cb) { try { cb.focus(); } catch (e) {} }
}
async function signOut(){
  try { await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'}); } catch(e){}
  window.location.href = '/login';
}

  await loadCurrentUser();
