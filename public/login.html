<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Launch Fiber Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
/* Login screen — uses design system tokens from /css/app-shell.css */
body{
  background:var(--surface-1);color:var(--text-1);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:var(--space-5);
}
.login-card{
  max-width:420px;width:100%;padding:var(--space-8);
}
.logo{display:flex;justify-content:center;margin-bottom:var(--space-6)}
.logo img{height:96px;width:auto;max-width:100%;object-fit:contain}
h1{font-size:var(--text-2xl);font-weight:600;text-align:center;margin-bottom:var(--space-1);color:var(--text-1)}
.subtitle{font-size:var(--text-sm);color:var(--text-muted);text-align:center;margin-bottom:var(--space-6)}
.field{margin-bottom:var(--space-4)}
.btn-primary.btn-block{width:100%;justify-content:center}
.error{
  background:var(--danger-light);color:var(--danger-text);border:1px solid var(--danger);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
  font-size:var(--text-sm);margin-bottom:var(--space-4);display:none;
}
.error.show{display:block}
.footer{text-align:center;font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-5)}
/* a11y: skip-nav */
.skip-nav{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999;text-decoration:none}
.skip-nav:focus{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:auto;height:auto;padding:var(--space-2) var(--space-5);background:var(--brand-primary);color:var(--surface-0);font-weight:600;border-radius:var(--radius-sm);font-size:var(--text-base);z-index:9999}
</style>
</head>
<body>

<a href="#main-content" class="skip-nav">Skip to main content</a>

<main id="main-content">
<div class="card login-card">
  <div class="logo">
    <img src="/img/launch-fiber-logo-transparent.png" alt="Launch Fiber Services">
  </div>
  <h1>Launch Fiber Services</h1>
  <p class="subtitle">Sign in to continue</p>

  <div class="error" id="error-msg" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <form id="login-form" onsubmit="return doLogin(event)">
    <div class="field form-group">
      <label class="form-label" for="username">Username</label>
      <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field form-group">
      <label class="form-label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
      <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign in
    </button>
  </form>

  <p class="footer" id="footer-text">New here? <a href="/signup.html" style="color:var(--brand-primary);text-decoration:none;font-weight:600">Create an account</a></p>
</div>
</main>

<script src="/js/app-shell.js" defer></script>
<script>
// Login is dark-only — no theme picker on this screen. The <html> tag is
// hardcoded data-theme="dark". The user's saved theme (if any) is cached from
// the login response below and applied after redirect on the app pages.

// Where to redirect after successful login. The login page lives on each
// service (admin / design / permitting), so "after login go to /" sends the
// user to that service's main page. The ?next= query param overrides this
// for cases like "you tried to access /something but weren't logged in".
function getRedirectTarget() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || '/';
  // W98-F4: block open redirect — only allow same-origin paths.
  // Reject protocol-relative (//) and absolute URLs (http:// / https://).
  if (/^\/\//i.test(next) || /^https?:\/\//i.test(next)) return '/';
  return next;
}

async function doLogin(ev){
  ev.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Signing in...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',  // ensure cookie is set + sent
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    // Wave 1.5 [TOKEN-FROM-BODY]: Token is no longer returned in the login
    // response body — auth is cookie-only. sessionStorage.lfs_token is NOT
    // written. The cookie is set server-side and sent automatically on
    // same-origin requests. api.js still reads lfs_token as a fallback but
    // it will simply be absent and the cookie path takes over.
    // If the server returned a saved theme on the user record, cache it locally
    // so the redirected page applies it pre-paint without a server round-trip.
    if (data.user && data.user.theme) {
      try { localStorage.setItem('lfs-theme', data.user.theme); } catch(e){}
    }
    window.location.href = getRedirectTarget();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
    // Also surface via AppShell toast for consistency with the rest of the app.
    if (window.AppShell && typeof window.AppShell.toast === 'function') {
      window.AppShell.toast(e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign in';
  }
  return false;
}
</script>

</body>
</html>
