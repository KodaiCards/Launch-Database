<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Jobs — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#B71C1C;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
  --modal-backdrop:rgba(0,0,0,.45);
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#EF5350;--danger-light:#3D1F23;--danger-text:#F8B4BD;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{
  background:var(--white);color:var(--text);border-color:var(--gray-border)}

.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px;object-fit:contain}
html[data-theme="dark"] .header-logo{filter:brightness(0) invert(1) opacity(.92)}
.header-title{font-size:16px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}

.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--gray-light)}
.btn-sm{padding:6px 10px;font-size:12px}

.container{max-width:900px;margin:24px auto;padding:0 16px}

.page-heading{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}

.job-list{display:flex;flex-direction:column;gap:12px}
.job-card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;padding:16px 18px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.job-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(27,95,160,.08)}
.job-info{flex:1;min-width:0}
.job-name{font-size:14px;font-weight:600;margin-bottom:4px}
.job-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.job-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-design{background:var(--info-light);color:var(--info-text)}
.tag-permitting{background:var(--warning-light);color:var(--warning-text)}
.tag-construction{background:var(--success-light);color:var(--success-text)}
.tag-status{background:var(--gray-light);color:var(--text-muted)}

.empty-state{text-align:center;color:var(--text-muted);padding:48px 20px}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.4}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-backdrop);display:none;
  align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;max-width:440px;width:100%;
  display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--gray-border);
  display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--gray-border);
  display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-border);
  border-radius:6px;background:var(--white);color:var(--text)}
.form-group textarea{min-height:72px;resize:vertical}
.form-group input:focus,.form-group textarea:focus{outline:2px solid var(--primary);outline-offset:1px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--surface-2,#212529);color:var(--text);border:1px solid var(--gray-border);
  border-radius:8px;padding:10px 18px;font-size:13px;z-index:2000;
  box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .3s;white-space:nowrap}
.toast.hidden{opacity:0;pointer-events:none}
.toast.success{border-color:var(--success);color:var(--success-text);background:var(--success-light)}
.toast.error{border-color:var(--danger);color:var(--danger-text);background:var(--danger-light)}

/* This-week recap strip */
.week-strip{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;
  padding:14px 16px;margin-bottom:18px}
.week-strip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.week-strip-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
.week-strip-total{font-size:13px;color:var(--text-muted)}
.week-strip-total strong{font-size:20px;color:var(--primary);font-variant-numeric:tabular-nums}
.week-strip-jobs{display:flex;flex-direction:column;gap:6px}
.week-strip-job{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)}
.week-strip-job .wsj-hours{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.week-strip-empty{font-size:12px;color:var(--text-muted);font-style:italic}

/* Recent entries list */
.recent-card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;
  margin-top:18px;overflow:hidden;display:none}
.recent-card-head{padding:12px 16px;border-bottom:1px solid var(--gray-border);
  font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.recent-list{display:flex;flex-direction:column}
.recent-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--gray-border);font-size:13px}
.recent-row:last-child{border-bottom:none}
.recent-row:hover{background:var(--gray-light)}
.recent-left{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.recent-job{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-meta{font-size:11px;color:var(--text-muted)}
.recent-right{flex-shrink:0;text-align:right}
.recent-hrs{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--primary)}
.recent-date{font-size:11px;color:var(--text-muted)}
.recent-notes{font-size:11px;color:var(--text-secondary);margin-top:2px;font-style:italic}
.recent-empty{font-size:12px;color:var(--text-muted);font-style:italic;padding:14px 16px}

.loading-row{text-align:center;color:var(--text-muted);padding:32px;font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
  border-radius:50%;border-right-color:transparent;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .job-card{flex-direction:column}
  .job-actions{width:100%}
  .job-actions .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img src="/img/launch-fiber-logo-transparent.png" alt="Launch Fiber Services" class="header-logo">
    <span class="header-title">My Jobs</span>
  </div>
  <div class="header-right">
    <button class="btn btn-secondary btn-sm" onclick="toggleDark()" title="Toggle dark mode">
      <i class="fa-solid fa-moon" id="dm-icon"></i>
    </button>
    <span id="user-label" style="font-size:12px;color:var(--text-muted)"></span>
    <button class="btn btn-secondary btn-sm" onclick="logout()">
      <i class="fa-solid fa-sign-out-alt"></i> Sign out
    </button>
  </div>
</header>

<main class="container" id="main">
  <!-- This-week recap strip -->
  <div class="week-strip" id="week-strip" style="display:none">
    <div class="week-strip-head">
      <span class="week-strip-label"><i class="fa-regular fa-calendar-check"></i> This week</span>
      <span class="week-strip-total"><strong id="week-total">0.0</strong> hrs</span>
    </div>
    <div class="week-strip-jobs" id="week-strip-jobs"></div>
  </div>

  <!-- Recent entries -->
  <div class="recent-card" id="recent-card">
    <div class="recent-card-head"><i class="fa-regular fa-clock"></i> Recent Entries</div>
    <div class="recent-list" id="recent-list"></div>
  </div>

  <div class="page-heading" style="margin-top:24px">My Assigned Jobs</div>
  <div class="page-sub">Log hours against the jobs assigned to you.</div>
  <div class="job-list" id="job-list">
    <div class="loading-row"><span class="spinner"></span>Loading your jobs…</div>
  </div>
</main>

<!-- Log Hours Modal -->
<div class="modal-overlay" id="log-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Log Hours</span>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div id="modal-job-label" style="font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text-secondary)"></div>
      <div class="form-group">
        <label for="inp-hours">Hours <span style="color:var(--danger)">*</span></label>
        <input type="number" id="inp-hours" min="0.1" max="24" step="0.25" placeholder="e.g. 2.5">
      </div>
      <div class="form-group">
        <label for="inp-date">Date</label>
        <input type="date" id="inp-date">
      </div>
      <div class="form-group">
        <label for="inp-notes">Notes</label>
        <textarea id="inp-notes" placeholder="Optional description of work done"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="submit-btn" onclick="submitHours()">
        <i class="fa-solid fa-check"></i> Log Hours
      </button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="/js/my_timeclock.js" defer></script>
</body>
</html>
