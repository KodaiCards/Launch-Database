<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline — Launch Fiber</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --rev:#8E24AA;--rev-light:#F3E5F5;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  --rev:#CE93D8;--rev-light:#2A1B33;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text);height:100vh;overflow:hidden}
button,a{font-family:inherit}
.header{background:var(--surface-2);border-bottom:1px solid var(--border-strong);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;height:52px}
.htitle{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.htitle i{color:var(--primary)}
.tabs{display:flex;gap:4px}
.tab{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--text-muted);border:1px solid transparent}
.tab.active{background:var(--primary-light);color:var(--primary-dark)}
.tab:hover{background:var(--surface-1)}
.hright{display:flex;align-items:center;gap:8px}
.btn{padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn:hover{background:var(--surface-1)}
.board{display:flex;gap:12px;padding:16px;height:calc(100vh - 52px);overflow-x:auto;align-items:flex-start}
.column{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;max-height:100%;display:flex;flex-direction:column}
.col-head{padding:10px 12px;font-size:12px;font-weight:700;text-transform:capitalize;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-strong)}
.col-head .count{font-size:11px;color:var(--text-muted);background:var(--surface-3);border-radius:10px;padding:1px 8px}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:60px}
.col-body.over{background:var(--primary-light);outline:2px dashed var(--primary);outline-offset:-4px;border-radius:8px}
.card{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:8px;padding:9px 10px;cursor:grab;font-size:13px}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card-sa{font-weight:600}
.card-meta{font-size:11px;color:var(--text-muted);margin:1px 0 6px}
.card-job{font-size:12px;color:var(--text-secondary)}
.card-emp{font-size:11px;color:var(--text-muted);margin-top:5px;display:flex;align-items:center;gap:5px}
.badge-rus{font-size:9px;font-weight:700;color:var(--rev);background:var(--rev-light);border-radius:5px;padding:1px 5px;margin-left:4px}
.col-rev .col-head{color:var(--rev)}
.empty{color:var(--text-muted);padding:40px;text-align:center;width:100%}
.undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--text);color:var(--surface-2);padding:10px 16px;border-radius:8px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .2s;z-index:60}
.undo-bar.show{transform:translateX(-50%) translateY(0)}
.undo-bar button{background:none;border:none;color:var(--info);font-weight:700;cursor:pointer}
.muted{color:var(--text-muted)}
</style>
</head>
<body>
  <div class="header">
    <div class="htitle"><i class="fa-solid fa-table-columns"></i> <span id="teamLabel">Pipeline</span></div>
    <div class="tabs">
      <a class="tab" id="tab-permitting" href="?team=permitting">Permitting</a>
      <a class="tab" id="tab-design" href="?team=design">Design</a>
    </div>
    <div class="hright">
      <a class="btn" href="/service-areas.html"><i class="fa-solid fa-diagram-project"></i> Service Areas</a>
      <a class="btn" href="/admin.html"><i class="fa-solid fa-arrow-left"></i> Admin</a>
      <button class="btn" id="themeToggle" title="Theme"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>
  <div class="board" id="board"><div class="empty">Loading…</div></div>
  <div class="undo-bar" id="undoBar"><span id="undoMsg"></span><button id="undoBtn">Undo</button></div>
  <script src="/js/api.js"></script>
  <script src="/js/pipeline_board.js"></script>
  <script src="/js/app_nav.js" data-active="pipelines"></script>
</body>
</html>
