<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Audit Log — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#842029;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#FF6B6B;--danger-light:#3D1A1A;--danger-text:#FFCDD2;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
html[data-theme="dark"] input,html[data-theme="dark"] select{background:var(--white);color:var(--text);border-color:var(--gray-border)}

.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-title{font-size:16px;font-weight:600}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--gray-border);background:transparent;color:var(--text-secondary)}
.btn-icon:hover{background:var(--surface-1)}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--gray-border);
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;cursor:pointer;background:var(--white);color:var(--text-secondary)}
.btn:hover{background:var(--surface-1)}

.page-body{padding:20px 24px;max-width:1100px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700}

.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search-input{padding:7px 12px;border:1px solid var(--gray-border);border-radius:6px;
  background:var(--white);color:var(--text);outline:none;font-size:13px;width:180px}
.search-input:focus{border-color:var(--primary)}
.filter-select{padding:7px 10px;border:1px solid var(--gray-border);border-radius:6px;
  background:var(--white);color:var(--text);outline:none;font-size:13px}
.filter-select:focus{border-color:var(--primary)}

.card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface-1);padding:9px 14px;text-align:left;font-weight:600;
  font-size:12px;color:var(--text-muted);border-bottom:1px solid var(--gray-border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--gray-border)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:9px 14px;color:var(--text-secondary)}
.actor{color:var(--text);font-weight:500}
.action-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:8px;background:var(--primary-light);color:var(--primary)}
.entity-type{font-size:11px;color:var(--text-muted);background:var(--surface-1);
  padding:1px 6px;border-radius:6px;display:inline-block}
.ts{font-size:12px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.source-badge{font-size:11px;color:var(--text-muted)}

.empty-state{padding:48px 20px;text-align:center;color:var(--text-muted);font-size:14px}
.empty-state i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
.skeleton{background:var(--surface-1);border-radius:4px;height:14px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.panel-loading{padding:20px;text-align:center;color:var(--text-muted);font-size:13px}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-top:1px solid var(--gray-border);font-size:13px;color:var(--text-muted)}
.pagination-btns{display:flex;gap:6px}

@media(max-width:700px){
  .page-body{padding:12px}
  .search-input,.filter-select{width:100%}
  .filter-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-title"><i class="fa-solid fa-clock-rotate-left"></i> Audit Log</span>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode">
      <i id="dm-icon" class="fa-solid fa-moon"></i>
    </button>
  </div>
</div>

<div class="page-body" role="main">
  <div class="page-header">
    <h1 class="page-title">Activity / Audit Log</h1>
  </div>

  <div class="filter-bar">
    <input type="search" id="aud-actor" class="search-input" placeholder="Filter by user…"
      oninput="applyFilter()" aria-label="Filter by actor username">
    <select id="aud-action" class="filter-select" onchange="applyFilter()" aria-label="Filter by action">
      <option value="">All actions</option>
      <option value="create">create</option>
      <option value="update">update</option>
      <option value="delete">delete</option>
      <option value="staff.create">staff.create</option>
      <option value="invoice.create">invoice.create</option>
      <option value="invoice.update">invoice.update</option>
    </select>
    <select id="aud-entity" class="filter-select" onchange="applyFilter()" aria-label="Filter by entity type">
      <option value="">All entities</option>
      <option value="project">project</option>
      <option value="service_area">service_area</option>
      <option value="service_area_job">service_area_job</option>
      <option value="invoice">invoice</option>
      <option value="client">client</option>
      <option value="staff">staff</option>
      <option value="time_entry">time_entry</option>
    </select>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table aria-label="Audit log">
        <thead>
          <tr>
            <th>When</th>
            <th>User</th>
            <th>Action</th>
            <th>Entity</th>
            <th>ID</th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody id="aud-tbody">
          <tr><td colspan="6"><div class="panel-loading"><span class="skeleton" style="width:60%;display:inline-block"></span></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" style="display:none">
      <span id="pag-info"></span>
      <div class="pagination-btns">
        <button class="btn" id="pag-prev" onclick="prevPage()" aria-label="Previous page">
          <i class="fa-solid fa-chevron-left"></i> Prev
        </button>
        <button class="btn" id="pag-next" onclick="nextPage()" aria-label="Next page">
          Next <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var PAGE_SIZE = 100;
  var _offset   = 0;
  var _total    = 0;
  var _filterTimer = null;

  document.addEventListener('DOMContentLoaded', function(){
    applyStoredTheme();
    load();
  });

  window.applyFilter = function(){
    _offset = 0;
    clearTimeout(_filterTimer);
    _filterTimer = setTimeout(load, 200);
  };

  window.prevPage = function(){
    if(_offset <= 0) return;
    _offset = Math.max(0, _offset - PAGE_SIZE);
    load();
  };

  window.nextPage = function(){
    if(_offset + PAGE_SIZE >= _total) return;
    _offset += PAGE_SIZE;
    load();
  };

  async function load(){
    setTbody('<tr><td colspan="6"><div class="panel-loading"><span class="skeleton" style="width:60%;display:inline-block"></span></div></td></tr>');
    var actor  = document.getElementById('aud-actor').value.trim();
    var action = document.getElementById('aud-action').value;
    var entity = document.getElementById('aud-entity').value;

    var qs = ['limit='+PAGE_SIZE, 'offset='+_offset];
    if(actor)  qs.push('actor='+encodeURIComponent(actor));
    if(action) qs.push('action='+encodeURIComponent(action));
    if(entity) qs.push('entity_type='+encodeURIComponent(entity));

    try{
      var res = await fetch('/api/audit/log?'+qs.join('&'), { credentials:'include' });
      if(res.status===401||res.status===403){
        setTbody('<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-lock"></i>Manager or admin access required.</div></td></tr>');
        return;
      }
      if(!res.ok) throw new Error(await res.text());
      var data = await res.json();
      _total = data.total || 0;
      render(data.rows || []);
      renderPagination();
    } catch(e){
      setTbody('<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Failed to load audit log. '+esc(e.message||'')+'</div></td></tr>');
    }
  }

  function render(rows){
    if(!rows.length){
      setTbody('<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i>No matching audit entries.</div></td></tr>');
      return;
    }
    setTbody(rows.map(function(r){
      return '<tr>'
        +'<td class="ts">'+relTime(r.created_at)+'</td>'
        +'<td class="actor">'+esc(r.actor_username||'system')+'</td>'
        +'<td><span class="action-badge">'+esc(r.action||'—')+'</span></td>'
        +'<td><span class="entity-type">'+esc(r.entity_type||'—')+'</span></td>'
        +'<td style="font-size:11px;color:var(--text-muted);font-family:monospace">'+esc(r.entity_id||'—')+'</td>'
        +'<td class="source-badge">'+esc(r.source||'—')+'</td>'
        +'</tr>';
    }).join(''));
  }

  function renderPagination(){
    var pag = document.getElementById('pagination');
    pag.style.display = 'flex';
    var from = _total === 0 ? 0 : _offset + 1;
    var to   = Math.min(_offset + PAGE_SIZE, _total);
    document.getElementById('pag-info').textContent = from+'–'+to+' of '+_total;
    document.getElementById('pag-prev').disabled = _offset <= 0;
    document.getElementById('pag-next').disabled = _offset + PAGE_SIZE >= _total;
  }

  function setTbody(html){ document.getElementById('aud-tbody').innerHTML = html; }

  function relTime(ts){
    if(!ts) return '—';
    var d = new Date(ts);
    var diff = (Date.now() - d.getTime()) / 1000;
    if(diff < 60)  return 'just now';
    if(diff < 3600) return Math.floor(diff/60)+'m ago';
    if(diff < 86400) return Math.floor(diff/3600)+'h ago';
    if(diff < 7*86400) return Math.floor(diff/86400)+'d ago';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }

  function esc(s){
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.toggleDark = function(){
    var html = document.documentElement;
    var dark = html.getAttribute('data-theme')==='dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    localStorage.setItem('lfs_theme', dark ? 'light' : 'dark');
    updateDmIcon();
  };
  function applyStoredTheme(){
    var stored = localStorage.getItem('lfs_theme');
    if(stored) document.documentElement.setAttribute('data-theme', stored);
    updateDmIcon();
  }
  function updateDmIcon(){
    var icon = document.getElementById('dm-icon');
    if(!icon) return;
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    icon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }
})();
</script>
<script src="/js/app_nav.js" data-active="audit"></script>
</body>
</html>
