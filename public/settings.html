<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Settings — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#842029;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#FF6B6B;--danger-light:#3D1A1A;--danger-text:#FFCDD2;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-title{font-size:16px;font-weight:600}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--gray-border);background:transparent;color:var(--text-secondary)}
.btn-icon:hover{background:var(--surface-1)}

.page-body{padding:20px 24px;max-width:1120px;margin:0 auto}
.page-title{font-size:20px;font-weight:700;margin-bottom:20px}

/* Grouped multi-column layout: use the horizontal space instead of a thin
   vertical column (PRODUCT_BAR §2.1). Quick links run full-width; the two
   compact cards (Appearance, System info) sit side by side below. */
.settings-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.settings-two .section{margin-bottom:0}
@media(max-width:720px){.settings-two{grid-template-columns:1fr}}

.section{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;
  overflow:hidden;margin-bottom:18px}
.section-header{padding:13px 16px;border-bottom:1px solid var(--gray-border);
  font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.section-header i{font-size:12px}
.kv{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid var(--gray-border);font-size:13px;gap:12px}
.kv:last-child{border-bottom:none}
.kv-key{color:var(--text-muted)}
.kv-val{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.kv-val.mono{font-family:monospace;font-size:12px}
.status-dot{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-ok{background:var(--success)}
.dot-err{background:var(--danger)}

.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:14px 16px}
.quick-link{display:flex;align-items:center;gap:9px;padding:10px 12px;
  border-radius:8px;border:1px solid var(--gray-border);background:var(--surface-1);
  text-decoration:none;color:var(--text);font-size:13px;font-weight:500;transition:all .15s}
.quick-link:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.quick-link i{font-size:14px;color:var(--primary);width:16px;text-align:center}

.theme-catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 16px}
.theme-opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--gray-border);background:transparent;color:var(--text);cursor:pointer;
  font-size:13px;font-family:inherit;text-align:left;transition:border-color .12s,background .12s}
.theme-opt:hover{border-color:var(--primary)}
.theme-opt.active{border-color:var(--primary);background:var(--primary-light)}
.theme-swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0;border:1px solid rgba(128,128,128,.35)}
.theme-opt-name{flex:1}
.theme-opt .fa-check{opacity:0;color:var(--primary);font-size:12px}
.theme-opt.active .fa-check{opacity:1}
.theme-hint{padding:0 16px 12px;margin:0;font-size:11px;color:var(--text-muted)}
@media(max-width:420px){.theme-catalog{grid-template-columns:1fr}}

.skeleton{background:var(--surface-1);border-radius:4px;height:13px;animation:pulse 1.5s infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-title"><i class="fa-solid fa-sliders"></i> Settings</span>
  </div>
  <div class="header-right"></div>
</div>

<div class="page-body" role="main">
  <h1 class="page-title">Settings &amp; System Info</h1>

  <!-- Quick links -->
  <div class="section">
    <div class="section-header"><i class="fa-solid fa-link"></i> Quick links</div>
    <div class="links-grid">
      <a class="quick-link" href="/dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a class="quick-link" href="/service-areas.html"><i class="fa-solid fa-diagram-project"></i> Service areas</a>
      <a class="quick-link" href="/clients.html"><i class="fa-solid fa-users"></i> Clients</a>
      <a class="quick-link" href="/invoices.html"><i class="fa-solid fa-file-invoice"></i> Invoices</a>
      <a class="quick-link" href="/people.html"><i class="fa-solid fa-id-badge"></i> People</a>
      <a class="quick-link" href="/hours.html"><i class="fa-solid fa-clock"></i> Hours</a>
      <a class="quick-link" href="/money.html"><i class="fa-solid fa-coins"></i> Money</a>
      <a class="quick-link" href="/job-board.html"><i class="fa-solid fa-briefcase"></i> Job board</a>
      <a class="quick-link" href="/pipeline.html"><i class="fa-solid fa-table-columns"></i> Pipelines</a>
      <a class="quick-link" href="/billing.html"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a>
      <a class="quick-link" href="/admin.html"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>
  </div>

  <!-- Compact cards side by side: theme control + system status -->
  <div class="settings-two">
    <!-- Theme -->
    <div class="section">
      <div class="section-header"><i class="fa-solid fa-palette"></i> Appearance</div>
      <div class="theme-catalog" id="theme-catalog" role="radiogroup" aria-label="Color theme"></div>
      <p class="theme-hint">Pick a theme — it applies everywhere and syncs across your devices.</p>
    </div>

    <!-- System info -->
    <div class="section" id="sysinfo-section">
      <div class="section-header"><i class="fa-solid fa-server"></i> System info</div>
      <div class="kv"><span class="kv-key">App</span><span class="kv-val" id="si-app"><span class="skeleton" style="width:140px"></span></span></div>
      <div class="kv"><span class="kv-key">Version</span><span class="kv-val mono" id="si-version"><span class="skeleton" style="width:60px"></span></span></div>
      <div class="kv"><span class="kv-key">Node.js</span><span class="kv-val mono" id="si-node"><span class="skeleton" style="width:60px"></span></span></div>
      <div class="kv"><span class="kv-key">Environment</span><span class="kv-val" id="si-env"><span class="skeleton" style="width:90px"></span></span></div>
      <div class="kv"><span class="kv-key">Portal mode</span><span class="kv-val" id="si-portal"><span class="skeleton" style="width:80px"></span></span></div>
      <div class="kv"><span class="kv-key">Uptime</span><span class="kv-val" id="si-uptime"><span class="skeleton" style="width:80px"></span></span></div>
      <div class="kv"><span class="kv-key">Database</span><span class="kv-val" id="si-db"><span class="skeleton" style="width:120px"></span></span></div>
    </div>
  </div>
</div>

<script src="/js/app-shell.js"></script>
<script>
(function(){
  'use strict';

  document.addEventListener('DOMContentLoaded', function(){
    initThemeCatalog();
    loadSysInfo();
  });

  async function loadSysInfo(){
    try{
      var res = await fetch('/api/system/info', { credentials:'include' });
      if(!res.ok) throw new Error(await res.text());
      var d = await res.json();
      set('si-app',    esc(d.app));
      set('si-version', esc(d.version));
      set('si-node',   esc(d.node));
      set('si-env',    esc(d.env));
      set('si-portal', esc(d.portal_mode));
      set('si-uptime', fmtUptime(d.uptime_seconds));
      set('si-db', d.db_ok
        ? '<span class="status-dot"><span class="dot dot-ok"></span>'+esc(d.db_version||'Connected')+'</span>'
        : '<span class="status-dot"><span class="dot dot-err"></span>Unreachable</span>');
    } catch(e){
      set('si-db','<span style="color:var(--danger-text)">Failed to load</span>');
    }
  }

  function set(id, html){
    var el = document.getElementById(id);
    if(el) el.innerHTML = html;
  }

  function fmtUptime(s){
    if(!s) return '—';
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    if(h >= 24){ return Math.floor(h/24)+'d '+( h%24)+'h'; }
    return h+'h '+m+'m';
  }

  function esc(s){
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Mount the shared app-shell theme picker/catalog (PLAN 2.1: replaces the
  // deprecated light/dark toggle). Catalog + persistence are owned by
  // app-shell.js — this only renders the catalog into the Appearance card.
  function initThemeCatalog(){
    var cat = document.getElementById('theme-catalog');
    if(!cat) return;
    if(!window.AppShell || !AppShell.themes){
      cat.innerHTML = '<p class="theme-hint" style="padding:0">Theme options are unavailable right now.</p>';
      return;
    }
    AppShell.initTheme();                       // apply the stored theme from localStorage
    var themes = AppShell.themes;
    var order = ['graphite','obsidian','nightsky','blueprint'];
    Object.keys(themes).forEach(function(id){ if(order.indexOf(id) < 0) order.push(id); });

    cat.innerHTML = '';
    order.forEach(function(id){
      var t = themes[id];
      if(!t) return;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'theme-opt';
      b.setAttribute('role','radio');
      b.setAttribute('data-theme-id', id);
      b.innerHTML = '<span class="theme-swatch" style="background:'+esc(t.dot)+'"></span>'+
                    '<span class="theme-opt-name">'+esc(t.label)+'</span>'+
                    '<i class="fa-solid fa-check" aria-hidden="true"></i>';
      b.addEventListener('click', function(){ AppShell.setTheme(id); markActive(currentThemeId()); });
      cat.appendChild(b);
    });
    markActive(currentThemeId());

    // Reflect the server-saved preference (cross-device) once available.
    if(AppShell.getUser){
      AppShell.getUser().then(function(u){
        if(u && u.theme){ AppShell.setTheme(u.theme); }
        markActive(currentThemeId());
      });
    }

    // Keep the card highlight in sync if the theme is changed elsewhere
    // (e.g. the shared top-bar picker) and focus returns to this page.
    window.addEventListener('focus', function(){ markActive(currentThemeId()); });
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) markActive(currentThemeId());
    });
  }

  function currentThemeId(){
    var root = document.documentElement;
    return root.getAttribute('data-skin') ||
      (root.getAttribute('data-theme') === 'light' ? 'light' : 'graphite');
  }

  function markActive(id){
    var items = document.querySelectorAll('#theme-catalog .theme-opt');
    for(var i=0;i<items.length;i++){
      var on = items[i].getAttribute('data-theme-id') === id;
      items[i].classList.toggle('active', on);
      items[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
  }
})();
</script>
<script src="/js/app_nav.js" data-active="settings"></script>
</body>
</html>
