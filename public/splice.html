async function refreshImportsList() {
  if (!state.currentId) return;
  let imports = [];
  try { imports = await api('/api/splice/projects/' + state.currentId + '/imports'); }
  catch { return; }
  const pending = imports.filter(i => i.status === 'pending');
  const recent  = imports.filter(i => i.status !== 'pending').slice(0, 5);
  document.getElementById('proj-imports-count').textContent =
    pending.length ? pending.length : '';
  const host = document.getElementById('proj-imports-body');
  if (!imports.length) {
    host.innerHTML = '<div class="empty-pane" style="padding:6px">No imports yet. Use "Import KMZ/DXF" above.</div>';
    return;
  }
  host.innerHTML = `
    ${pending.length ? '<div style="margin-bottom:8px"><b>Pending</b></div>' : ''}
    ${pending.map(i => importRowHtml(i, true)).join('')}
    ${recent.length ? '<div style="margin:10px 0 4px;color:var(--text-muted);font-size:10px;text-transform:uppercase">Recent</div>' : ''}
    ${recent.map(i => importRowHtml(i, false)).join('')}
  `;
}

function importRowHtml(i, pending) {
  const sum = i.summary_jsonb || {};
  const counts = `${(sum.adds?.locations||0)+(sum.adds?.cables||0)} adds · ${(sum.updates?.locations||0)+(sum.updates?.cables||0)} updates · ${(sum.removes?.locations||0)+(sum.removes?.cables||0)} removes`;
  return `
    <div style="border:1px solid var(--border-weak);border-radius:6px;padding:6px;margin-bottom:6px;background:var(--surface)">
      <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(i.source_filename || '')}">${esc(i.source_filename || '(unnamed)')}</div>
      <div style="color:var(--text-muted);font-size:10px;margin-top:2px">
        ${esc(i.source_format)} · ${i.uploaded_by_name ? esc(i.uploaded_by_name) + ' · ' : ''}${new Date(i.uploaded_at).toLocaleString()}
      </div>
      <div style="font-size:10px;margin-top:2px">${counts}</div>
      <div style="font-size:10px;margin-top:2px;color:${importStatusColor(i.status)};font-weight:500;text-transform:uppercase">${esc(i.status.replace('_',' '))}</div>
      ${pending ? `
        <div style="display:flex;gap:4px;margin-top:6px">
          <button class="btn btn-sm" style="flex:1" onclick="openImportReviewModal('${i.id}')"><i class="fa-solid fa-eye"></i> Review</button>
          <button class="btn btn-sm btn-danger" onclick="rejectImport('${i.id}')" title="Reject this import"><i class="fa-solid fa-times"></i></button>
        </div>` : ''}
    </div>`;
}

function importStatusColor(status) {
  switch (status) {
    case 'applied':           return 'var(--success)';
    case 'partially_applied': return 'var(--warning)';
    case 'rejected':          return 'var(--danger)';
    case 'pending':           return 'var(--primary)';
    default:                  return 'var(--text-muted)';
  }
}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
            <div><b>Point 1</b><br>
              <input type="text" id="m-imp-cp1-src" placeholder="src x,y" style="width:100%;margin:2px 0"><br>
              <input type="text" id="m-imp-cp1-dst" placeholder="lon,lat" style="width:100%;margin:2px 0">
            </div>
            <div><b>Point 2</b><br>
              <input type="text" id="m-imp-cp2-src" placeholder="src x,y" style="width:100%;margin:2px 0"><br>
              <input type="text" id="m-imp-cp2-dst" placeholder="lon,lat" style="width:100%;margin:2px 0">
            </div>
          </div>
        </div>
      </div>
    `,
    onSubmit: async (close) => {
      const fileEl = document.getElementById('m-imp-file');
      const file = fileEl.files[0];
      if (!file) return toast('Pick a file first', 'error');
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const fd = new FormData();
      fd.set('file', file);
      if (ext === 'dxf') {
        const mode = document.querySelector('input[name="m-imp-calib-mode"]:checked')?.value || 'crs';
        let calib;
        if (mode === 'crs') {
          const crs = document.getElementById('m-imp-crs').value.trim();
          if (!/^EPSG:\d+$/i.test(crs)) return toast('CRS must look like EPSG:2284', 'error');
          calib = { crs };
        } else {
          const parsePair = id => {
            const v = document.getElementById(id).value.trim();
            const parts = v.split(',').map(s => parseFloat(s.trim()));
            return parts.length === 2 && parts.every(Number.isFinite) ? parts : null;
          };
          const cp1src = parsePair('m-imp-cp1-src'), cp1dst = parsePair('m-imp-cp1-dst');
          const cp2src = parsePair('m-imp-cp2-src'), cp2dst = parsePair('m-imp-cp2-dst');
          if (!cp1src || !cp1dst || !cp2src || !cp2dst) return toast('Each point needs src x,y AND lon,lat', 'error');
          calib = { control_points: [{ src: cp1src, dst: cp1dst }, { src: cp2src, dst: cp2dst }] };
        }
        fd.set('calibration', JSON.stringify(calib));
      }
      try {
        const tok = sessionStorage.getItem('lfs_token');
        const r = await fetch('/api/splice/projects/' + state.currentId + '/imports', {
          method: 'POST',
          credentials: 'include',
          headers: tok ? { 'Authorization': 'Bearer ' + tok } : {},
          body: fd,
        });
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || 'Upload failed');
        close();
        toast('Imported ' + file.name + ' — open it in the imports list to review.', 'success');
        await refreshImportsList();
        // Auto-open the review modal for convenience.
        if (json.import?.id) openImportReviewModal(json.import.id);
      } catch (e) { toast('Import failed: ' + e.message, 'error'); }
    },
  });
  // Toggle DXF calibration block based on file extension.
  setTimeout(() => {
    const fileEl = document.getElementById('m-imp-file');
    fileEl.addEventListener('change', () => {
      const ext = (fileEl.files[0]?.name.split('.').pop() || '').toLowerCase();
      document.getElementById('m-imp-dxf-calib').style.display = ext === 'dxf' ? 'block' : 'none';
    });
    document.querySelectorAll('input[name="m-imp-calib-mode"]').forEach(r => {
      r.addEventListener('change', () => {
        document.getElementById('m-imp-calib-crs').style.display = r.value === 'crs' && r.checked ? 'block' : 'none';
        document.getElementById('m-imp-calib-cp').style.display  = r.value === 'control' && r.checked ? 'block' : 'none';
      });
    });
  }, 50);
}

function reviewDetailHtml(c) {
  const p = c.payload_jsonb || {};
  if (c.target_table === 'splice_locations') {
    if (c.change_type === 'add') {
      return `<b>${esc(p.name || '?')}</b> · ${esc(p.type || 'splice_point')} <span style="color:var(--text-muted)">at ${(+p.latitude).toFixed(5)}, ${(+p.longitude).toFixed(5)}</span>`;
    }
    if (c.change_type === 'update') {
      const fields = Object.entries(p).map(([k, v]) => `<code>${esc(k)}</code>: ${esc(JSON.stringify(v))}`).join(' · ');
      return `Update location <code>${esc(c.target_id)}</code><br><span style="color:var(--text-muted);font-size:10px">${fields}</span>`;
    }
    if (c.change_type === 'delete') {
      return `<span style="color:var(--danger)">Remove</span> location <b>${esc(p.name || c.target_id)}</b>`;
    }
  }
  if (c.target_table === 'splice_cables') {
    if (c.change_type === 'add') {
      const len = p.path_geojson?.coordinates?.length || 0;
      return `<b>${esc(p.name || '?')}</b> · ${p.fiber_count}f ${esc(p.construction_type || '')} <span style="color:var(--text-muted)">${len} waypoints</span>`;
    }
    if (c.change_type === 'update') {
      const fields = Object.keys(p).map(k => k === 'path_geojson' ? 'path' : k).join(', ');
      return `Update cable <code>${esc(c.target_id)}</code><br><span style="color:var(--text-muted);font-size:10px">fields: ${esc(fields)}</span>`;
    }
    if (c.change_type === 'delete') {
      return `<span style="color:var(--danger)">Remove</span> cable <b>${esc(p.name || c.target_id)}</b>`;
    }
  }
  return JSON.stringify(p).slice(0, 200);
}

async function updateChangeDecision(changeId, decision) {
  const importId = state._reviewImport?.import?.id;
  if (!importId) return;
  try {
    await api(`/api/splice/imports/${importId}/changes/${changeId}/decision`, 'POST', { decision });
    // Update the in-memory copy so bulkDecision and re-renders stay
    // accurate without re-fetching.
    const c = state._reviewImport.changes.find(x => x.id === changeId);
    if (c) c.decision = decision;
  } catch (e) { toast('Decision failed: ' + e.message, 'error'); }
}

async function bulkDecision(decision) {
  const importId = state._reviewImport?.import?.id;
  if (!importId) return;
  const targets = state._reviewImport.changes.filter(c =>
    decision === 'approved' ? c.change_type !== 'delete' : true
  );
  for (const c of targets) {
    if (c.decision !== decision) {
      try {
        await api(`/api/splice/imports/${importId}/changes/${c.id}/decision`, 'POST', { decision });
        c.decision = decision;
        const sel = document.querySelector(`#rev-${c.id} select`);
        if (sel) sel.value = decision;
      } catch {}
    }
  }
  toast(`Set ${targets.length} change(s) to ${decision}`, 'success');
}

// ───────────────────────────────────────────────────────────────────────────
// CSV / Excel paste import (Phase 2C #13)
//
// Three-step wizard:
//   Step 1 — paste raw text (tab-sep or CSV)
//   Step 2 — map columns to canonical fields + pick kind (cables/locations)
//   Step 3 — POST to /import-paste, then open the standard review modal
//
// No external dependency: the CSV parser below handles quoted fields and
// "" escaped quotes in ~30 lines; that's enough for Excel/Sheets output.
// ───────────────────────────────────────────────────────────────────────────

// Minimal CSV parser — handles double-quoted fields (embedded commas,
// newlines, and "" escapes). Delimiter auto-detected per line: tab wins
// if any field contains a tab in the first scan; otherwise comma.
function parseCsv(text, delim) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  // Heuristic: if we find a tab anywhere in the first 4 lines, use tab.
  if (!delim) {
    const sample = lines.slice(0, 4).join('\n');
    delim = sample.includes('\t') ? '\t' : ',';
  }
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let i = 0;
    while (i < line.length) {
      if (line[i] === '"') {
        // Quoted field — consume until closing quote, un-escape "".
        let field = '';
        i++; // skip opening quote
        while (i < line.length) {
          if (line[i] === '"' && line[i + 1] === '"') { field += '"'; i += 2; }
          else if (line[i] === '"') { i++; break; }
          else { field += line[i++]; }
        }
        row.push(field);
        if (line[i] === delim) i++; // skip trailing delimiter
      } else {
        // Unquoted field — read until delimiter or end of line.
        let start = i;
        while (i < line.length && line[i] !== delim) i++;
        row.push(line.slice(start, i));
        if (line[i] === delim) i++;
      }
    }
    result.push(row);
  }
  return result;
}

// Canonical fields for each kind. Used for auto-mapping and the column
// mapping select options.
const PASTE_FIELDS = {
  cables: [
    { key: 'name',              label: 'Name *' },
    { key: 'fiber_count',       label: 'Fiber count' },
    { key: 'construction_type', label: 'Construction type (ribbon/loose_tube)' },
    { key: 'from_location',     label: 'From location' },
    { key: 'to_location',       label: 'To location' },
    { key: 'manufacturer_part', label: 'Manufacturer part' },
    { key: 'notes',             label: 'Notes' },
  ],
  locations: [
    { key: 'name',      label: 'Name *' },
    { key: 'type',      label: 'Type (co/splice_point/fdh/terminal/ring_cut)' },
    { key: 'latitude',  label: 'Latitude' },
    { key: 'longitude', label: 'Longitude' },
    { key: 'notes',     label: 'Notes' },
  ],
};

// Best-guess auto-mapping: normalize both sides and look for exact match,
// then prefix match so "Cable Name" → "name" if nothing better fits.
function autoMapColumn(headerName, kind) {
  const h = headerName.toLowerCase().replace(/[^a-z0-9]/g, '');
  for (const { key } of PASTE_FIELDS[kind]) {
    const k = key.replace(/_/g, '');
    if (h === k) return key;
  }
  // Looser: check if the canonical key appears anywhere in the header.
  for (const { key } of PASTE_FIELDS[kind]) {
    if (h.includes(key.replace(/_/g, ''))) return key;
  }
  return '';
}

function openPasteImportModal() {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  if (!state.currentId) return toast('Open a project first', 'error');

  // ── Step 1: paste textarea ───────────────────────────────────────────────
  showModal({
    title: 'Paste from spreadsheet — step 1 of 3',
    submitText: 'Next: map columns',
    body: `
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5">
        Copy rows from Excel or Google Sheets and paste below. Tab-separated
        and comma-separated (CSV) are both accepted.
      </div>
      <textarea id="pi-raw" rows="10" style="width:100%;font-family:monospace;font-size:11px;resize:vertical"
        placeholder="Name&#9;Fiber count&#9;From location&#9;..."></textarea>
    `,
    onSubmit: (close) => {
      const raw = document.getElementById('pi-raw').value.trim();
      if (!raw) return toast('Paste some data first', 'error');
      let parsed;
      try { parsed = parseCsv(raw); }
      catch (e) { return toast('Parse error: ' + e.message, 'error'); }
      if (parsed.length < 2) return toast('Need at least a header row + one data row', 'error');
      close();
      _pasteImportStep2(parsed);
    },
  });
}

function _pasteImportStep2(parsed) {
  const headers  = parsed[0];
  const preview  = parsed.slice(1, 4); // show up to 3 data rows
  const allRows  = parsed.slice(1);

  // Build preview table HTML.
  const previewHtml = `
    <table class="table" style="font-size:11px;margin-bottom:12px">
      <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>
        ${preview.map(row =>
          `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join('')}</tr>`
        ).join('')}
      </tbody>
    </table>
    ${allRows.length > 3 ? `<div style="font-size:10px;color:var(--text-muted);margin-bottom:10px">...and ${allRows.length - 3} more row(s)</div>` : ''}
  `;

  // Column mapping selectors — re-rendered when kind changes.
  function mappingHtml(kind) {
    const opts = [{ key: '', label: '(ignore)' }, ...PASTE_FIELDS[kind]];
    return headers.map((h, i) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div style="width:140px;font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(h)}">${esc(h)}</div>
        <select id="pi-col-${i}" style="flex:1;font-size:11px">
          ${opts.map(o => `<option value="${o.key}" ${autoMapColumn(h, kind) === o.key ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select>
      </div>`).join('');
  }

  showModal({
    title: 'Paste from spreadsheet — step 2 of 3',
    submitText: 'Next: review & submit',
    wide: true,
    body: `
      <div style="font-size:12px;font-weight:500;margin-bottom:6px">Preview (first ${Math.min(3, preview.length)} row(s))</div>
      <div style="overflow-x:auto;margin-bottom:10px">${previewHtml}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <label style="font-size:12px;font-weight:500">Import as:</label>
        <label style="font-size:12px"><input type="radio" name="pi-kind" value="cables" checked> Cables</label>
        <label style="font-size:12px"><input type="radio" name="pi-kind" value="locations"> Locations</label>
      </div>
      <div style="font-size:12px;font-weight:500;margin-bottom:6px">Map columns</div>
      <div id="pi-mapping-body">${mappingHtml('cables')}</div>
    `,
    onSubmit: (close) => {
      const kind = document.querySelector('input[name="pi-kind"]:checked')?.value || 'cables';

      // Build mapped rows using the user's column assignments.
      const mapping = headers.map((_, i) => document.getElementById('pi-col-' + i)?.value || '');
      const rows = allRows.map(row => {
        const obj = {};
        mapping.forEach((field, i) => {
          if (field) obj[field] = row[i] ?? '';
        });
        return obj;
      }).filter(r => Object.keys(r).length > 0);

      if (!rows.length) return toast('No mappable rows', 'error');
      close();
      _pasteImportStep3(rows, kind);
    },
  });

  // Re-render mapping selectors when kind radio changes, resetting
  // auto-mapping to the newly chosen kind's field list.
  setTimeout(() => {
    document.querySelectorAll('input[name="pi-kind"]').forEach(r => {
      r.addEventListener('change', () => {
        const kind = document.querySelector('input[name="pi-kind"]:checked')?.value || 'cables';
        document.getElementById('pi-mapping-body').innerHTML = mappingHtml(kind);
      });
    });
  }, 50);
}

async function _pasteImportStep3(rows, kind) {
  try {
    const json = await api(
      '/api/splice/projects/' + state.currentId + '/import-paste',
      'POST',
      { rows, kind }
    );
    toast(
      `Staged ${rows.length} row(s) as "${kind}" — opening review.`,
      'success'
    );
    await refreshImportsList();
    if (json.import?.id) openImportReviewModal(json.import.id);
  } catch (e) {
    toast('Paste import failed: ' + e.message, 'error');
  }
}

function pickedVersions() {
  const aEl = document.querySelector('input[name="diff-a"]:checked');
  const bEl = document.querySelector('input[name="diff-b"]:checked');
  if (!aEl) { toast('Pick a version in column A', 'error'); return null; }
  return { a: aEl.value, b: bEl ? bEl.value : 'current' };
}

function viewDiffJson() {
  const p = pickedVersions(); if (!p) return;
  window.open(`/api/splice/projects/${state.currentId}/diff/${p.a}/${p.b}`, '_blank');
}

function downloadDiffPdf() {
  const p = pickedVersions(); if (!p) return;
  window.open(`/api/splice/projects/${state.currentId}/diff/${p.a}/${p.b}/pdf`, '_blank');
}

// ───────────────────────────────────────────────────────────────────────────
// Dark mode (mirrors design.html — sticky in localStorage)
// ───────────────────────────────────────────────────────────────────────────

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-dark').innerHTML =
    t === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
}
document.getElementById('btn-dark').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('lfs_theme', next); } catch {}
});
applyTheme(localStorage.getItem('lfs_theme') === 'dark' ? 'dark' : 'light');

// ───────────────────────────────────────────────────────────────────────────
// Boot
// ───────────────────────────────────────────────────────────────────────────

(async function boot(){
  await loadMe();
  await loadProjects();
})();

// Release lock when leaving the page so the next viewer doesn't have to
// wait for the 10-min stale-lock window.
window.addEventListener('beforeunload', () => {
  if (state.lockState === 'mine' && state.currentId) {
    // navigator.sendBeacon avoids the unload race; works without a
    // Bearer token because the JWT cookie travels alongside.
    try {
      navigator.sendBeacon(
        '/api/splice/projects/' + state.currentId + '/unlock',
        new Blob([''], { type: 'application/json' })
      );
    } catch {}
  }
});

</script>
</body>
