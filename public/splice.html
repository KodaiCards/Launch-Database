function openSpliceModal(trayId, ribbon) {
  if (isReadOnly()) return toast('View-only mode', 'error');
  const tray = state.data.trays.find(t => t.id === trayId);
  if (!tray) return;
  const usedFibers = new Set();
  state.data.splices.forEach(s => {
    // Cap each fiber at 2 endpoints (one per cable side). The route accepts
    // up to 2 already; we mark any fiber that's hit its limit.
    const aCount = state.data.splices.filter(x => x.fiber_a_id === s.fiber_a_id || x.fiber_b_id === s.fiber_a_id).length;
    if (aCount >= 2) usedFibers.add(s.fiber_a_id);
    const bCount = state.data.splices.filter(x => x.fiber_a_id === s.fiber_b_id || x.fiber_b_id === s.fiber_b_id).length;
    if (bCount >= 2) usedFibers.add(s.fiber_b_id);
  });

  const cableOpts = state.data.cables.map(c => `<option value="${c.id}">${esc(c.name)} (${c.fiber_count}f, ${c.construction_type})</option>`).join('');

  showModal({
    title: ribbon ? 'Ribbon splice ×12 (mass fusion)' : 'Single splice',
    wide: true,
    body: `
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">
        ${ribbon
          ? 'Pick one ribbon (12-fiber buffer tube) on each side. All 12 fibers get spliced together in TIA-598 order — fiber 1 to fiber 1, fiber 2 to fiber 2, etc.'
          : 'Pick one fiber from each side, then click <b>Splice</b>.'}
      </p>
      <div class="splice-cols">
        <div>
          <div class="field" style="margin-bottom:6px"><label>Side A · cable</label>
            <select id="sp-cable-a" onchange="renderFiberPicker('a')"><option value="">Pick cable…</option>${cableOpts}</select></div>
          <div class="field" style="margin-bottom:6px" id="sp-tube-a-wrap" style="display:none"><label>Side A · ${ribbon?'ribbon':'tube'}</label>
            <select id="sp-tube-a" onchange="renderFiberPicker('a')"></select></div>
          ${!ribbon ? `<div class="field" style="margin-bottom:0"><label>Side A · fiber</label>
            <div id="sp-fibers-a" class="fiber-grid"><div class="empty-pane">Pick a cable</div></div></div>` : ''}
        </div>
        <div>
          <div class="field" style="margin-bottom:6px"><label>Side B · cable</label>
            <select id="sp-cable-b" onchange="renderFiberPicker('b')"><option value="">Pick cable…</option>${cableOpts}</select></div>
          <div class="field" style="margin-bottom:6px" id="sp-tube-b-wrap" style="display:none"><label>Side B · ${ribbon?'ribbon':'tube'}</label>
            <select id="sp-tube-b" onchange="renderFiberPicker('b')"></select></div>
          ${!ribbon ? `<div class="field" style="margin-bottom:0"><label>Side B · fiber</label>
            <div id="sp-fibers-b" class="fiber-grid"><div class="empty-pane">Pick a cable</div></div></div>` : ''}
        </div>
      </div>
    `,
    submitText: ribbon ? 'Splice 12 fibers' : 'Splice',
    onSubmit: async (close) => {
      if (ribbon) {
        const tubeA = document.getElementById('sp-tube-a').value;
        const tubeB = document.getElementById('sp-tube-b').value;
        if (!tubeA || !tubeB) return toast('Pick a ribbon on both sides', 'error');
        const fibersA = state.data.fibers.filter(f => f.buffer_tube_id === tubeA).sort((a,b)=>a.position-b.position);
        const fibersB = state.data.fibers.filter(f => f.buffer_tube_id === tubeB).sort((a,b)=>a.position-b.position);
        if (fibersA.length !== 12 || fibersB.length !== 12) return toast('Each ribbon must have 12 fibers', 'error');
        const pairs = fibersA.map((fa, i) => ({ fiber_a_id: fa.id, fiber_b_id: fibersB[i].id }));
        try {
          await api('/api/splice/trays/' + trayId + '/ribbon-splice', 'POST', { pairs });
          close();
          await hydrateProject();
        } catch (e) { toast(e.message, 'error'); }
      } else {
        const fa = state._spA;
        const fb = state._spB;
        if (!fa || !fb) return toast('Pick a fiber on both sides', 'error');
        try {
          await api('/api/splice/trays/' + trayId + '/splices', 'POST', {
            fiber_a_id: fa, fiber_b_id: fb,
          });
          close();
          state._spA = null; state._spB = null;
          await hydrateProject();
        } catch (e) { toast(e.message, 'error'); }
      }
    },
  });
  state._spA = null; state._spB = null;
  state._spRibbon = ribbon;
  state._spUsed = usedFibers;
}

window.renderFiberPicker = function(side) {
  const ribbon = state._spRibbon;
  const cableSel = document.getElementById('sp-cable-' + side);
  const cableId = cableSel.value;
  const tubeWrap = document.getElementById('sp-tube-' + side + '-wrap');
  const tubeSel  = document.getElementById('sp-tube-' + side);
  if (!cableId) {
    tubeWrap.style.display = 'none';
    if (!ribbon) document.getElementById('sp-fibers-' + side).innerHTML = '<div class="empty-pane">Pick a cable</div>';
    return;
  }
  const tubes = state.data.buffer_tubes.filter(t => t.cable_id === cableId).sort((a,b)=>a.position-b.position);
  tubeWrap.style.display = 'block';
  tubeSel.innerHTML = '<option value="">Pick tube…</option>' + tubes.map(t =>
    `<option value="${t.id}">${t.position}. ${t.color}</option>`
  ).join('');
  if (!ribbon) {
    const tubeId = tubeSel.value;
    const grid = document.getElementById('sp-fibers-' + side);
    if (!tubeId) { grid.innerHTML = '<div class="empty-pane">Pick a tube</div>'; return; }
    const fibers = state.data.fibers.filter(f => f.buffer_tube_id === tubeId).sort((a,b)=>a.position-b.position);
    grid.innerHTML = fibers.map(f => {
      const used = state._spUsed.has(f.id);
      return `<div class="fiber-cell ${used?'in-use':''}"
        data-fiber-id="${f.id}" data-side="${side}"
        onclick="${used?'':'pickFiber(this)'}">
        <span class="fc fc-${f.color}"></span>${f.position}
      </div>`;
    }).join('');
  }
};

window.pickFiber = function(el) {
  const side = el.dataset.side;
  const fid = el.dataset.fiberId;
  document.querySelectorAll('.fiber-cell[data-side="' + side + '"]').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  if (side === 'a') state._spA = fid; else state._spB = fid;
};

function showModal({ title, body, onSubmit, submitText='Save', wide=false }) {

    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

        </footer>

}
function closeModal() { document.getElementById('modal-host').innerHTML = ''; }

// ───────────────────────────────────────────────────────────────────────────
// Map view (Phase 3A) — MapLibre GL JS, lazy-loaded on first activation.
// Esri World Imagery as the default basemap (free, attributed). The map
// renders the same closure/cable rows as the diagram tab — one source
// of truth, two views. Click a marker → open the existing closure
// inspector in the right pane. Drag a marker → PUT /coords. Draw-path
// mode adds waypoints click-by-click and double-click finishes.
// ───────────────────────────────────────────────────────────────────────────

const MAPLIBRE_VERSION = '4.7.1';
let _mapLibrePromise = null;
function loadMapLibre() {
  if (_mapLibrePromise) return _mapLibrePromise;
  _mapLibrePromise = new Promise((resolve, reject) => {
    // CSS first so the canvas mounts with the right styles.
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.css`;
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = `https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.js`;
    s.onload  = () => resolve(window.maplibregl);
    s.onerror = () => reject(new Error('Failed to load MapLibre GL JS'));
    document.head.appendChild(s);
  });
  return _mapLibrePromise;
}

// Esri World Imagery — free for non-commercial-and-light-commercial use,
// attributed in tile URL params. The most common OSP-industry basemap.
const ESRI_SAT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

function switchView(view) {
  if (view === state.activeView) return;
  state.activeView = view;
  document.querySelectorAll('.view-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === view));
  const isMap = view === 'map';
  document.getElementById('stage').style.display      = isMap ? 'none' : 'block';
  document.getElementById('toolbar').style.display    = isMap ? 'none' : 'flex';
  document.getElementById('map-stage').style.display  = isMap ? 'block' : 'none';
  document.getElementById('map-toolbar').style.display = isMap ? 'flex' : 'none';
  if (isMap) initMapIfNeeded();
}

async function initMapIfNeeded() {
  if (state.map) {
    // Already mounted; just refresh from current state.data.
    state.map.resize();
    refreshMapLayers();
    mapFitData();
    return;
  }
  try {
    const maplibregl = await loadMapLibre();
    state.maplibregl = maplibregl;
    const map = new maplibregl.Map({
      container: 'map-stage',
      style: {
        version: 8,
        sources: {
          'esri-sat': {
            type: 'raster',
            tiles: [ESRI_SAT_TILES],
            tileSize: 256,
            attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
          },
        },
        layers: [{ id: 'esri-sat', type: 'raster', source: 'esri-sat' }],
      },
      // Continental US default; mapFitData() flies to the data on load
      // when at least one location has coords.
      center: [-98.5, 39.8],
      zoom: 4,
      attributionControl: { compact: true },
    });
    state.map = map;
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));
    map.on('load', () => {
      // Source + layer for cable polylines. We re-set the data on every
      // refresh from state.data; the source itself just needs to exist
      // so the layer can mount.
      map.addSource('cables', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'cables-line',
        type: 'line',
        source: 'cables',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#FFD400',
          'line-width': 3,
          'line-opacity': 0.9,
        },
      });
      // Halo so the line is visible over both bright and dark satellite.
      map.addLayer({
        id: 'cables-line-halo',
        type: 'line',
        source: 'cables',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#000',
          'line-width': 6,
          'line-opacity': 0.3,
        },
      }, 'cables-line');
      // Track in-progress draw waypoints separately so we can render
      // them while the user is clicking.
      map.addSource('draft-path', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'draft-path-line',
        type: 'line',
        source: 'draft-path',
        paint: { 'line-color': '#FF6E00', 'line-width': 3, 'line-dasharray': [2, 2] },
      });
      map.addLayer({
        id: 'draft-path-points',
        type: 'circle',
        source: 'draft-path',
        filter: ['==', '$type', 'Point'],
        paint: { 'circle-radius': 5, 'circle-color': '#FF6E00', 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 },
      });
      refreshMapLayers();
      mapFitData();
      // Click handler for placing-an-unmapped-closure mode.
      map.on('click', (e) => {
        if (state.mapMode === 'place' && state.mapPlaceTargetId) {
          mapApplyPlacement(e.lngLat);
        } else if (state.mapMode === 'path') {
          mapPathAddWaypoint(e.lngLat);
        }
      });
      map.on('dblclick', (e) => {
        if (state.mapMode === 'path') {
          e.preventDefault();
          mapPathFinish();
        }
      });
    });
  } catch (e) {
    toast('Map failed to load: ' + e.message, 'error');
  }
}

function refreshMapLayers() {
  const map = state.map;
  if (!map || !map.isStyleLoaded() || !state.data) return;
  // Tear down existing markers so we can rebuild from scratch — cheaper
  // than tracking which moved/added/removed at this scale.
  if (state._mapMarkers) {
    state._mapMarkers.forEach(m => m.remove());
  }
  state._mapMarkers = [];
  const ml = state.maplibregl;
  const locsWithGeo = (state.data.locations || []).filter(l => l.latitude != null && l.longitude != null);
  for (const loc of locsWithGeo) {
    const closuresAtLoc = (state.data.closures || []).filter(c => c.location_id === loc.id);
    const el = document.createElement('div');
    el.className = 'map-closure-marker';
    el.style.cssText = `width:18px;height:18px;border-radius:50%;background:${closuresAtLoc.length?'#1B5FA0':'#888'};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);cursor:pointer`;
    el.title = loc.name + (closuresAtLoc.length ? ' · ' + closuresAtLoc.length + ' closure(s)' : '');
    const marker = new ml.Marker({ element: el, draggable: !isReadOnly() })
      .setLngLat([Number(loc.longitude), Number(loc.latitude)])
      .addTo(map);
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      // If the location has closures, open the first one's inspector;
      // otherwise open the location inspector.
      if (closuresAtLoc.length) selectThing('closure', closuresAtLoc[0].id);
      else selectThing('location', loc.id);
    });
    marker.on('dragend', async () => {
      const ll = marker.getLngLat();
      try {
        await api(`/api/splice/locations/${loc.id}/coords`, 'PUT', {
          latitude: ll.lat, longitude: ll.lng,
        });
        loc.latitude = ll.lat; loc.longitude = ll.lng;
      } catch (e) {
        toast('Move failed: ' + e.message, 'error');
        marker.setLngLat([Number(loc.longitude), Number(loc.latitude)]);
      }
    });
    state._mapMarkers.push(marker);
  }
  // Cables — only those with a stored path render. A path is independent
  // of endpoint locations having coords; if a designer has only mapped
  // the polyline (e.g. ingest from KMZ), it still shows.
  const cableFeatures = (state.data.cables || [])
    .filter(c => c.path_geojson && Array.isArray(c.path_geojson.coordinates) && c.path_geojson.coordinates.length >= 2)
    .map(c => ({
      type: 'Feature',
      geometry: c.path_geojson,
      properties: { id: c.id, name: c.name, fiber_count: c.fiber_count },
    }));
  const src = map.getSource('cables');
  if (src) src.setData({ type: 'FeatureCollection', features: cableFeatures });
}

function mapFitData() {
  const map = state.map;
  if (!map || !state.data) return;
  const ml = state.maplibregl;
  const bounds = new ml.LngLatBounds();
  let count = 0;
  for (const loc of state.data.locations || []) {
    if (loc.latitude != null && loc.longitude != null) {
      bounds.extend([Number(loc.longitude), Number(loc.latitude)]);
      count++;
    }
  }
  for (const c of state.data.cables || []) {
    if (c.path_geojson && Array.isArray(c.path_geojson.coordinates)) {
      for (const pt of c.path_geojson.coordinates) bounds.extend(pt);
    }
  }
  if (count === 0 && bounds.isEmpty()) return;
  map.fitBounds(bounds, { padding: 60, maxZoom: 18, duration: 500 });
}

function mapTogglePlaceMode() {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  // Pick an unmapped location to place. If only one is unmapped, skip
  // the picker; otherwise prompt.
  const unmapped = (state.data.locations || []).filter(l => l.latitude == null || l.longitude == null);
  if (!unmapped.length) return toast('All locations are already on the map.', 'info');
  if (state.mapMode === 'place') return mapClearMode();
  const list = unmapped.map((l, i) => `${i + 1}. ${l.name}`).join('\n');
  const choice = prompt(`Which location to place on the map?\n\n${list}\n\nEnter a number:`, '1');
  if (!choice) return;
  const idx = parseInt(choice, 10) - 1;
  if (!Number.isFinite(idx) || idx < 0 || idx >= unmapped.length) return toast('Bad choice', 'error');
  state.mapPlaceTargetId = unmapped[idx].id;
  state.mapMode = 'place';
  document.getElementById('map-stage').classList.add('placing');
  document.getElementById('btn-place-mode').classList.add('active');
  document.getElementById('map-mode-hint').textContent = `Click on the map to place "${unmapped[idx].name}"`;
}

async function mapApplyPlacement(lngLat) {
  const id = state.mapPlaceTargetId;
  if (!id) return;
  try {
    await api(`/api/splice/locations/${id}/coords`, 'PUT', {
      latitude: lngLat.lat, longitude: lngLat.lng,
    });
    toast('Location placed', 'success');
    mapClearMode();
    await hydrateProject();
    if (state.activeView === 'map') refreshMapLayers();
  } catch (e) {
    toast('Place failed: ' + e.message, 'error');
  }
}

function mapTogglePathMode() {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  const cables = state.data?.cables || [];
  if (!cables.length) return toast('Add a cable first.', 'info');
  if (state.mapMode === 'path') return mapClearMode();
  const list = cables.map((c, i) => `${i + 1}. ${c.name} (${c.fiber_count}f${c.path_geojson ? ' — has path, will replace' : ''})`).join('\n');
  const choice = prompt(`Draw path for which cable?\n\n${list}\n\nEnter a number:`, '1');
  if (!choice) return;
  const idx = parseInt(choice, 10) - 1;
  if (!Number.isFinite(idx) || idx < 0 || idx >= cables.length) return toast('Bad choice', 'error');
  state.mapPathTargetId = cables[idx].id;
  state.mapPathPoints = [];
  state.mapMode = 'path';
  document.getElementById('btn-path-mode').classList.add('active');
  document.getElementById('map-mode-hint').textContent = `Click waypoints for "${cables[idx].name}"; double-click to finish, Esc to cancel`;
  document.getElementById('map-stage').classList.add('placing');
}

function mapPathAddWaypoint(lngLat) {
  if (state.mapMode !== 'path') return;
  state.mapPathPoints.push([lngLat.lng, lngLat.lat]);
  mapRefreshDraftPath();
}

function mapRefreshDraftPath() {
  const map = state.map;
  if (!map) return;
  const features = [];
  if (state.mapPathPoints.length >= 2) {
    features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: state.mapPathPoints } });
  }
  for (const p of state.mapPathPoints) {
    features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: p } });
  }
  const src = map.getSource('draft-path');
  if (src) src.setData({ type: 'FeatureCollection', features });
}

async function mapPathFinish() {
  if (state.mapMode !== 'path') return;
  if (state.mapPathPoints.length < 2) {
    toast('Need at least two waypoints', 'error');
    return;
  }
  const cableId = state.mapPathTargetId;
  const path_geojson = { type: 'LineString', coordinates: state.mapPathPoints.slice() };
  try {
    await api(`/api/splice/cables/${cableId}/path`, 'PUT', { path_geojson });
    toast('Cable path saved', 'success');
    mapClearMode();
    await hydrateProject();
    if (state.activeView === 'map') refreshMapLayers();
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

function mapClearMode() {
  state.mapMode = null;
  state.mapPlaceTargetId = null;
  state.mapPathTargetId = null;
  state.mapPathPoints = [];
  document.getElementById('btn-place-mode').classList.remove('active');
  document.getElementById('btn-path-mode').classList.remove('active');
  document.getElementById('map-stage').classList.remove('placing');
  document.getElementById('map-mode-hint').textContent = '';
  if (state.map) {
    const src = state.map.getSource('draft-path');
    if (src) src.setData({ type: 'FeatureCollection', features: [] });
  }
}

// Esc cancels any active map mode.
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.mapMode) mapClearMode();
});

document.getElementById('btn-export').addEventListener('click', () => {
  if (!state.currentId) return;
  // Open in new tab — server returns inline application/pdf so the browser
  // renders it directly.
  window.open('/api/splice/projects/' + state.currentId + '/export-pdf', '_blank');
});

// Phase 3B — KMZ download. Server sends Content-Disposition: attachment
// so the browser saves the file rather than trying to render it.
function downloadKmz() {
  if (!state.currentId) return;
  const hasGeo = (state.data?.locations || []).some(l => l.latitude != null && l.longitude != null) ||
                 (state.data?.cables   || []).some(c => c.path_geojson);
  if (!hasGeo) {
    if (!confirm('No locations or cables have geographic coordinates yet. The KMZ will be effectively empty. Download anyway?')) return;
  }
  window.location.href = '/api/splice/projects/' + state.currentId + '/export-kmz';
}

// ───────────────────────────────────────────────────────────────────────────

async function saveRevision() {
  if (!state.currentId) return;
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  const label = prompt('Label for this revision (e.g. "rev A", "client review"):', '');
  if (label === null) return;
  try {
    const v = await api('/api/splice/projects/' + state.currentId + '/versions', 'POST', { label: label.trim() || null });
    if (v.skipped) {
      toast('Nothing changed since last snapshot — not saved.', 'info');
    } else {
      toast(`Saved revision v${v.version_number}${v.label ? ' — ' + v.label : ''}`, 'success');
    }
  } catch (e) { toast('Save failed: ' + e.message, 'error'); }
}

async function openVersionsModal() {
  if (!state.currentId) return;
  let versions = [];
  try { versions = await api('/api/splice/projects/' + state.currentId + '/versions'); }
  catch (e) { return toast('Load failed: ' + e.message, 'error'); }

  // Stash on state so the diff button can read selections without a
  // second fetch.
  state._versions = versions;
  const projId = state.currentId;
  const rows = versions.length ? versions.map(v => `
    <tr>
      <td><label><input type="radio" name="diff-a" value="${v.version_number}"> v${v.version_number}</label></td>
      <td><label><input type="radio" name="diff-b" value="${v.version_number}"> v${v.version_number}</label></td>
      <td><b>v${v.version_number}</b></td>
      <td>${esc(v.label || '')}</td>
      <td><span class="muted" style="font-family:monospace">${esc(v.generation_hash || '')}</span></td>
      <td>${new Date(v.created_at).toLocaleString()}</td>
      <td>${esc(v.created_by_name || '')}</td>
    </tr>
  `).join('') : `<tr><td colspan="7" class="muted" style="text-align:center;padding:18px">No saved revisions yet. Click "Save rev" to create one.</td></tr>`;

  showModal({
    title: 'Version history',
    submitText: 'Close',
    wide: true,
    body: `
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
        Auto-snapshots fire after edits when the last version is &gt;10 minutes old.
        Pick A and B columns to diff two revisions, or pick A only and diff against the live tree.
      </div>
      <div style="max-height:50vh;overflow:auto;border:1px solid var(--border-weak);border-radius:6px">
        <table class="table" style="margin:0">
          <thead>
            <tr>
              <th>A</th><th>B</th><th>Ver</th><th>Label</th><th>Hash</th><th>Saved</th><th>By</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="viewDiffJson()"><i class="fa-solid fa-code"></i> View diff (JSON)</button>
        <button class="btn btn-sm btn-primary" onclick="downloadDiffPdf()"><i class="fa-solid fa-file-pdf"></i> Download diff PDF</button>
        <span class="muted" style="font-size:11px;align-self:center">B blank ⇒ diff vs current</span>
      </div>
    `,
    onSubmit: (close) => close(),
  });
}

function pickedVersions() {
  const aEl = document.querySelector('input[name="diff-a"]:checked');
  const bEl = document.querySelector('input[name="diff-b"]:checked');
  if (!aEl) { toast('Pick a version in column A', 'error'); return null; }
  return { a: aEl.value, b: bEl ? bEl.value : 'current' };
}

function viewDiffJson() {
  const p = pickedVersions(); if (!p) return;
  window.open(`/api/splice/projects/${state.currentId}/diff/${p.a}/${p.b}`, '_blank');
}

function downloadDiffPdf() {
  const p = pickedVersions(); if (!p) return;
  window.open(`/api/splice/projects/${state.currentId}/diff/${p.a}/${p.b}/pdf`, '_blank');
}

// ───────────────────────────────────────────────────────────────────────────
// Dark mode (mirrors design.html — sticky in localStorage)
// ───────────────────────────────────────────────────────────────────────────

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-dark').innerHTML =
    t === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
}
document.getElementById('btn-dark').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('lfs_theme', next); } catch {}
});
applyTheme(localStorage.getItem('lfs_theme') === 'dark' ? 'dark' : 'light');

// ───────────────────────────────────────────────────────────────────────────
// Boot
// ───────────────────────────────────────────────────────────────────────────

(async function boot(){
  await loadMe();
  await loadProjects();
})();

// Release lock when leaving the page so the next viewer doesn't have to
// wait for the 10-min stale-lock window.
window.addEventListener('beforeunload', () => {
  if (state.lockState === 'mine' && state.currentId) {
    // navigator.sendBeacon avoids the unload race; works without a
    // Bearer token because the JWT cookie travels alongside.
    try {
      navigator.sendBeacon(
        '/api/splice/projects/' + state.currentId + '/unlock',
        new Blob([''], { type: 'application/json' })
      );
    } catch {}
  }
});

</script>
</body>
</html>
