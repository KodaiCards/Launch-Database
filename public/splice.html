function selectThing(type, id) {
  state.selection = { type, id };
  renderInspector();
}

function renderInspector() {
  const empty = document.getElementById('inspector-empty');
  const body = document.getElementById('inspector-body');
  if (!state.data) {
    empty.style.display = 'block';
    body.style.display = 'none';
    return;
  }
  if (!state.selection) {
    empty.style.display = 'block';
    empty.innerHTML = `Select an object on the canvas, or use the project actions on the left.`;
    body.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  body.style.display = 'block';

  const { type, id } = state.selection;
  if (type === 'closure')  return renderClosureInspector(id);
  if (type === 'tray')     return renderTrayInspector(id);
  if (type === 'cable')    return renderCableInspector(id);
  if (type === 'location') return renderLocationInspector(id);
  body.innerHTML = `<div class="empty-pane">Unknown selection</div>`;
}

function renderCableInspector(cableId) {
  const cable = state.data.cables.find(c => c.id === cableId);
  if (!cable) { state.selection = null; return renderInspector(); }
  const fromLoc = cable.from_location_id ? state.data.locations.find(l => l.id === cable.from_location_id) : null;
  const toLoc   = cable.to_location_id   ? state.data.locations.find(l => l.id === cable.to_location_id)   : null;
  const tubes = state.data.buffer_tubes.filter(t => t.cable_id === cableId);
  // Splices that touch any of this cable's fibers.
  const fiberIds = new Set(state.data.fibers.filter(f =>
    tubes.find(t => t.id === f.buffer_tube_id)
  ).map(f => f.id));
  const spliceCount = state.data.splices.filter(s =>
    fiberIds.has(s.fiber_a_id) || fiberIds.has(s.fiber_b_id)
  ).length;

  const body = document.getElementById('inspector-body');
  body.innerHTML = `
    <h3>${esc(cable.name)} <span class="small">${cable.fiber_count}f · ${cable.construction_type}</span></h3>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">
      ${esc(fromLoc?.name || 'unrouted')} → ${esc(toLoc?.name || 'unrouted')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="openEditCable('${cableId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="btn btn-sm" onclick="openStrandMetadataEditor('${cableId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-list-check"></i> Edit circuits</button>
      <button class="btn btn-sm btn-danger" onclick="deleteCable('${cableId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
    <table class="table">
      <tbody>
        <tr><th>Mfr part</th><td>${esc(cable.manufacturer_part || '—')}</td></tr>
        <tr><th>Tubes</th><td>${tubes.length}</td></tr>
        <tr><th>Splices touching</th><td>${spliceCount}</td></tr>
        <tr><th>Circuits set</th><td>${state.data.fibers.filter(f => fiberIds.has(f.id) && f.circuit_name).length} of ${cable.fiber_count}</td></tr>
        <tr><th>Route length</th><td>${cable.path_length_feet ? cable.path_length_feet.toLocaleString() + ' ft' : '—'}</td></tr>
        <tr><th>Notes</th><td>${esc(cable.notes || '—')}</td></tr>
      </tbody>
    </table>
    ${cable.path_geojson ? `
      <div style="margin-top:8px;font-size:11px;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="if(state.activeView==='map'){mapStartEditPath('${cableId}')}else{switchView('map');setTimeout(()=>mapStartEditPath('${cableId}'),600)}" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-vector-square"></i> Edit path on map</button>
      </div>` : ''}
    <div style="margin-top:10px;font-size:11px;color:var(--text-muted)">
      Fiber count is locked after creation. To re-size, delete and re-add.
    </div>
  `;
}

function renderLocationInspector(locationId) {
  const loc = state.data.locations.find(l => l.id === locationId);
  if (!loc) { state.selection = null; return renderInspector(); }
  const closures = state.data.closures.filter(c => c.location_id === locationId);
  const cablesAt = state.data.cables.filter(c =>
    c.from_location_id === locationId || c.to_location_id === locationId
  );
  const hasGeo = loc.latitude != null && loc.longitude != null;
  const coordStr = hasGeo
    ? `${Number(loc.latitude).toFixed(6)}, ${Number(loc.longitude).toFixed(6)}`
    : 'Not placed on map';

  // Build compact fiber diagram: for each closure at this location, list
  // splices as "Cable A f# ↔ Cable B f#" grouped by closure.
  const fiberDiagramRows = [];
  for (const cl of closures) {
    const trays = state.data.trays.filter(t => t.closure_id === cl.id);
    const trayIds = new Set(trays.map(t => t.id));
    const splicesHere = state.data.splices.filter(s => trayIds.has(s.tray_id));
    if (!splicesHere.length) continue;
    fiberDiagramRows.push(`<div style="font-size:10px;color:var(--text-muted);margin:6px 0 2px;text-transform:uppercase;letter-spacing:0.4px">${esc(cl.model || 'Closure')}</div>`);
    for (const sp of splicesHere.slice(0, 20)) {
      const fiberA = state.data.fibers.find(f => f.id === sp.fiber_a_id);
      const fiberB = state.data.fibers.find(f => f.id === sp.fiber_b_id);
      const tubeA = fiberA ? state.data.buffer_tubes.find(t => t.id === fiberA.buffer_tube_id) : null;
      const tubeB = fiberB ? state.data.buffer_tubes.find(t => t.id === fiberB.buffer_tube_id) : null;
      const cableA = tubeA ? state.data.cables.find(c => c.id === tubeA.cable_id) : null;
      const cableB = tubeB ? state.data.cables.find(c => c.id === tubeB.cable_id) : null;
      const labelA = cableA ? `${esc(cableA.name)} T${tubeA.position} f${fiberA.position}` : '?';
      const labelB = cableB ? `${esc(cableB.name)} T${tubeB.position} f${fiberB.position}` : '?';
      fiberDiagramRows.push(
        `<div class="fiber-diagram-row"><span style="flex:1">${labelA}</span><span style="color:var(--text-muted)">&#8596;</span><span style="flex:1;text-align:right">${labelB}</span></div>`
      );
    }
    if (splicesHere.length > 20) {
      fiberDiagramRows.push(`<div style="font-size:10px;color:var(--text-muted)">&hellip; ${splicesHere.length - 20} more splices</div>`);
    }
  }

  const body = document.getElementById('inspector-body');
  body.innerHTML = `
    <h3>${esc(loc.name)} <span class="small" style="background:${_locColor(loc)};color:#fff;padding:1px 6px;border-radius:10px">${esc(loc.type)}</span></h3>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">${coordStr}</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="openEditLocation('${locationId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="btn btn-sm" onclick="openAddClosureForLocation('${locationId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-plus"></i> Add closure</button>
      <button class="btn btn-sm btn-danger" onclick="deleteLocation('${locationId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
    <table class="table">
      <tbody>
        <tr><th>Type</th><td>${esc(loc.type)}</td></tr>
        <tr><th>Closures</th><td>${closures.length}</td></tr>
        <tr><th>Cables</th><td>${cablesAt.length}</td></tr>
        ${cablesAt.length ? `<tr><th></th><td style="font-size:10px">${cablesAt.map(c=>`<a href="#" onclick="event.preventDefault();selectThing('cable','${c.id}')">${esc(c.name)}</a>`).join(', ')}</td></tr>` : ''}
        <tr><th>Notes</th><td>${esc(loc.notes || '—')}</td></tr>
      </tbody>
    </table>
    ${closures.length ? `
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-weak)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="font-size:11px;font-weight:600">Closures at this location</div>
          ${!isReadOnly() ? `<button class="btn btn-sm btn-danger" id="bulk-delete-btn" disabled onclick="bulkDeleteClosures('${locationId}')" style="font-size:10px;padding:2px 7px"><i class="fa-solid fa-trash"></i> Delete selected</button>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${closures.map(c => `
            <div style="display:flex;align-items:center;gap:6px;font-size:11px">
              ${!isReadOnly() ? `<input type="checkbox" class="closure-bulk-pick" data-closure-id="${c.id}" onchange="updateBulkDeleteBtn()" style="flex-shrink:0">` : ''}
              <a href="#" onclick="event.preventDefault();selectThing('closure','${c.id}')" style="flex:1">${esc(c.model || 'Closure')} (${c.tray_count} trays)</a>
            </div>`).join('')}
        </div>
      </div>` : ''}
    ${fiberDiagramRows.length ? `
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-weak)">
        <div style="font-size:11px;font-weight:600;margin-bottom:4px">Fiber diagram</div>
        ${fiberDiagramRows.join('')}
      </div>` : ''}
    <div style="margin-top:10px;font-size:11px;color:var(--text-muted)">
      Deleting a location cascades to its closures, trays, and splices.
    </div>
  `;
}

// Enable/disable the bulk-delete button based on how many checkboxes are checked.
function updateBulkDeleteBtn() {
  const btn = document.getElementById('bulk-delete-btn');
  if (!btn) return;
  const checked = document.querySelectorAll('input.closure-bulk-pick:checked');
  btn.disabled = checked.length === 0;
}

// Bulk-delete all checked closures in the location inspector.
async function bulkDeleteClosures(locationId) {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  const checked = Array.from(document.querySelectorAll('input.closure-bulk-pick:checked'));
  if (!checked.length) return;
  const ids = checked.map(el => el.dataset.closureId);
  const n = ids.length;
  if (!confirm(`Delete ${n} closure${n === 1 ? '' : 's'} at this location? Each closure's trays + splices will cascade-delete with it.`)) return;
  try {
    await api('/api/splice/closures/bulk-delete', 'POST', { ids });
    await hydrateProject();
    selectThing('location', locationId);
  } catch (e) {
    toast('Bulk delete failed: ' + e.message, 'error');
  }
}

// Helper used by the multi-stop flow and the location inspector to open the
// add-closure modal with a specific location pre-selected.
async function openAddClosureForLocation(locationId) {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  await openAddClosure();
  // Pre-select the given location in the modal that just opened.
  const sel = document.getElementById('m-cl-loc');
  if (sel) sel.value = locationId;
}

function renderClosureInspector(closureId) {
  const cl = state.data.closures.find(c => c.id === closureId);
  if (!cl) { state.selection = null; return renderInspector(); }
  const loc = state.data.locations.find(l => l.id === cl.location_id);
  const trayList = state.data.trays.filter(t => t.closure_id === closureId).sort((a,b)=>a.position-b.position);
  const splicesByTray = (tid) => state.data.splices.filter(s => s.tray_id === tid);
  // Stored strands at this closure's location.
  const storedAtLoc = (state.data.strand_states || [])
    .filter(s => s.location_id === cl.location_id && s.state === 'stored');

  const body = document.getElementById('inspector-body');
  body.innerHTML = `
    <h3>${esc(cl.model || 'Closure')} <span class="small">${trayList.length}×${cl.tray_capacity}</span></h3>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">at ${esc(loc?.name || '?')}</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="openEditClosure('${closureId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="btn btn-sm" onclick="saveClosureAsTemplate('${closureId}')" title="Save closure shell as a reusable template" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-floppy-disk"></i> Save as template</button>
      <button class="btn btn-sm btn-danger" onclick="deleteClosure('${closureId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
    <table class="table">
      <thead><tr><th>Tray</th><th>Splices</th><th></th></tr></thead>
      <tbody>
        ${trayList.map(t => {
          const used = splicesByTray(t.id).length;
          const overCap = used > cl.tray_capacity;
          return `<tr>
            <td><b>${t.position}</b></td>
            <td><span style="color:${overCap?'var(--danger)':'inherit'}">${used} / ${cl.tray_capacity}</span></td>
            <td><button class="btn btn-sm" onclick="selectThing('tray','${t.id}')">Open</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>

    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border-weak)">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        Splitters <span class="small">${renderSplitterCount(closureId)}</span>
      </h3>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
        Passive optical splitters (PLC/FBT). One input fiber fans out to N
        downstream fibers. Validate before exporting — un-wired ports are flagged.
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn btn-sm" onclick="openAddSplitter('${closureId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-plus"></i> Add splitter</button>
      </div>
      ${renderSplitterList(closureId)}
    </div>

    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border-weak)">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        Stored strands <span class="small">${storedAtLoc.length}</span>
      </h3>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
        Strands cut and coiled here without splicing. Splicer documentation
        lists these explicitly so a tube isn't cut by mistake.
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn btn-sm" onclick="openAddStoredStrand('${cl.location_id}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-plus"></i> Mark strand stored</button>
      </div>
      ${storedAtLoc.length ? `
        <table class="table">
          <thead><tr><th>Cable</th><th>Strand</th><th>Slack</th><th></th></tr></thead>
          <tbody>
            ${storedAtLoc.map(s => {
              const cable = state.data.cables.find(c => c.id === s.cable_id);
              return `<tr>
                <td>${esc(cable?.name || '?')}</td>
                <td>#${s.strand_position}</td>
                <td>${s.stored_length_inches != null ? s.stored_length_inches + '"' : '—'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="clearStrandState('${s.id}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-times"></i></button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>` : '<div class="empty-pane" style="padding:8px">None marked yet.</div>'}
    </div>

    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border-weak)">
      <h3>Slack at this closure</h3>

        Service loop length per cable. Splicer coils these at the handhole
        before making cuts.
      </div>
      ${renderCableSlackList(cl.location_id)}

    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border-weak)" id="closure-field-section">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        Field markup
        <button class="btn btn-sm" onclick="getClosureFieldLink('${closureId}')" title="Mint or copy the public link splicers scan to upload field photos"><i class="fa-solid fa-link"></i> Field link</button>
      </h3>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
        Splicers scan the per-closure QR code on the printed PDF and upload as-built photos with no login.
      </div>
      <div id="closure-markups-${closureId}"><div class="empty-pane" style="padding:8px">Loading…</div></div>
    </div>

  loadClosureMarkups(closureId);

// Phase 2B #7 — pull field markups for the selected closure and
// render thumbnails. Image bytes come from a separate auth-gated
// endpoint so the list response stays light.
async function loadClosureMarkups(closureId) {
  const host = document.getElementById('closure-markups-' + closureId);
  if (!host) return;
  try {
    const list = await api('/api/splice/closures/' + closureId + '/markups');
    if (!list.length) {
      host.innerHTML = '<div class="empty-pane" style="padding:8px">No field photos yet.</div>';
      return;
    }
    host.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px">
        ${list.map(m => `
          <div style="border:1px solid var(--border-weak);border-radius:6px;overflow:hidden;background:var(--surface)">
            <a href="/api/splice/markups/${m.id}/image" target="_blank" rel="noopener">
              <img src="/api/splice/markups/${m.id}/image" alt="field photo"
                   style="width:100%;height:90px;object-fit:cover;display:block;background:var(--surface-2)" loading="lazy">
            </a>
            <div style="padding:5px 6px;font-size:11px;color:var(--text-muted)">
              <div style="color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.splicer_name || 'Anonymous')}</div>
              <div>${new Date(m.uploaded_at).toLocaleDateString()}</div>
              ${m.notes ? `<div title="${esc(m.notes)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.notes)}</div>` : ''}
              <div style="margin-top:3px"><button class="btn btn-sm btn-danger" style="padding:1px 5px;font-size:10px" onclick="deleteMarkup('${m.id}','${closureId}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-trash"></i></button></div>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch (e) {
    host.innerHTML = '<div class="empty-pane" style="padding:8px;color:var(--danger)">Load failed: ' + esc(e.message) + '</div>';
  }
}

async function getClosureFieldLink(closureId) {
  try {
    // Use the most recent un-expired token if one exists; otherwise
    // mint. Engineer can always mint a fresh one explicitly.
    const existing = await api('/api/splice/closures/' + closureId + '/public-tokens');
    let url;
    const live = existing.find(t => !t.expires_at || new Date(t.expires_at) > new Date());
    if (live) {
      url = live.url;
    } else {
      const fresh = await api('/api/splice/closures/' + closureId + '/public-tokens', 'POST', {});
      url = fresh.url;
    }
    // Best-effort clipboard copy. Falls back to a prompt() so the
    // engineer can still grab the URL on browsers that block
    // navigator.clipboard from non-HTTPS origins.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(url);
        toast('Field link copied to clipboard', 'success');
        return;
      } catch {}
    }
    prompt('Field link (Cmd/Ctrl+C to copy):', url);
  } catch (e) { toast('Failed to get field link: ' + e.message, 'error'); }
}

// ─── Cable slack helpers (Phase 2C #10) ──────────────────────────────────
// One row per cable that terminates or passes through this location
// (from_location_id OR to_location_id matches).  Each row shows the
// current slack_length_inches + notes from splice_cable_states and
// lets the engineer edit them inline.  Auto-save on blur keeps the UI
// lightweight — no separate Save button needed.

function renderCableSlackList(locationId) {
  const cablesAtLoc = (state.data.cables || []).filter(c =>
    c.from_location_id === locationId || c.to_location_id === locationId
  );
  if (!cablesAtLoc.length) {
    return '<div class="empty-pane" style="padding:8px">No cables at this location yet.</div>';
  }
  const rows = cablesAtLoc.map(cable => {
    const cs = (state.data.cable_states || []).find(
      s => s.cable_id === cable.id && s.location_id === locationId
    );
    const slackVal  = cs?.slack_length_inches ?? '';
    const notesVal  = cs?.notes ?? '';
    const csId      = cs?.id || '';
    return `<tr>
      <td><b>${esc(cable.name)}</b></td>
      <td>
        <input type="number" min="0" step="1" class="input-sm" style="width:70px"
               value="${esc(String(slackVal))}"
               data-cable-id="${cable.id}" data-location-id="${locationId}"
               data-field="slack_length_inches" data-cs-id="${csId}"
               onblur="saveCableSlackField(this)"
               ${isReadOnly() ? 'disabled' : ''}>
      </td>
      <td>
        <input type="text" class="input-sm" style="width:130px"
               value="${esc(notesVal)}"
               data-cable-id="${cable.id}" data-location-id="${locationId}"
               data-field="notes" data-cs-id="${csId}"
               onblur="saveCableSlackField(this)"
               ${isReadOnly() ? 'disabled' : ''}>
      </td>
      <td>
        ${csId ? `<button class="btn btn-sm btn-danger" onclick="clearCableState('${csId}')" title="Clear slack entry" ${isReadOnly() ? 'disabled' : ''}><i class="fa-solid fa-times"></i></button>` : ''}
      </td>
    </tr>`;
  }).join('');

  return `
    <table class="table">
      <thead><tr><th>Cable</th><th>Slack (in)</th><th>Notes</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// Persist a single field change from a cable-slack inline input.
// Both inputs in a row share the same (cable_id, location_id) key;
// we read the sibling value so the UPSERT always writes both columns.
async function saveCableSlackField(input) {
  if (isReadOnly()) return;
  const cableId    = input.dataset.cableId;
  const locationId = input.dataset.locationId;
  if (!cableId || !locationId) return;

  // Find both sibling inputs for this cable+location row.
  const row = input.closest('tr');
  const slackInput = row.querySelector('[data-field="slack_length_inches"]');
  const notesInput = row.querySelector('[data-field="notes"]');

  const slackRaw = slackInput?.value.trim();
  const body = {
    slack_length_inches: slackRaw !== '' && slackRaw != null ? parseInt(slackRaw, 10) : null,
    notes: notesInput?.value.trim() || null,
  };
  try {
    await api(
      `/api/splice/cables/${cableId}/locations/${locationId}/cable-state`,
      'PUT', body
    );
    // Refresh state so the row re-renders with the new cs.id if this
    // was a first insert (csId was blank before).
    await hydrateProject();
  } catch (e) { toast('Save failed: ' + e.message, 'error'); }
}

async function clearCableState(cableStateId) {

  try {
    await api('/api/splice/cable-states/' + cableStateId, 'DELETE');

// Build a flat list of fiber options for cables touching this closure's
// location. Used by both the input-fiber and output-fiber pickers.
function _closureFiberOptions(closureId) {
  const cl = state.data.closures.find(c => c.id === closureId);
  if (!cl) return '';
  const cablesAtLoc = state.data.cables.filter(c =>
    c.from_location_id === cl.location_id || c.to_location_id === cl.location_id
  );
  if (!cablesAtLoc.length) return '<option value="">No cables at this location</option>';
  const opts = ['<option value="">-- none --</option>'];
  for (const cable of cablesAtLoc) {
    const tubes = state.data.buffer_tubes.filter(t => t.cable_id === cable.id);
    for (const tube of tubes) {
      const fibers = state.data.fibers.filter(f => f.buffer_tube_id === tube.id);
      for (const fiber of fibers) {
        opts.push(`<option value="${fiber.id}">${esc(cable.name)} / ${tube.color} / pos ${fiber.position}</option>`);
      }
    }
  }
  return opts.join('');
}

function openWireSplitter(splitterId) {
  const sp = (state.data.splitters || []).find(s => s.id === splitterId);
  if (!sp) return;
  const outputs = (state.data.splitter_outputs || []).filter(o => o.splitter_id === splitterId);
  const fiberOpts = _closureFiberOptions(sp.closure_id);

  // Build one row per output port so the designer can wire each
  // independently. We re-select the current output_fiber_id inline.
  const rows = outputs.map(o => {
    const selected = o.output_fiber_id
      ? fiberOpts.replace(`value="${o.output_fiber_id}"`, `value="${o.output_fiber_id}" selected`)
      : fiberOpts;
    return `
      <div class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <label style="width:60px;min-width:60px">Port ${o.position}</label>
        <select data-output-id="${o.id}" style="flex:1">${selected}</select>
      </div>`;
  }).join('');

  showModal({
    title: `Wire outputs — ${sp.ratio} splitter`,
    wide: true,
    body: `
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
        Select the downstream fiber for each output port. Leave blank to un-wire.
      </div>
      <div id="m-wire-outputs">${rows}</div>

    submitText: 'Save all',
    onSubmit: async (close) => {
      const selects = document.querySelectorAll('#m-wire-outputs select[data-output-id]');
      try {
        await Promise.all([...selects].map(sel =>
          api(`/api/splice/splitter-outputs/${sel.dataset.outputId}`, 'PUT', {
            output_fiber_id: sel.value || null,
          })
        ));
        close();
        await hydrateProject();
      } catch (e) { toast(e.message, 'error'); }
    },
  });

function renderTrayInspector(trayId) {
  const tray = state.data.trays.find(t => t.id === trayId);
  if (!tray) { state.selection = null; return renderInspector(); }
  const cl = state.data.closures.find(c => c.id === tray.closure_id);

  const splices = state.data.splices.filter(s => s.tray_id === trayId);
  const ribbonGroups = state.data.ribbon_groups.filter(g => g.tray_id === trayId);

  const body = document.getElementById('inspector-body');
  body.innerHTML = `
    <h3>Tray ${tray.position} <span class="small">${splices.length}/${cl.tray_capacity}</span></h3>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">
      ${esc(cl.model || 'Closure')} at ${esc(loc?.name || '?')}
      &nbsp;·&nbsp; <a href="#" onclick="event.preventDefault();selectThing('closure','${cl.id}')">← back to closure</a>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">

function renderRibbonGroupRows(groups, splices) {
  return groups.map(g => {
    const inGroup = splices.filter(s => s.ribbon_group_id === g.id);
    if (!inGroup.length) return '';
    const first = inGroup[0];
    const a = describeFiber(first.fiber_a_id);
    const b = describeFiber(first.fiber_b_id);
    return `<div class="splice-row">
      <div class="desc">
        <b>${esc(a.cable)}</b> · <span class="fc fc-${a.tube_color}"></span>${esc(a.tube_color)}
        →
        <b>${esc(b.cable)}</b> · <span class="fc fc-${b.tube_color}"></span>${esc(b.tube_color)}
        <span class="ribbon-tag">ribbon ×12</span>
      </div>
      <div style="display:flex;gap:4px">
        <button class="btn btn-sm" onclick="traceFiberPath('${first.fiber_a_id}')" title="Trace full strand path from side A"><i class="fa-solid fa-diagram-project"></i> Trace</button>
        <button class="btn btn-sm btn-danger" onclick="deleteRibbonGroup('${g.id}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-times"></i></button>
      </div>
    </div>`;
  }).join('');
}

function renderLooseSpliceRows(splices) {
  const loose = splices.filter(s => !s.ribbon_group_id);
  if (!loose.length) return '<div class="empty-pane">No individual splices yet.</div>';
  return `<div class="splices-list"><h4>Individual splices</h4>
    ${loose.map(s => {
      const a = describeFiber(s.fiber_a_id);
      const b = describeFiber(s.fiber_b_id);
      return `<div class="splice-row">
        <div class="desc">
          <span class="fc fc-${a.color}"></span>${esc(a.cable)} ${esc(a.tube_color)}/${a.position}
          →
          <span class="fc fc-${b.color}"></span>${esc(b.cable)} ${esc(b.tube_color)}/${b.position}
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm" onclick="traceFiberPath('${s.fiber_a_id}')" title="Trace full strand path from side A"><i class="fa-solid fa-diagram-project"></i> Trace</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSplice('${s.id}')" ${isReadOnly()?'disabled':''}><i class="fa-solid fa-times"></i></button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function describeFiber(fiberId) {
  const f = state.data.fibers.find(x => x.id === fiberId);
  if (!f) return { cable:'?', tube_color:'?', tube_position:'?', color:'?', position:'?' };
  const tube = state.data.buffer_tubes.find(t => t.id === f.buffer_tube_id);
  const cable = tube ? state.data.cables.find(c => c.id === tube.cable_id) : null;
  return {
    cable: cable?.name || '?',
    tube_color: tube?.color || '?',
    tube_position: tube?.position ?? '?',
    color: f.color,
    position: f.position,
  };
}

// ───────────────────────────────────────────────────────────────────────────
// Path tracing (Phase 2C #11)
// ───────────────────────────────────────────────────────────────────────────

// Fetch the full strand path for fiber_a_id of a splice and light up the
// canvas. We always trace from fiber_a_id (side A) so the result is
// deterministic — if the designer wants the other end they can click
// Trace on the splice at the far end of the chain.
async function traceFiberPath(fiberId) {
  if (!fiberId || !state.currentId) return;
  try {
    const result = await api('/api/splice/fibers/' + fiberId + '/path');
    state.tracePath = result;
    // Re-draw the canvas so highlights appear immediately.
    drawCanvasContents();
    // Show a sidebar chain summary in a transient info area if it exists.
    _renderTracePathSidebar(result);
    if (result.warnings && result.warnings.length) {
      toast(result.warnings[0], 'warn');
    }
  } catch (e) {
    toast('Path trace failed: ' + e.message, 'error');
  }
}

function clearTracePath() {
  state.tracePath = null;
  drawCanvasContents();
  const sidebar = document.getElementById('trace-path-sidebar');
  if (sidebar) sidebar.remove();
}

// Render a numbered chain summary in a floating sidebar overlay on the
// canvas pane. Removed whenever clearTracePath() is called.
function _renderTracePathSidebar(result) {
  // Remove any stale sidebar first.
  const old = document.getElementById('trace-path-sidebar');
  if (old) old.remove();

  const pane = document.querySelector('.canvas-pane');
  if (!pane) return;

  const div = document.createElement('div');
  div.id = 'trace-path-sidebar';
  div.style.cssText = [
    'position:absolute', 'bottom:48px', 'right:10px', 'z-index:10',
    'background:var(--surface-2)', 'border:1px solid var(--border-weak)',
    'border-radius:8px', 'box-shadow:0 2px 8px rgba(0,0,0,.12)',
    'padding:10px 12px', 'font-size:11px', 'max-width:320px',
    'max-height:40vh', 'overflow:auto',
  ].join(';');

  const chain = result.chain || [];
  const hops = chain.map((entry, i) => {
    const f = entry.fiber;
    const label = f.cable_name
      ? `${esc(f.cable_name)} · tube ${f.tube_position} · fiber ${f.position}`
      : `(fiber ${f.id.slice(0, 8)})`;
    const arrow = entry.splice_to_next
      ? ` <span style="color:var(--primary)">→ ${esc(entry.splice_to_next.closure_model || 'closure')} (${esc(entry.splice_to_next.location_name || '?')}) →</span> `
      : '';
    return `<div style="margin-bottom:2px"><b>${i + 1}.</b> ${label}${arrow}</div>`;
  }).join('');

  const flags = [];
  if (result.circular)    flags.push('<span style="color:var(--warning-text)">circular strand detected</span>');
  if (result.over_spliced) flags.push('<span style="color:var(--danger-text)">over-spliced fiber in path</span>');

  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b><i class="fa-solid fa-diagram-project"></i> Strand path (${chain.length} hop${chain.length !== 1 ? 's' : ''})</b>
      <button class="btn btn-sm" onclick="clearTracePath()" title="Clear trace (Esc)"><i class="fa-solid fa-times"></i></button>
    </div>
    ${flags.length ? `<div style="margin-bottom:6px">${flags.join(' · ')}</div>` : ''}
    ${hops || '<div style="color:var(--text-muted)">Single fiber — no splices.</div>'}
  `;
  pane.appendChild(div);
}

function openAddLocation() {

  let models = [];

  const tplOpts = templates.length

        const meta  = ' (' + t.tray_count + '×' + t.tray_capacity + (t.model ? ', ' + esc(t.model) : '') + ')';

        // If a template is selected AND the user hasn't tweaked the
        // shell fields below, prefer the from-template endpoint —
        // it bumps the closure_models picklist + carries notes from
        // the template + signals SSE listeners with from_template.
        if (tplId) {
          await api(`/api/splice/locations/${locId}/closures/from-template/${tplId}`, 'POST');
        } else {
          await api('/api/splice/locations/' + locId + '/closures', 'POST', {

// Auto-fill the closure-shell fields when the user picks a template
// from the picker. They can still tweak before saving.
function onAddClosureTemplateChanged(tplId) {
  const tpl = (state._closureTemplates || []).find(t => t.id === tplId);
  if (!tpl) return;
  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  setVal('m-cl-model', tpl.model || '');
  setVal('m-cl-tc', tpl.tray_count);
  setVal('m-cl-cap', tpl.tray_capacity);
  if (tpl.notes) setVal('m-cl-notes', tpl.notes);
}

// Save the selected closure's shell as a reusable template. Pulls
// model + tray_count + tray_capacity off the closure; lets the user
// name it and pick scope (this client or global).
async function saveClosureAsTemplate(closureId) {
  if (isReadOnly()) return;
  const cl = state.data.closures.find(c => c.id === closureId);
  if (!cl) return;
  const defaultName = (cl.model ? cl.model + ' ' : '') + cl.tray_count + 'x' + cl.tray_capacity;
  const name = prompt('Template name:', defaultName);
  if (!name || !name.trim()) return;
  // Scope: prompt yes/no. Defaults to global; the simple prompt avoids
  // the overhead of a full second modal for what is most often a
  // single-client save.
  const scopeToClient = state.data.project?.client_id
    ? confirm('Scope this template to the current project\'s client?\n\nOK = client-scoped (only shows on that client\'s projects)\nCancel = global (shows on every client)')
    : false;
  try {
    await api('/api/splice/closure-templates', 'POST', {
      name: name.trim(),
      model: cl.model || null,
      tray_count: cl.tray_count,
      tray_capacity: cl.tray_capacity,
      scope_client_id: scopeToClient ? (state.data.project?.client_id || null) : null,
      notes: cl.notes || null,
    });
    toast(`Saved "${name.trim()}" as a template`, 'success');
  } catch (e) { toast('Failed to save template: ' + e.message, 'error'); }
}

// Phase 2A #4 — strand metadata bulk editor. Opens a modal with every
// fiber on this cable and inputs for circuit_name + customer + notes.
// Save fires a single bulk PUT so editing 432 strands at once is one
// network round-trip.
function openStrandMetadataEditor(cableId) {
  if (isReadOnly()) return toast('View-only mode', 'error');
  const cable = state.data.cables.find(c => c.id === cableId);
  if (!cable) return;
  const tubes = state.data.buffer_tubes
    .filter(t => t.cable_id === cableId)
    .sort((a, b) => a.position - b.position);

  // Build rows: one per fiber, in TIA-598 order, grouped by tube.
  const rows = [];
  for (const tube of tubes) {
    const fibersInTube = state.data.fibers
      .filter(f => f.buffer_tube_id === tube.id)
      .sort((a, b) => a.position - b.position);
    for (const f of fibersInTube) {
      const strandPos = (tube.position - 1) * 12 + f.position;
      rows.push(`<tr data-fiber-id="${f.id}">
        <td class="num">${strandPos}</td>
        <td><span class="fc fc-${tube.color}"></span>${tube.position}</td>
        <td><span class="fc fc-${f.color}"></span>${f.position}</td>
        <td><input class="meta-circuit" type="text" value="${esc(f.circuit_name || '')}" placeholder="e.g. CKT-1024"></td>
        <td><input class="meta-customer" type="text" value="${esc(f.customer || '')}" placeholder="e.g. ABC Corp"></td>
        <td><input class="meta-notes" type="text" value="${esc(f.notes || '')}" placeholder="optional"></td>
      </tr>`);
    }
  }

  showModal({
    title: `Edit circuits — ${cable.name} (${cable.fiber_count} fibers)`,
    wide: true,
    body: `
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">
        Circuit names appear on the splicer's PDF when set. Leave blank to omit.
      </p>
      <div style="max-height:60vh;overflow:auto;border:1px solid var(--border-weak);border-radius:4px">
        <table class="table" style="font-size:11px">
          <thead style="position:sticky;top:0;background:var(--surface-2);z-index:1">
            <tr>
              <th>Strand</th><th>Tube</th><th>Fiber</th>
              <th>Circuit name</th><th>Customer</th><th>Notes</th>
            </tr>
          </thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>
    `,
    submitText: `Save ${rows.length} fibers`,
    onSubmit: async (close) => {
      // Collect every row's three fields. Send only fields that
      // changed from the saved value to keep the payload tight on
      // 432-fiber cables.
      const updates = [];
      document.querySelectorAll(`#modal-host tr[data-fiber-id]`).forEach(tr => {
        const id = tr.dataset.fiberId;
        const original = state.data.fibers.find(f => f.id === id);
        const circuit = tr.querySelector('.meta-circuit').value.trim();
        const customer = tr.querySelector('.meta-customer').value.trim();
        const notes = tr.querySelector('.meta-notes').value.trim();
        const patch = { id };
        if (circuit !== (original?.circuit_name || '')) patch.circuit_name = circuit || null;
        if (customer !== (original?.customer || '')) patch.customer = customer || null;
        if (notes !== (original?.notes || '')) patch.notes = notes || null;
        if (Object.keys(patch).length > 1) updates.push(patch);
      });
      if (!updates.length) {
        toast('No changes', 'success');
        close();
        return;
      }
      try {
        const r = await api(`/api/splice/cables/${cableId}/fiber-metadata`, 'PUT', { fibers: updates });
        toast(`Updated ${r.updated_count} fibers`, 'success');
        close();
        await hydrateProject();
      } catch (e) { toast(e.message, 'error'); }
    },
  });
}

async function deleteCable(cableId) {

  const cable = state.data.cables.find(c => c.id === cableId);

  const fiberIds = new Set(state.data.fibers
    .filter(f => state.data.buffer_tubes.find(t => t.id === f.buffer_tube_id && t.cable_id === cableId))

    fiberIds.has(s.fiber_a_id) || fiberIds.has(s.fiber_b_id)

    ? `Delete cable "${cable.name}"? This will cascade-delete ${dependentSplices} splice(s) on its fibers.`
    : `Delete cable "${cable.name}"?`;

  try {
    await api('/api/splice/cables/' + cableId, 'DELETE');

function openSpliceModal(trayId, ribbon) {
  if (isReadOnly()) return toast('View-only mode', 'error');
  const tray = state.data.trays.find(t => t.id === trayId);
  if (!tray) return;
  const usedFibers = new Set();
  state.data.splices.forEach(s => {
    // Cap each fiber at 2 endpoints (one per cable side). The route accepts
    // up to 2 already; we mark any fiber that's hit its limit.
    const aCount = state.data.splices.filter(x => x.fiber_a_id === s.fiber_a_id || x.fiber_b_id === s.fiber_a_id).length;
    if (aCount >= 2) usedFibers.add(s.fiber_a_id);
    const bCount = state.data.splices.filter(x => x.fiber_a_id === s.fiber_b_id || x.fiber_b_id === s.fiber_b_id).length;
    if (bCount >= 2) usedFibers.add(s.fiber_b_id);
  });

  const cableOpts = state.data.cables.map(c => `<option value="${c.id}">${esc(c.name)} (${c.fiber_count}f, ${c.construction_type})</option>`).join('');

  showModal({
    title: ribbon ? 'Ribbon splice ×12 (mass fusion)' : 'Single splice',
    wide: true,
    body: `
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">
        ${ribbon
          ? 'Pick one ribbon (12-fiber buffer tube) on each side. All 12 fibers get spliced together in TIA-598 order — fiber 1 to fiber 1, fiber 2 to fiber 2, etc.'
          : 'Pick one fiber from each side, then click <b>Splice</b>.'}
      </p>
      <div class="splice-cols">
        <div>
          <div class="field" style="margin-bottom:6px"><label>Side A · cable</label>
            <select id="sp-cable-a" onchange="renderFiberPicker('a')"><option value="">Pick cable…</option>${cableOpts}</select></div>
          <div class="field" id="sp-tube-a-wrap" style="margin-bottom:6px;display:none"><label>Side A · ${ribbon?'ribbon':'tube'}</label>
            <select id="sp-tube-a" onchange="renderFibersOnly('a')"></select></div>
          ${!ribbon ? `<div class="field" style="margin-bottom:0"><label>Side A · fiber</label>
            <div id="sp-fibers-a" class="fiber-grid"><div class="empty-pane">Pick a cable</div></div></div>` : ''}
        </div>
        <div>
          <div class="field" style="margin-bottom:6px"><label>Side B · cable</label>
            <select id="sp-cable-b" onchange="renderFiberPicker('b')"><option value="">Pick cable…</option>${cableOpts}</select></div>
          <div class="field" id="sp-tube-b-wrap" style="margin-bottom:6px;display:none"><label>Side B · ${ribbon?'ribbon':'tube'}</label>
            <select id="sp-tube-b" onchange="renderFibersOnly('b')"></select></div>
          ${!ribbon ? `<div class="field" style="margin-bottom:0"><label>Side B · fiber</label>
            <div id="sp-fibers-b" class="fiber-grid"><div class="empty-pane">Pick a cable</div></div></div>` : ''}
        </div>
      </div>
    `,
    submitText: ribbon ? 'Splice 12 fibers' : 'Splice',
    onSubmit: async (close) => {
      if (ribbon) {
        const tubeA = document.getElementById('sp-tube-a').value;
        const tubeB = document.getElementById('sp-tube-b').value;
        if (!tubeA || !tubeB) return toast('Pick a ribbon on both sides', 'error');
        const fibersA = state.data.fibers.filter(f => f.buffer_tube_id === tubeA).sort((a,b)=>a.position-b.position);
        const fibersB = state.data.fibers.filter(f => f.buffer_tube_id === tubeB).sort((a,b)=>a.position-b.position);
        if (fibersA.length !== 12 || fibersB.length !== 12) return toast('Each ribbon must have 12 fibers', 'error');
        const pairs = fibersA.map((fa, i) => ({ fiber_a_id: fa.id, fiber_b_id: fibersB[i].id }));
        try {
          await api('/api/splice/trays/' + trayId + '/ribbon-splice', 'POST', { pairs });
          close();
          await hydrateProject();
        } catch (e) { toast(e.message, 'error'); }
      } else {
        const fa = state._spA;
        const fb = state._spB;
        if (!fa || !fb) return toast('Pick a fiber on both sides', 'error');
        try {
          await api('/api/splice/trays/' + trayId + '/splices', 'POST', {
            fiber_a_id: fa, fiber_b_id: fb,
          });
          close();
          state._spA = null; state._spB = null;
          await hydrateProject();
        } catch (e) { toast(e.message, 'error'); }
      }
    },
  });
  state._spA = null; state._spB = null;
  state._spRibbon = ribbon;
  state._spUsed = usedFibers;
}

// Cable-side onchange. Rebuilds the tube dropdown from the picked
// cable's buffer_tubes; resets the fiber grid to the "pick a tube"
// placeholder. The tube dropdown's onchange points at renderFibersOnly
// (below) so the user's tube selection isn't clobbered every time
// they pick a tube — that was the "tubes don't populate" bug.
window.renderFiberPicker = function(side) {
  const ribbon = state._spRibbon;
  const cableSel = document.getElementById('sp-cable-' + side);
  const cableId = cableSel.value;
  const tubeWrap = document.getElementById('sp-tube-' + side + '-wrap');
  const tubeSel  = document.getElementById('sp-tube-' + side);
  if (!cableId) {
    tubeWrap.style.display = 'none';
    if (!ribbon) document.getElementById('sp-fibers-' + side).innerHTML = '<div class="empty-pane">Pick a cable</div>';
    return;
  }
  const tubes = state.data.buffer_tubes.filter(t => t.cable_id === cableId).sort((a,b)=>a.position-b.position);
  tubeWrap.style.display = 'block';
  tubeSel.innerHTML = '<option value="">Pick tube…</option>' + tubes.map(t =>
    `<option value="${t.id}">${t.position}. ${t.color}</option>`
  ).join('');
  if (!ribbon) {
    document.getElementById('sp-fibers-' + side).innerHTML = '<div class="empty-pane">Pick a tube</div>';
  }
};

// Tube-side onchange. Reads the currently-selected tube and builds
// the fiber grid for it. Does NOT touch the tube dropdown — that's
// what the user just clicked, and rebuilding it would wipe their
// selection.
window.renderFibersOnly = function(side) {
  if (state._spRibbon) return;  // ribbon mode doesn't show a fiber grid
  const tubeSel = document.getElementById('sp-tube-' + side);
  const tubeId = tubeSel.value;
  const grid = document.getElementById('sp-fibers-' + side);
  if (!tubeId) { grid.innerHTML = '<div class="empty-pane">Pick a tube</div>'; return; }
  const fibers = state.data.fibers
    .filter(f => f.buffer_tube_id === tubeId)
    .sort((a,b)=>a.position-b.position);
  grid.innerHTML = fibers.map(f => {
    const used = state._spUsed.has(f.id);
    return `<div class="fiber-cell ${used?'in-use':''}"
      data-fiber-id="${f.id}" data-side="${side}"
      onclick="${used?'':'pickFiber(this)'}">
      <span class="fc fc-${f.color}"></span>${f.position}
    </div>`;
  }).join('');
};

window.pickFiber = function(el) {
  const side = el.dataset.side;
  const fid = el.dataset.fiberId;
  document.querySelectorAll('.fiber-cell[data-side="' + side + '"]').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  if (side === 'a') state._spA = fid; else state._spB = fid;
};

// ───────────────────────────────────────────────────────────────────────────
// Cross-project search — debounced sidebar lookup
// ───────────────────────────────────────────────────────────────────────────

let _searchTimer = null;
function onSearchInput(value) {
  clearTimeout(_searchTimer);
  const q = (value || '').trim();
  const host = document.getElementById('search-results');
  if (q.length < 2) { host.style.display = 'none'; host.innerHTML = ''; return; }
  // 200ms debounce — fast enough to feel live, slow enough to skip
  // every-keystroke round-trips on a fast typist.
  _searchTimer = setTimeout(() => runSearch(q), 200);
}

async function runSearch(q) {
  const host = document.getElementById('search-results');
  host.style.display = 'block';
  host.innerHTML = '<div style="padding:8px;color:var(--text-muted)">Searching…</div>';
  let r;
  try { r = await api('/api/splice/search?q=' + encodeURIComponent(q)); }
  catch (e) {
    host.innerHTML = '<div style="padding:8px;color:var(--danger)">Search failed: ' + esc(e.message) + '</div>';
    return;
  }
  const total = r.projects.length + r.locations.length + r.cables.length + r.closures.length + r.fibers.length;
  if (!total) {
    host.innerHTML = '<div style="padding:8px;color:var(--text-muted)">No matches.</div>';
    return;
  }
  // Each result deep-links: clicking a non-project result selects the
  // owning project, hydrates, then sets state.selection so the inspector
  // opens on the matched entity.
  const sec = (label, rows, render) => rows.length ? `
    <div style="padding:6px 8px 2px;color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.05em">
      ${esc(label)} <span style="font-weight:400">(${rows.length})</span>
    </div>
    ${rows.map(render).join('')}
  ` : '';
  host.innerHTML = `
    ${sec('Projects', r.projects, p => `
      <div class="search-row" onclick="selectFromSearch('project','${p.id}','${p.id}')" style="padding:5px 10px;cursor:pointer;border-top:1px solid var(--border-weak)">
        <b>${esc(p.name)}</b> <span style="color:var(--text-muted)">${esc(p.status || '')}</span>
      </div>
    `)}
    ${sec('Locations', r.locations, l => `
      <div class="search-row" onclick="selectFromSearch('location','${l.id}','${l.project_id}')" style="padding:5px 10px;cursor:pointer;border-top:1px solid var(--border-weak)">
        <b>${esc(l.name)}</b> <span style="color:var(--text-muted)">${esc(l.type || '')}</span>
        <div style="font-size:10px;color:var(--text-muted)">${esc(l.project_name)}</div>
      </div>
    `)}
    ${sec('Cables', r.cables, c => `
      <div class="search-row" onclick="selectFromSearch('cable','${c.id}','${c.project_id}')" style="padding:5px 10px;cursor:pointer;border-top:1px solid var(--border-weak)">
        <b>${esc(c.name)}</b> <span style="color:var(--text-muted)">${c.fiber_count}f</span>
        <div style="font-size:10px;color:var(--text-muted)">${esc(c.project_name)}</div>
      </div>
    `)}
    ${sec('Closures', r.closures, cl => `
      <div class="search-row" onclick="selectFromSearch('closure','${cl.id}','${cl.project_id}')" style="padding:5px 10px;cursor:pointer;border-top:1px solid var(--border-weak)">
        <b>${esc(cl.model || 'Closure')}</b> <span style="color:var(--text-muted)">at ${esc(cl.location_name)}</span>
        <div style="font-size:10px;color:var(--text-muted)">${esc(cl.project_name)}</div>
      </div>
    `)}
    ${sec('Circuits', r.fibers, f => `
      <div class="search-row" onclick="selectFromSearch('fiber','${f.id}','${f.project_id}')" style="padding:5px 10px;cursor:pointer;border-top:1px solid var(--border-weak)">
        <b>${esc(f.circuit_name || '(no circuit name)')}</b>
        ${f.customer ? '<span style="color:var(--text-muted)"> · ' + esc(f.customer) + '</span>' : ''}
        <div style="font-size:10px;color:var(--text-muted)">${esc(f.cable_name)} ${esc(f.color)}-${f.position} · ${esc(f.project_name)}</div>
      </div>
    `)}
  `;
  host.querySelectorAll('.search-row').forEach(el => {
    el.addEventListener('mouseenter', () => el.style.background = 'var(--surface-2)');
    el.addEventListener('mouseleave', () => el.style.background = '');
  });
}

async function selectFromSearch(kind, entityId, projectId) {
  // Hide the results panel so the click feels immediate.
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-input').value = '';
  if (state.currentId !== projectId) {
    await selectProject(projectId);
  }
  // After hydrate, set selection so the inspector lands on the match.
  if (kind !== 'project') {
    selectThing(kind, entityId);
  }
}

// Click outside the search results closes them (sidebar feel).
document.addEventListener('click', (e) => {
  const host = document.getElementById('search-results');
  const input = document.getElementById('search-input');
  if (!host || !input) return;
  if (!host.contains(e.target) && e.target !== input) {
    host.style.display = 'none';
  }
});

function showModal({ title, body, onSubmit, submitText='Save', wide=false }) {

  host.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${wide?'wide':''}">
        <header>

        </header>
        <div class="body">${body}</div>

        </footer>

function closeModal() { document.getElementById('modal-host').innerHTML = ''; }

// ───────────────────────────────────────────────────────────────────────────
// Map view (Phase 3A) — MapLibre GL JS, lazy-loaded on first activation.
// Esri World Imagery as the default basemap (free, attributed). The map
// renders the same closure/cable rows as the diagram tab — one source
// of truth, two views. Click a marker → open the existing closure
// inspector in the right pane. Drag a marker → PUT /coords. Draw-path
// mode adds waypoints click-by-click and double-click finishes.
// ───────────────────────────────────────────────────────────────────────────

const MAPLIBRE_VERSION = '4.7.1';
let _mapLibrePromise = null;
function loadMapLibre() {
  if (_mapLibrePromise) return _mapLibrePromise;
  _mapLibrePromise = new Promise((resolve, reject) => {
    // CSS first so the canvas mounts with the right styles.
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.css`;
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = `https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.js`;
    s.onload  = () => resolve(window.maplibregl);
    s.onerror = () => reject(new Error('Failed to load MapLibre GL JS'));
    document.head.appendChild(s);
  });
  return _mapLibrePromise;
}

// Esri World Imagery — free for non-commercial-and-light-commercial use,
// attributed in tile URL params. The most common OSP-industry basemap.
const ESRI_SAT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
// Esri reference overlay — boundaries + place names + major roads, used
// in hybrid mode on top of the satellite tiles. Same provider, same
// attribution, transparent PNGs.
const ESRI_REF_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';

// Default starting view when a project has no geographic data yet.
// Mecca Drive, Macon GA — owner-set 2026-05-06. Once a project gets
// any location coords, mapFitData() flies to the actual extent on the
// next hydrate, so this only matters on first-touch.
const DEFAULT_MAP_CENTER = [-83.6736, 32.8625];
const DEFAULT_MAP_ZOOM   = 15;

// Basemap mode persists across sessions (matches dark-mode pattern).
function loadBasemapMode() {
  try { return localStorage.getItem('lfs_splice_basemap') || 'hybrid'; }
  catch { return 'hybrid'; }
}
function saveBasemapMode(mode) {
  try { localStorage.setItem('lfs_splice_basemap', mode); } catch {}
}

function switchView(view) {
  if (view === state.activeView) return;
  state.activeView = view;
  document.querySelectorAll('.view-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === view));
  const isMap = view === 'map';
  document.getElementById('stage').style.display      = isMap ? 'none' : 'block';
  document.getElementById('toolbar').style.display    = isMap ? 'none' : 'flex';
  document.getElementById('map-stage').style.display  = isMap ? 'block' : 'none';
  document.getElementById('map-toolbar').style.display = isMap ? 'flex' : 'none';
  if (isMap) initMapIfNeeded();
}

async function initMapIfNeeded() {
  if (state.map) {
    // Already mounted; just refresh from current state.data.
    state.map.resize();
    refreshMapLayers();
    mapFitData();
    return;
  }
  try {
    const maplibregl = await loadMapLibre();
    state.maplibregl = maplibregl;
    const initialBasemap = loadBasemapMode();
    state.basemap = initialBasemap;
    const map = new maplibregl.Map({
      container: 'map-stage',
      style: {
        version: 8,
        sources: {
          'esri-sat': {
            type: 'raster',
            tiles: [ESRI_SAT_TILES],
            tileSize: 256,
            attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
          },
          'esri-ref': {
            type: 'raster',
            tiles: [ESRI_REF_TILES],
            tileSize: 256,
            attribution: 'Reference © Esri',
          },
        },
        layers: [
          { id: 'esri-sat', type: 'raster', source: 'esri-sat' },
          // The reference overlay starts visible-iff-hybrid; toggle
          // function flips its layout.visibility.
          {
            id: 'esri-ref',
            type: 'raster',
            source: 'esri-ref',
            layout: { visibility: initialBasemap === 'hybrid' ? 'visible' : 'none' },
          },
        ],
      },
      // Mecca Drive, Macon GA default. mapFitData() flies to a project's
      // actual extent on the next hydrate when geo data exists.
      center: DEFAULT_MAP_CENTER,
      zoom: DEFAULT_MAP_ZOOM,
      attributionControl: { compact: true },
    });
    state.map = map;
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));
    // Sync the basemap toggle label to whatever was loaded from
    // localStorage (defaults to 'hybrid' on first run).
    const bmLabel = document.getElementById('btn-basemap-label');
    if (bmLabel) bmLabel.textContent = initialBasemap === 'hybrid' ? 'Hybrid' : 'Satellite';
    map.on('load', () => {
      // Source + layer for cable polylines. We re-set the data on every
      // refresh from state.data; the source itself just needs to exist
      // so the layer can mount.
      map.addSource('cables', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'cables-line',
        type: 'line',
        source: 'cables',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#FFD400',
          'line-width': 3,
          'line-opacity': 0.9,
        },
      });
      // Halo so the line is visible over both bright and dark satellite.
      map.addLayer({
        id: 'cables-line-halo',
        type: 'line',
        source: 'cables',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#000',
          'line-width': 6,
          'line-opacity': 0.3,
        },
      }, 'cables-line');
      // Track in-progress draw waypoints separately so we can render
      // them while the user is clicking.
      map.addSource('draft-path', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'draft-path-line',
        type: 'line',
        source: 'draft-path',
        paint: { 'line-color': '#FF6E00', 'line-width': 3, 'line-dasharray': [2, 2] },
      });
      map.addLayer({
        id: 'draft-path-points',
        type: 'circle',
        source: 'draft-path',
        filter: ['==', '$type', 'Point'],
        paint: { 'circle-radius': 5, 'circle-color': '#FF6E00', 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 },
      });
      refreshMapLayers();
      mapFitData();
      map.on('click', (e) => {
        if (state.mapMode === 'place-new') {
          mapApplyNewLocation(e.lngLat);
        } else if (state.mapMode === 'multistop') {
          mapMsAddStop(e.lngLat);
        }
      });
      map.on('dblclick', (e) => {
        if (state.mapMode === 'multistop') {
          e.preventDefault();
          mapMsFinish();
        }
      });
      // Cable click → enter edit-path mode.
      map.on('click', 'cables-line', (e) => {
        if (state.mapMode) return;
        const props = e.features[0]?.properties;
        if (props?.id) mapStartEditPath(props.id);
      });
      map.on('mouseenter', 'cables-line', () => {
        if (!state.mapMode) map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'cables-line', () => {
        if (!state.mapMode) map.getCanvas().style.cursor = '';
      });
    });
  } catch (e) {
    toast('Map failed to load: ' + e.message, 'error');
  }
}

// Haversine in feet — client-side mirror of the server helper so the
// multi-stop running tally works without a round-trip.
function _haversineFtClient(coords) {
  if (!coords || coords.length < 2) return 0;
  const R = 20902231;
  let total = 0;
  for (let i = 1; i < coords.length; i++) {
    const [lon1, lat1] = coords[i - 1];
    const [lon2, lat2] = coords[i];
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    total += 2 * R * Math.asin(Math.sqrt(a));
  }
  return total;
}

function refreshMapLayers() {
  const map = state.map;
  if (!map || !map.isStyleLoaded() || !state.data) return;

  // Tear down existing markers so we can rebuild from scratch.
  (state._mapMarkers || []).forEach(m => m.remove());
  (state._mapLabelMarkers || []).forEach(m => m.remove());
  state._mapMarkers = [];
  state._mapLabelMarkers = [];

  const ml = state.maplibregl;
  const locsWithGeo = (state.data.locations || []).filter(l => l.latitude != null && l.longitude != null);

  for (const loc of locsWithGeo) {
    const closuresAtLoc = (state.data.closures || []).filter(c => c.location_id === loc.id);
    const color = _locColor(loc);
    const el = document.createElement('div');
    el.className = 'map-closure-marker';
    // Larger dot (20px) for closures to signal there's data inside.
    const sz = closuresAtLoc.length ? 20 : 16;
    el.style.cssText = `width:${sz}px;height:${sz}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);cursor:pointer;transition:transform .1s`;
    el.title = loc.name + ` (${loc.type})` + (closuresAtLoc.length ? ' · ' + closuresAtLoc.length + ' closure(s)' : '');

    // Small name label below the dot.
    const label = document.createElement('div');
    label.textContent = loc.name;
    label.style.cssText = 'position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;font-size:10px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none';
    el.appendChild(label);
    el.style.position = 'relative';

    const marker = new ml.Marker({ element: el, draggable: !isReadOnly() })
      .setLngLat([Number(loc.longitude), Number(loc.latitude)])
      .addTo(map);

    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (state.mapMode === 'multistop') {
        // Snap to this location in multi-stop mode instead of opening inspector.
        mapMsSnapToLocation(loc);
        return;
      }
      // Always open the rich location inspector; it links through to closures.
      selectThing('location', loc.id);
    });

    marker.on('dragend', async () => {
      const ll = marker.getLngLat();
      try {
        await api(`/api/splice/locations/${loc.id}/coords`, 'PUT', {
          latitude: ll.lat, longitude: ll.lng,
        });
        loc.latitude = ll.lat; loc.longitude = ll.lng;
      } catch (e) {
        toast('Move failed: ' + e.message, 'error');
        marker.setLngLat([Number(loc.longitude), Number(loc.latitude)]);
      }
    });
    state._mapMarkers.push(marker);
  }

  // Cable polylines with footage labels at their midpoints.
  const cablesWithPath = (state.data.cables || []).filter(
    c => c.path_geojson && Array.isArray(c.path_geojson.coordinates) && c.path_geojson.coordinates.length >= 2
  );
  const cableFeatures = cablesWithPath.map(c => ({
    type: 'Feature',
    geometry: c.path_geojson,
    properties: { id: c.id, name: c.name, fiber_count: c.fiber_count,
                  path_length_feet: c.path_length_feet || 0 },
  }));
  const src = map.getSource('cables');
  if (src) src.setData({ type: 'FeatureCollection', features: cableFeatures });

  // Footage labels — Marker-based so they render cleanly over raster tiles.
  for (const c of cablesWithPath) {
    const ft = c.path_length_feet || 0;
    if (!ft) continue;
    const coords = c.path_geojson.coordinates;
    // Midpoint: interpolate along the coordinate array by total length.
    const mid = _midpointOfPolyline(coords);
    if (!mid) continue;
    const lbl = document.createElement('div');
    lbl.textContent = `${Math.round(ft)} ft`;
    lbl.style.cssText = 'background:rgba(0,0,0,.55);color:#FFD400;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;pointer-events:none;letter-spacing:0.3px';
    const m = new ml.Marker({ element: lbl, anchor: 'center' })
      .setLngLat(mid)
      .addTo(map);
    state._mapLabelMarkers.push(m);
  }
}

// Returns the geographic midpoint along a polyline (equal arc-length split).
function _midpointOfPolyline(coords) {
  if (!coords || coords.length < 2) return null;
  // Accumulate segment lengths, find half-total, interpolate.
  const segs = [];
  let total = 0;
  for (let i = 1; i < coords.length; i++) {
    const d = _haversineFtClient([coords[i - 1], coords[i]]);
    segs.push(d);
    total += d;
  }
  let half = total / 2;
  for (let i = 0; i < segs.length; i++) {
    if (segs[i] >= half) {
      const t = half / segs[i];
      const [lon1, lat1] = coords[i];
      const [lon2, lat2] = coords[i + 1];
      return [lon1 + (lon2 - lon1) * t, lat1 + (lat2 - lat1) * t];
    }
    half -= segs[i];
  }
  return coords[Math.floor(coords.length / 2)];
}

function mapFitData() {
  const map = state.map;
  if (!map || !state.data) return;
  const ml = state.maplibregl;
  const bounds = new ml.LngLatBounds();
  let count = 0;
  for (const loc of state.data.locations || []) {
    if (loc.latitude != null && loc.longitude != null) {
      bounds.extend([Number(loc.longitude), Number(loc.latitude)]);
      count++;
    }
  }
  for (const c of state.data.cables || []) {
    if (c.path_geojson && Array.isArray(c.path_geojson.coordinates)) {
      for (const pt of c.path_geojson.coordinates) bounds.extend(pt);
    }
  }
  if (count === 0 && bounds.isEmpty()) return;
  map.fitBounds(bounds, { padding: 60, maxZoom: 18, duration: 500 });
}

// ─── Multi-stop cable draw ──────────────────────────────────────────────────

function mapToggleMultistop() {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  if (state.mapMode === 'multistop') return mapClearMode();
  mapClearMode();
  state.mapMode = 'multistop';
  state._msStops = [];
  state._msMarkers = [];
  document.getElementById('btn-draw-cable').classList.add('active');
  document.getElementById('map-stage').classList.add('placing');
  document.getElementById('map-mode-hint').textContent = 'Click a location to start cable route. Double-click to finish. Esc cancels.';
}

// Snap-to-location check: find the nearest marker within ~25 CSS px of click.
function _msFindNearestLoc(lngLat) {
  const map = state.map;
  if (!map) return null;
  const clickPx = map.project(lngLat);
  const SNAP_PX = 25;
  let best = null, bestD = Infinity;
  for (const loc of (state.data.locations || [])) {
    if (loc.latitude == null || loc.longitude == null) continue;
    const px = map.project([Number(loc.longitude), Number(loc.latitude)]);
    const d = Math.hypot(clickPx.x - px.x, clickPx.y - px.y);
    if (d < SNAP_PX && d < bestD) { best = loc; bestD = d; }
  }
  return best;
}

function mapMsSnapToLocation(loc) {
  // Called when user clicks a marker directly in multistop mode.
  _mapMsAddStopInternal([Number(loc.longitude), Number(loc.latitude)], loc.id, loc.name);
}

function mapMsAddStop(lngLat) {
  if (state.mapMode !== 'multistop') return;
  const snapped = _msFindNearestLoc(lngLat);
  if (snapped) {
    _mapMsAddStopInternal([Number(snapped.longitude), Number(snapped.latitude)], snapped.id, snapped.name);
  } else {
    _mapMsAddStopInternal([lngLat.lng, lngLat.lat], null, null);
  }
}

function _mapMsAddStopInternal(coord, locationId, locName) {
  state._msStops.push({ coord, locationId, name: locName });
  // Visual indicator for the waypoint.
  const ml = state.maplibregl;
  const el = document.createElement('div');
  const isSnapped = locationId != null;
  el.style.cssText = `width:12px;height:12px;border-radius:50%;background:${isSnapped?'#16A34A':'#FF6E00'};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);pointer-events:none`;
  const m = new ml.Marker({ element: el }).setLngLat(coord).addTo(state.map);
  state._msMarkers.push(m);
  mapMsUpdateDraftPath();
  mapMsUpdateHint();
}

function mapMsUpdateDraftPath() {
  const map = state.map;
  if (!map) return;
  const coords = state._msStops.map(s => s.coord);
  const features = [];
  if (coords.length >= 2) {
    features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  }
  const src = map.getSource('draft-path');
  if (src) src.setData({ type: 'FeatureCollection', features });
}

function mapMsUpdateHint() {
  const stops = state._msStops;
  if (!stops.length) {
    document.getElementById('map-mode-hint').textContent = 'Click a location to start cable route. Double-click to finish. Esc cancels.';
    return;
  }
  const coords = stops.map(s => s.coord);
  const ft = Math.round(_haversineFtClient(coords));
  const names = stops.map(s => s.name || '(free)').join(' → ');
  document.getElementById('map-mode-hint').textContent =
    `${names} · ${ft.toLocaleString()} ft so far — double-click last point to finish`;
}

async function mapMsFinish() {
  if (state.mapMode !== 'multistop') return;
  const stops = state._msStops;
  if (stops.length < 2) {
    toast('Need at least two points to define a route', 'error');
    return;
  }
  // Collect snapped endpoints and intermediates.
  const fromLoc = stops.find(s => s.locationId)?.locationId || null;
  const toLoc = [...stops].reverse().find(s => s.locationId)?.locationId || null;
  const intermediates = stops.slice(1, -1).filter(s => s.locationId);
  const coords = stops.map(s => s.coord);
  const totalFt = Math.round(_haversineFtClient(coords));

  // Prompt for cable details via a modal.
  const FIBER_OPTIONS = [12, 24, 48, 96, 144, 288, 432, 864];
  await new Promise((resolve) => {
    showModal({
      title: 'Create cable',
      body: `
        <div class="field"><label>Cable name</label>
          <input id="ms-cable-name" type="text" placeholder="e.g. 24f-HH1-to-HH5" style="width:100%"></div>
        <div class="row">
          <div class="field"><label>Fiber count</label>
            <select id="ms-fiber-count">${FIBER_OPTIONS.map(n=>`<option value="${n}"${n===24?' selected':''}>${n}f</option>`).join('')}</select>
          </div>
          <div class="field"><label>Construction</label>
            <select id="ms-construction"><option value="loose_tube">Loose tube</option><option value="ribbon">Ribbon</option></select>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Route: ${totalFt.toLocaleString()} ft across ${stops.length} stops</div>
      `,
      submitText: 'Create cable',
      onSubmit: async (close) => {
        const name = document.getElementById('ms-cable-name').value.trim();
        if (!name) { toast('Cable name required', 'error'); return; }
        const fiber_count = Number(document.getElementById('ms-fiber-count').value);
        const construction_type = document.getElementById('ms-construction').value;
        try {
          const result = await api(`/api/splice/projects/${state.currentId}/cables`, 'POST', {
            name, fiber_count, construction_type,
            from_location_id: fromLoc, to_location_id: toLoc,
          });
          const cableId = result.cable.id;
          await api(`/api/splice/cables/${cableId}/path`, 'PUT', {
            path_geojson: { type: 'LineString', coordinates: coords },
          });
          toast(`Cable "${name}" created (${totalFt.toLocaleString()} ft)`, 'success');
          close();
          mapClearMode();
          await hydrateProject();
          if (state.activeView === 'map') refreshMapLayers();
          // Follow-up: offer to add closures at intermediate snapped stops.
          for (const stop of intermediates) {
            const loc = state.data.locations.find(l => l.id === stop.locationId);
            if (!loc) continue;
            const yes = window.confirm(`Add closure / splice assignments at "${loc.name}"?`);
            if (yes) {
              selectThing('location', loc.id);
              await openAddClosureForLocation(loc.id);
            }
          }
          resolve();
        } catch (e) {
          toast('Failed: ' + e.message, 'error');
        }
      },
    });
    // Cancel button clears the draw mode but doesn't throw.
    // The overlay click also clears it via closeModal() → no resolve() needed;
    // the Promise just hangs (no side-effect since mapClearMode handles cleanup).
    document.getElementById('modal-host').querySelector('.close')
      ?.addEventListener('click', () => { mapClearMode(); resolve(); }, { once: true });
    document.getElementById('modal-host').querySelector('.modal-overlay')
      ?.addEventListener('click', (ev) => {
        if (ev.target === ev.currentTarget) { mapClearMode(); resolve(); }
      }, { once: true });
    document.getElementById('modal-host').querySelector('footer .btn:first-child')
      ?.addEventListener('click', () => { mapClearMode(); resolve(); }, { once: true });
  });
}

// ─── Cable path editing ────────────────────────────────────────────────────

function mapStartEditPath(cableId) {
  if (isReadOnly()) return toast('Read-only — take over the lock first', 'error');
  const cable = (state.data.cables || []).find(c => c.id === cableId);
  if (!cable || !cable.path_geojson) return;
  mapClearMode();
  state.mapMode = 'edit-path';
  state._editingCableId = cableId;
  state._editPathCoords = cable.path_geojson.coordinates.map(c => [...c]);
  document.getElementById('map-stage').classList.add('placing');
  document.getElementById('map-mode-hint').textContent =
    `Editing "${cable.name}": drag handles to move, click midpoints to insert. Esc to cancel.`;
  mapRebuildEditHandles();
}

function mapRebuildEditHandles() {
  const map = state.map;
  if (!map) return;
  (state._cableHandleMarkers || []).forEach(m => m.remove());
  state._cableHandleMarkers = [];
  const ml = state.maplibregl;
  const coords = state._editPathCoords;

  // Actual waypoint handles.
  for (let i = 0; i < coords.length; i++) {
    const el = document.createElement('div');
    el.className = 'cable-handle';
    const idx = i; // capture for closure
    const marker = new ml.Marker({ element: el, draggable: true })
      .setLngLat(coords[i])
      .addTo(map);
    marker.on('drag', () => {
      const ll = marker.getLngLat();
      coords[idx] = [ll.lng, ll.lat];
      _editPathUpdateDraftLine(coords);
    });
    marker.on('dragend', () => {
      mapSaveEditedPath();
      // Rebuild to reposition midpoint handles correctly.
      mapRebuildEditHandles();
    });
    // Shift-click to delete a waypoint (minimum 2 points required).
    el.addEventListener('click', (ev) => {
      if (!ev.shiftKey) return;
      ev.stopPropagation();
      if (coords.length <= 2) return toast('A path needs at least 2 points', 'info');
      coords.splice(idx, 1);
      mapSaveEditedPath();
      mapRebuildEditHandles();
    });
    state._cableHandleMarkers.push(marker);
  }

  // Midpoint insertion handles (between every consecutive pair).
  for (let i = 0; i < coords.length - 1; i++) {
    const [lon1, lat1] = coords[i];
    const [lon2, lat2] = coords[i + 1];
    const midCoord = [(lon1 + lon2) / 2, (lat1 + lat2) / 2];
    const el = document.createElement('div');
    el.className = 'cable-handle mid';
    const afterIdx = i + 1; // insert before this index
    const midMarker = new ml.Marker({ element: el, draggable: true })
      .setLngLat(midCoord)
      .addTo(map);
    midMarker.on('dragstart', () => {
      // Promote to a real waypoint on first drag.
      const ll = midMarker.getLngLat();
      coords.splice(afterIdx, 0, [ll.lng, ll.lat]);
      midMarker.remove();
      // Rebuild handles now that coords has a new entry; the dragend
      // will save after this.
    });
    midMarker.on('dragend', () => {
      mapSaveEditedPath();
      mapRebuildEditHandles();
    });
    state._cableHandleMarkers.push(midMarker);
  }

  _editPathUpdateDraftLine(coords);
}

function _editPathUpdateDraftLine(coords) {
  const map = state.map;
  if (!map) return;
  const features = [];
  if (coords.length >= 2) {
    features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  }
  const src = map.getSource('draft-path');
  if (src) src.setData({ type: 'FeatureCollection', features });
}

async function mapSaveEditedPath() {
  const cableId = state._editingCableId;
  if (!cableId || state._editPathCoords.length < 2) return;
  const path_geojson = { type: 'LineString', coordinates: state._editPathCoords.map(c => [...c]) };
  try {
    await api(`/api/splice/cables/${cableId}/path`, 'PUT', { path_geojson });
    // Optimistically update local state so footage label updates.
    const cable = (state.data.cables || []).find(c => c.id === cableId);
    if (cable) {
      cable.path_geojson = path_geojson;
      cable.path_length_feet = Math.round(_haversineFtClient(path_geojson.coordinates));
    }
    refreshMapLayers();
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

// ─── Basemap ───────────────────────────────────────────────────────────────

// Cycle between satellite-only and hybrid (satellite + reference labels).
// Persists across sessions in localStorage.
function cycleBasemap() {
  if (!state.map) return;
  const next = state.basemap === 'hybrid' ? 'sat' : 'hybrid';
  state.basemap = next;
  saveBasemapMode(next);
  state.map.setLayoutProperty('esri-ref', 'visibility', next === 'hybrid' ? 'visible' : 'none');
  document.getElementById('btn-basemap-label').textContent = next === 'hybrid' ? 'Hybrid' : 'Satellite';
}

// ─── Mode clear ────────────────────────────────────────────────────────────

function mapClearMode() {
  // Clean up multi-stop markers.
  (state._msMarkers || []).forEach(m => m.remove());
  state._msMarkers = [];
  state._msStops = [];
  // Clean up edit-path handles.
  (state._cableHandleMarkers || []).forEach(m => m.remove());
  state._cableHandleMarkers = [];
  state._editingCableId = null;
  state._editPathCoords = [];

  state.mapMode = null;
  state.mapPlaceType = null;
  state.mapPlaceTargetId = null;
  state.mapPathTargetId = null;
  state.mapPathPoints = [];
  const btnAdd = document.getElementById('btn-add-item');
  const btnDraw = document.getElementById('btn-draw-cable');
  if (btnAdd) btnAdd.classList.remove('active');
  if (btnDraw) btnDraw.classList.remove('active');
  document.getElementById('map-stage').classList.remove('placing');
  document.getElementById('map-mode-hint').textContent = '';
  if (state.map) {
    const src = state.map.getSource('draft-path');
    if (src) src.setData({ type: 'FeatureCollection', features: [] });
    // Restore default cursor.
    state.map.getCanvas().style.cursor = '';
  }
}

// Esc cancels any active map mode.
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.mapMode) mapClearMode();
    if (state.tracePath) clearTracePath();
  }
});
