<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Launch Fiber — Splice Matrix</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Konva pinned so a CDN release can't silently change canvas behavior. -->
<script src="https://cdn.jsdelivr.net/npm/konva@9.3.16/konva.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* Token system mirrors design.html — light defaults + dark overrides. */
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;--primary-text:#FFFFFF;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --text:#222222;--text-secondary:#555555;--text-muted:#6C757D;
  --border-strong:#CED4DA;--border-weak:#DEE2E6;
  --success:#28A745;--success-light:#D4EDDA;--success-text:#155724;
  --warning:#FFC107;--warning-light:#FFF3CD;--warning-text:#856404;
  --danger:#DC3545;--danger-light:#F8D7DA;--danger-text:#721C24;
  --info:#17A2B8;--info-light:#D1ECF1;--info-text:#0C5460;
  --white:#FFFFFF;--gray-light:#F0F0F0;--gray-border:#DEE2E6;
  /* Fiber color literals — TIA-598 — used for swatches. */
  --fc-blue:#1660C9;--fc-orange:#E67E22;--fc-green:#27AE60;--fc-brown:#8B5A2B;
  --fc-slate:#7F8C8D;--fc-white:#F5F5F5;--fc-red:#C0392B;--fc-black:#000;
  --fc-yellow:#F1C40F;--fc-violet:#8E44AD;--fc-rose:#E91E63;--fc-aqua:#1ABC9C;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;--primary-text:#FFFFFF;
  --surface-1:#1A1F26;--surface-2:#242B36;--surface-3:#1F2630;
  --text:#E6EAF0;--text-secondary:#B8BFC9;--text-muted:#8A95A4;
  --border-strong:#3A4250;--border-weak:#2D343F;
  --success:#3DD174;--success-light:#1F4030;--success-text:#9AE5B5;
  --warning:#FFD43B;--warning-light:#3D3010;--warning-text:#FFE58F;
  --danger:#FF6B7A;--danger-light:#3D1820;--danger-text:#FFA0AC;
  --info:#5BC0DE;--info-light:#0E3340;--info-text:#9EDFEF;
  --white:#242B36;--gray-light:#1F2630;--gray-border:#3A4250;
}
html,body{height:100%;background:var(--surface-1);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px}

a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* Header */
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:0 16px;height:48px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.header .logo{font-weight:700;font-size:14px;letter-spacing:0.3px;display:flex;align-items:center;gap:8px}
.header .divider{width:1px;height:22px;background:rgba(255,255,255,.25)}
.header .title{font-size:13px;font-weight:500;flex:1;display:flex;align-items:center;gap:8px}
.header .right{display:flex;gap:8px;align-items:center}
.user-pill{font-size:11px;color:rgba(255,255,255,.85);padding:4px 10px;border:1px solid rgba(255,255,255,.25);border-radius:12px;cursor:pointer}
.user-pill:hover{background:rgba(255,255,255,.12)}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr 320px;height:calc(100vh - 48px)}
.sidebar{background:var(--surface-2);border-right:1px solid var(--border-weak);overflow:auto;padding:10px}
.canvas-pane{background:var(--surface-3);position:relative;overflow:hidden}
.inspector{background:var(--surface-2);border-left:1px solid var(--border-weak);overflow:auto;padding:10px}

/* Sidebar — project list */
.sidebar-section{margin-bottom:14px}
.sidebar-section h3{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.proj-list{list-style:none}
.proj-item{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:6px}
.proj-item:hover{background:var(--surface-1)}
.proj-item.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark)}
html[data-theme="dark"] .proj-item.active{color:var(--text)}
.proj-item .name{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-item .badge{font-size:10px;color:var(--text-muted);background:var(--surface-3);padding:1px 5px;border-radius:8px}
.proj-meta{font-size:10px;color:var(--text-muted);margin-top:2px}

/* Toolbar (above canvas) */
.toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;background:var(--surface-2);padding:6px;border-radius:8px;border:1px solid var(--border-weak);box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:5}
.view-tabs{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:0;background:var(--surface-2);border-radius:8px;border:1px solid var(--border-weak);box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:6;overflow:hidden}
.view-tab{padding:6px 14px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:500;border-right:1px solid var(--border-weak)}
.view-tab:last-child{border-right:none}
.view-tab.active{background:var(--primary);color:var(--primary-text)}
.view-tab:hover:not(.active){background:var(--surface-3)}
.map-toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface-2);padding:6px;border-radius:8px;border:1px solid var(--border-weak);box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:5}
.map-toolbar .btn.active{background:var(--primary);color:var(--primary-text)}
.map-mode-hint{font-size:11px;color:var(--text-muted);margin-left:6px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Palette dropdown */
.map-palette-wrap{position:relative}
.map-palette{position:absolute;top:calc(100% + 4px);left:0;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);min-width:160px;z-index:20;padding:4px 0}
.map-palette-item{display:block;width:100%;padding:6px 12px;font-size:11px;font-weight:500;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;white-space:nowrap}
.map-palette-item:hover{background:var(--surface-3)}
.map-palette-sep{border:none;border-top:1px solid var(--border-weak);margin:3px 0}
/* Cable edit handles */
.cable-handle{width:10px;height:10px;border-radius:50%;background:#FFD400;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4);cursor:grab;position:absolute;transform:translate(-50%,-50%)}
.cable-handle.mid{background:#FF6E00;opacity:0.7}
.cable-handle:active{cursor:grabbing}
/* Location type color chips */
.loc-type-chip{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
/* Fiber diagram compact rows */
.fiber-diagram-row{padding:3px 0;border-bottom:1px solid var(--border-weak);font-size:11px;display:flex;gap:6px;align-items:center}
.fiber-diagram-row:last-child{border-bottom:none}
.map-popup{font-size:12px;min-width:160px}
.map-popup b{color:var(--primary)}
.map-popup .row{margin:2px 0}
.map-popup .actions{margin-top:6px;display:flex;gap:4px}
#map-stage .maplibregl-canvas-container{outline:none}
#map-stage.placing,#map-stage.placing .maplibregl-canvas{cursor:crosshair !important}
.lock-banner{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center;background:var(--surface-2);padding:6px 10px;border-radius:8px;border:1px solid var(--border-weak);box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:5;font-size:12px}
.lock-banner.locked{border-color:var(--success);color:var(--success-text);background:var(--success-light)}
.lock-banner.held-by-other{border-color:var(--warning);color:var(--warning-text);background:var(--warning-light)}
.lock-banner.stale{border-color:var(--danger);color:var(--danger-text);background:var(--danger-light)}
.warnings-banner{position:absolute;bottom:10px;left:10px;right:10px;padding:8px 12px;border-radius:6px;font-size:12px;z-index:5;display:none;cursor:pointer;user-select:none}
.warnings-banner.show{display:flex;align-items:center;gap:10px;justify-content:space-between}
.warnings-banner.warn{background:var(--warning-light);color:var(--warning-text);border:1px solid var(--warning)}
.warnings-banner.error{background:var(--danger-light);color:var(--danger-text);border:1px solid var(--danger)}
.warnings-banner:hover{filter:brightness(1.04)}
.validation-pill{background:rgba(0,0,0,0.08);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase}
.validation-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.validation-item{padding:8px 10px;border-radius:5px;font-size:12px;border-left:3px solid var(--border-strong)}
.validation-item.error{border-left-color:var(--danger);background:var(--danger-light)}
.validation-item.warning{border-left-color:var(--warning);background:var(--warning-light)}
.validation-item .code{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px}
.validation-item .nav{font-size:11px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.validation-item .nav a{cursor:pointer}

/* Konva stage container */
#stage{width:100%;height:100%}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:500;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-icon{padding:6px 8px}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* Inspector */
.inspector h3{font-size:13px;margin-bottom:10px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.inspector h3 .small{font-size:10px;color:var(--text-muted);font-weight:400}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:6px 8px;font-size:12px;border:1px solid var(--border-strong);border-radius:4px;background:var(--white);color:var(--text)}
.field textarea{resize:vertical;min-height:60px;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty-pane{color:var(--text-muted);font-style:italic;text-align:center;padding:40px 10px;font-size:12px}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--border-weak);vertical-align:top}
.table th{font-size:10px;text-transform:uppercase;color:var(--text-muted);font-weight:600;letter-spacing:0.4px}
.table tr:hover td{background:var(--surface-1)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface-2);border-radius:10px;max-width:560px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal.wide{max-width:840px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--border-weak);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:15px;font-weight:600}
.modal .body{padding:16px 18px;overflow:auto;flex:1}
.modal footer{padding:12px 18px;border-top:1px solid var(--border-weak);display:flex;gap:8px;justify-content:flex-end}
.modal .close{cursor:pointer;color:var(--text-muted);background:none;border:none;font-size:18px}

/* Fiber color swatch (used in selectors) */
.fc{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--border-strong);margin-right:5px;vertical-align:-1px}
.fc-blue{background:var(--fc-blue)}.fc-orange{background:var(--fc-orange)}
.fc-green{background:var(--fc-green)}.fc-brown{background:var(--fc-brown)}
.fc-slate{background:var(--fc-slate)}.fc-white{background:var(--fc-white)}
.fc-red{background:var(--fc-red)}.fc-black{background:var(--fc-black)}
.fc-yellow{background:var(--fc-yellow)}.fc-violet{background:var(--fc-violet)}
.fc-rose{background:var(--fc-rose)}.fc-aqua{background:var(--fc-aqua)}

/* Splice modal layout — two side-by-side columns for fiber A and fiber B */
.splice-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.splice-cols > div{border:1px solid var(--border-weak);border-radius:6px;padding:10px;background:var(--surface-1)}
.fiber-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px;max-height:160px;overflow:auto}
.fiber-cell{font-size:10px;padding:4px;text-align:center;border:1px solid var(--border-weak);border-radius:3px;cursor:pointer;background:var(--white);user-select:none}
.fiber-cell:hover{background:var(--primary-light);border-color:var(--primary)}
.fiber-cell.selected{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
.fiber-cell.in-use{opacity:0.45;cursor:not-allowed}
.fiber-cell.in-use:hover{background:var(--white);border-color:var(--border-weak)}

.splices-list{margin-top:12px;border-top:1px solid var(--border-weak);padding-top:10px}
.splices-list h4{font-size:12px;margin-bottom:6px;color:var(--text-secondary)}
.splice-row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:11px;border-bottom:1px solid var(--border-weak)}
.splice-row .desc{flex:1;display:flex;gap:6px;align-items:center}
.ribbon-tag{display:inline-block;padding:1px 5px;background:var(--primary-light);color:var(--primary-dark);border-radius:3px;font-size:9px;font-weight:600;margin-left:4px;text-transform:uppercase;letter-spacing:0.4px}

/* Toast (fixed bottom-right) */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--white);padding:10px 14px;border-radius:6px;font-size:12px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:320px}
.toast.error{background:var(--danger);color:#fff}
.toast.success{background:var(--success);color:#fff}

/* Mobile — inspector slides over from right */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar,.inspector{position:absolute;top:48px;bottom:0;width:80%;z-index:10;display:none}
  .sidebar{left:0}
  .sidebar.open{display:block}
  .inspector{right:0}
  .inspector.open{display:block}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo"><i class="fa-solid fa-network-wired"></i> Splice Matrix</div>
  <div class="divider"></div>
  <div class="title" id="title-name">— No project selected —</div>
  <div class="right">
    <button class="btn btn-sm" id="btn-save-rev" title="Save a labeled revision" disabled onclick="saveRevision()"><i class="fa-solid fa-flag"></i> Save rev</button>
    <button class="btn btn-sm" id="btn-versions" title="Version history & compare" disabled onclick="openVersionsModal()"><i class="fa-solid fa-clock-rotate-left"></i> Versions</button>
    <button class="btn btn-sm" id="btn-export" disabled><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
    <button class="btn btn-sm" id="btn-export-kmz" disabled title="Download a KMZ for Google Earth / GIS" onclick="downloadKmz()"><i class="fa-solid fa-earth-americas"></i> KMZ</button>
    <button class="btn btn-sm btn-icon" id="btn-dark" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    <span class="user-pill" id="user-pill" onclick="signOut()" title="Click to sign out">
      <i class="fa-solid fa-user-circle"></i> <span id="user-name">…</span>
    </span>
  </div>
</header>

<div class="app">

  <!-- ─── Left sidebar: project list ─── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Projects <button class="btn btn-sm btn-primary" onclick="openCreateProject()"><i class="fa-solid fa-plus"></i></button></h3>
      <div style="margin-bottom:8px">
        <input type="search" id="search-input" placeholder="Search circuits, cables, closures…"
               style="width:100%;padding:5px 8px;font-size:12px;border-radius:4px;border:1px solid var(--border-weak);background:var(--surface-2);color:var(--text)"
               oninput="onSearchInput(this.value)">
        <div id="search-results" style="display:none;background:var(--surface);border:1px solid var(--border-weak);border-radius:4px;margin-top:4px;max-height:50vh;overflow:auto;font-size:11px"></div>
      </div>
      <ul class="proj-list" id="proj-list"><li class="empty-pane">Loading…</li></ul>
    </div>
    <div class="sidebar-section" id="proj-actions" style="display:none">
      <h3>Project actions</h3>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn btn-sm" onclick="openAddLocation()"><i class="fa-solid fa-map-pin"></i> Add Location</button>
        <button class="btn btn-sm" onclick="openAddCable()"><i class="fa-solid fa-bolt"></i> Add Cable</button>
        <button class="btn btn-sm" onclick="openAddClosure()"><i class="fa-solid fa-box"></i> Add Closure</button>
        <button class="btn btn-sm" onclick="openImportDesignModal()"><i class="fa-solid fa-file-import"></i> Import KMZ/DXF</button>
        <button class="btn btn-sm" onclick="openPasteImportModal()"><i class="fa-solid fa-paste"></i> Paste from spreadsheet</button>
        <button class="btn btn-sm btn-danger" onclick="deleteCurrentProject()"><i class="fa-solid fa-trash"></i> Delete project</button>
      </div>
    </div>
    <div class="sidebar-section" id="proj-imports" style="display:none">
      <h3>Pending imports <span id="proj-imports-count" class="small"></span></h3>
      <div id="proj-imports-body" style="font-size:11px"></div>
    </div>
    <div class="sidebar-section" id="proj-summary" style="display:none">
      <h3>Summary</h3>
      <div id="proj-summary-body" style="font-size:11px;color:var(--text-secondary);line-height:1.7"></div>
    </div>
  </aside>

  <!-- ─── Center: Konva canvas + Map (Phase 3A) tabs ─── -->
  <div class="canvas-pane">
    <div class="view-tabs" id="view-tabs" style="display:none">
      <button class="view-tab active" data-view="diagram" onclick="switchView('diagram')"><i class="fa-solid fa-diagram-project"></i> Diagram</button>
      <button class="view-tab" data-view="map" onclick="switchView('map')"><i class="fa-solid fa-earth-americas"></i> Map</button>
    </div>
    <div class="toolbar" id="toolbar" style="display:none">
      <button class="btn btn-sm" onclick="resetView()"><i class="fa-solid fa-expand"></i> Fit</button>
      <button class="btn btn-sm" onclick="zoom(1.2)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      <button class="btn btn-sm" onclick="zoom(0.83)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
    </div>
    <div class="map-toolbar" id="map-toolbar" style="display:none">
      <button class="btn btn-sm" onclick="mapFitData()" title="Zoom to fit all geographic data"><i class="fa-solid fa-expand"></i> Fit</button>
      <button class="btn btn-sm" id="btn-basemap" onclick="cycleBasemap()" title="Toggle basemap: satellite-only vs hybrid"><i class="fa-solid fa-layer-group"></i> <span id="btn-basemap-label">Hybrid</span></button>
      <div class="map-palette-wrap" id="palette-wrap">
        <button class="btn btn-sm" id="btn-add-item" onclick="mapTogglePalette()" title="Add a location item to the map"><i class="fa-solid fa-plus"></i> Add Item</button>
        <div class="map-palette" id="map-palette" style="display:none">
          <button class="map-palette-item" onclick="mapStartPlace('handhole')"><i class="fa-solid fa-circle-dot" style="width:14px"></i> Handhole</button>
          <button class="map-palette-item" onclick="mapStartPlace('manhole')"><i class="fa-solid fa-circle" style="width:14px"></i> Manhole</button>
          <button class="map-palette-item" onclick="mapStartPlace('pole')"><i class="fa-solid fa-turn-up" style="width:14px"></i> Pole</button>
          <button class="map-palette-item" onclick="mapStartPlace('pedestal')"><i class="fa-solid fa-box" style="width:14px"></i> Pedestal</button>
          <button class="map-palette-item" onclick="mapStartPlace('vault')"><i class="fa-solid fa-vault" style="width:14px"></i> Vault</button>
          <hr class="map-palette-sep">
          <button class="map-palette-item" onclick="mapStartPlace('fdh')"><i class="fa-solid fa-network-wired" style="width:14px"></i> FDH</button>
          <button class="map-palette-item" onclick="mapStartPlace('splice_point')"><i class="fa-solid fa-scissors" style="width:14px"></i> Splice point</button>
          <button class="map-palette-item" onclick="mapStartPlace('co')"><i class="fa-solid fa-building" style="width:14px"></i> Central Office</button>
          <button class="map-palette-item" onclick="mapStartPlace('terminal')"><i class="fa-solid fa-plug" style="width:14px"></i> Terminal</button>
          <button class="map-palette-item" onclick="mapStartPlace('ring_cut')"><i class="fa-solid fa-ring" style="width:14px"></i> Ring cut</button>
        </div>
      </div>
      <button class="btn btn-sm" id="btn-draw-cable" onclick="mapToggleMultistop()" title="Draw a cable route across multiple locations"><i class="fa-solid fa-route"></i> Draw cable</button>
      <span id="map-mode-hint" class="map-mode-hint"></span>
    </div>
    <div class="lock-banner" id="lock-banner" style="display:none"></div>
    <div id="stage"></div>
    <div id="map-stage" style="display:none;width:100%;height:100%"></div>
    <div class="warnings-banner" id="warnings-banner"></div>
  </div>

  <!-- ─── Right sidebar: inspector ─── -->
  <aside class="inspector" id="inspector">
    <div id="inspector-empty" class="empty-pane">
      Select a project to begin.<br><br>
      <small>Click a closure on the canvas to view its trays and add splices.</small>
    </div>
    <div id="inspector-body" style="display:none"></div>
  </aside>

</div>

<!-- ─── Toast container ─── -->
<div id="toast" class="toast" style="display:none"></div>

<!-- ─── Modal containers (populated by JS) ─── -->
<div id="modal-host"></div>

<script>
// ───────────────────────────────────────────────────────────────────────────
// Globals + state
// ───────────────────────────────────────────────────────────────────────────

const TIA_598 = ['blue','orange','green','brown','slate','white','red','black','yellow','violet','rose','aqua'];

const state = {
  user: null,
  projects: [],
  currentId: null,
  data: null,           // full hydrate of current project
  selection: null,      // { type: 'closure'|'tray'|'cable'|'location', id }
  lockState: 'unlocked', // 'mine' | 'other' | 'stale' | 'unlocked'
  lockHolder: null,
  heartbeatTimer: null,
  sse: null,
  konva: null,          // { stage, layers... }
  pendingSplice: null,  // { fiber_a_id, tray_id }
  // Phase 2C #11 — path tracing. Populated by traceFiberPath(); cleared by
  // clearTracePath(). drawCanvasContents() reads this to overlay highlights.
  tracePath: null,      // { fiber_id, chain, circular, over_spliced, warnings }
  // Phase 3A — map view state.
  activeView: 'diagram',     // 'diagram' | 'map'
  map: null,                 // MapLibre Map instance
  maplibregl: null,          // captured for Marker/LngLatBounds constructors
  _mapMarkers: [],
  _mapLabelMarkers: [],      // footage label markers for cable midpoints
  _cableHandleMarkers: [],   // drag handles for active cable edit session
  _editingCableId: null,     // cable whose path is being edited
  _editPathCoords: [],       // mutable working copy during edit session
  // mapMode: null | 'palette' | 'place-new' | 'multistop' | 'edit-path'
  mapMode: null,
  mapPlaceType: null,        // location type being placed (place-new mode)
  // Legacy compat — mapPlaceTargetId is now unused; mapPathTargetId reused
  // for the old path draw mode (cable selector); kept so any SSE handler
  // that still references it doesn't throw.
  mapPlaceTargetId: null,
  mapPathTargetId: null,
  mapPathPoints: [],
  // Multi-stop draw state
  _msStops: [],              // { lngLat, locationId|null, name } accumulated stops
  _msMarkers: [],            // MapLibre Markers for visual stop indicators
};

// Per-type marker colour palette. Defined here (before the inspector section)
// so renderLocationInspector can use _locColor() at render time.
const LOC_TYPE_COLORS = {
  handhole:    '#3B82F6',
  manhole:     '#7C3AED',
  pole:        '#78716C',
  pedestal:    '#16A34A',
  vault:       '#B45309',
  fdh:         '#DC2626',
  co:          '#0F172A',
  splice_point:'#1B5FA0',
  terminal:    '#0D9488',
  ring_cut:    '#EA580C',
};

function _locColor(loc) {
  return LOC_TYPE_COLORS[loc.type] || '#888';
}

// ───────────────────────────────────────────────────────────────────────────
// API helper — same shape as design.html, with 30s timeout for PDF call.
// ───────────────────────────────────────────────────────────────────────────

async function api(path, method='GET', body=null, timeoutMs=15000) {
  const opts = { method, headers: {'Content-Type':'application/json'}, credentials:'include' };
  try { const tok = sessionStorage.getItem('lfs_token'); if (tok) opts.headers['Authorization'] = 'Bearer '+tok; } catch(e){}
  if (body) opts.body = JSON.stringify(body);
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), timeoutMs);
  try {
    opts.signal = ctrl.signal;
    const r = await fetch(path, opts);
    clearTimeout(tid);
    if (r.status === 401) {
      try { sessionStorage.removeItem('lfs_token'); } catch(e){}
      window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
      throw new Error('Session expired');
    }
    if (!r.ok) {
      let msg = r.statusText;
      try { const j = await r.json(); msg = j.error || msg; } catch {}
      throw new Error(msg);
    }
    return r.json();
  } catch (e) {
    clearTimeout(tid);
    if (e.name === 'AbortError') throw new Error('Request timed out');
    throw e;
  }
}

function toast(msg, kind='') {
  const el = document.getElementById('toast');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.style.display='none'; }, 3000);
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ───────────────────────────────────────────────────────────────────────────
// Auth bootstrap
// ───────────────────────────────────────────────────────────────────────────

async function loadMe() {
  try {
    const me = await api('/api/auth/me');
    state.user = me;
    document.getElementById('user-name').textContent = me.full_name || me.username || me.email || 'user';
  } catch (e) {
    // 401 already redirects via api(); other errors leave the user-pill blank.
    document.getElementById('user-name').textContent = '?';
  }
}

function signOut() {
  fetch('/api/auth/logout', { method:'POST', credentials:'include' })
    .finally(() => {
      try { sessionStorage.removeItem('lfs_token'); } catch(e){}
      window.location.href = '/login';
    });
}

// ───────────────────────────────────────────────────────────────────────────
// Project list
// ───────────────────────────────────────────────────────────────────────────

async function loadProjects() {
  try {
    const list = await api('/api/splice/projects');
    state.projects = list;
    renderProjectList();
  } catch (e) {
    toast('Failed to load projects: ' + e.message, 'error');
  }
}

// Project list filter + sort settings persist across reloads in
// localStorage (matches dark-mode + basemap pattern).
function loadProjListPrefs() {
  try {
    return {
      status: localStorage.getItem('lfs_splice_proj_status') || 'all',
      sort:   localStorage.getItem('lfs_splice_proj_sort')   || 'recent',
      filter: '',  // text filter doesn't persist — feels surprising on reload
    };
  } catch { return { status: 'all', sort: 'recent', filter: '' }; }
}
function saveProjListPrefs(prefs) {
  try {
    if (prefs.status) localStorage.setItem('lfs_splice_proj_status', prefs.status);
    if (prefs.sort)   localStorage.setItem('lfs_splice_proj_sort',   prefs.sort);
  } catch {}
}
state._projListPrefs = state._projListPrefs || loadProjListPrefs();

function setProjListPref(key, value) {
  state._projListPrefs[key] = value;
  if (key !== 'filter') saveProjListPrefs(state._projListPrefs);
  renderProjectList();
}

function renderProjectList() {
  const ul = document.getElementById('proj-list');
  const prefs = state._projListPrefs || loadProjListPrefs();
  state._projListPrefs = prefs;

  // Filter chrome above the list. Mounted once into a sibling slot;
  // re-rendered with current pref values so the controls reflect the
  // active filters even after a hydrate.
  let chrome = document.getElementById('proj-list-controls');
  if (!chrome) {
    chrome = document.createElement('div');
    chrome.id = 'proj-list-controls';
    chrome.style.cssText = 'display:flex;gap:4px;margin-bottom:6px;font-size:11px';
    ul.parentNode.insertBefore(chrome, ul);
  }
  chrome.innerHTML = `
    <select id="proj-list-status" onchange="setProjListPref('status', this.value)" style="flex:1;padding:3px 4px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-weak);border-radius:3px">
      <option value="all"${prefs.status==='all'?' selected':''}>All</option>
      <option value="active"${prefs.status==='active'?' selected':''}>Active</option>
      <option value="completed"${prefs.status==='completed'?' selected':''}>Completed</option>
      <option value="archived"${prefs.status==='archived'?' selected':''}>Archived</option>
    </select>
    <select id="proj-list-sort" onchange="setProjListPref('sort', this.value)" style="flex:1;padding:3px 4px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-weak);border-radius:3px">
      <option value="recent"${prefs.sort==='recent'?' selected':''}>Recent</option>
      <option value="name"${prefs.sort==='name'?' selected':''}>Name</option>
      <option value="size"${prefs.sort==='size'?' selected':''}>Size</option>
    </select>
  `;

  // Apply filter then sort to the in-memory list (cheap; cardinality is
  // low even for an extremely active install). Server-side ordering
  // already returns recent-first; we re-sort here so other modes work.
  let view = state.projects.slice();
  if (prefs.status !== 'all') view = view.filter(p => p.status === prefs.status);
  if (prefs.filter) {
    const q = prefs.filter.toLowerCase();
    view = view.filter(p => (p.name || '').toLowerCase().includes(q));
  }
  if (prefs.sort === 'name') {
    view.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  } else if (prefs.sort === 'size') {
    const score = p => (p.cable_count || 0) + (p.location_count || 0) + (p.splice_count || 0);
    view.sort((a, b) => score(b) - score(a));
  }
  // 'recent' keeps the server's updated_at DESC ordering.

  if (!view.length) {
    if (!state.projects.length) {
      ul.innerHTML = '<li class="empty-pane">No projects yet. Click + to create one.</li>';
    } else {
      ul.innerHTML = '<li class="empty-pane">No projects match the current filter.</li>';
    }
    return;
  }
  ul.innerHTML = view.map(p => `
    <li class="proj-item ${p.id === state.currentId ? 'active' : ''}" onclick="selectProject('${p.id}')">
      <div style="flex:1;min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="proj-meta">${p.cable_count||0}c · ${p.location_count||0}loc · ${p.splice_count||0}sp${p.status && p.status !== 'active' ? ' · ' + esc(p.status) : ''}</div>
      </div>
      <button class="btn btn-sm btn-icon" title="Clone project" onclick="event.stopPropagation();cloneProject('${p.id}','${esc(p.name).replace(/'/g, "\\'")}')"><i class="fa-solid fa-copy"></i></button>
      ${p.locked_by_staff_id ? '<span class="badge" title="Locked"><i class="fa-solid fa-lock"></i></span>' : ''}
    </li>
  `).join('');
}

// Phase 2B #5 — clone a project end-to-end on the server. Picks up
// every descendant row (locations, cables, fibers, closures, trays,
// splices, ribbon groups, strand states + circuit metadata). Designer
// attribution moves to the cloning user; lock state is NOT carried
// over so the clone opens unlocked.
async function cloneProject(projectId, sourceName) {
  const newName = prompt('Name for the cloned project:', `${sourceName} (copy)`);
  if (!newName || !newName.trim()) return;
  try {
    const r = await api(`/api/splice/projects/${projectId}/clone`, 'POST', { name: newName.trim() });
    toast(`Cloned ${r.counts.cables} cables, ${r.counts.fibers} fibers, ${r.counts.splices} splices.`, 'success');
    await loadProjects();
    if (r.project?.id) selectProject(r.project.id);
  } catch (e) { toast('Clone failed: ' + e.message, 'error'); }
}

function openCreateProject() {
  showModal({
    title: 'New splice project',
    body: `
      <div class="field"><label>Name</label>
        <input id="m-name" placeholder="e.g. Crossroad School splice plan" autofocus></div>
      <div class="field"><label>Notes (optional)</label>
        <textarea id="m-notes" placeholder="Anything the splicer should know up front"></textarea></div>
    `,
    onSubmit: async (close) => {
      const name = document.getElementById('m-name').value.trim();
      if (!name) { toast('Name required', 'error'); return; }
      try {
        const proj = await api('/api/splice/projects', 'POST', {
          name, notes: document.getElementById('m-notes').value.trim() || null,
        });
        state.projects.unshift({ ...proj, cable_count:0, location_count:0, splice_count:0 });
        renderProjectList();
        close();
        await selectProject(proj.id);
      } catch (e) { toast(e.message, 'error'); }
    },
  });
}

async function selectProject(id) {
  if (state.currentId === id && state.data) return;
  // Tear down previous SSE + heartbeat first.
  cleanupCurrent();
  state.currentId = id;
  document.getElementById('proj-actions').style.display = 'block';
  document.getElementById('proj-imports').style.display = 'block';
  refreshImportsList();
  document.getElementById('proj-summary').style.display = 'block';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('view-tabs').style.display = 'flex';
  document.getElementById('btn-export').disabled = false;
  document.getElementById('btn-export-kmz').disabled = false;
  document.getElementById('btn-versions').disabled = false;
  document.getElementById('btn-save-rev').disabled = false;
  renderProjectList();
  await hydrateProject();
  attemptLock();
  openSSE(id);
}

function cleanupCurrent() {
  if (state.heartbeatTimer) { clearInterval(state.heartbeatTimer); state.heartbeatTimer = null; }
  if (state.sse) { try { state.sse.close(); } catch {} state.sse = null; }
  state.data = null;
  state.selection = null;
  state.pendingSplice = null;
  state.lockState = 'unlocked';
}

async function hydrateProject() {
  try {
    const data = await api('/api/splice/projects/' + state.currentId);
    state.data = data;
    document.getElementById('title-name').textContent = data.project.name;
    renderSummary();
    renderInspector();
    renderCanvas();
    renderWarnings();
    // Phase 3A — refresh the map layer on every hydrate. No-op when
    // map isn't initialized yet (user never opened the Map tab).
    if (state.map) refreshMapLayers();
    // Phase 2B #6 — fire-and-forget auto-snapshot. Server-side debounce
    // skips when last version is <10min old or generation hash matches,
    // so this is safe to call after every hydrate without flooding the
    // versions table.
    fireAutoSnapshot();
  } catch (e) {
    toast('Hydrate failed: ' + e.message, 'error');
  }
}

function fireAutoSnapshot() {
  if (!state.currentId || isReadOnly()) return;
  // Client-side throttle (60s) on top of the server's 10-min debounce —
  // avoids the network round-trip on rapid sequential edits.
  const now = Date.now();
  if (state._lastAutoSnap && (now - state._lastAutoSnap) < 60_000) return;
  state._lastAutoSnap = now;
  api('/api/splice/projects/' + state.currentId + '/versions/auto', 'POST').catch(() => {});
}

function renderSummary() {
  const d = state.data;
  if (!d) return;
  const el = document.getElementById('proj-summary-body');
  el.innerHTML = `
    <div><b>${d.cables.length}</b> cable${d.cables.length===1?'':'s'} · <b>${d.fibers.length}</b> fiber${d.fibers.length===1?'':'s'}</div>
    <div><b>${d.locations.length}</b> location${d.locations.length===1?'':'s'} · <b>${d.closures.length}</b> closure${d.closures.length===1?'':'s'}</div>
    <div><b>${d.splices.length}</b> splice${d.splices.length===1?'':'s'} · <b>${d.ribbon_groups.length}</b> ribbon group${d.ribbon_groups.length===1?'':'s'}</div>
    <div style="margin-top:6px;color:var(--text-muted)">Updated ${new Date(d.project.updated_at).toLocaleString()}</div>
  `;
}

function renderWarnings() {
  const v = state.data?.validation;
  const banner = document.getElementById('warnings-banner');
  if (!v) { banner.classList.remove('show'); return; }
  const errCount = v.summary?.error_count || 0;
  const warnCount = v.summary?.warning_count || 0;
  // Update Export PDF button state — fatal errors block export, warnings
  // don't. The button stays clickable with warnings (designer's choice).
  const exportBtn = document.getElementById('btn-export');
  if (errCount > 0) {
    exportBtn.disabled = true;
    exportBtn.title = `Fix ${errCount} fatal error(s) before exporting (or pass &force=1)`;
  } else {
    exportBtn.disabled = false;
    exportBtn.title = warnCount > 0 ? `Exporting with ${warnCount} warning(s)` : 'Export PDF';
  }
  if (errCount === 0 && warnCount === 0) {
    banner.classList.remove('show', 'error', 'warn');
    return;
  }
  const isError = errCount > 0;
  banner.className = 'warnings-banner show ' + (isError ? 'error' : 'warn');
  banner.innerHTML = `
    <span><i class="fa-solid fa-${isError?'circle-exclamation':'triangle-exclamation'}"></i>
      <b>${errCount} error${errCount===1?'':'s'}</b> · ${warnCount} warning${warnCount===1?'':'s'}
      ${isError ? '<span class="validation-pill">PDF export blocked</span>' : ''}
    </span>
    <span style="font-size:11px;opacity:0.8">click for details →</span>
  `;
  banner.onclick = openValidationDrawer;
}

function openValidationDrawer() {
  const v = state.data?.validation;
  if (!v) return;
  const items = [...v.errors.map(e => ({ ...e, severity: 'error' })),
                 ...v.warnings.map(w => ({ ...w, severity: 'warning' }))];
  if (!items.length) return;
  const itemsHtml = items.map(i => {
    const navLinks = [];
    if (i.closure_id)        navLinks.push(`<a onclick="closeModal();selectThing('closure','${i.closure_id}')">→ Closure</a>`);
    if (i.tray_id)           navLinks.push(`<a onclick="closeModal();selectThing('tray','${i.tray_id}')">→ Tray</a>`);
    if (i.cable_id)          navLinks.push(`<a onclick="closeModal();selectThing('cable','${i.cable_id}')">→ Cable</a>`);
    if (i.location_id)       navLinks.push(`<a onclick="closeModal();selectThing('location','${i.location_id}')">→ Location</a>`);
    return `
      <div class="validation-item ${i.severity}">
        <div class="code">${esc(i.severity)} · ${esc(i.code)}</div>
        <div>${esc(i.message)}</div>
        ${navLinks.length ? `<div class="nav">${navLinks.join('')}</div>` : ''}
      </div>`;
  }).join('');
  const blocked = v.summary?.blocked;
  showModal({
    title: `Plan validation — ${v.summary.error_count} error(s), ${v.summary.warning_count} warning(s)`,
    wide: true,
    body: `
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">
        Errors block PDF export by default. Warnings don't — they're flagged for your review.
        ${blocked ? `<br><br><b>You can force-export anyway</b> if you know what you're doing — the PDF will still generate, but the splicer will receive a knowingly broken plan.` : ''}
      </p>
      <div class="validation-list">${itemsHtml}</div>
    `,
    submitText: blocked ? 'Force export PDF' : 'Close',
    onSubmit: (close) => {
      if (blocked) {
        window.open('/api/splice/projects/' + state.currentId + '/export-pdf?force=1', '_blank');
      }
      close();
    },
  });
}

// ───────────────────────────────────────────────────────────────────────────
// Locking
// ───────────────────────────────────────────────────────────────────────────

async function attemptLock() {
  try {
    const r = await api('/api/splice/projects/' + state.currentId + '/lock', 'POST');
    state.lockState = 'mine';
    state.lockHolder = { name: r.locked_by_name, at: r.locked_at };
    renderLockBanner();
    // 60s heartbeat (per spec).
    state.heartbeatTimer = setInterval(() => {
      api('/api/splice/projects/' + state.currentId + '/heartbeat', 'POST').catch(err => {
        // Lost the lock — flip to view-only and let the user choose to take it back.
        if (String(err.message).includes('Lock no longer held')) {
          state.lockState = 'other';
          renderLockBanner();
          clearInterval(state.heartbeatTimer);
          state.heartbeatTimer = null;
        }
      });
    }, 60000);
  } catch (e) {
    if (e.message && e.message.toLowerCase().includes('locked')) {
      state.lockState = 'other';
      renderLockBanner();
    } else {
      toast('Lock failed: ' + e.message, 'error');
    }
  }
}

async function takeOver() {
  try {
    const r = await api('/api/splice/projects/' + state.currentId + '/take-over', 'POST');
    state.lockState = 'mine';
    state.lockHolder = { name: r.locked_by_name, at: r.locked_at };
    renderLockBanner();
    if (!state.heartbeatTimer) {
      state.heartbeatTimer = setInterval(() => {
        api('/api/splice/projects/' + state.currentId + '/heartbeat', 'POST').catch(()=>{});
      }, 60000);
    }
    toast('Lock taken over', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

async function releaseLock() {
  try {
    await api('/api/splice/projects/' + state.currentId + '/unlock', 'POST');
    state.lockState = 'unlocked';
    if (state.heartbeatTimer) { clearInterval(state.heartbeatTimer); state.heartbeatTimer = null; }
    renderLockBanner();
  } catch (e) { toast(e.message, 'error'); }
}

function renderLockBanner() {
  const el = document.getElementById('lock-banner');
  if (state.lockState === 'unlocked') { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.className = 'lock-banner ' + (state.lockState === 'mine' ? 'locked' : 'held-by-other');
  if (state.lockState === 'mine') {
    el.innerHTML = `<i class="fa-solid fa-lock"></i> Editing · <button class="btn btn-sm" onclick="releaseLock()">Release</button>`;
  } else {
    const proj = state.data?.project;
    const heldBy = proj?.locked_by_full_name || proj?.locked_by_name || 'another designer';
    const lockedAt = proj?.locked_at ? new Date(proj.locked_at).getTime() : 0;
    const isStale = Date.now() - lockedAt > 10 * 60 * 1000;
    el.innerHTML = `<i class="fa-solid fa-eye"></i> View only — locked by <b>${esc(heldBy)}</b>
      ${isStale ? `<button class="btn btn-sm" onclick="takeOver()">Take over (stale)</button>` : `<button class="btn btn-sm" onclick="takeOver()">Force take over</button>`}`;
  }
}

function isReadOnly() { return state.lockState !== 'mine'; }

// ───────────────────────────────────────────────────────────────────────────
// Server-Sent Events — broadcasts of committed actions from other viewers
// ───────────────────────────────────────────────────────────────────────────

function openSSE(projectId) {
  if (!('EventSource' in window)) return;
  // EventSource doesn't send Authorization headers — relies on the JWT
  // cookie set by the auth middleware. That's already in place because
  // our login flow sets the cookie alongside sessionStorage.lfs_token.
  state.sse = new EventSource('/api/splice/projects/' + projectId + '/events');
  // Re-hydrate on any committed event. Cheap because cardinality is low
  // and the alternative (delta-merge per event type) is a footgun for
  // the v1 build.
  const handler = () => { hydrateProject(); };
  ['cable_added','cable_updated','cable_deleted',
   'closure_added','closure_updated','closure_deleted',
   'location_added','location_updated','location_deleted',
   'splice_added','splice_deleted',
   'ribbon_splice_added','ribbon_group_deleted',
   'location_coords_changed','cable_path_changed',
   'design_import_applied','design_import_rejected',
   'project_updated','lock_acquired','lock_released','lock_taken_over',
   'splitter_added','splitter_updated','splitter_deleted','splitter_output_wired',
   'cable_state_updated','cable_state_deleted',
   'closures_bulk_deleted']
   .forEach(evt => state.sse.addEventListener(evt, handler));
  // Refresh the imports sidebar when the master designer or another
  // engineer takes action on a pending import.
  ['design_import_applied','design_import_rejected'].forEach(evt => {
    state.sse.addEventListener(evt, () => refreshImportsList());
  });
  // Phase 2B #7 — splicer uploaded a field photo from a public QR
  // link. We don't need a full re-hydrate (no graph change); just
  // refresh the markup list if the matching closure is selected.
  ['field_markup_added', 'field_markup_removed'].forEach(evt => {
    state.sse.addEventListener(evt, (e) => {
      try {
        const data = JSON.parse(e.data || '{}');
        if (state.selection?.type === 'closure' && state.selection.id === data.closure_id) {
          loadClosureMarkups(data.closure_id);
        }
      } catch {}
    });
  });
  state.sse.onerror = () => {
    // EventSource auto-reconnects; nothing to do unless it's a permanent
    // 401 — which the api() helper would have already redirected.
  };
}

// ───────────────────────────────────────────────────────────────────────────
// Konva canvas rendering
// ───────────────────────────────────────────────────────────────────────────

const COLORS = {
  blue:'#1660C9', orange:'#E67E22', green:'#27AE60', brown:'#8B5A2B',
  slate:'#7F8C8D', white:'#F5F5F5', red:'#C0392B', black:'#000',
  yellow:'#F1C40F', violet:'#8E44AD', rose:'#E91E63', aqua:'#1ABC9C',
};

function renderCanvas() {
  const container = document.getElementById('stage');
  container.innerHTML = '';
  const stage = new Konva.Stage({
    container: 'stage',
    width: container.clientWidth || 800,
    height: container.clientHeight || 600,
    draggable: true,
  });
  const bgLayer = new Konva.Layer({ listening: false });
  const cableLayer = new Konva.Layer();
  const closureLayer = new Konva.Layer();
  const spliceLayer = new Konva.Layer({ listening: false });
  // traceLayer renders path-trace highlights on top of everything else.
  // listening:false so it never intercepts clicks.
  const traceLayer = new Konva.Layer({ listening: false });
  stage.add(bgLayer); stage.add(cableLayer); stage.add(closureLayer); stage.add(spliceLayer); stage.add(traceLayer);
  state.konva = { stage, bgLayer, cableLayer, closureLayer, spliceLayer, traceLayer };

  // Click on empty canvas clears any active path trace (same UX as Esc).
  stage.on('click tap', (e) => {
    if (e.target === stage && state.tracePath) {
      clearTracePath();
    }
  });

  // Wheel zoom centered on cursor — Konva idiom.
  stage.on('wheel', (e) => {
    e.evt.preventDefault();
    const oldScale = stage.scaleX();
    const pointer = stage.getPointerPosition();
    if (!pointer) return;
    const mousePointTo = {
      x: (pointer.x - stage.x()) / oldScale,
      y: (pointer.y - stage.y()) / oldScale,
    };
    const direction = e.evt.deltaY > 0 ? -1 : 1;
    const newScale = direction > 0 ? oldScale * 1.1 : oldScale / 1.1;
    stage.scale({ x: newScale, y: newScale });
    stage.position({
      x: pointer.x - mousePointTo.x * newScale,
      y: pointer.y - mousePointTo.y * newScale,
    });
  });

  drawCanvasContents();

  // Resize — refit on window resize.
  if (!renderCanvas._listenerInstalled) {
    window.addEventListener('resize', () => {
      if (!state.konva) return;
      state.konva.stage.size({
        width: container.clientWidth,
        height: container.clientHeight,
      });
      state.konva.stage.batchDraw();
    });
    renderCanvas._listenerInstalled = true;
  }
}

function drawCanvasContents() {
  if (!state.konva || !state.data) return;
  const { cableLayer, closureLayer, spliceLayer, traceLayer } = state.konva;
  cableLayer.destroyChildren();
  closureLayer.destroyChildren();
  spliceLayer.destroyChildren();
  traceLayer.destroyChildren();

  const d = state.data;

  // Layout heuristic for Phase 1:
  //   Locations are arranged in a horizontal row (sequence_index order).
  //   Each location gets a column. Cables connecting two locations are
  //   drawn as horizontal pipes between the relevant columns. Closures
  //   appear as boxes anchored to their location column.
  //   It's not topologically precise (a cable spanning 3 locations has no
  //   midpoint), but Phase 1 only uses 'splice_point' so this works.

  const orderedLocations = [...d.locations].sort((a, b) =>
    (a.sequence_index || 0) - (b.sequence_index || 0) || a.name.localeCompare(b.name)
  );
  const colX = new Map();
  const COL_GAP = 280;
  const X_START = 60;
  orderedLocations.forEach((loc, i) => colX.set(loc.id, X_START + i * COL_GAP));

  // Locations as labeled vertical guidelines. The label is clickable
  // (opens the location inspector); the dashed line is decorative
  // (listening:false so it doesn't intercept canvas drag).
  orderedLocations.forEach(loc => {
    const x = colX.get(loc.id);
    closureLayer.add(new Konva.Line({
      points: [x, 40, x, 600], stroke:'#9AA5B5', dash:[4,4], strokeWidth:1,
      listening: false,
    }));
    const labelGroup = new Konva.Group({ x: x - 60, y: 6 });
    labelGroup.add(new Konva.Rect({
      x: 0, y: 0, width: 120, height: 28, fill: 'transparent',
    }));
    labelGroup.add(new Konva.Text({
      x: 0, y: 8, width: 120, align:'center',
      text: loc.name, fontSize: 13, fontStyle:'bold', fill:'#1B5FA0',
    }));
    labelGroup.on('click tap', () => selectThing('location', loc.id));
    labelGroup.on('mouseenter', () => { document.body.style.cursor='pointer'; });
    labelGroup.on('mouseleave', () => { document.body.style.cursor='default'; });
    closureLayer.add(labelGroup);
  });

  // Cables between locations. Each cable is wrapped in a Group with a
  // transparent hit-area rect so the whole strip is clickable. Cable Y
  // positions are stashed in cableYById so the splice-line renderer can
  // anchor curves at the right vertical position.
  const cableYById = new Map();
  d.cables.forEach((cable, i) => {
    const from = colX.get(cable.from_location_id);
    const to   = colX.get(cable.to_location_id);
    const y = 80 + i * 60;
    if (from && to) {
      const tubes = d.buffer_tubes.filter(t => t.cable_id === cable.id).sort((a,b)=>a.position-b.position);
      const tubeGap = 2;
      const stripHeight = Math.max(8, tubes.length * tubeGap + 2);
      const cableCenterY = y + (tubes.length * tubeGap) / 2;
      cableYById.set(cable.id, cableCenterY);

      const group = new Konva.Group();
      // Hit-area rect: covers the strands so a click anywhere on the
      // cable strip selects the cable. Transparent fill, no stroke.
      group.add(new Konva.Rect({
        x: from + 6, y: y - 4, width: to - from - 12, height: stripHeight + 8,
        fill: 'rgba(0,0,0,0.001)',  // near-transparent but listenable
      }));
      tubes.forEach((tube, ti) => {
        group.add(new Konva.Line({
          points: [from + 6, y + ti * tubeGap, to - 6, y + ti * tubeGap],
          stroke: COLORS[tube.color] || '#666',
          strokeWidth: 2, listening: false,
        }));
      });
      group.add(new Konva.Text({
        x: (from + to) / 2 - 80, y: y - 14, width: 160, align:'center',
        text: cable.name + ' (' + cable.fiber_count + 'f, ' + cable.construction_type + ')',
        fontSize: 11, fill:'#444', listening: false,
      }));
      group.on('click tap', () => selectThing('cable', cable.id));
      group.on('mouseenter', () => { document.body.style.cursor='pointer'; });
      group.on('mouseleave', () => { document.body.style.cursor='default'; });
      cableLayer.add(group);
    } else {
      // Floating cable (no endpoints). Drop a click-target row at the bottom.
      const ty = 600 + i * 22;
      const floatGroup = new Konva.Group();
      floatGroup.add(new Konva.Rect({
        x: 18, y: ty - 2, width: 360, height: 18, fill: 'rgba(0,0,0,0.001)',
      }));
      floatGroup.add(new Konva.Text({
        x: 20, y: ty, text: '⚠ Unrouted cable: ' + cable.name,
        fontSize: 11, fill:'#856404', listening: false,
      }));
      floatGroup.on('click tap', () => selectThing('cable', cable.id));
      floatGroup.on('mouseenter', () => { document.body.style.cursor='pointer'; });
      floatGroup.on('mouseleave', () => { document.body.style.cursor='default'; });
      cableLayer.add(floatGroup);
    }
  });

  // Closures at each location, stacked vertically below the location label.
  const closuresByLoc = new Map();
  d.closures.forEach(cl => {
    if (!closuresByLoc.has(cl.location_id)) closuresByLoc.set(cl.location_id, []);
    closuresByLoc.get(cl.location_id).push(cl);
  });

  // _drawRichClosure — renders a closure that has 3 or more cables terminating
  // at its location. The standard two-cable layout (vertical box centered on the
  // location column) becomes confusing at high cable counts because stub lines
  // would overlap and the column is too narrow to show per-cable disposition.
  // Instead we draw a wider rounded rectangle, route cable stubs in from both
  // sides (left = cables whose from_location_id matches, right = to_location_id
  // matches), and attach a per-cable pill badge showing splice/store/express
  // counts so the splicer can see at a glance how each cable is handled here.
  function _drawRichClosure(cl, locX, baseY, cablesAtLoc, trayList, totalSpliceCount) {
    const RW = 200;  // rich-closure rectangle width
    // Height grows with tray count so the sparklines have breathing room,
    // but we clamp so the canvas doesn't balloon for huge closures.
    const RH = Math.min(200, Math.max(130, trayList.length * 14 + 80));
    const rx = locX - RW / 2;  // top-left X, centred on location column

    const splicesIn = (tray) => d.splices.filter(s => s.tray_id === tray.id).length;
    const overCap   = trayList.some(t => splicesIn(t) > cl.tray_capacity);

    // Build a fiber-ID set for each cable so disposition counts are O(n)
    // rather than O(n*m).  strand_states is cable-scoped, so we group by
    // cable_id and location in one pass.
    const strandStatesByLocCable = new Map(); // key: `${cable_id}:${loc_id}`
    (d.strand_states || []).forEach(ss => {
      if (ss.state !== 'stored') return;
      const key = ss.cable_id + ':' + ss.location_id;
      if (!strandStatesByLocCable.has(key)) strandStatesByLocCable.set(key, 0);
      strandStatesByLocCable.set(key, strandStatesByLocCable.get(key) + 1);
    });

    // For each cable, count how many of its fibers are spliced at this closure
    // (any splice in any tray of this closure that touches a fiber from this cable).
    const trayIds = new Set(trayList.map(t => t.id));
    const splicesHere = d.splices.filter(s => trayIds.has(s.tray_id));
    const fiberById2  = new Map(d.fibers.map(f => [f.id, f]));
    const tubeById2   = new Map(d.buffer_tubes.map(t => [t.id, t]));
    function cableOfFiber(fid) {
      const f = fiberById2.get(fid);
      if (!f) return null;
      const tb = tubeById2.get(f.buffer_tube_id);
      return tb ? tb.cable_id : null;
    }
    // splice count per cable at this closure
    const splicedPerCable = new Map();
    splicesHere.forEach(s => {
      [s.fiber_a_id, s.fiber_b_id].forEach(fid => {
        const cid = cableOfFiber(fid);
        if (cid) splicedPerCable.set(cid, (splicedPerCable.get(cid) || 0) + 1);
      });
    });

    // Separate cables into left-side (originate here) and right-side (terminate
    // here).  If a cable has both endpoints at the same location (a loop), put
    // it on the left so it shows up somewhere.
    const leftCables  = cablesAtLoc.filter(c => c.from_location_id === cl.location_id);
    const rightCables = cablesAtLoc.filter(c => c.to_location_id === cl.location_id && c.from_location_id !== cl.location_id);

    const group = new Konva.Group({ x: rx, y: baseY });

    // Background rectangle — wider than the standard box to accommodate stubs.
    group.add(new Konva.Rect({
      width: RW, height: RH,
      fill: overCap ? '#FFF3CD' : '#FFFFFF',
      stroke: overCap ? '#DC3545' : '#1B5FA0',
      strokeWidth: 2, cornerRadius: 6,
    }));

    // Closure model name.
    group.add(new Konva.Text({
      x: 6, y: 5, width: RW - 12,
      text: cl.model || 'Closure',
      fontSize: 11, fontStyle: 'bold', fill: '#1B5FA0',
    }));

    // Interior summary: "N trays · M splices" — gives the splicer a quick
    // sanity check without having to open the inspector.
    group.add(new Konva.Text({
      x: 6, y: 18, width: RW - 12, align: 'center',
      text: trayList.length + ' trays · ' + totalSpliceCount + ' splices',
      fontSize: 10, fill: '#6C757D',
    }));

    // Tray sparkline — same fill-ratio bars as the standard closure, scaled to
    // fit the wider rectangle.
    const sparkY = 34;
    const sparkH = 10;
    trayList.forEach((tray, ti) => {
      const fill = splicesIn(tray) / Math.max(cl.tray_capacity, 1);
      const tw   = (RW - 12) / Math.max(trayList.length, 1);
      const tx   = 6 + ti * tw;
      group.add(new Konva.Rect({
        x: tx, y: sparkY, width: tw - 1, height: sparkH,
        fill: '#F0F0F0', stroke: '#DEE2E6', strokeWidth: 0.5,
      }));
      group.add(new Konva.Rect({
        x: tx, y: sparkY, width: (tw - 1) * Math.min(fill, 1), height: sparkH,
        fill: fill > 1 ? '#DC3545' : (fill > 0.85 ? '#FFC107' : '#28A745'),
      }));
    });

    // Per-cable stub + disposition badge helper.
    // stubX is the closure-rectangle edge (0 for left side, RW for right side).
    // stubDirX is -1 for left (line goes left out of the closure) or +1 for right.
    // cableY is the canvas Y of that cable's center stripe.
    function _drawStub(cable, stubX, stubDirX, stubRowY) {
      const STUB_LEN  = 40;   // length of the horizontal connector outside the box
      const BADGE_W   = 80;   // pill badge width
      const BADGE_H   = 14;
      const STUB_COLOR = '#888';

      // Horizontal line from the closure edge to the cable's canvas Y-position.
      // We draw in group-local coords, so subtract baseY and rx for Y.
      const localCableY = (cableYById.get(cable.id) ?? (baseY + RH / 2)) - baseY;

      // Vertical tap from closure edge to the cable row.
      const edgeY = Math.max(5, Math.min(RH - 5, stubRowY));

      // Connector path: right-angle elbow. Start at closure edge (stubX, edgeY),
      // go horizontally out STUB_LEN, then a vertical segment to align with the
      // cable stripe, then continue horizontally to meet it. In practice the
      // cable stripe is far away on the canvas so we only draw the elbow stub;
      // the cable's own drawn line already extends across the canvas.
      const elbowX = stubX + stubDirX * STUB_LEN;
      group.add(new Konva.Line({
        points: [stubX, edgeY, elbowX, edgeY],
        stroke: STUB_COLOR, strokeWidth: 1.5, listening: false,
        dash: [4, 3],
      }));
      // Arrow nub at the elbow tip to indicate direction.
      const arrowDir = stubDirX;  // +1 right, -1 left
      group.add(new Konva.Line({
        points: [
          elbowX, edgeY,
          elbowX - arrowDir * 6, edgeY - 4,
          elbowX - arrowDir * 6, edgeY + 4,
          elbowX, edgeY,
        ],
        closed: true, fill: STUB_COLOR, stroke: STUB_COLOR, strokeWidth: 0.5,
        listening: false,
      }));

      // Cable name label alongside the stub, placed just outside the closure edge.
      const labelX = stubDirX === -1 ? (elbowX - BADGE_W - 2) : (elbowX + 2);
      group.add(new Konva.Text({
        x: labelX, y: edgeY - 10, width: BADGE_W,
        text: cable.name + ' · ' + cable.fiber_count + 'f',
        fontSize: 9, fill: '#444', listening: false,
        ellipsis: true,
      }));

      // Disposition counts for this cable at this closure.
      const spliced  = Math.floor((splicedPerCable.get(cable.id) || 0) / 2); // each splice counted twice (fiber_a + fiber_b)
      const stored   = strandStatesByLocCable.get(cable.id + ':' + cl.location_id) || 0;
      const express  = Math.max(0, cable.fiber_count - spliced - stored);

      // Pill badges: blue=spliced, gray=stored, green=express. Only draw a
      // badge when count > 0 to avoid clutter on cables that are entirely
      // expressed through or entirely spliced.
      const badges = [];
      if (spliced > 0) badges.push({ label: spliced + ' spl', color: '#1660C9', textColor: '#fff' });
      if (stored  > 0) badges.push({ label: stored  + ' sto', color: '#7F8C8D', textColor: '#fff' });
      if (express > 0) badges.push({ label: express + ' exp', color: '#27AE60', textColor: '#fff' });

      const PILL_W = 36;
      const PILL_H = 12;
      const PILL_GAP = 2;
      const pillsWidth = badges.length * (PILL_W + PILL_GAP) - PILL_GAP;
      // Centre the pill row below the label.
      const pillStartX = stubDirX === -1
        ? (elbowX - pillsWidth - 2)
        : (elbowX + 2);
      badges.forEach((b, bi) => {
        const px = pillStartX + bi * (PILL_W + PILL_GAP);
        const py = edgeY + 2;
        group.add(new Konva.Rect({
          x: px, y: py, width: PILL_W, height: PILL_H,
          fill: b.color, cornerRadius: PILL_H / 2, listening: false,
        }));
        group.add(new Konva.Text({
          x: px + 2, y: py + 2, width: PILL_W - 4,
          text: b.label, fontSize: 8, fill: b.textColor,
          align: 'center', listening: false,
        }));
      });
    }

    // Distribute stubs evenly along the left and right edges of the closure rect.
    // We reserve the top 50px for headers/sparkline, so stubs start at y=50.
    const STUB_TOP = 50;
    const STUB_BOTTOM = RH - 10;
    function stubY(idx, total) {
      if (total <= 1) return (STUB_TOP + STUB_BOTTOM) / 2;
      return STUB_TOP + idx * (STUB_BOTTOM - STUB_TOP) / (total - 1);
    }
    leftCables.forEach((cable, i) => {
      _drawStub(cable, 0, -1, stubY(i, leftCables.length));
    });
    rightCables.forEach((cable, i) => {
      _drawStub(cable, RW, 1, stubY(i, rightCables.length));
    });

    group.on('click tap', () => selectThing('closure', cl.id));
    group.on('mouseenter', () => { document.body.style.cursor = 'pointer'; });
    group.on('mouseleave', () => { document.body.style.cursor = 'default'; });
    closureLayer.add(group);
  }

  for (const loc of orderedLocations) {
    const list = closuresByLoc.get(loc.id) || [];
    const x = colX.get(loc.id);
    // Cables that terminate (from or to) at this location — used to decide
    // whether to use the rich layout for a given closure.
    const cablesAtLoc = d.cables.filter(c =>
      c.from_location_id === loc.id || c.to_location_id === loc.id
    );
    list.forEach((cl, idx) => {
      const baseY    = 380 + idx * 110;
      const trayList = d.trays.filter(t => t.closure_id === cl.id).sort((a,b)=>a.position-b.position);
      const splicesIn = (tray) => d.splices.filter(s => s.tray_id === tray.id).length;
      const overCap  = trayList.some(t => splicesIn(t) > cl.tray_capacity);
      const totalSpliceCount = trayList.reduce((sum, t) => sum + splicesIn(t), 0);

      // Rich layout for closures where 3 or more cables converge. The standard
      // two-cable layout (120px box) is kept unchanged — generalising it just
      // to handle the common case adds complexity without benefit.
      if (cablesAtLoc.length >= 3) {
        _drawRichClosure(cl, x, baseY, cablesAtLoc, trayList, totalSpliceCount);
        return;
      }

      const group = new Konva.Group({ x: x - 60, y: baseY, width: 120 });
      group.add(new Konva.Rect({
        width: 120, height: 90,
        fill: overCap ? '#FFF3CD' : '#FFFFFF',
        stroke: overCap ? '#DC3545' : '#1B5FA0',
        strokeWidth: 2, cornerRadius: 4,
      }));
      group.add(new Konva.Text({
        x: 4, y: 4, width: 112,
        text: cl.model || 'Closure',
        fontSize: 11, fontStyle:'bold', fill:'#1B5FA0',
      }));
      group.add(new Konva.Text({
        x: 4, y: 18, width: 112,
        text: trayList.length + '×' + cl.tray_capacity + ' trays',
        fontSize: 10, fill:'#6C757D',
      }));
      // Tray sparkline — small bars showing fill ratio per tray.
      trayList.forEach((tray, ti) => {
        const fill = splicesIn(tray) / cl.tray_capacity;
        const tx = 4 + ti * (112 / Math.max(trayList.length, 1));
        const tw = 112 / Math.max(trayList.length, 1) - 1;
        group.add(new Konva.Rect({
          x: tx, y: 36, width: tw, height: 12,
          fill:'#F0F0F0', stroke:'#DEE2E6', strokeWidth:0.5,
        }));
        group.add(new Konva.Rect({
          x: tx, y: 36, width: tw * Math.min(fill, 1), height: 12,
          fill: fill > 1 ? '#DC3545' : (fill > 0.85 ? '#FFC107' : '#28A745'),
        }));
      });
      group.add(new Konva.Text({
        x: 4, y: 56, width: 112, align:'center',
        text: 'Open trays →', fontSize: 10, fill:'#1B5FA0',
      }));
      // Click → open closure inspector
      group.on('click tap', () => selectThing('closure', cl.id));
      group.on('mouseenter', () => { document.body.style.cursor='pointer'; });
      group.on('mouseleave', () => { document.body.style.cursor='default'; });
      closureLayer.add(group);
    });
  }

  // Splice lines — drawn on the spliceLayer (listening:false so they're
  // visual only). For each splice we route a quadratic bezier from
  // cable A's center-Y to cable B's center-Y at the closure's column X,
  // bowing slightly to the right so multiple splices in the same tray
  // are visually distinguishable. Ribbon groups collapse to one thicker
  // line covering all 12 splices (less canvas noise, matches PDF).
  const fiberById = new Map(d.fibers.map(f => [f.id, f]));
  const tubeById  = new Map(d.buffer_tubes.map(t => [t.id, t]));
  const closureById = new Map(d.closures.map(c => [c.id, c]));
  const trayById  = new Map(d.trays.map(t => [t.id, t]));
  const ribbonGroupCounter = new Map();   // group_id → splice count
  d.splices.forEach(s => {
    if (s.ribbon_group_id) {
      ribbonGroupCounter.set(s.ribbon_group_id, (ribbonGroupCounter.get(s.ribbon_group_id) || 0) + 1);
    }
  });

  // Cluster offset per tray so multiple splices in the same tray fan out
  // instead of stacking on top of each other.
  const trayOffsetCounter = new Map();
  function nextOffsetForTray(trayId) {
    const n = (trayOffsetCounter.get(trayId) || 0);
    trayOffsetCounter.set(trayId, n + 1);
    // 12, 24, 36... pixels of bow to the right.
    return 12 + n * 12;
  }
  // Render ribbon groups first (bigger, behind), then loose splices on top.
  const renderedRibbons = new Set();
  function spliceCableForFiber(fiberId) {
    const f = fiberById.get(fiberId);
    if (!f) return null;
    const tube = tubeById.get(f.buffer_tube_id);
    if (!tube) return null;
    return { cable_id: tube.cable_id, tube_color: tube.color };
  }
  function tubeColorOfFiber(fiberId) {
    const c = spliceCableForFiber(fiberId);
    return c ? COLORS[c.tube_color] || '#666' : '#666';
  }

  d.splices.forEach(s => {
    if (s.ribbon_group_id && renderedRibbons.has(s.ribbon_group_id)) return;
    const tray = trayById.get(s.tray_id);
    if (!tray) return;
    const closure = closureById.get(tray.closure_id);
    if (!closure) return;
    const x = colX.get(closure.location_id);
    if (x == null) return;
    const aInfo = spliceCableForFiber(s.fiber_a_id);
    const bInfo = spliceCableForFiber(s.fiber_b_id);
    if (!aInfo || !bInfo) return;
    const yA = cableYById.get(aInfo.cable_id);
    const yB = cableYById.get(bInfo.cable_id);
    // Skip splices whose cables are unrouted — there's no canvas anchor
    // to draw between. They still show up in the inspector and PDF.
    if (yA == null || yB == null) return;

    const isRibbon = !!s.ribbon_group_id;
    const offset = nextOffsetForTray(s.tray_id);
    const ctrlX = x + offset;
    const ctrlY = (yA + yB) / 2;
    const stroke = tubeColorOfFiber(s.fiber_a_id);

    // Quadratic bezier as a Konva.Shape (custom sceneFunc) — Konva's
    // built-in Line with tension blurs control points; explicit bezier
    // is easier to reason about.
    const bow = new Konva.Shape({
      stroke,
      strokeWidth: isRibbon ? 4 : 1.5,
      opacity: isRibbon ? 0.85 : 0.7,
      lineCap: 'round',
      sceneFunc(ctx, shape) {
        ctx.beginPath();
        ctx.moveTo(x, yA);
        ctx.quadraticCurveTo(ctrlX, ctrlY, x, yB);
        ctx.fillStrokeShape(shape);
      },
      listening: false,
    });
    spliceLayer.add(bow);

    if (isRibbon) {
      renderedRibbons.add(s.ribbon_group_id);
      // ×12 marker near the apex of the curve.
      spliceLayer.add(new Konva.Text({
        x: ctrlX - 12, y: ctrlY - 6,
        text: '×' + (ribbonGroupCounter.get(s.ribbon_group_id) || 12),
        fontSize: 10, fontStyle: 'bold', fill: stroke,
        listening: false,
      }));
    }
  });

  // ── Path-trace overlay (Phase 2C #11) ──────────────────────────────────
  // When a strand path is active, glow every cable in the chain and accent
  // every closure that hosts a splice-to-next hop.
  if (state.tracePath && state.tracePath.chain && state.tracePath.chain.length) {
    const TRACE_CABLE_COLOR  = '#FF6B00';  // vivid orange — high contrast on both themes
    const TRACE_CLOSURE_COLOR = '#FF6B00';

    // Collect the set of cable IDs and closure IDs that appear in the chain.
    const traceCableIds   = new Set();
    const traceClosureIds = new Set();

    for (const entry of state.tracePath.chain) {
      const f = entry.fiber;
      if (f.cable_id) traceCableIds.add(f.cable_id);
      if (entry.splice_to_next && entry.splice_to_next.closure_id) {
        traceClosureIds.add(entry.splice_to_next.closure_id);
      }
    }

    // For each traced cable, draw a thick glowing outline around its strip.
    d.cables.forEach((cable, i) => {
      if (!traceCableIds.has(cable.id)) return;
      const from = colX.get(cable.from_location_id);
      const to   = colX.get(cable.to_location_id);
      if (from == null || to == null) return;
      const tubes = d.buffer_tubes.filter(t => t.cable_id === cable.id);
      const y = 80 + i * 60;
      const tubeGap = 2;
      const stripHeight = Math.max(8, tubes.length * tubeGap + 2);
      // Glow rect behind the cable strip.
      traceLayer.add(new Konva.Rect({
        x: from + 4, y: y - 6,
        width: to - from - 8, height: stripHeight + 12,
        stroke: TRACE_CABLE_COLOR, strokeWidth: 3,
        fill: 'rgba(255,107,0,0.10)',
        cornerRadius: 4, listening: false,
      }));
    });

    // For each traced closure, draw a colored accent ring around its box.
    // Rich closures (3+ cables) use a wider rectangle; standard ones use 120px.
    for (const loc of orderedLocations) {
      const list = closuresByLoc.get(loc.id) || [];
      const x = colX.get(loc.id);
      const cablesHere = d.cables.filter(c =>
        c.from_location_id === loc.id || c.to_location_id === loc.id
      );
      const isRich = cablesHere.length >= 3;
      const ringW = isRich ? 208 : 128;
      list.forEach((cl, idx) => {
        if (!traceClosureIds.has(cl.id)) return;
        const baseY = 380 + idx * 110;
        traceLayer.add(new Konva.Rect({
          x: x - ringW / 2 - 4, y: baseY - 4,
          width: ringW, height: 98,
          stroke: TRACE_CLOSURE_COLOR, strokeWidth: 3,
          fill: 'rgba(255,107,0,0.08)',
          cornerRadius: 6, listening: false,
        }));
      });
    }
  }

  state.konva.stage.batchDraw();
  resetView();
}

function resetView() {
  if (!state.konva) return;
  const stage = state.konva.stage;
  stage.scale({ x: 1, y: 1 });
  stage.position({ x: 0, y: 0 });
  stage.batchDraw();
}

function zoom(factor) {
  if (!state.konva) return;
  const stage = state.konva.stage;
  const newScale = stage.scaleX() * factor;
  stage.scale({ x: newScale, y: newScale });
  stage.batchDraw();
}

// Inspector — context-sensitive right pane
