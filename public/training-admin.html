<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Training Progress — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#842029;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --danger:#FF6B6B;--danger-light:#3D1A1A;--danger-text:#FFCDD2;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:14px}
.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--gray-border);
  display:inline-flex;align-items:center;gap:6px;background:var(--white);color:var(--text-secondary)}
.btn:hover{background:var(--surface-1)}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--gray-border);color:var(--text-secondary)}
.page-body{padding:20px 24px;max-width:1100px;margin:0 auto}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted);margin-bottom:18px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;padding:12px 16px;min-width:130px}
.stat .num{font-size:22px;font-weight:700}
.stat .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search-input{padding:7px 12px;border:1px solid var(--gray-border);border-radius:6px;
  background:var(--white);color:var(--text);outline:none;font-size:13px;width:220px}
.search-input:focus{border-color:var(--primary)}
.card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--gray-border);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);font-weight:600;background:var(--surface-1)}
tr:last-child td{border-bottom:none}
.person{font-weight:600}
.person .uname{font-weight:400;color:var(--text-muted);font-size:11px;margin-left:6px}
.role-chip{font-size:10px;background:var(--surface-1);border:1px solid var(--gray-border);border-radius:10px;padding:1px 8px;color:var(--text-muted);white-space:nowrap}
.role-chip.trainee{background:var(--primary-light);color:var(--primary-dark);border-color:transparent}
.bar-wrap{display:flex;align-items:center;gap:10px;min-width:200px}
.bar{flex:1;height:9px;background:var(--surface-1);border:1px solid var(--gray-border);border-radius:6px;overflow:hidden;min-width:120px}
.bar > span{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .3s}
.bar.done > span{background:var(--success)}
.pct{font-size:12px;font-weight:600;width:38px;text-align:right}
.muted{color:var(--text-muted)}
.empty{padding:40px;text-align:center;color:var(--text-muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-radius:50%;border-right-color:transparent;animation:sp .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="header-title"><i class="fa-solid fa-graduation-cap" style="color:var(--primary)"></i> Training Progress</div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn" onclick="load()"><i class="fa-solid fa-rotate"></i> Refresh</button>
    <button class="btn-icon" onclick="toggleDark()" title="Toggle theme"><i class="fa-solid fa-moon" id="dm-icon"></i></button>
  </div>
</div>

<div class="page-body">
  <div class="page-title">Team training progress</div>
  <div class="page-sub">Per-person completion across the OSP training curriculum.</div>

  <div class="stats" id="stats"></div>

  <div class="filter-bar">
    <input class="search-input" id="search" type="search" placeholder="Filter by name…" oninput="render()">
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th>Person</th><th>Role</th><th style="width:280px">Progress</th>
        <th class="num">Completed</th><th>In progress</th><th>Last active</th><th>Joined</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty"><span class="spin"></span> Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  var _data = { total_lessons: null, users: [] };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(d){ if(!d) return '<span class="muted">—</span>'; try{ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return esc(d); } }
  function fmtRole(r){ return String(r||'').replace(/_/g,' '); }

  window.load = async function(){
    var tb = document.getElementById('tbody');
    tb.innerHTML = '<tr><td colspan="7" class="empty"><span class="spin"></span> Loading…</td></tr>';
    try{
      var res = await fetch('/api/training/admin/overview', { credentials:'include' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      _data = await res.json();
      render();
    }catch(e){
      tb.innerHTML = '<tr><td colspan="7" class="empty">Failed to load training progress.</td></tr>';
    }
  };

  window.render = function(){
    var total = _data.total_lessons;
    var q = (document.getElementById('search').value||'').toLowerCase().trim();
    var users = (_data.users||[]).filter(function(u){ return !q || (u.name||'').toLowerCase().indexOf(q)>=0 || (u.username||'').toLowerCase().indexOf(q)>=0; });

    // Stats
    var people = (_data.users||[]).length;
    var started = (_data.users||[]).filter(function(u){ return u.completed>0 || u.in_progress>0; }).length;
    var doneAll = total ? (_data.users||[]).filter(function(u){ return u.completed>=total; }).length : 0;
    var avg = (total && people) ? Math.round((_data.users||[]).reduce(function(a,u){ return a+Math.min(1,u.completed/total); },0)/people*100) : null;
    document.getElementById('stats').innerHTML =
        stat(people,'People')
      + stat(started,'Started')
      + stat(doneAll,'Finished')
      + stat(avg==null?'—':avg+'%','Avg completion')
      + stat(total==null?'—':total,'Lessons in curriculum');

    var tb = document.getElementById('tbody');
    if(!users.length){ tb.innerHTML = '<tr><td colspan="7" class="empty">No people yet. New sign-ups appear here.</td></tr>'; return; }
    tb.innerHTML = users.map(function(u){
      var pct = total ? Math.min(100, Math.round(u.completed/total*100)) : null;
      var done = (total && u.completed>=total);
      var barHtml = (pct==null)
        ? '<div class="bar-wrap"><span class="muted" style="font-size:12px">'+u.completed+' completed</span></div>'
        : '<div class="bar-wrap"><div class="bar'+(done?' done':'')+'"><span style="width:'+pct+'%"></span></div><span class="pct">'+pct+'%</span></div>';
      var roleCls = u.role==='trainee' ? ' trainee' : '';
      return '<tr>'
        + '<td class="person">'+esc(u.name)+'<span class="uname">@'+esc(u.username)+'</span></td>'
        + '<td><span class="role-chip'+roleCls+'">'+esc(fmtRole(u.role))+'</span></td>'
        + '<td>'+barHtml+'</td>'
        + '<td class="num">'+u.completed+(total?' / '+total:'')+'</td>'
        + '<td>'+(u.in_progress||0)+'</td>'
        + '<td>'+fmtDate(u.last_seen_at)+'</td>'
        + '<td>'+fmtDate(u.created_at)+'</td>'
        + '</tr>';
    }).join('');
  };

  function stat(num,lbl){ return '<div class="stat"><div class="num">'+esc(num)+'</div><div class="lbl">'+esc(lbl)+'</div></div>'; }

  window.toggleDark = function(){
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme', dark?'light':'dark');
    localStorage.setItem('lfs_theme', dark?'light':'dark');
    updateDmIcon();
  };
  function updateDmIcon(){ var i=document.getElementById('dm-icon'); if(i) i.className = document.documentElement.getAttribute('data-theme')==='dark'?'fa-solid fa-sun':'fa-solid fa-moon'; }
  (function(){ var s=localStorage.getItem('lfs_theme'); if(s) document.documentElement.setAttribute('data-theme',s); updateDmIcon(); })();

  load();
})();
</script>
<script src="/js/app_nav.js" data-active="training"></script>
</body>
</html>
