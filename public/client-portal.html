<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — Launch Fiber Services</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Token system — mirrors all other Launch Fiber portals. Edit tokens here
   and every component updates automatically. Dark mode flips without
   per-component overrides. */
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;--primary-text:#FFFFFF;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;--primary-text:#FFFFFF;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text);min-height:100vh}
html[data-theme="dark"] body{background:#0F1419}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* Header */
.header{
  background:var(--surface-2);
  border-bottom:1px solid var(--gray-border);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-title{font-size:14px;font-weight:600;color:var(--text)}
.header-sub{font-size:12px;color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:8px}
.btn{
  padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;
  border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;text-decoration:none;color:inherit;
}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--surface-1)}
.btn-icon{padding:6px 8px}
.btn-sm{padding:6px 10px;font-size:12px}
.account-pill{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-muted);
  border:1px solid var(--gray-border);background:var(--surface-2);
}
.account-pill:hover{background:var(--surface-1)}
.account-pill strong{color:var(--text)}

/* Main layout */
.container{max-width:1240px;margin:0 auto;padding:24px 16px}

/* Page title */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted)}

/* Three-column grid */
.cp-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
  align-items:start;
}
@media(max-width:860px){
  .cp-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .cp-grid{grid-template-columns:1fr}
}

/* Column */
.cp-column{
  background:var(--surface-2);
  border:1px solid var(--gray-border);
  border-radius:12px;
  overflow:hidden;
}
.cp-col-header{
  padding:14px 16px;
  border-bottom:1px solid var(--gray-border);
  display:flex;align-items:center;gap:8px;
}
.cp-col-icon{font-size:15px;color:var(--primary)}
.cp-col-title{font-size:14px;font-weight:600;color:var(--text)}
.cp-col-body{padding:12px}

/* Project card */
.cp-project-card{
  background:var(--surface-1);
  border:1px solid var(--border-weak);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:10px;
}
.cp-project-card:last-child{margin-bottom:0}
.cp-card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35}
.cp-card-money{font-size:18px;font-weight:700;color:var(--text);margin-top:8px}
.cp-card-meta{font-size:12px;color:var(--text-muted);margin-top:4px}

/* Status pills */
.cp-pill{
  display:inline-block;padding:2px 9px;border-radius:8px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
}
.pill-gray {background:var(--surface-3);color:var(--text-muted)}
.pill-blue {background:var(--info-light);color:var(--info-text)}
.pill-green{background:var(--success-light);color:var(--success-text)}
.pill-teal {background:var(--success);color:#fff}

/* Deferred column */
.cp-deferred{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px;text-align:center;
}
.cp-deferred-icon{font-size:32px;color:var(--text-muted);opacity:.35;margin-bottom:12px}
.cp-deferred-msg{font-size:13px;color:var(--text-muted)}

/* Empty state */
.cp-empty{
  padding:32px 16px;text-align:center;
  font-size:13px;color:var(--text-muted);
}

/* Admin toolbar */
.cp-admin-toolbar{
  background:var(--surface-2);
  border:1px solid var(--gray-border);
  border-radius:8px;
  padding:12px 16px;
  margin-bottom:20px;
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;
}
.cp-admin-toolbar label{
  font-size:13px;font-weight:500;color:var(--text-secondary);
  display:flex;align-items:center;gap:8px;
}
.cp-admin-toolbar select{
  padding:6px 10px;border-radius:6px;font-size:13px;
  border:1px solid var(--gray-border);
  background:var(--surface-1);color:var(--text);
  font-family:var(--font);cursor:pointer;
  min-width:220px;
}
.cp-admin-toolbar select:focus{outline:2px solid var(--primary);outline-offset:2px}
.cp-view-as-notice{
  font-size:12px;color:var(--text-muted);margin-left:4px;
  font-style:italic;
}

/* Client section header (admin all-clients overview) */
.cp-client-section{margin-bottom:32px}
.cp-client-heading{
  font-size:15px;font-weight:700;color:var(--text);
  padding:10px 0 10px;
  border-bottom:2px solid var(--primary);
  margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.cp-client-heading i{color:var(--primary);font-size:14px}

/* Footer */
.cp-footer{
  margin-top:24px;
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
}

/* a11y */
.skip-nav{
  position:absolute;left:-9999px;top:auto;width:1px;height:1px;
  overflow:hidden;z-index:9999;text-decoration:none;
}
.skip-nav:focus{
  position:fixed;left:50%;top:8px;transform:translateX(-50%);
  width:auto;height:auto;padding:10px 20px;background:var(--primary);
  color:#fff;font-weight:600;border-radius:6px;font-size:14px;z-index:9999;
}
</style>
</head>
<body>

<a href="#main-content" class="skip-nav">Skip to main content</a>

<header class="header" role="banner">
  <div style="display:flex;align-items:center;gap:14px">
    <span class="header-title">Launch Fiber Services</span>
    <span class="header-sub">Project Status</span>
  </div>
  <div class="header-right">
    <button class="btn btn-secondary btn-sm btn-icon"
            onclick="(function(){const t=document.documentElement.dataset.theme;document.documentElement.dataset.theme=t==='dark'?'light':'dark';localStorage.setItem('theme',document.documentElement.dataset.theme)})()"
            title="Toggle dark mode"
            aria-label="Toggle dark mode">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
    <a href="/admin.html" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back
    </a>
  </div>
</header>

<main class="container" id="main-content">
  <div class="page-header">
    <h1 class="page-title" id="cp-page-title">Your Projects</h1>
    <p class="page-sub" id="cp-page-sub">Design and permitting activity — updates automatically.</p>
  </div>

  <!-- Admin toolbar: visible only for non-customer roles, populated by JS -->
  <div id="cp-admin-toolbar" class="cp-admin-toolbar" style="display:none" role="search" aria-label="Admin view controls">
    <label for="cp-view-as">
      <i class="fa-solid fa-eye" aria-hidden="true"></i>
      View as:
    </label>
    <select id="cp-view-as" aria-label="Select client to view as">
      <option value="">All clients (admin overview)</option>
    </select>
    <span class="cp-view-as-notice" id="cp-view-as-notice" aria-live="polite"></span>
  </div>

  <!-- Project content: JS renders either a single cp-grid (customer/single-client)
       or multiple cp-client-section blocks (admin all-clients overview) -->
  <div id="cp-content" aria-live="polite">
    <div class="cp-empty" style="padding:40px 0;text-align:center">Loading&hellip;</div>
  </div>

  <div class="cp-footer" aria-live="polite">
    <span id="cp-last-updated"></span>
  </div>
</main>

<script>
// Restore saved theme preference before first paint
(function(){
  var t=localStorage.getItem('theme');
  if(t==='dark'||t==='light') document.documentElement.dataset.theme=t;
})();
</script>
<script src="/js/client_portal.js" defer></script>
</body>
</html>
