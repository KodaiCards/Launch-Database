<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — Launch Fiber Services</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Design system -->
<link rel="stylesheet" href="/css/app-shell.css">
<style>
/* Client-portal-specific styles — colors come from app-shell.css design tokens.
   Layout / cards / status pills are scoped here so the three-column read-only
   view keeps its dense vertical rhythm. */
*{box-sizing:border-box}

/* Main layout — page padding sits inside .app-content */
.container{max-width:1240px;margin:0 auto;padding:var(--space-6) var(--space-4)}

/* Page title */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted)}

/* Grid — dynamic layout based on how many non-empty team categories exist */
.cp-grid{
  display:grid;
  gap:20px;
  align-items:start;
}
/* Three columns */
.cp-grid-three{grid-template-columns:1fr 1fr 1fr}
/* Two columns */
.cp-grid-two{grid-template-columns:1fr 1fr}
/* Single — full width, column expands to fill */
.cp-grid-single{grid-template-columns:1fr}
.cp-column-full{width:100%}

@media(max-width:860px){
  .cp-grid-three{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .cp-grid-three,.cp-grid-two{grid-template-columns:1fr}
}

/* Column — visually identical to .card from app-shell.css.
   client_portal.js may add .card to .cp-column for explicit design-system
   alignment; this rule keeps the look correct either way. */
.cp-column,
.cp-column.card{
  background:var(--surface-2);
  border:1px solid var(--border-strong);
  border-radius:12px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.cp-col-header{
  padding:14px 16px;
  border-bottom:1px solid var(--gray-border);
  display:flex;align-items:center;gap:8px;
}
.cp-col-icon{font-size:15px;color:var(--primary)}
.cp-col-title{font-size:14px;font-weight:600;color:var(--text)}
.cp-col-body{padding:12px}

/* Collapsible header — shared behavior for column, contract, and job headers */
.cp-collapsible-header{
  cursor:pointer;user-select:none;
}
.cp-collapsible-header:hover{filter:brightness(.97)}
html[data-theme="dark"] .cp-collapsible-header:hover{filter:brightness(1.06)}
.cp-collapsible-header:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

/* Chevron inside collapsible headers */
.cp-chev{
  font-size:10px;color:var(--text-muted);flex-shrink:0;
  transition:transform .18s ease;
}

/* Column header now participates in collapse — override static display */
.cp-col-header{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}

/* Overview badge in node headers */
.cp-overview{
  margin-left:auto;display:inline-flex;align-items:center;flex-wrap:wrap;
  gap:4px;font-size:11px;font-weight:400;color:var(--text-muted);
  flex-shrink:0;max-width:55%;text-align:right;justify-content:flex-end;
}
.cp-ov-sep{color:var(--border-strong);margin:0 1px}
.cp-ov-count{font-weight:600;color:var(--text-secondary)}
.cp-ov-meta{color:var(--text-muted)}
.cp-ov-status{color:var(--text-muted)}
.cp-ov-cost{font-weight:600;color:var(--primary)}

/* Contract group (level 1 nesting — only rendered when project has a contract) */
.cp-contract-group{
  margin-bottom:14px;
  border:1px solid var(--border-weak);
  border-radius:10px;
  overflow:hidden;
}
.cp-contract-group:last-child{margin-bottom:0}
.cp-contract-header{
  display:flex;align-items:center;gap:7px;
  padding:9px 12px;
  background:var(--primary-light);
  border-bottom:1px solid var(--border-weak);
  font-size:13px;font-weight:600;color:var(--primary);
}
html[data-theme="dark"] .cp-contract-header{
  background:var(--primary-dark);
  color:var(--primary-text);
}
.cp-contract-icon{font-size:12px}
.cp-contract-label{line-height:1.3}
/* When contract is collapsed the border-bottom should disappear */
.cp-contract-header[aria-expanded="false"]{border-bottom:none}

/* Job group (level 2 nesting) */
.cp-job-group{padding:6px 12px 2px}
.cp-contract-group .cp-job-group{padding:6px 10px 2px}
.cp-job-header{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;
  color:var(--text-muted);
  margin-bottom:0;padding:6px 0 5px;
  border-bottom:1px solid var(--border-weak);
}
.cp-job-header-collapsible{
  border-radius:4px;padding:6px 4px;
}
.cp-job-header-collapsible[aria-expanded="false"]{border-bottom:none;margin-bottom:6px}
.cp-job-header-label{flex:1;line-height:1.3}
.cp-job-areas{
  padding-top:8px;
  /* leaf cards go here — cp-project-card handles own spacing */
}

/* Project card */
.cp-project-card{
  background:var(--surface-1);
  border:1px solid var(--border-weak);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:10px;
}
.cp-project-card:last-child{margin-bottom:8px}
.cp-card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35}
.cp-card-money{font-size:18px;font-weight:700;color:var(--text);margin-top:8px}
.cp-card-meta{font-size:12px;color:var(--text-muted);margin-top:4px}

/* Clickable project card hover / focus */
.cp-clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.cp-clickable:hover{
  border-color:var(--primary);
  box-shadow:0 0 0 2px var(--primary-light);
}
html[data-theme="dark"] .cp-clickable:hover{
  box-shadow:0 0 0 2px var(--primary-dark);
}
.cp-clickable:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Project detail modal */
.cp-detail-overlay{
  position:fixed;inset:0;z-index:1000;
  background:var(--modal-backdrop, rgba(0,0,0,.45));
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.cp-detail-box{
  background:var(--surface-2);
  border:1px solid var(--border-strong);
  border-radius:12px;
  width:100%;max-width:460px;
  box-shadow:var(--shadow-xl);
  overflow:hidden;
}
.cp-detail-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 18px;
  border-bottom:1px solid var(--gray-border);
}
.cp-detail-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.cp-detail-close{
  flex-shrink:0;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:14px;
  border:1px solid var(--gray-border);background:var(--surface-1);
  cursor:pointer;transition:all .15s;
}
.cp-detail-close:hover{background:var(--surface-3);color:var(--text)}
.cp-detail-body{padding:16px 18px}
.cp-detail-table{width:100%;border-collapse:collapse}
.cp-detail-th{
  font-size:12px;font-weight:600;color:var(--text-muted);
  padding:7px 0;width:90px;vertical-align:top;text-align:left;
}
.cp-detail-td{
  font-size:13px;color:var(--text);
  padding:7px 0 7px 12px;vertical-align:top;
}
.cp-detail-table tr + tr .cp-detail-th,
.cp-detail-table tr + tr .cp-detail-td{
  border-top:1px solid var(--border-weak);
}

/* Status pills */
.cp-pill{
  display:inline-block;padding:2px 9px;border-radius:8px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
}
.pill-gray {background:var(--surface-3);color:var(--text-muted)}
.pill-blue {background:var(--info-light);color:var(--info-text)}
.pill-green{background:var(--success-light);color:var(--success-text)}
.pill-teal {background:var(--success);color:var(--primary-text)}

/* Deferred column */
.cp-deferred{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px;text-align:center;
}
.cp-deferred-icon{font-size:32px;color:var(--text-muted);opacity:.35;margin-bottom:12px}
.cp-deferred-msg{font-size:13px;color:var(--text-muted)}

/* Empty state */
.cp-empty{
  padding:32px 16px;text-align:center;
  font-size:13px;color:var(--text-muted);
}

/* Admin toolbar */
.cp-admin-toolbar{
  background:var(--surface-2);
  border:1px solid var(--gray-border);
  border-radius:8px;
  padding:12px 16px;
  margin-bottom:20px;
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;
}
.cp-admin-toolbar label{
  font-size:13px;font-weight:500;color:var(--text-secondary);
  display:flex;align-items:center;gap:8px;
}
.cp-admin-toolbar select{
  padding:6px 10px;border-radius:6px;font-size:13px;
  border:1px solid var(--gray-border);
  background:var(--surface-1);color:var(--text);
  font-family:var(--font);cursor:pointer;
  min-width:220px;
}
.cp-admin-toolbar select:focus{outline:2px solid var(--primary);outline-offset:2px}
.cp-view-as-notice{
  font-size:12px;color:var(--text-muted);margin-left:4px;
  font-style:italic;
}

/* Client section header (admin all-clients overview) */
.cp-client-section{margin-bottom:32px}
.cp-client-heading{
  font-size:15px;font-weight:700;color:var(--text);
  padding:10px 0 10px;
  border-bottom:2px solid var(--primary);
  margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.cp-client-heading i{color:var(--primary);font-size:14px}

/* Footer */
.cp-footer{
  margin-top:24px;
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
}

/* a11y skip-nav comes from app-shell.css */
</style>
</head>
<body class="app-with-topbar">

<a href="#main-content" class="skip-nav">Skip to main content</a>

<noscript>
  <div style="padding:16px;background:#FFF8E1;color:#7A4F0E;text-align:center;border-bottom:1px solid #DEE2E6">
    JavaScript is required to view your project status.
  </div>
</noscript>

<main id="main-content" class="app-content">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title" id="cp-page-title">Your Projects</h1>
      <p class="page-sub" id="cp-page-sub">Design and permitting activity — updates automatically.</p>
    </div>

    <!-- Admin toolbar: visible only for non-customer roles, populated by JS -->
    <div id="cp-admin-toolbar" class="cp-admin-toolbar card" style="display:none" role="search" aria-label="Admin view controls">
      <label for="cp-view-as">
        <i class="fa-solid fa-eye" aria-hidden="true"></i>
        View as:
      </label>
      <select id="cp-view-as" aria-label="Select client to view as">
        <option value="">All clients (admin overview)</option>
      </select>
      <span class="cp-view-as-notice" id="cp-view-as-notice" aria-live="polite"></span>
    </div>

    <!-- Project content: JS renders either a single cp-grid (customer/single-client)
         or multiple cp-client-section blocks (admin all-clients overview).
         Each Design/Permitting/Construction column carries the .cp-column AND .card
         classes so the design-system shadow + border treatment applies. -->
    <div id="cp-content" aria-live="polite">
      <div class="cp-empty" style="padding:40px 0;text-align:center">Loading&hellip;</div>
    </div>

    <div class="cp-footer" aria-live="polite">
      <span id="cp-last-updated"></span>
    </div>
  </div>
</main>

<script src="/js/app-shell.js" defer></script>
<script src="/js/client_portal.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.AppShell && typeof AppShell.init === 'function') {
      AppShell.init({ title: 'Client Portal', portalId: 'client_portal' });
    }
  });
</script>
</body>
</html>
