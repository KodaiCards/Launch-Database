<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Job Board — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#B71C1C;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#EF5350;--danger-light:#3D1F23;--danger-text:#F8B4BD;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--gray-light)}
.btn-sm{padding:6px 10px;font-size:12px}
.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px;object-fit:contain}
html[data-theme="dark"] .header-logo{filter:brightness(0) invert(1) opacity(.92)}
.header-title{font-size:16px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.page-heading{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted);margin-bottom:18px}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--gray-border);border-radius:6px;
  font-size:13px;background:var(--white);color:var(--text);font-family:var(--font)}

/* Board columns */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.col-wrap{}
.col-header{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.col-header .cnt{background:var(--gray-light);border:1px solid var(--gray-border);
  border-radius:10px;padding:1px 7px;font-size:11px;color:var(--text-muted)}

/* Job cards */
.job-card{background:var(--white);border:1px solid var(--gray-border);border-radius:8px;
  padding:11px 13px;margin-bottom:8px;font-size:12px}
.job-card-name{font-size:13px;font-weight:600;margin-bottom:4px}
.job-card-area{color:var(--text-secondary);margin-bottom:6px}
.job-card-meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
  background:var(--gray-light);color:var(--text-muted)}
.tag-rus{background:#F3E5F5;color:#8E24AA}
.tag-bau{background:var(--info-light);color:var(--info-text)}
.tag-design{background:var(--info-light);color:var(--info-text)}
.tag-permitting{background:var(--warning-light);color:var(--warning-text)}
.tag-construction{background:var(--success-light);color:var(--success-text)}
.tag-inspection{background:var(--success-light);color:var(--success-text)}
.assigned{font-size:10px;color:var(--text-muted);margin-top:5px}

.empty-state{text-align:center;color:var(--text-muted);padding:32px 16px;font-size:13px}
.empty-state i{font-size:28px;margin-bottom:8px;opacity:.4;display:block}
.loading-row{text-align:center;color:var(--text-muted);padding:28px;font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
  border-radius:50%;border-right-color:transparent;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar input{width:100%}
  .container{padding:0 10px}
  .board{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img src="/img/launch-fiber-logo-transparent.png" alt="Launch Fiber Services" class="header-logo">
    <span class="header-title">Job Board</span>
  </div>
  <div class="header-right">
    <button class="btn btn-secondary btn-sm" onclick="toggleDark()" title="Toggle dark mode">
      <i class="fa-solid fa-moon" id="dm-icon"></i>
    </button>
    <a href="/" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Admin</a>
  </div>
</header>

<main class="container" data-active="job-board">
  <div class="page-heading">Job Board</div>
  <div class="page-sub">All service-area jobs grouped by status. Read-only.</div>

  <div class="toolbar">
    <input type="search" id="jb-search" placeholder="Search job, area, client…" style="width:220px">
    <select id="jb-team">
      <option value="">All teams</option>
      <option value="permitting">Permitting</option>
      <option value="design">Design</option>
      <option value="construction">Construction</option>
      <option value="inspection">Inspection</option>
    </select>
    <select id="jb-program">
      <option value="">All programs</option>
      <option value="rus">RUS</option>
      <option value="bau">BAU</option>
      <option value="gfr">GFR</option>
      <option value="other">Other</option>
    </select>
    <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
  </div>

  <div id="board-wrap">
    <div class="loading-row"><span class="spinner"></span>Loading jobs…</div>
  </div>
</main>

<script src="/js/job_board.js" defer></script>
<script src="/js/app_nav.js" data-active="job-board"></script>
</body>
</html>
