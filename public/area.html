<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Workspace — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#B71C1C;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#EF5350;--danger-light:#3D1F23;--danger-text:#F8B4BD;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

.topbar{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}

.btn{padding:7px 13px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s;cursor:pointer}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--surface-1)}
.btn-danger{background:var(--danger-light);color:var(--danger-text);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--gray-border);background:transparent;color:var(--text-secondary)}
.btn-icon:hover{background:var(--surface-1)}
.btn-ghost{background:none;border:none;color:var(--text-muted);padding:3px 6px;border-radius:4px;font-size:12px;cursor:pointer}
.btn-ghost:hover{color:var(--text);background:var(--surface-1)}

.page-body{padding:20px 24px;max-width:1080px;margin:0 auto}

/* Flash bar */
.flash-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;
  background:var(--text);color:var(--white);padding:10px 18px;border-radius:8px;
  font-size:13px;font-weight:500;white-space:nowrap;display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.25);gap:8px;align-items:center}
.flash-bar.err{background:var(--danger)}
.flash-bar.show{display:flex}

/* Breadcrumb */
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:14px}
.breadcrumb a{color:var(--primary)}

/* Area header */
.area-head{margin-bottom:18px}
.area-name{font-size:22px;font-weight:700;margin-bottom:6px}
.area-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-rus{background:#F3E5F5;color:#8E24AA}
.badge-bau{background:var(--primary-light);color:var(--primary-dark)}
.badge-gfr{background:#E8F5E9;color:#2E7D32}
.badge-prog{background:var(--surface-1);color:var(--text-muted)}
.badge-map{background:#E3F2FD;color:#1565C0}
.badge-manual{background:var(--surface-1);color:var(--text-muted)}
.badge-bom{background:#FFF8E1;color:#7A4F0E}
.badge-final{background:var(--success-light);color:var(--success-text)}

/* Map stub (kept for compat) */
.map-stub{background:var(--white);border:1px dashed var(--gray-border);border-radius:10px;
  padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
/* Map header (R15.2) */
.sa-map-header{margin-bottom:16px;border:1px solid var(--gray-border);border-radius:10px;overflow:visible;background:var(--white)}
.sa-map-toolbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--white);border-bottom:1px solid var(--gray-border);border-radius:10px 10px 0 0;flex-wrap:wrap}
.sa-map-container{position:relative;height:300px;transition:height .1s}
.sa-map-leaflet,.sa-map-frm{position:absolute;inset:0;width:100%;height:100%;border:0}
.sa-map-frm{display:none}
.sa-map-resize{height:7px;cursor:ns-resize;background:transparent;border-top:2px solid var(--gray-border);border-radius:0 0 10px 10px;opacity:.5;transition:opacity .15s}
.sa-map-resize:hover{opacity:1;background:var(--primary-light)}
@keyframes sa-spin{to{transform:rotate(360deg)}}

/* Route selector */
.route-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg-ctrl{display:flex;border:1px solid var(--gray-border);border-radius:7px;overflow:hidden}
.seg-ctrl button{padding:6px 14px;font-size:12px;font-weight:500;border:none;border-right:1px solid var(--gray-border);
  background:var(--white);color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:all .12s}
.seg-ctrl button:last-child{border-right:none}
.seg-ctrl button.active{background:var(--primary);color:#fff}
.seg-ctrl button:hover:not(.active){background:var(--surface-1)}
.route-status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-complete{background:var(--success)}
.dot-active{background:var(--primary)}
.dot-planned{background:var(--text-muted)}

/* Cost tiles */
.cost-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.cost-tile{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;padding:14px 16px;
  position:relative;transition:opacity .2s}
.cost-tile.dim{opacity:.5}
.cost-tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px;
  display:flex;align-items:center;justify-content:space-between}
.cost-tile .val{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:2px}
.cost-tile .sub{font-size:12px;color:var(--text-muted)}
.vis-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);margin-top:8px;cursor:pointer;
  user-select:none}
.vis-check input{cursor:pointer;accent-color:var(--primary)}

/* Card + table */
.card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;overflow:hidden;margin-bottom:22px}
.card-head{padding:12px 16px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;
  justify-content:space-between;gap:8px;background:var(--surface-1)}
.card-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;gap:7px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface-1);padding:9px 12px;text-align:left;font-weight:600;font-size:12px;
  color:var(--text-muted);border-bottom:1px solid var(--gray-border);white-space:nowrap}
th.num,td.num{text-align:right}
tbody tr{border-bottom:1px solid var(--gray-border)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:9px 12px;color:var(--text-secondary);vertical-align:middle}
tfoot td{font-weight:700;border-top:2px solid var(--gray-border);padding:8px 12px;background:var(--surface-1)}

/* Status pills */
.st-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.st-not_started{background:var(--surface-1);color:var(--text-muted)}
.st-in_progress,.st-active{background:var(--primary-light);color:var(--primary-dark)}
.st-revision{background:var(--warning-light);color:var(--warning-text)}
.st-done,.st-complete{background:var(--success-light);color:var(--success-text)}
.st-billed{background:#E8F5E9;color:#1B5E20}
.st-on_hold{background:var(--surface-1);color:var(--text-muted)}
.st-planned{background:var(--surface-1);color:var(--text-muted)}

/* Progress bar */
.prog-track{height:5px;background:var(--surface-1);border-radius:3px;overflow:hidden;min-width:60px}
.prog-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.prog-fill.done{background:var(--success)}

/* Expand rows */
.expand-row{background:var(--surface-1)}
.expand-row td{padding:8px 12px 8px 32px;font-size:12px;color:var(--text-muted)}
.people-list{display:flex;flex-direction:column;gap:4px}
.person-row{display:flex;align-items:center;gap:10px}
.person-row .pname{flex:1;font-weight:500;color:var(--text-secondary)}
.unit-list{display:flex;flex-direction:column;gap:4px}
.unit-row{display:flex;align-items:center;gap:10px}
.unit-row .ulabel{flex:1;font-weight:500}

/* Inline form for add-material */
.add-mat-row td{padding:8px 12px;background:var(--surface-1)}
.add-mat-row input,.add-mat-row select{font-size:12px;padding:4px 7px;border:1px solid var(--gray-border);
  border-radius:5px;background:var(--white);color:var(--text);width:100%;font-family:var(--font)}
.add-mat-row input:focus,.add-mat-row select:focus{outline:2px solid var(--primary);outline-offset:1px}

/* Misc */
.empty-state{padding:32px;text-align:center;color:var(--text-muted);font-size:13px}
.empty-state i{font-size:28px;display:block;margin-bottom:8px;opacity:.4}
.skeleton{background:var(--surface-1);border-radius:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loading-row{text-align:center;color:var(--text-muted);padding:28px;font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
  border-radius:50%;border-right-color:transparent;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.amt{font-variant-numeric:tabular-nums}
.dim-val{color:var(--text-muted)}
.clickable-row{cursor:pointer}
.clickable-row:hover td{background:var(--surface-1)}
.expand-btn{color:var(--text-muted);transition:transform .15s;display:inline-block}
.expanded .expand-btn{transform:rotate(90deg)}
.cost-cat{font-size:11px;color:var(--text-muted);margin-top:1px}
.note-block{margin-top:6px;font-size:12px;color:var(--text-muted);font-style:italic}
.dates-block{margin-top:4px;font-size:11px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap}
.finalize-btn-area{margin-left:auto;display:flex;align-items:center;gap:8px}
/* Phase C: project documents */
.job-docs-block{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.docs-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.doc-upload{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px}
.doc-upload select,.doc-upload input[type=file]{padding:3px 6px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface-1);color:var(--text)}
.du-progress{display:flex;align-items:center;gap:6px;width:100%;margin-top:4px}
.du-bar{height:6px;width:0;background:var(--primary);border-radius:3px;transition:width .15s;flex:0 0 auto;min-width:0}
.du-progress{position:relative}
.du-progress .du-bar{flex:1 1 auto;max-width:200px}
.du-pct{font-size:11px;color:var(--text-muted)}
.docs-list{display:flex;flex-direction:column;gap:4px}
.doc-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;border-radius:5px}
.doc-row:hover{background:var(--surface-2)}
.doc-name{color:var(--primary);text-decoration:none;font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-name:hover{text-decoration:underline}
.doc-type{font-size:10px;background:var(--surface-3,var(--surface-2));border:1px solid var(--border);border-radius:10px;padding:1px 8px;color:var(--text-muted);white-space:nowrap}
.doc-status-sel{font-size:10px;padding:1px 4px;border:1px solid var(--border);border-radius:5px;background:var(--surface-1);color:var(--text)}
.doc-size{color:var(--text-muted);font-size:11px;white-space:nowrap}
.doc-meta{color:var(--text-muted);font-size:11px;margin-left:auto;white-space:nowrap}
.doc-act{color:var(--text-muted);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:4px;text-decoration:none}
.doc-act:hover{color:var(--primary);background:var(--surface-3,var(--surface-2))}
.doc-del:hover{color:var(--danger-text)}

@media(max-width:700px){
  .page-body{padding:12px}
  .cost-tiles{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="btn btn-sm btn-secondary" href="/service-areas.html"><i class="fa-solid fa-arrow-left"></i></a>
    <span class="topbar-title" id="page-title"><i class="fa-solid fa-diagram-project"></i> Workspace</span>
  </div>
  <div class="topbar-right">
    <button class="btn-icon" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode">
      <i id="dm-icon" class="fa-solid fa-moon"></i>
    </button>
  </div>
</div>

<!-- Flash bar -->
<div class="flash-bar" id="flash-bar" role="status" aria-live="polite"></div>

<div class="page-body" id="page-body" role="main">
  <div class="loading-row"><span class="spinner"></span>Loading workspace…</div>
</div>

<script>
(function(){
'use strict';

var _id   = new URLSearchParams(location.search).get('id');
var _ws   = null;          // workspace response
var _rsel = 'all';         // selected route id or 'all'
var _mapView = 'route';    // 'route' | 'overview' (stub toggle)
var _expandedMat = {};     // materialId → bool (survive re-render)
var _expandedJob = {};     // jobId → bool

document.addEventListener('DOMContentLoaded', function(){
  applyTheme();
  if(!_id){
    document.getElementById('page-body').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>No area ID in URL — use ?id=&lt;uuid&gt;.</div>';
    return;
  }
  load();
});

// ── Load ──────────────────────────────────────────────────────────────────────
async function load(){
  try{
    var r = await api('/api/service-areas/'+encodeURIComponent(_id)+'/workspace');
    _ws = r;
    var _routes = _ws.routes||[];
    // single route → auto-select it; invalid selection → reset to 'all'
    if(_routes.length===1) _rsel = _routes[0].id;
    else if(_rsel !== 'all' && !_routes.find(function(x){ return x.id===_rsel; })) _rsel='all';
    render();
  } catch(e){
    var m = e.message||'Unknown error';
    if(m.indexOf('401')>-1||m.indexOf('403')>-1){
      document.getElementById('page-body').innerHTML = '<div class="empty-state"><i class="fa-solid fa-lock"></i>Login required.</div>';
    } else if(m.indexOf('404')>-1){
      document.getElementById('page-body').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Service area not found.</div>';
    } else {
      document.getElementById('page-body').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>'+esc(m)+'</div>';
    }
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  var ws = _ws;
  var area = ws.area;
  var routes = ws.routes||[];

  // Page title
  document.getElementById('page-title').innerHTML = '<i class="fa-solid fa-diagram-project"></i> '+esc(area.name||'Workspace');
  document.title = esc(area.name||'Workspace')+' — Launch Fiber';

  // Current view (jobs/materials/rollup for selected route or all)
  var view = currentView();

  document.getElementById('page-body').innerHTML =
    renderBreadcrumb(area)
    + renderAreaHead(area)
    + renderMapStub(routes)
    + renderRouteBar(routes, view, ws.finalized)
    + renderCostTiles(view.rollup, area, view.finalized)
    + renderMaterialsSection(view.materials, area, view.finalized)
    + renderJobsSection(view.jobs);

  bindAll();
}

function currentView(){
  var ws = _ws;
  if(_rsel==='all' || !ws.routes.length){
    return {
      jobs: flatJobs(),
      materials: flatMats(),
      rollup: ws.rollup,
      finalized: ws.finalized,
      routeId: null
    };
  }
  var rt = (ws.routes||[]).find(function(r){ return r.id===_rsel; });
  return rt ? {
    jobs: rt.jobs||[],
    materials: rt.materials||[],
    rollup: rt.rollup||{},
    finalized: !!rt.build_finalized_at,
    routeId: rt.id
  } : { jobs:[], materials:[], rollup:{}, finalized:false, routeId:null };
}

function flatJobs(){
  var all = [];
  (_ws.routes||[]).forEach(function(r){ (r.jobs||[]).forEach(function(j){ all.push(j); }); });
  (_ws.unrouted.jobs||[]).forEach(function(j){ all.push(j); });
  return all;
}
function flatMats(){
  var all = [];
  (_ws.routes||[]).forEach(function(r){ (r.materials||[]).forEach(function(m){ all.push(m); }); });
  (_ws.unrouted.materials||[]).forEach(function(m){ all.push(m); });
  return all;
}

// ── Sections ──────────────────────────────────────────────────────────────
function renderBreadcrumb(area){
  return '<div class="breadcrumb">'
    +'<a href="/service-areas.html"><i class="fa-solid fa-diagram-project"></i> Service Areas</a>'
    +' / <a href="/clients.html">'+esc(area.client_name||'—')+'</a>'
    +' / <strong>'+esc(area.name||'—')+'</strong>'
    +'</div>';
}

function lifecycleBadge(area){
  if(area.closed_at){
    return '<span class="badge" style="background:var(--success-light);color:var(--success-text);font-size:11px"><i class="fa-solid fa-archive" aria-hidden="true"></i> Final · Archived</span>';
  }
  if(area.build_finalized_at){
    return '<span class="badge" style="background:var(--primary-light);color:var(--primary-dark);font-size:11px"><i class="fa-solid fa-check-double" aria-hidden="true"></i> Completed</span>';
  }
  return '<span class="badge" style="background:var(--surface-1);color:var(--text-muted);font-size:11px"><i class="fa-solid fa-circle-play" aria-hidden="true"></i> Active</span>';
}

function renderAreaHead(area){
  var prog = area.program||'';
  var ecBadge = area.engineering_contract_id
    ? '<span class="badge badge-rus">RUS · EC '+esc(area.ec_name||'')+'</span>'
    : '<span class="badge badge-'+esc(prog||'prog')+'">'+esc((prog||'—').toUpperCase())+' · no EC</span>';
  var wo = area.work_order_number ? '<span>WO# '+esc(area.work_order_number)+'</span>' : '';
  return '<div class="area-head">'
    +'<div class="area-name" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+esc(area.name||'—')+lifecycleBadge(area)+'</div>'
    +'<div class="area-meta">'
    +'<span><i class="fa-solid fa-building" aria-hidden="true"></i> '+esc(area.client_name||'—')+'</span>'
    +ecBadge+wo
    +'</div>'
    +'</div>';
}

function renderMapStub(routes){ return renderMapHeader(routes, (_ws||{}).area||{}); }

function renderMapHeader(routes, area){
  var planLinked = area && area.map_plan_id;
  var planLabel = planLinked ? 'Plan: '+esc(area.map_plan_id) : 'No plan linked';
  return '<div class="sa-map-header">'
    +'<div class="sa-map-toolbar">'
    +'<i class="fa-solid fa-map" style="color:var(--primary);font-size:12px" aria-hidden="true"></i>'
    +'<span style="font-size:12px;font-weight:600;color:var(--text-secondary)" id="sa-map-label">'+planLabel+'</span>'
    +(planLinked ? '' : '<span style="font-size:11px;color:var(--text-muted)">&nbsp;— draw on the map to link a plan</span>')
    +(planLinked ? '<input id="sa-map-jump" type="text" placeholder="Jump to unit…" title="Type a unit name or ID to fly the map there" aria-label="Jump to map unit" style="font-size:12px;padding:3px 8px;border:1px solid var(--gray-border);border-radius:5px;background:var(--white);color:var(--text);width:140px;margin-left:8px">' : '')
    +'<div class="seg-ctrl" style="font-size:11px;margin-left:4px" id="sa-view-mode-ctrl" role="group" aria-label="View mode">'
    +'<button id="sa-vm-overall" class="active" onclick="saMapSetViewMode(\'overall\')" title="Show all data">Overall</button>'
    +'<button id="sa-vm-construction" onclick="saMapSetViewMode(\'construction\')" title="Construction only">Construction</button>'

function renderRouteBar(routes, view, areaFinalized){
  var hasRoutes = routes && routes.length>0;
  var multiRoute = routes && routes.length>1;
  var finBtnLabel = view.finalized
    ? '<i class="fa-solid fa-lock-open"></i> Reopen build'
    : '<i class="fa-solid fa-check-double"></i> Finalize build';
  var finBtnCls = view.finalized ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-primary';

  var seg = '';
  if(hasRoutes){
    seg = '<div class="seg-ctrl" role="tablist" aria-label="Route selector">';
    // "All routes" tab only when more than one route exists
    if(multiRoute){
      seg += '<button role="tab" data-route="all" class="'+(_rsel==='all'?'active':'')+'" aria-selected="'+(_rsel==='all'?'true':'false')+'">All routes</button>';
    }
    routes.forEach(function(r){
      var dot = r.build_finalized_at?'complete':r.status||'planned';
      seg += '<button role="tab" data-route="'+esc(r.id)+'" class="'+(_rsel===r.id?'active':'')+'" aria-selected="'+(_rsel===r.id?'true':'false')+'"><span class="route-status-dot dot-'+esc(dot)+'" aria-hidden="true"></span>'+esc(r.name||'Route')+'</button>';
    });
    seg += '</div>';
  }

  // Mark final / Reopen (= archive lifecycle stage)
  var areaFinal = !!_ws.area.closed_at;
  var closeBtnLabel = areaFinal
    ? '<i class="fa-solid fa-lock-open"></i> Reopen'
    : '<i class="fa-solid fa-archive"></i> Mark final';
  var closeBtnCls = areaFinal ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-secondary';
  var closeBtnTitle = areaFinal ? 'Remove final/archive status' : 'Mark area as fully done and archived';

  return '<div class="route-bar">'
    +seg
    +'<div class="finalize-btn-area">'
    +'<button class="'+finBtnCls+'" id="finalize-btn">'+finBtnLabel+'</button>'
    +'<button class="'+closeBtnCls+'" id="close-btn" title="'+esc(closeBtnTitle)+'" style="'+(areaFinal?'border-color:var(--success);color:var(--success-text)':'')+'">'
    +closeBtnLabel+'</button>'
    +'</div>'
    +'</div>';
}

function renderCostTiles(rollup, area, finalized){
  var cvm = area.client_visible_metrics||{};
  var pct = rollup.progress_pct;
  var pctDisplay = finalized ? 'Complete' : (pct!=null ? pct+'%' : '—');

  function tile(domId, key, label, val, sub){
    var checked = cvm[key]!==false;
    var dim = !checked;
    return '<div id="'+domId+'" class="cost-tile'+(dim?' dim':'')+'">'
      +'<div class="lbl">'+label+'</div>'
      +'<div class="val amt">'+val+'</div>'
      +(sub?'<div class="sub">'+sub+'</div>':'')
      +'<label class="vis-check" title="Show this tile to the client in their portal">'
      +'<input type="checkbox" data-vis="'+key+'"'+(checked?' checked':'')+' aria-label="Show '+label+' to client">'
      +'<i class="fa-solid fa-'+(checked?'eye':'eye-slash')+'" aria-hidden="true"></i> Show to client'
      +'</label>'
      +'</div>';
  }

  return '<div class="cost-tiles">'
    +tile('tile-progress',     'progress',          'Progress',         pctDisplay,                         finalized?'Build finalized':'Overall completion')
    +tile('tile-engineering',  'engineering_cost',  'Engineering',      fmtMoney(rollup.engineering_cost),  'labor & overhead')
    +tile('tile-construction', 'construction_cost', 'Construction',     fmtMoney(rollup.construction_cost), 'labor + materials')
    +tile('tile-total',        'total_cost',        'Total Cost',       fmtMoney(rollup.total_cost),        'engineering + construction')
    +'</div>';
}

function renderMatRow(m, finalized){
  var exp  = parseInt(m.quantity)||0;
  var comp = parseInt(m.completed_quantity)||0;
  var rem  = Math.max(0, exp-comp);
  var pct  = exp>0 ? Math.min(100, Math.round(comp/exp*100)) : 0;
  var srcBadge = m.source==='map' ? '<span class="badge badge-map">map</span>'
               : m.source==='bom_csv' ? '<span class="badge badge-bom">BOM</span>'
               : '<span class="badge badge-manual">manual</span>';
  var progCell = finalized
    ? '<span class="badge badge-final">Final build</span>'
    : '<div class="prog-track" aria-label="'+pct+'% complete" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><div class="prog-fill'+(pct>=100?' done':'')+'" style="width:'+pct+'%"></div></div><span style="font-size:11px;color:var(--text-muted);margin-left:4px">'+pct+'%</span>';
  var hasUnits = parseInt(m.unit_count)||0;
  var expandCls = _expandedMat[m.id]?'expanded':'';
  return '<tr class="clickable-row mat-row '+expandCls+'" data-mat-id="'+esc(m.id)+'"'
    +(m.map_feature_ref?' data-elem-ref="'+esc(m.map_feature_ref)+'"':'')+' tabindex="'+(m.map_feature_ref?'0':'-1')+'">'
    +'<td>'+srcBadge+' '+esc(m.item||'—')+(m.map_feature_ref?'<span style="font-size:10px;color:var(--text-muted);margin-left:4px">ref:'+esc(m.map_feature_ref)+'</span>':'')+'</td>'
    +'<td>'+esc(m.unit||'—')+'</td>'
    +'<td class="num amt">'+fmtMoney(m.unit_cost)+'</td>'
    +'<td class="num">'+exp+'</td>'
    +'<td class="num">'+comp+'</td>'
    +'<td class="num">'+rem+'</td>'
    +'<td style="display:flex;align-items:center;gap:6px;min-width:120px">'
    +progCell
    +(hasUnits?'<span class="expand-btn" aria-hidden="true"><i class="fa-solid fa-chevron-right" style="font-size:10px"></i></span>':'')
    +'</td>'
    +'</tr>';
}

// A "project" with documents = an engineering job (design/permitting/inspection,
// or anything explicitly tagged engineering). Documents live on these.
function isEngJob(j){ return j.cost_category==='engineering' || ['permitting','design','inspection'].indexOf(j.team)>=0; }

function renderJobRow(j){
  var stKey = (j.status||'not_started').replace(/[^a-z_]/g,'');
  var stLabel = (j.status||'not started').replace(/_/g,' ');
  var hasExpand = (j.people&&j.people.length)||(j.notes)||(j.start_date||j.completed_date)||isEngJob(j);
  var expandCls = _expandedJob[j.id]?'expanded':'';
  var isVarious = j.employee_label&&j.employee_label.indexOf('Various')===0;
  return '<tr class="'+(hasExpand?'clickable-row ':'')+' job-row '+expandCls+'" data-job-id="'+esc(j.id)+'" data-category="'+esc(j.cost_category||'')+'" '+(hasExpand?'tabindex="0" role="button" aria-expanded="'+(!!_expandedJob[j.id])+'"':'')+'>'
    +'<td>'
    +'<div>'+esc(j.label||j.job_name||j.team||'—')+'</div>'
    +(j.cost_category?'<div class="cost-cat">'+esc(j.cost_category)+'</div>':'')
    +'</td>'
    +'<td>'+(isVarious?'<span style="color:var(--primary);cursor:pointer">':'')+esc(j.employee_label||'—')+(isVarious?'</span>':'')
    +(hasExpand?'<span class="expand-btn" aria-hidden="true" style="margin-left:6px"><i class="fa-solid fa-chevron-right" style="font-size:10px"></i></span>':'')
    +'</td>'
    +'<td>'+esc(j.billing_type||'—')+'</td>'
    +'<td class="num">'+fmtHours(j.actual_hours)+'</td>'
    +'<td class="num amt">'+fmtMoney(j.actual_amount)+'</td>'
    +'<td><span class="st-pill st-'+esc(stKey)+'">'+esc(stLabel)+'</span></td>'
    +'</tr>';

function renderJobExpand(j){
  var parts = [];
  if(j.people&&j.people.length){
    var prows = j.people.map(function(p){
      return '<div class="person-row">'
        +'<span class="pname">'+esc(p.name||'—')+'</span>'
        +'<span>'+fmtHours(p.hours)+'h</span>'
        +(p.amount!=null?'<span class="amt">'+fmtMoney(p.amount)+'</span>':'')
        +'</div>';
    }).join('');
    parts.push('<div class="people-list">'+prows+'</div>');
  }
  if(j.notes) parts.push('<div class="note-block">'+esc(j.notes)+'</div>');
  if(j.start_date||j.completed_date){
    var dparts = [];
    if(j.start_date) dparts.push('<span>Started: '+esc(j.start_date.slice?j.start_date.slice(0,10):j.start_date)+'</span>');
    if(j.completed_date) dparts.push('<span>Completed: '+esc(j.completed_date.slice?j.completed_date.slice(0,10):j.completed_date)+'</span>');
    parts.push('<div class="dates-block">'+dparts.join('')+' <span style="opacity:.6">· from hours import</span></div>');
  }
  // R17 B4: location/draw controls for permitting + design jobs
  var isProject = j.team==='permitting'||j.team==='design';
  if(isProject){
    var hasGeo = !!(j.geometry);
    var locInfo = hasGeo
      ? '<span style="color:var(--text-muted);font-size:11px"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i> '
        +(j.footage!=null?j.footage+' ft':'')+' '+(j.miles!=null?'/ '+j.miles+' mi':'')+'</span>'
      : '<span style="color:var(--text-muted);font-size:11px;font-style:italic">No location</span>';
    parts.push('<div class="dates-block" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +locInfo
      +'<button class="btn btn-sm btn-secondary" style="font-size:11px" onclick="reDrawProjectLine('+esc(JSON.stringify(j.id))+')">'
      +'<i class="fa-solid fa-pencil"></i> '+(hasGeo?'Re-draw line':'Draw line')+'</button>'
      +(hasGeo?'<button class="btn btn-sm btn-secondary" style="font-size:11px" onclick="clearProjectLine('+esc(JSON.stringify(j.id))+')"><i class="fa-solid fa-xmark"></i> Clear</button>':'')
      +'</div>');
  }
  // Phase C: documents on engineering projects (PDF/DWG, status tags, up to 2 GB).
  if(isEngJob(j)){
    parts.push(renderJobDocsBlock(j.id));
  }
  return '<tr class="expand-row" id="job-expand-'+esc(j.id)+'"><td colspan="6">'+parts.join('')+'</td></tr>';
}

// ── Bind events ───────────────────────────────────────────────────────────
function bindAll(){
  // SA map header (R15.2)
  ensureLeafletForArea(initSaMap);

  // Route selector
  document.querySelectorAll('[data-route]').forEach(function(btn){
    btn.addEventListener('click', function(){
      _rsel = btn.dataset.route;
      render();
    });
  });

  // Finalize button
  var fb = document.getElementById('finalize-btn');
  if(fb) fb.addEventListener('click', function(){
    var view = currentView();
    doFinalize(!view.finalized, view.routeId);
  });

  // Mark final / Reopen button (lifecycle close = archive)
  var cb = document.getElementById('close-btn');
  if(cb) cb.addEventListener('click', function(){
    doClose(!_ws.area.closed_at, currentView().routeId);
  });

  // Client visible checkboxes
  document.querySelectorAll('[data-vis]').forEach(function(cb){
    cb.addEventListener('change', function(){
      toggleMetric(cb.dataset.vis, cb.checked);
    });
  });

  // Add material
  var showAddBtn = document.getElementById('show-add-mat');
  if(showAddBtn) showAddBtn.addEventListener('click', function(){
    var row = document.getElementById('add-mat-row');
    if(row){ row.style.display=''; document.getElementById('am-item').focus(); }
  });
  var saveMatBtn = document.getElementById('am-save');
  if(saveMatBtn) saveMatBtn.addEventListener('click', saveAddMaterial);
  var cancelMatBtn = document.getElementById('am-cancel');
  if(cancelMatBtn) cancelMatBtn.addEventListener('click', function(){
    var row = document.getElementById('add-mat-row');
    if(row) row.style.display='none';
  });

  // Material row expand (units)
  document.querySelectorAll('.mat-row').forEach(function(tr){
    tr.addEventListener('click', function(){
      var mid = tr.dataset.matId;
      if(!mid) return;
      var mat = findMat(mid);
      if(!mat || !(parseInt(mat.unit_count)||0)) return;
      _expandedMat[mid] = !_expandedMat[mid];
      render();
      if(_expandedMat[mid]) loadUnits(mid);
    });
    tr.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tr.click(); }
    });
  });

  // Job row expand
  document.querySelectorAll('.job-row[tabindex]').forEach(function(tr){
    tr.addEventListener('click', function(){
      var jid = tr.dataset.jobId;
      if(!jid) return;
      _expandedJob[jid] = !_expandedJob[jid];
      render();
    });
    tr.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tr.click(); }
    });
  });

  // Phase C: lazy-load documents for any expanded engineering project.
  document.querySelectorAll('.job-docs-block[data-docs-job]:not([data-loaded])').forEach(function(el){
    el.setAttribute('data-loaded','1');
    loadJobDocs(el.getAttribute('data-docs-job'));
  });

  // Restore unit rows (re-render wipes them, re-fetch)
  Object.keys(_expandedMat).forEach(function(mid){
    if(_expandedMat[mid]) loadUnits(mid);
  });

  // R15.3 — Bidirectional row↔pin hover + click-to-fly on material rows with map_feature_ref
  document.querySelectorAll('.mat-row[data-elem-ref]').forEach(function(tr) {
    var eid = tr.dataset.elemRef;
    tr.addEventListener('mouseenter', function() { saMapHighlightElem(eid, true); });
    tr.addEventListener('mouseleave', function() { saMapHighlightElem(eid, false); });
    tr.addEventListener('click', function() { saMapFlyToElem(eid); });
    tr.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); saMapFlyToElem(eid); }
    });
  });

  // R15.3 — Jump-to-unit input
  var jumpInput = document.getElementById('sa-map-jump');
  if (jumpInput) {
    jumpInput.addEventListener('input', function() {
      var q = this.value.trim().toLowerCase();
      if (!q || !_saMapLeaflet) return;
      var found = null;
      Object.values(_saMapMarkersById).some(function(entry) {
        var d = entry.data;
        var name = (d.name || '').toLowerCase();
        var sid  = (d.structureId || '').toLowerCase();
        var pid  = (d.id || '').toLowerCase();
        if (name.indexOf(q) !== -1 || sid.indexOf(q) !== -1 || pid.indexOf(q) !== -1) {
          found = entry; return true;
        }
      });
      if (found && found.data.lat != null) {
        _saMapLeaflet.flyTo([found.data.lat, found.data.lng], 18, { duration: 0.5 });
        setTimeout(function() { found.marker.openPopup(); }, 550);
        saMapHighlightElem(found.data.id, true);
        setTimeout(function() { saMapHighlightElem(found.data.id, false); }, 2000);
      }
    });
    jumpInput.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { this.value = ''; this.blur(); }
    });
  }

  // R15.3 — Re-apply layer toggle state after re-render
  var cBtn = document.getElementById('sa-map-constr-btn');
  var eBtn = document.getElementById('sa-map-eng-btn');
  if (cBtn) cBtn.classList.toggle('active', _saMapLayer === 'construction');
  if (eBtn) eBtn.classList.toggle('active', _saMapLayer === 'engineering');
}

function ensureLeafletForArea(cb) {
  if (typeof L !== 'undefined') { cb(); return; }
  ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css']
  .forEach(function(href){ var l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l); });
  function loadSc(src, next){ var s=document.createElement('script');s.src=src;s.onload=next;document.head.appendChild(s); }
  loadSc('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', cb);
}

function initSaMap() {
  var area = (_ws || {}).area;
  if (!area) return;
  _saMapArea = area;

  var el = document.getElementById('sa-map-leaflet');
  if (!el) return;

  // Destroy and recreate if container was replaced by a re-render
  if (_saMapLeaflet) {
    try { _saMapLeaflet.remove(); } catch (_) {}
    _saMapLeaflet = null;
  }
  _saMapLayerBnd = _saMapLayerPts = _saMapLayerSegs = null;

  var center = (area.center_lat != null && area.center_lng != null)
    ? [area.center_lat, area.center_lng]
    : [32.8407, -83.6324];

  _saMapLeaflet = L.map('sa-map-leaflet', { center: center, zoom: 14 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 20,
  }).addTo(_saMapLeaflet);

  // Boundary
  if (area.boundary) {
    try {
      var bndry = typeof area.boundary === 'string' ? JSON.parse(area.boundary) : area.boundary;
      _saMapLayerBnd = L.geoJSON(bndry, {
        style: { color: '#1B5FA0', weight: 2.5, fillOpacity: 0.08, opacity: 0.7 }
      }).addTo(_saMapLeaflet);
      _saMapLeaflet.fitBounds(_saMapLayerBnd.getBounds(), { padding: [24, 24] });
    } catch (_) {}
  }

  // Plan data
  if (area.map_plan_id) loadSaPlanData(area.map_plan_id);

  // R17 B4: render any project lines (permitting/design jobs with geometry)
  plotProjectLines();
}

async function loadSaPlanData(planId) {
  if (!_saMapLeaflet) return;
  try {
    var [ptsR, segR] = await Promise.all([
      fetch('/api/map/store/' + encodeURIComponent('frm_pts_' + planId), { credentials: 'include' }).then(function(r){ return r.ok ? r.json() : null; }),
      fetch('/api/map/store/' + encodeURIComponent('frm_segs_' + planId), { credentials: 'include' }).then(function(r){ return r.ok ? r.json() : null; }),
    ]);
    var pts  = (ptsR  && ptsR.value)  ? JSON.parse(ptsR.value)  : {};
    var segs = (segR  && segR.value)  ? JSON.parse(segR.value)   : {};
    plotSaPlanElements(pts, segs);
  } catch (e) { console.error('[sa-map] plan load failed', e); }
}

function planElemColor(status) {
  if (status === 'asBuilt' || status === 'active' || status === 'existing') return '#28A745';
  if (status === 'underConstruction') return '#FF9800';
  if (status === 'permitted') return '#1B5FA0';
  return '#9BA1A8';
}

function plotSaPlanElements(pts, segs) {
  if (!_saMapLeaflet) return;
  if (_saMapLayerPts)  { _saMapLeaflet.removeLayer(_saMapLayerPts);  }
  if (_saMapLayerSegs) { _saMapLeaflet.removeLayer(_saMapLayerSegs); }

  _saMapLayerPts  = L.layerGroup();
  _saMapLayerSegs = L.layerGroup();
  _saMapMarkersById = {};
  _saMapSegsById    = {};

  Object.values(pts || {}).forEach(function(p) {
    if (p.lat == null || p.lng == null) return;
    var color = planElemColor(p.status);
    var icon = L.divIcon({
      className: '',
      html: '<div data-elem-id="' + esc(p.id||'') + '" style="width:10px;height:10px;border-radius:50%;background:' + color
        + ';border:1.5px solid rgba(0,0,0,.2);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s"></div>',
      iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -7],
    });
    var m = L.marker([p.lat, p.lng], { icon: icon });
    m.bindPopup(saMapElemPopup(p), { minWidth: 160 });
    m.options._elemId = p.id;
    m.on('click', function() { saMapElemClick(p); });
    // Wire map→row hover for bidirectional linking
    m.on('mouseover', function() { saMapHighlightElem(p.id, true); });
    m.on('mouseout',  function() { saMapHighlightElem(p.id, false); });
    _saMapLayerPts.addLayer(m);
    if (p.id) _saMapMarkersById[p.id] = { marker: m, data: p, color: color };
  });

  Object.values(segs || {}).forEach(function(s) {
    if (!s.path || !s.path.length) return;
    var color = planElemColor(s.status);
    var pl = L.polyline(s.path, { color: color, weight: 3, opacity: 0.75 });
    pl.bindPopup(saMapSpanPopup(s), { minWidth: 160 });
    pl.options._elemId = s.id;
    _saMapLayerSegs.addLayer(pl);
    if (s.id) _saMapSegsById[s.id] = { polyline: pl, data: s };
  });

  // Respect current layer toggle
  if (_saMapLayer === 'construction') {
    _saMapLayerPts.addTo(_saMapLeaflet);
    _saMapLayerSegs.addTo(_saMapLeaflet);
  }

  // Fit to elements if no boundary set
  if (!_saMapLayerBnd) {
    try {
      var group = L.featureGroup([_saMapLayerPts, _saMapLayerSegs]);
      if (group.getLayers().length) _saMapLeaflet.fitBounds(group.getBounds(), { padding: [24, 24] });
    } catch (_) {}
  }
}

  return '<div style="font-size:12px">'

    + '<div style="color:#666;font-size:11px">' + esc(p.ptype || '') + ' · ' + esc(p.status || 'proposed') + '</div>'
    + (p.structureId ? '<div style="font-size:10px;color:#888">ID: ' + esc(p.structureId) + '</div>' : '')

function ensureLeafletDraw(cb) {
  if (typeof L !== 'undefined' && typeof L.Draw !== 'undefined') { cb(); return; }
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css';
  document.head.appendChild(link);
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js';
  s.onload = cb;
  document.head.appendChild(s);
}

function convexHullPts(pts) {
  if (pts.length < 3) return pts.slice();
  // Jarvis march (gift wrapping)
  var n = pts.length;
  var startIdx = 0;
  for (var i = 1; i < n; i++) if (pts[i].lng < pts[startIdx].lng) startIdx = i;
  var hull = [], cur = startIdx;
  do {
    hull.push(pts[cur]);
    var next = (cur + 1) % n;
    for (var j = 0; j < n; j++) {
      var ox = pts[next].lng - pts[cur].lng, oy = pts[next].lat - pts[cur].lat;
      var px = pts[j].lng  - pts[cur].lng, py = pts[j].lat  - pts[cur].lat;
      if (ox * py - oy * px < 0) next = j;
    }
    cur = next;
  } while (cur !== startIdx && hull.length <= n);
  return hull;
}

function saMapBndSetDrawLayer(layer) {
  if (_saMapBndLayer) _saMapBndItems.removeLayer(_saMapBndLayer);
  _saMapBndLayer = layer;
  _saMapBndItems.addLayer(_saMapBndLayer);
  // Enable vertex editing on the new layer
  if (_saMapBndEditH) { try { _saMapBndEditH.disable(); } catch(_){} }
  _saMapBndEditH = new L.EditToolbar.Edit(_saMapLeaflet, { featureGroup: _saMapBndItems });
  _saMapBndEditH.enable();
  var drawBtn = document.getElementById('sa-map-bnd-draw-btn');
  if (drawBtn) drawBtn.innerHTML = '<i class="fa-solid fa-pen"></i> Redraw';
}

function saMapBndUpdateUI(show) {

  if (bar) bar.style.display = show ? 'flex' : 'none';
  var bndBtn = document.getElementById('sa-map-bnd-btn');

      : '<i class="fa-solid fa-draw-polygon"></i> Boundary';

    if (editBtn) editBtn.disabled = show;

}

function saMapBndExit() {
  _saMapBndMode = false;
  _saMapBndHandler = null;
  _saMapBndEditH   = null;
  _saMapBndItems   = null;
  _saMapBndLayer   = null;
  saMapBndUpdateUI(false);
}

window.saMapToggleBnd = function() {
  if (_saMapInEdit) { flash('Switch to View mode first', 'err'); return; }
  if (_saMapBndMode) { saMapBndCancel(); return; }
  // Ensure Leaflet is loaded and the map is initialised before proceeding
  ensureLeafletForArea(function() {
    if (!_saMapLeaflet) initSaMap();
    if (!_saMapLeaflet) { flash('Map not ready — reload the page', 'err'); return; }
    ensureLeafletDraw(doToggleBnd);
  });
};
function doToggleBnd() {
    _saMapBndMode = true;
    _saMapBndOrig = ((_ws || {}).area || {}).boundary || null;

    // Feature group to hold the boundary polygon
    _saMapBndItems = new L.FeatureGroup();
    _saMapLeaflet.addLayer(_saMapBndItems);

    // If an existing boundary exists, add it as editable
    if (_saMapLayerBnd) {
      _saMapLeaflet.removeLayer(_saMapLayerBnd);
      var existing = _saMapBndOrig;
      if (existing) {
        try {
          var geo = typeof existing === 'string' ? JSON.parse(existing) : existing;
          // Leaflet.draw editable works on L.Polygon, not L.geoJSON directly
          var ring = geo.coordinates ? geo.coordinates[0] : (geo.geometry ? geo.geometry.coordinates[0] : null);
          if (ring) {
            var latlngs = ring.map(function(c){ return [c[1], c[0]]; });
            var poly = L.polygon(latlngs, { color: '#1B5FA0', weight: 2.5, fillOpacity: 0.12 });
            saMapBndSetDrawLayer(poly);
          }
        } catch(_) {}
      }
    }

    saMapBndUpdateUI(true);
    flash('Boundary edit mode — draw or adjust the polygon, then save');
}

window.saMapBndStartDraw = function() {
  if (!_saMapLeaflet || !_saMapBndMode) return;
  if (_saMapBndEditH) { try { _saMapBndEditH.disable(); } catch(_){} _saMapBndEditH = null; }
  if (_saMapBndHandler) { try { _saMapBndHandler.disable(); } catch(_){} }
  _saMapBndHandler = new L.Draw.Polygon(_saMapLeaflet, {
    shapeOptions: { color: '#1B5FA0', weight: 2.5, fillOpacity: 0.12 },
    showArea: false,
  });
  _saMapBndHandler.enable();
  _saMapLeaflet.once('draw:created', function(e) {
    _saMapBndHandler = null;
    saMapBndSetDrawLayer(e.layer);
  });
  flash('Click to add vertices — double-click to close polygon');
};

window.saMapBndHull = function() {
  if (!_saMapLeaflet || !_saMapBndMode) return;
  var pts = Object.values(_saMapMarkersById)
    .map(function(e){ return e.data; })
    .filter(function(d){ return d.lat != null && d.lng != null; });
  if (pts.length < 3) { flash('Need at least 3 plan units to auto-suggest a boundary', 'err'); return; }
  var hull = convexHullPts(pts);
  var latlngs = hull.map(function(p){ return [p.lat, p.lng]; });
  var poly = L.polygon(latlngs, { color: '#1B5FA0', weight: 2.5, fillOpacity: 0.12 });
  saMapBndSetDrawLayer(poly);
  _saMapLeaflet.fitBounds(poly.getBounds(), { padding: [32, 32] });
  flash('Hull drawn from ' + pts.length + ' units — drag vertices to adjust');
};

window.saMapBndSave = async function() {
  if (!_saMapBndMode || !_saMapBndItems) return;
  var layers = [];
  _saMapBndItems.eachLayer(function(l){ layers.push(l); });
  if (!layers.length) { flash('Draw a boundary polygon first', 'err'); return; }

  // Commit any in-progress edits before reading geometry
  if (_saMapBndEditH) { try { _saMapBndEditH.save(); _saMapBndEditH.disable(); } catch(_){} }

  var layer = layers[0];
  var geo = layer.toGeoJSON();
  var coords = geo.geometry && geo.geometry.coordinates && geo.geometry.coordinates[0];
  if (!coords || coords.length < 3) { flash('Invalid boundary polygon', 'err'); return; }

  // Center = average of ring coords (exclude closing duplicate)
  var ring = coords[coords.length-1][0]===coords[0][0] && coords[coords.length-1][1]===coords[0][1]
    ? coords.slice(0,-1) : coords;
  var avgLat = ring.reduce(function(s,c){return s+c[1];},0)/ring.length;
  var avgLng = ring.reduce(function(s,c){return s+c[0];},0)/ring.length;

  try {
    await api('/api/service-areas/'+encodeURIComponent(_id)+'/boundary','PUT',{
      boundary: geo.geometry,
      center_lat: Math.round(avgLat*1e6)/1e6,
      center_lng: Math.round(avgLng*1e6)/1e6,
    });
    // Update local workspace state so cancel restores the new boundary
    if (_ws && _ws.area) {
      _ws.area.boundary   = geo.geometry;
      _ws.area.center_lat = avgLat;
      _ws.area.center_lng = avgLng;
    }
    // Exit boundary mode + re-draw the saved boundary on the map
    if (_saMapBndItems) { _saMapLeaflet.removeLayer(_saMapBndItems); }
    saMapBndExit();
    _saMapLayerBnd = L.geoJSON(geo.geometry, {
      style: { color:'#1B5FA0', weight:2.5, fillOpacity:0.08, opacity:0.7 }
    }).addTo(_saMapLeaflet);
    flash('Boundary saved');
  } catch(e) {
    flash(e.message||'Failed to save boundary','err');
    // Re-enable edit so user can try again
    if (_saMapBndItems && _saMapBndLayer) {
      _saMapBndEditH = new L.EditToolbar.Edit(_saMapLeaflet, { featureGroup: _saMapBndItems });
      _saMapBndEditH.enable();
    }
  }
};

window.saMapBndCancel = function() {
  if (_saMapBndHandler) { try { _saMapBndHandler.disable(); } catch(_){} }
  if (_saMapBndEditH)   { try { _saMapBndEditH.disable();   } catch(_){} }
  if (_saMapBndItems && _saMapLeaflet) { _saMapLeaflet.removeLayer(_saMapBndItems); }
  // Restore original boundary
  if (_saMapBndOrig && _saMapLeaflet) {
    try {
      var geo = typeof _saMapBndOrig === 'string' ? JSON.parse(_saMapBndOrig) : _saMapBndOrig;
      _saMapLayerBnd = L.geoJSON(geo, {
        style:{ color:'#1B5FA0', weight:2.5, fillOpacity:0.08, opacity:0.7 }
      }).addTo(_saMapLeaflet);
    } catch(_){}
  }
  saMapBndExit();
};

window.saMapDragStart = function(e) {

function findMat(mid){
  var all = flatMats();
  for(var i=0;i<all.length;i++) if(all[i].id===mid) return all[i];
  return null;

// ── Add material ──────────────────────────────────────────────────────────
async function saveAddMaterial(){

  var unit = (document.getElementById('am-unit')||{}).value;

// ── Client visible metrics ────────────────────────────────────────────────
async function toggleMetric(key, val){
  var area = _ws.area;
  var cvm = Object.assign({}, area.client_visible_metrics||{});
  cvm[key] = val;
  // optimistic update
  area.client_visible_metrics = cvm;
  render();
  try{
    await api('/api/service-areas/'+encodeURIComponent(_id),'PUT',{ client_visible_metrics: cvm });
    flash(val ? key.replace(/_/g,' ')+' now visible to client' : key.replace(/_/g,' ')+' hidden from client');
  } catch(e){
    cvm[key] = !val;
    area.client_visible_metrics = cvm;
    render();
    flash(e.message||'Failed to update visibility','err');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function fmtMoney(n){
  if(n==null||n===''||isNaN(parseFloat(n))) return '<span class="dim-val">—</span>';
  return '$'+Math.round(Number(n)).toLocaleString('en-US');
}
function fmtHours(n){
  var h = parseFloat(n)||0;
  return h.toFixed(1);
}

var _flashTimer = null;
function flash(msg, type){
  var bar = document.getElementById('flash-bar');
  if(!bar) return;
  bar.textContent = msg;
  bar.className = 'flash-bar show'+(type==='err'?' err':'');
  clearTimeout(_flashTimer);
  _flashTimer = setTimeout(function(){ bar.classList.remove('show'); }, 3500);
}

async function api(path, method, body){
  var opts = { credentials:'include', headers:{ 'Content-Type':'application/json' } };
  if(method) opts.method = method;
  if(body!=null) opts.body = JSON.stringify(body);
  var r = await fetch(path, opts);
  if(!r.ok){
    var txt = '';
    try{ var j=await r.json(); txt=j.error||j.message||''; } catch(e2){ txt=await r.text().catch(function(){return '';}); }
    throw new Error(r.status+(txt?' — '+txt:''));
  }
  if(r.status===204||r.headers.get('content-length')==='0') return null;
  return r.json();
}

// ── R17 B4: Project line draw/re-draw on the SA detail map ──────────────────

var _projLineState = {};  // jobId → L.Polyline

function haversineAreaFt(lat1, lng1, lat2, lng2) {
  var R = 20902231;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2)
    + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcFootageArea(latlngs) {
  var ft = 0;
  for (var i = 1; i < latlngs.length; i++)
    ft += haversineAreaFt(latlngs[i-1][0], latlngs[i-1][1], latlngs[i][0], latlngs[i][1]);
  return Math.round(ft);
}

function plotProjectLines() {
  if (!_saMapLeaflet || !_ws) return;
  // Clear old project lines
  Object.keys(_projLineState).forEach(function(jid) {
    try { _saMapLeaflet.removeLayer(_projLineState[jid]); } catch(_){}
  });
  _projLineState = {};
  // Gather all jobs from workspace
  var allJobs = [];
  (_ws.routes||[]).forEach(function(r){ (r.jobs||[]).forEach(function(j){ allJobs.push(j); }); });
  ((_ws.unrouted||{}).jobs||[]).forEach(function(j){ allJobs.push(j); });
  allJobs.forEach(function(j) {
    if (!j.geometry) return;
    var isProject = j.team==='permitting'||j.team==='design';
    if (!isProject) return;
    var color = j.team==='permitting' ? '#28A745' : '#1565C0';
    try {
      var geo = typeof j.geometry==='string' ? JSON.parse(j.geometry) : j.geometry;
      var latlngs = Array.isArray(geo) ? geo : (geo.coordinates||[]).map(function(c){return [c[1],c[0]];});
      var polyline = L.polyline(latlngs, { color: color, weight: 3, opacity: 0.8 })
        .bindTooltip(esc(j.label||j.job_name||j.team||'Project'), { sticky: true, direction: 'top' })
        .addTo(_saMapLeaflet);
      _projLineState[j.id] = polyline;
    } catch(_){}
  });
}

var _reDrawJobId   = null;
var _reDrawHandler = null;

window.reDrawProjectLine = function(jobId) {
  ensureLeafletForArea(function() {
    if (!_saMapLeaflet) initSaMap();
    if (!_saMapLeaflet) { flash('Map not ready — reload the page', 'err'); return; }
    ensureLeafletDraw(function() {
      _reDrawJobId = jobId;
      if (_reDrawHandler) { try { _reDrawHandler.disable(); } catch(_){} }
      _reDrawHandler = new L.Draw.Polyline(_saMapLeaflet, {
        shapeOptions: { color: '#E65100', weight: 3, opacity: 0.9 }
      });
      _reDrawHandler.enable();
      flash('Click vertices to draw the project line — double-click to finish');
      _saMapLeaflet.once('draw:created', function(e) {
        _reDrawHandler = null;
        var latlngs = e.layer.getLatLngs().map(function(ll){ return [ll.lat, ll.lng]; });
        var footage  = calcFootageArea(latlngs);
        var miles    = Math.round(footage / 5280 * 100) / 100;
        reDrawSave(jobId, latlngs, footage, miles);
      });
    });
  });
};

async function reDrawSave(jobId, latlngs, footage, miles) {
  try {
    var r = await fetch('/api/service-area-jobs/' + encodeURIComponent(jobId), {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ geometry: latlngs, footage: footage, miles: miles })
    });
    if (!r.ok) { var err = await r.json(); throw new Error(err.error || 'HTTP '+r.status); }
    // Refresh workspace
    var r2 = await api('/api/service-areas/'+encodeURIComponent(_id)+'/workspace');
    _ws = r2; render();
    flash(footage + ' ft / ' + miles + ' mi saved');
  } catch(e) { flash(e.message||'Failed to save line', 'err'); }
}

window.clearProjectLine = async function(jobId) {
  try {
    var r = await fetch('/api/service-area-jobs/' + encodeURIComponent(jobId), {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ geometry: null, footage: null, miles: null })
    });
    if (!r.ok) { var err = await r.json(); throw new Error(err.error || 'HTTP '+r.status); }
    var r2 = await api('/api/service-areas/'+encodeURIComponent(_id)+'/workspace');
    _ws = r2; render();
    flash('Location cleared');
  } catch(e) { flash(e.message||'Failed to clear', 'err'); }
};

// ── Phase C: project documents (PDF/DWG, status tags, up to 2 GB) ───────────

var DOC_TYPES = [
  ['permit_application','Permit Application'],
  ['approved_permit','Approved Permit'],
  ['plan_dwg','Plan (DWG)'],
  ['plan_pdf','Plan (PDF)'],
  ['final_dwg','Final DWG'],
  ['final_pdf','Final PDF'],
  ['correspondence','Correspondence'],
  ['document','Other'],
];
var DOC_STATUSES = ['Draft','Submitted','In Review','Approved','Final'];
function docTypeLabel(v){ for(var i=0;i<DOC_TYPES.length;i++){ if(DOC_TYPES[i][0]===v) return DOC_TYPES[i][1]; } return v||'Document'; }
function fmtBytes(n){ n=Number(n)||0; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; if(n<1073741824) return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; }

// The expand-row block. Contents are filled by loadJobDocs once mounted.
function renderJobDocsBlock(jobId){
  var typeOpts = DOC_TYPES.map(function(t){ return '<option value="'+esc(t[0])+'">'+esc(t[1])+'</option>'; }).join('');
  var statusOpts = '<option value="">No status</option>'+DOC_STATUSES.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('');
  var jid = esc(JSON.stringify(jobId));
  return '<div class="job-docs-block" data-docs-job="'+esc(jobId)+'">'
    +'<div class="docs-head"><i class="fa-solid fa-folder-open" style="color:var(--primary)"></i> Documents'
      +'<button class="btn btn-sm btn-secondary" style="font-size:11px;margin-left:auto" onclick="toggleDocUpload('+jid+')"><i class="fa-solid fa-upload"></i> Upload</button>'
    +'</div>'
    +'<div class="doc-upload" data-docs-up="'+esc(jobId)+'" style="display:none">'
      +'<input type="file" class="du-file" accept=".pdf,.dwg,.dxf" style="font-size:11px">'
      +'<select class="du-type" style="font-size:11px">'+typeOpts+'</select>'
      +'<select class="du-status" style="font-size:11px">'+statusOpts+'</select>'
      +'<button class="btn btn-sm btn-primary" style="font-size:11px" onclick="submitJobDoc('+jid+', this)">Add</button>'
      +'<div class="du-progress" style="display:none"><div class="du-bar"></div><span class="du-pct"></span></div>'
    +'</div>'
    +'<div class="docs-list" data-docs-list="'+esc(jobId)+'"><span style="color:var(--text-muted);font-size:11px">Loading…</span></div>'
    +'</div>';
}

window.toggleDocUpload = function(jobId){
  var el = document.querySelector('.doc-upload[data-docs-up="'+cssEsc(jobId)+'"]');
  if(el) el.style.display = el.style.display==='none' ? 'flex' : 'none';
};

function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

async function loadJobDocs(jobId){
  var list = document.querySelector('.docs-list[data-docs-list="'+cssEsc(jobId)+'"]');
  if(!list) return;
  try{
    var docs = await api('/api/service-area-jobs/'+encodeURIComponent(jobId)+'/documents');
    if(!docs.length){ list.innerHTML = '<span style="color:var(--text-muted);font-size:11px;font-style:italic">No documents yet.</span>'; return; }
    list.innerHTML = docs.map(function(d){ return renderDocRow(jobId, d); }).join('');
  }catch(e){ list.innerHTML = '<span style="color:var(--danger-text);font-size:11px">Failed to load documents</span>'; }
}

function renderDocRow(jobId, d){
  var statusOpts = '<option value="">—</option>'+DOC_STATUSES.map(function(s){ return '<option value="'+esc(s)+'"'+(d.status===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  var did = esc(JSON.stringify(d.id));
  var jid = esc(JSON.stringify(jobId));
  var ext = (d.file_name||'').split('.').pop().toUpperCase();
  return '<div class="doc-row">'
    +'<i class="fa-solid '+(ext==='PDF'?'fa-file-pdf':'fa-file-lines')+'" style="color:var(--primary)" aria-hidden="true"></i>'
    +'<a href="/uploads/'+escUrl(d.file_path)+'" target="_blank" class="doc-name" title="'+esc(d.file_name||'')+'">'+esc(d.file_name||'file')+'</a>'
    +'<span class="doc-type">'+esc(docTypeLabel(d.doc_type))+'</span>'
    +'<select class="doc-status-sel" onchange="retagJobDoc('+did+', this.value, '+jid+')" title="Status tag">'+statusOpts+'</select>'
    +'<span class="doc-size">'+fmtBytes(d.file_size)+'</span>'
    +'<span class="doc-meta">'+esc((d.uploaded_by_name||'')+'')+'</span>'
    +'<a href="/uploads/'+escUrl(d.file_path)+'" download="'+esc(d.file_name||'')+'" class="doc-act" title="Download"><i class="fa-solid fa-download"></i></a>'
    +'<button class="doc-act doc-del" onclick="deleteJobDoc('+did+', '+jid+')" title="Delete"><i class="fa-solid fa-trash"></i></button>'
    +'</div>';
}

// escUrl: URL-safe path for /uploads/<file> (strip #/?). Mirrors admin.html helper.
function escUrl(p){ return String(p||'').replace(/[#?]/g, function(c){ return encodeURIComponent(c); }); }

window.submitJobDoc = function(jobId, btn){
  var wrap = document.querySelector('.doc-upload[data-docs-up="'+cssEsc(jobId)+'"]');
  if(!wrap) return;
  var fileInp = wrap.querySelector('.du-file');
  var file = fileInp && fileInp.files && fileInp.files[0];
  if(!file){ flash('Choose a PDF or DWG file', 'err'); return; }
  var docType = wrap.querySelector('.du-type').value;
  var status = wrap.querySelector('.du-status').value;
  var prog = wrap.querySelector('.du-progress');
  var bar = wrap.querySelector('.du-bar');
  var pct = wrap.querySelector('.du-pct');
  var fd = new FormData();
  fd.append('file', file);
  fd.append('doc_type', docType);
  if(status) fd.append('status', status);

  btn.disabled = true; prog.style.display = 'flex';
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/service-area-jobs/'+encodeURIComponent(jobId)+'/documents');
  xhr.withCredentials = true;
  var tok = (window.localStorage && localStorage.getItem('lfs_token')); if(tok) xhr.setRequestHeader('Authorization','Bearer '+tok);
  xhr.upload.onprogress = function(e){ if(e.lengthComputable){ var p=Math.round(e.loaded/e.total*100); bar.style.width=p+'%'; pct.textContent=p+'%'; } };
  xhr.onload = function(){
    btn.disabled = false; prog.style.display='none'; bar.style.width='0%'; pct.textContent='';
    if(xhr.status>=200 && xhr.status<300){
      fileInp.value=''; wrap.style.display='none';
      flash('Document uploaded'); loadJobDocs(jobId);
    } else {
      var msg='Upload failed'; try{ msg=JSON.parse(xhr.responseText).error||msg; }catch(_){}
      flash(msg, 'err');
    }
  };
  xhr.onerror = function(){ btn.disabled=false; prog.style.display='none'; flash('Upload failed', 'err'); };
  xhr.send(fd);
};

window.retagJobDoc = async function(docId, status, jobId){
  try{
    await api('/api/service-area-job-documents/'+encodeURIComponent(docId), 'PATCH', { status: status });
    flash('Status updated');
  }catch(e){ flash('Failed to update status', 'err'); loadJobDocs(jobId); }
};

window.deleteJobDoc = async function(docId, jobId){
  try{
    await api('/api/service-area-job-documents/'+encodeURIComponent(docId), 'DELETE');
    flash('Document deleted'); loadJobDocs(jobId);
  }catch(e){ flash('Failed to delete', 'err'); }
};

})();
