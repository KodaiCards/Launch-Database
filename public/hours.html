<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hours — Launch Fiber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;
  --white:#FFFFFF;--gray-light:#F5F7FA;--gray-border:#DEE2E6;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;
  --white:#1D2430;--gray-light:#1A1F26;--gray-border:#2D3540;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
html[data-theme="dark"] input{background:var(--white);color:var(--text);border-color:var(--gray-border)}

.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px;object-fit:contain}
html[data-theme="dark"] .header-logo{filter:brightness(0) invert(1) opacity(.92)}
.header-title{font-size:16px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}

.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--gray-light)}
.btn-sm{padding:6px 10px;font-size:12px}

.container{max-width:1100px;margin:24px auto;padding:0 16px}
.page-heading{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}

.toolbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;
  background:var(--white);border:1px solid var(--gray-border);border-radius:10px;padding:14px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.field input{padding:8px 12px;border:1px solid var(--gray-border);border-radius:6px;background:var(--white);color:var(--text)}
.toolbar-spacer{flex:1}
.total-pill{font-size:13px;color:var(--text-secondary)}
.total-pill strong{font-size:18px;color:var(--primary);font-variant-numeric:tabular-nums}

.group-btn{background:var(--white);color:var(--text)}
.group-btn:hover{background:var(--gray-light)}
.group-btn.active{background:var(--primary);color:#fff}

.person-group{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.person-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;background:var(--gray-light);border-bottom:1px solid var(--gray-border)}
.person-header:hover{background:var(--primary-light)}
.person-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.person-name .chev{transition:transform .15s;font-size:11px;color:var(--text-muted)}
.person-group.collapsed .chev{transform:rotate(-90deg)}
.person-total{font-size:13px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
.person-group.collapsed .job-table-wrap{display:none}

.job-table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 16px;color:var(--text-muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-border)}
td{padding:10px 16px;border-bottom:1px solid var(--gray-border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--gray-light)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-design{background:var(--info-light);color:var(--info-text)}
.tag-permitting{background:var(--warning-light);color:var(--warning-text)}
.tag-construction{background:var(--success-light);color:var(--success-text)}

.empty-state{text-align:center;color:var(--text-muted);padding:48px 20px}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.4;display:block}
.loading-row{text-align:center;color:var(--text-muted);padding:32px;font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
  border-radius:50%;border-right-color:transparent;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:var(--gray-border);border-radius:4px;animation:sk-pulse 1.2s ease-in-out infinite;height:14px;margin:4px 0}
@keyframes sk-pulse{0%,100%{opacity:.6}50%{opacity:.25}}
@media(max-width:700px){
  .toolbar{flex-direction:column;align-items:stretch;gap:8px}
  .toolbar-spacer{display:none}
  .container{padding:0 10px}
  .toolbar>div[style]{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img src="/img/launch-fiber-logo-transparent.png" alt="Launch Fiber Services" class="header-logo">
    <span class="header-title">Hours</span>
  </div>
  <div class="header-right">
    <a href="/" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Admin</a>
  </div>
</header>

<main class="container" role="main" data-active="hours">
  <div class="page-heading">Hours by Person</div>
  <div class="page-sub">Labor hours per staff member and job. No billing figures.</div>

  <!-- Date presets -->
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" onclick="setPreset('week')">This week</button>
    <button class="btn btn-secondary btn-sm" onclick="setPreset('month')">This month</button>
    <button class="btn btn-secondary btn-sm" onclick="setPreset('all')">All time</button>
  </div>

  <div class="toolbar">
    <div class="field">
      <label for="from">From</label>
      <input type="date" id="from">
    </div>
    <div class="field">
      <label for="to">To</label>
      <input type="date" id="to">
    </div>
    <button class="btn btn-primary" onclick="applyFilter()"><i class="fa-solid fa-filter"></i> Apply</button>
    <button class="btn btn-secondary" onclick="clearFilter()">Clear</button>
    <div class="toolbar-spacer"></div>
    <!-- Group-by toggle -->
    <div style="display:flex;gap:0;border:1px solid var(--gray-border);border-radius:6px;overflow:hidden">
      <button class="btn btn-sm group-btn active" id="grp-person"  onclick="setGroup('person')"  style="border-radius:0;border:none">Person</button>
      <button class="btn btn-sm group-btn"        id="grp-client"  onclick="setGroup('client')"  style="border-radius:0;border:none;border-left:1px solid var(--gray-border)">Client</button>
      <button class="btn btn-sm group-btn"        id="grp-area"    onclick="setGroup('area')"    style="border-radius:0;border:none;border-left:1px solid var(--gray-border)">Service area</button>
    </div>
    <div class="total-pill">Total: <strong id="grand-total">—</strong> hrs</div>
    <button class="btn btn-secondary" onclick="exportCsv()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
    <button class="btn btn-secondary" onclick="exportCsv('client')"><i class="fa-solid fa-file-csv"></i> By client</button>
    <button class="btn btn-secondary" onclick="exportCsv('area')"><i class="fa-solid fa-file-csv"></i> By area</button>
  </div>

  <div id="results">
    <div class="loading-row"><span class="spinner"></span>Loading hours…</div>
  </div>
</main>

<script src="/js/hours_view.js" defer></script>
<script src="/js/app_nav.js" data-active="hours"></script>
</body>
</html>
