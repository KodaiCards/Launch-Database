<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Launch Fiber — Permitting Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#B85C1F;--primary-dark:#8C4517;--primary-light:#FFF3E8;--gray-light:#F5F7FA;--gray-border:#DEE2E6;--white:#FFF;--success:#28A745;--warning:#FFC107;--danger:#DC3545;--text:#212529;--text-muted:#6C757D;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--gray-light);color:var(--text);font-size:14px}
.view{display:none;padding:24px;flex-direction:column;gap:20px}.view.active{display:flex}
.card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600}
.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:0 24px;display:flex;align-items:center;gap:20px;height:58px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav{background:var(--primary);display:flex;padding:0 24px;position:sticky;top:58px;z-index:19;overflow-x:auto}
.nav-tab{color:rgba(255,255,255,.7);padding:0 18px;height:42px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:500;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.08)}.nav-tab.active{color:#fff;border-bottom-color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stat-card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;padding:16px 18px}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;line-height:1}.stat-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat-card.accent{background:var(--primary);border-color:var(--primary)}.stat-card.accent .stat-label,.stat-card.accent .stat-sub{color:rgba(255,255,255,.7)}.stat-card.accent .stat-value{color:#fff}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);background:var(--gray-light);border-bottom:1px solid var(--gray-border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid #F0F0F0;vertical-align:middle}
tbody tr:hover td{background:var(--gray-light)}
.td-name{font-weight:500}.td-mono{font-family:monospace;font-size:12px}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-active{background:#D4EDDA;color:#155724}.badge-completed{background:#D1ECF1;color:#0C5460}.badge-billed{background:#CCE5FF;color:#004085}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;font-family:var(--font)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--gray-border)}.btn-secondary:hover{background:var(--gray-light)}
.btn-success{background:var(--success);color:#fff}.btn-danger{background:#fff;color:var(--danger);border:1px solid #F5C6CB}
.btn-sm{padding:4px 10px;font-size:12px}.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:6px}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-title{font-size:18px;font-weight:700}.section-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.pipeline{display:flex;align-items:center}.pipeline-step{display:flex;align-items:center}
.pipeline-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--gray-border);background:var(--white);flex-shrink:0}
.pipeline-dot.done{background:var(--success);border-color:var(--success)}.pipeline-dot.current{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 3px rgba(184,92,31,.2)}
.pipeline-line{width:16px;height:2px;background:var(--gray-border)}.pipeline-line.done{background:var(--success)}
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}.empty-state i{font-size:36px;margin-bottom:12px;opacity:.3}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between}.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:22px}.modal-footer{padding:14px 22px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:8px;background:var(--gray-light);border-radius:0 0 12px 12px}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:12px;font-weight:600;color:var(--text-muted)}
input,select,textarea{border:1px solid var(--gray-border);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--font);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:60px}
select.filter{padding:7px 10px;font-size:13px;background:var(--white);cursor:pointer;border:1px solid var(--gray-border);border-radius:7px}
</style>
</head>
<body>
<header class="header">
  <div style="font-size:20px;font-weight:700;color:var(--primary)"><i class="fa-solid fa-file-signature" style="margin-right:8px"></i>Permitting Portal</div>
  <div style="margin-left:auto;font-size:12px;color:var(--text-muted)">Launch Fiber Services</div>
</header>
<nav class="nav">
  <a class="nav-tab active" data-view="projects" onclick="sv('projects')"><i class="fa-solid fa-folder-open"></i> Projects</a>
  <a class="nav-tab" data-view="pipeline" onclick="sv('pipeline')"><i class="fa-solid fa-file-signature"></i> Pipeline</a>
  <a class="nav-tab" data-view="potential" onclick="sv('potential')"><i class="fa-solid fa-lightbulb"></i> Potential Permits</a>
</nav>

<div id="view-projects" class="view active">
  <div class="section-header"><div><div class="section-title">Permitting Projects</div></div>
    <div style="display:flex;gap:8px"><select class="filter" id="pf" onchange="lp()"><option value="active">Active</option><option value="">All</option><option value="completed">Completed</option></select>
    <button class="btn btn-secondary btn-sm" onclick="lp()"><i class="fa-solid fa-rotate"></i></button></div>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Project</th><th>Client</th><th>WO #</th><th>Footage</th><th>Hours</th><th>Status</th></tr></thead>
    <tbody id="pb"></tbody>
  </table></div></div>
</div>

<div id="view-pipeline" class="view">
  <div class="section-header"><div><div class="section-title">Permit Pipeline</div></div></div>
  <div id="sb" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px"></div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Project</th><th>Client</th><th>WO #</th><th>Footage</th><th>Stage</th><th>Pipeline</th><th></th></tr></thead>
    <tbody id="plb"></tbody>
  </table></div></div>
</div>

<div id="view-potential" class="view">
  <div class="section-header"><div><div class="section-title">Potential Permits</div><div class="section-sub">Submitted by Design</div></div>
    <select class="filter" id="ppf" onchange="lpp()"><option value="">All</option><option value="pending" selected>Pending</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>SR/HWY</th><th>County</th><th>Route</th><th>By</th><th>Status</th><th>Date</th><th></th></tr></thead>
    <tbody id="ppb"></tbody>
  </table></div></div>
</div>

<div class="modal-overlay" id="cpm">
  <div class="modal">
    <div class="modal-header"><span class="modal-title"><i class="fa-solid fa-plus"></i> Create Permit</span><button class="btn btn-icon btn-secondary" onclick="cm('cpm')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="form-row"><div class="form-group"><label>Name *</label><input id="cn"></div><div class="form-group"><label>Client</label><select id="cc"></select></div></div>
      <div class="form-row"><div class="form-group"><label>WO #</label><input id="cw"></div><div class="form-group"><label>Footage</label><input type="number" id="cf" placeholder="0"></div></div>
      <div class="form-row"><div class="form-group"><label>Permit Type</label><select id="cs"><option value="DOT">DOT</option><option value="RR">RR (Railroad)</option></select></div><div class="form-group"><label>Parent</label><select id="cpa"></select></div></div>
      <div class="form-group"><label>Notes</label><textarea id="cno"></textarea></div>
      <input type="hidden" id="cpid">
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="cm('cpm')">Cancel</button><button class="btn btn-success" onclick="snp()"><i class="fa-solid fa-check"></i> Create</button></div>
  </div>
</div>

<script>
const ST=['potential','started','submitted','approved','checklist','billed'];
const SL={potential:'Potential',started:'Started',submitted:'Submitted',approved:'Approved',checklist:'Checklist',billed:'Billed'};
const SC={potential:'#6c757d',started:'#1B5FA0',submitted:'#ff9800',approved:'#28A745',checklist:'#17a2b8',billed:'#6f42c1'};
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function sb(s){return `<span class="badge badge-${s}">${s}</span>`}
function om(id){document.getElementById(id).classList.add('open')}
function cm(id){document.getElementById(id).classList.remove('open')}
async function api(p,m='GET',b=null){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(p,o);if(!r.ok)throw new Error(await r.text());return r.json()}

function sv(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  if(v==='projects')lp();if(v==='pipeline')lpl();if(v==='potential')lpp();
}

async function lp(){
  const s=document.getElementById('pf').value;
  let u='/api/projects?type=permitting';if(s)u+='&status='+s;
  const d=await api(u);
  document.getElementById('pb').innerHTML=d.length?d.map(p=>`<tr>
    <td class="td-name">${esc(p.name)}</td><td>${esc(p.client_name||'—')}</td><td class="td-mono">${esc(p.work_order_number||'—')}</td>
    <td>${p.footage?parseFloat(p.footage).toLocaleString()+' LF':'—'}</td><td>${parseFloat(p.actual_hours||0).toFixed(1)}</td><td>${sb(p.status)}</td>
  </tr>`).join(''):'<tr><td colspan="6" class="empty-state">No projects</td></tr>';
}

async function lpl(){
  const d=await api('/api/permits');
  const ct={};ST.forEach(s=>ct[s]=0);d.forEach(p=>{if(p.current_stage)ct[p.current_stage]++});
  document.getElementById('sb').innerHTML=ST.map(s=>`<div style="background:${SC[s]};color:#fff;padding:14px;border-radius:8px;text-align:center"><div style="font-size:24px;font-weight:700">${ct[s]}</div><div style="font-size:11px;text-transform:uppercase;opacity:.85">${SL[s]}</div></div>`).join('');
  document.getElementById('plb').innerHTML=d.length?d.map(p=>{
    const s=p.current_stage||'potential',si=ST.indexOf(s);
    const pipe=ST.map((x,i)=>`<div class="pipeline-step">${i>0?`<div class="pipeline-line${i<si?' done':''}"></div>`:''}<div class="pipeline-dot${i<si?' done':''}${i===si?' current':''}" title="${SL[x]}"></div></div>`).join('');
    return `<tr><td class="td-name">${esc(p.name)}</td><td>${esc(p.client_name||'—')}</td><td class="td-mono">${esc(p.work_order_number||'—')}</td>
      <td>${p.footage?parseFloat(p.footage).toLocaleString()+' LF':'—'}</td><td>${sb(s)}</td><td><div class="pipeline" style="min-width:140px">${pipe}</div></td>
      <td>${s!=='billed'?`<button class="btn btn-sm btn-primary" onclick="ap('${p.id}')"><i class="fa-solid fa-forward-step"></i></button>`:''}</td></tr>`;
  }).join(''):'<tr><td colspan="7" class="empty-state">No permits</td></tr>';
}

async function ap(id){const b=prompt('Your name:');if(b===null)return;try{await api('/api/permits/'+id+'/advance','PUT',{updated_by:b||'Permitting'});lpl();lp();}catch(e){alert(e.message);}}

async function lpp(){
  const s=document.getElementById('ppf').value;
  let u='/api/potential-permits';if(s)u+='?status='+s;
  const d=await api(u);
  document.getElementById('ppb').innerHTML=d.length?d.map(p=>{
    const c={pending:'var(--primary)',accepted:'var(--success)',rejected:'var(--danger)'}[p.status]||'#ccc';
    return `<tr><td class="td-name">${esc(p.sr_hwy||'—')}</td><td>${esc(p.county||'—')}</td><td>${esc(p.route||'—')}</td><td>${esc(p.submitted_by||'—')}</td>
      <td><span style="background:${c};color:#fff;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600">${p.status}</span></td>
      <td style="font-size:12px;color:var(--text-muted)">${new Date(p.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
      <td style="white-space:nowrap">${p.status==='pending'?`<button class="btn btn-sm btn-success" onclick="ocp('${p.id}','${esc(p.sr_hwy||'')}','${esc(p.county||'')}','${esc(p.route||'')}')"><i class="fa-solid fa-plus"></i> Create Permit</button>
        <button class="btn btn-sm btn-danger btn-icon" onclick="rpp('${p.id}')" style="margin-left:4px"><i class="fa-solid fa-xmark"></i></button>`:''}</td></tr>`;
  }).join(''):'<tr><td colspan="7" class="empty-state">No potential permits</td></tr>';
}

async function ocp(id,sr,co,rt){
  document.getElementById('cpid').value=id;
  document.getElementById('cn').value=(sr||'')+ ' Permitting';
  document.getElementById('cno').value=`SR/HWY: ${sr||'N/A'}, County: ${co||'N/A'}, Route: ${rt||'N/A'}`;
  document.getElementById('cw').value='';document.getElementById('cf').value='';document.getElementById('cs').value='DOT';
  const [cl,pr]=await Promise.all([api('/api/clients'),api('/api/projects')]);
  const cs=document.getElementById('cc');cs.innerHTML='<option value="">Select...</option>';cl.forEach(c=>cs.add(new Option(c.name,c.id)));
  const ps=document.getElementById('cpa');ps.innerHTML='<option value="">None</option>';pr.forEach(p=>ps.add(new Option(p.name,p.id)));
  om('cpm');
}

async function snp(){
  const n=document.getElementById('cn').value.trim();if(!n)return alert('Name required');
  const ppId=document.getElementById('cpid').value;
  try{
    const p=await api('/api/projects','POST',{name:n,client_id:document.getElementById('cc').value||null,work_order_number:document.getElementById('cw').value||null,
      project_type:'permitting',billing_type:'footage',billing_rate:document.getElementById('cs').value==='RR'?null:90,
      footage:parseFloat(document.getElementById('cf').value)||null,notes:document.getElementById('cno').value||null,
      parent_id:document.getElementById('cpa').value||null,permit_subtype:document.getElementById('cs').value,permit_manager:'Permitting Portal'});
    if(ppId)await api('/api/potential-permits/'+ppId,'PUT',{status:'accepted',reviewed_by:'Permitting Portal',project_id:p.id});
    cm('cpm');lpp();lp();lpl();
  }catch(e){alert(e.message);}
}

async function rpp(id){if(!confirm('Reject?'))return;try{await api('/api/potential-permits/'+id,'PUT',{status:'rejected',reviewed_by:'Permitting Portal'});lpp();}catch(e){alert(e.message);}}

lp();
</script>
</body>
</html>
