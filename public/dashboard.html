<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Launch Fiber</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --danger:#DC3545;--danger-light:#FDECEA;--danger-text:#B71C1C;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --rus:#8E24AA;--rus-light:#F3E5F5;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --danger:#EF5350;--danger-light:#3D1F23;--danger-text:#F8B4BD;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  --rus:#CE93D8;--rus-light:#2A1B33;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text);height:100vh;overflow:hidden}
a,button{font-family:inherit}
.shell{display:flex;height:100vh}
.rail{width:184px;background:var(--surface-2);border-right:1px solid var(--border-strong);padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;padding:6px 10px 14px;font-size:15px;font-weight:700}.brand i{color:var(--primary)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13px;color:var(--text-secondary);text-decoration:none}
.nav-item:hover{background:var(--surface-1)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.nav-item .soon{margin-left:auto;font-size:9px;color:var(--text-muted);background:var(--surface-3);border-radius:5px;padding:1px 5px}
.nav-item.disabled{cursor:default;color:var(--text-muted)}
.main{flex:1;overflow-y:auto;padding:20px 26px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-size:20px;font-weight:700}
.period{font-size:12px;color:var(--text-secondary);border:1px solid var(--border-strong);border-radius:8px;padding:5px 11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.tile .val{font-size:26px;font-weight:700;margin-top:5px}
.tile .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.attention{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;padding:13px 16px;margin-bottom:18px}
.attention h3{font-size:13px;font-weight:700;margin-bottom:11px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.att{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.att .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.att .v{color:var(--text-muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-strong);margin-bottom:16px}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--text-muted);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.card{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden}
.card-h{padding:11px 16px;border-bottom:1px solid var(--border-strong);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card-h a{font-size:12px;color:var(--primary);text-decoration:none}
.kv{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border-weak);font-size:13px}
.kv:last-child{border-bottom:none}.kv .k{color:var(--text-secondary)}
.bigrow{display:flex;gap:24px;padding:16px}
.big{font-size:22px;font-weight:700}.big .u{font-size:12px;color:var(--text-muted);font-weight:400;display:block}
.note{font-size:12px;color:var(--text-muted);padding:10px 16px;border-top:1px solid var(--border-weak);background:var(--surface-1)}
.stage-row{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.stage{background:var(--surface-1);border:1px solid var(--border-weak);border-radius:8px;padding:7px 11px;min-width:80px}
.stage .s-lbl{font-size:11px;color:var(--text-muted);text-transform:capitalize}.stage .s-cnt{font-size:18px;font-weight:700}
.stage.rev{border-color:var(--rus);color:var(--rus)}
.muted{color:var(--text-muted)}
</style>
</head>
<body>
  <main class="main" role="main">
      <div class="topbar">
        <h1>Dashboard</h1>
        <div style="display:flex;gap:0;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden">
          <button id="pd-month"   class="period-btn active" onclick="setPeriod('month')"   style="padding:5px 12px;font-size:12px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit">Month</button>
          <button id="pd-quarter" class="period-btn"        onclick="setPeriod('quarter')" style="padding:5px 12px;font-size:12px;border:none;border-left:1px solid var(--border-strong);background:none;color:var(--text-secondary);cursor:pointer;font-family:inherit">Quarter</button>
          <button id="pd-all"     class="period-btn"        onclick="setPeriod('all')"     style="padding:5px 12px;font-size:12px;border:none;border-left:1px solid var(--border-strong);background:none;color:var(--text-secondary);cursor:pointer;font-family:inherit">All time</button>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="attention"><h3>Needs attention</h3><div class="att-grid" id="attention"></div></div>
      <div class="tabs">
        <button class="tab active" data-tab="revenue">Revenue</button>
        <button class="tab" data-tab="bill">Ready to bill</button>
        <button class="tab" data-tab="hours">Hours</button>
        <button class="tab" data-tab="pipeline">Pipeline</button>
      </div>
      <div id="tabContent"><div class="muted" style="padding:20px">Loading…</div></div>
    </main>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard_overview.js"></script>
  <script src="/js/app_nav.js" data-active="dashboard"></script>
</body>
</html>
