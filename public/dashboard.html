<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Launch Fiber</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --rus:#8E24AA;--rus-light:#F3E5F5;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  --rus:#CE93D8;--rus-light:#2A1B33;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text);min-height:100vh}
button,a{font-family:inherit}
.header{background:var(--surface-2);border-bottom:1px solid var(--border-strong);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;height:52px}
.htitle{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}.htitle i{color:var(--primary)}
.hright{display:flex;gap:8px}
.btn{padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn:hover{background:var(--surface-1)}
.wrap{max-width:1080px;margin:22px auto;padding:0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;padding:16px 18px}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.tile .val{font-size:28px;font-weight:700;margin-top:6px}
.tile .sub{font-size:12px;color:var(--text-muted);margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-strong);margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.card{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;margin-bottom:14px}
.card-h{padding:11px 16px;border-bottom:1px solid var(--border-strong);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card-h a{font-size:12px;color:var(--primary);text-decoration:none}
.stage-row{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
.stage{background:var(--surface-1);border:1px solid var(--border-weak);border-radius:8px;padding:8px 12px;min-width:84px}
.stage .s-lbl{font-size:11px;color:var(--text-muted);text-transform:capitalize}
.stage .s-cnt{font-size:20px;font-weight:700}
.stage.rev{border-color:var(--rus);color:var(--rus)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-weak);font-size:13px}
.row:last-child{border-bottom:none}
.row .nm{font-weight:600}.row .mt{font-size:11px;color:var(--text-muted)}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.badge-rus{background:var(--rus-light);color:var(--rus)}
.badge-prog{background:var(--surface-3);color:var(--text-muted)}
.muted{color:var(--text-muted)}
</style>
</head>
<body>
  <div class="header">
    <div class="htitle"><i class="fa-solid fa-gauge-high"></i> Dashboard</div>
    <div class="hright">
      <a class="btn" href="/service-areas.html"><i class="fa-solid fa-diagram-project"></i> Service Areas</a>
      <a class="btn" href="/admin.html"><i class="fa-solid fa-arrow-left"></i> Admin</a>
      <button class="btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>
  <div class="wrap">
    <div class="tiles" id="tiles"></div>
    <div class="tabs">
      <button class="tab active" data-tab="pipeline">Pipeline</button>
      <button class="tab" data-tab="recent">Recent</button>
      <button class="tab" data-tab="clients">By client</button>
    </div>
    <div id="tabContent"><div class="muted" style="padding:20px">Loading…</div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard_overview.js"></script>
</body>
</html>
