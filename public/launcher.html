<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Fiber Portal</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Design system (loaded AFTER any legacy stylesheets so tokens take precedence) -->
<link rel="stylesheet" href="/css/app-shell.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── Legacy aliases for the launcher's existing layout vars ── */
:root{
  --font-stack:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius-md:6px;
  --radius-lg:10px;
  --shadow-panel:var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.12));
  --shadow-lift:var(--shadow-md, 0 4px 16px rgba(0,0,0,0.16));
  --footer-h:48px;
}

html,body{height:100%}
body{
  font-family:var(--font-stack);
  background:var(--surface-1);
  color:var(--text-1);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── Main content (fills remaining viewport so the grid can expand) ── */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden; /* clip at main boundary; tile-area handles inner scroll */
}

/* ── Launcher shell + constrained box ── */
#tile-area{
  flex:1;
  display:flex;
  align-items:stretch;
  justify-content:center;
  min-height:0;
  overflow:hidden;
  padding:20px;
  box-sizing:border-box;
}
.launcher-box{
  width:100%;
  max-width:720px;
  /* Stretch to fill the available vertical space so the grid can divide it evenly.
     The grid uses fr rows so tiles shrink to fit rather than overflow. */
  display:flex;
  align-items:stretch;
}

/* ── Tile grid (viewport-fitted bento layout) ──
   Both columns AND rows use fr tracks so every tile shares available space equally
   in both dimensions — tiles shrink as count grows so they all fit without scrolling.
   The grid fills the .launcher-box height (which fills the viewport minus topbar/footer).
   aspect-ratio is removed from tiles; cells drive the size. */
.launcher-grid{
  display:grid;
  width:100%;
  height:100%;
  gap:10px;
  box-sizing:border-box;
}
/* Count-driven column + row layouts — both axes use fr so tiles fill the viewport */
.launcher-grid[data-count="1"]{grid-template-columns:1fr;grid-template-rows:1fr}
.launcher-grid[data-count="2"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.launcher-grid[data-count="3"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}
.launcher-grid[data-count="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.launcher-grid[data-count="5"]{grid-template-columns:repeat(3, 1fr);grid-template-rows:1fr 1fr}
.launcher-grid[data-count="6"]{grid-template-columns:repeat(3, 1fr);grid-template-rows:1fr 1fr}
.launcher-grid[data-count="7"]{grid-template-columns:repeat(4, 1fr);grid-template-rows:1fr 1fr}
.launcher-grid[data-count="8"]{grid-template-columns:repeat(4, 1fr);grid-template-rows:1fr 1fr}
.launcher-grid[data-count="9"]{grid-template-columns:repeat(3, 1fr);grid-template-rows:1fr 1fr 1fr}
/* 10+ uses a 4-col layout with enough rows to hold all tiles */
.launcher-grid[data-count="10"]{grid-template-columns:repeat(4, 1fr);grid-template-rows:repeat(3, 1fr)}

/* ── Individual tile (base / small style) ── */
.tile{
  background:var(--surface-2);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  transition:transform .12s, box-shadow .12s, border-color .12s;
  box-shadow:var(--shadow-panel);
  overflow:hidden;
  min-width:0;
  min-height:0;
  text-align:center;
  /* Fill the grid cell in both axes — grid rows/cols drive the size,
     so tiles shrink when more portals are shown */
  width:100%;
  height:100%;
}
.tile:hover{
  box-shadow:var(--shadow-lift);
  border-color:var(--brand-primary);
}
/* Lift-on-hover only for count >= 2 (hero shouldn't lift) */
.launcher-grid:not([data-count="1"]) .tile:hover{
  transform:translateY(-2px);
}
/* Outline on hover — uses text color so it adapts to theme */
.launcher-grid:not([data-count="1"]) .tile:hover{
  outline:2px solid var(--text-1);
  outline-offset:-2px;
}
.tile-icon{
  width:clamp(44px, 7vw, 72px);
  height:clamp(44px, 7vw, 72px);
  border-radius:50%;
  background:var(--brand-primary-light);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--brand-primary);
  flex-shrink:0;
}
.tile-icon i{
  font-size:clamp(18px, 3vw, 32px);
}
.tile-name{
  font-size:clamp(13px, 1.3vw, 18px);
  font-weight:600;
  color:var(--text-1);
  line-height:1.25;
}
.tile-desc{
  font-size:clamp(11px, 0.9vw, 13px);
  color:var(--text-muted);
  line-height:1.5;
  max-width:36ch;
}

/* Hero (count=1) — single tile; box is capped so it doesn't sprawl on large
   screens. Sized so the icon + title + full description fit without clipping. */
.launcher-grid[data-count="1"]{max-width:360px;max-height:400px;margin:auto}
.launcher-grid[data-count="1"] .tile{
  gap:16px;
  padding:32px;
  justify-content:center;
}
.launcher-grid[data-count="1"] .tile-icon{
  width:clamp(72px, 10vw, 104px);
  height:clamp(72px, 10vw, 104px);
}
.launcher-grid[data-count="1"] .tile-icon i{
  font-size:clamp(32px, 5vw, 48px);
}
.launcher-grid[data-count="1"] .tile-name{
  font-size:clamp(20px, 2.2vw, 26px);
  line-height:1.2;
}
.launcher-grid[data-count="1"] .tile-desc{
  font-size:14px;
  line-height:1.45;
  max-width:34ch;
}

/* Large (count=2|3) — generous but not hero */
.launcher-grid[data-count="2"] .tile,
.launcher-grid[data-count="3"] .tile{
  gap:14px;
  padding:24px;
}
.launcher-grid[data-count="2"] .tile-icon,
.launcher-grid[data-count="3"] .tile-icon{
  width:clamp(56px, 8vw, 96px);
  height:clamp(56px, 8vw, 96px);
}
.launcher-grid[data-count="2"] .tile-icon i,
.launcher-grid[data-count="3"] .tile-icon i{
  font-size:clamp(24px, 4vw, 44px);
}
.launcher-grid[data-count="2"] .tile-name,
.launcher-grid[data-count="3"] .tile-name{
  font-size:clamp(15px, 1.8vw, 24px);
}

/* Hide description on tightly packed tiles (count >= 4) */
.launcher-grid[data-count="4"] .tile-desc,
.launcher-grid[data-count="5"] .tile-desc,
.launcher-grid[data-count="6"] .tile-desc,
.launcher-grid[data-count="7"] .tile-desc,
.launcher-grid[data-count="8"] .tile-desc,
.launcher-grid[data-count="9"] .tile-desc,
.launcher-grid[data-count="10"] .tile-desc{
  display:none;
}

/* ── Empty / loading states ── */
.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 24px;
  color:var(--text-muted);
  width:100%;
}
.empty-state i{font-size:40px;margin-bottom:16px;display:block;opacity:0.4}
.empty-state p{font-size:14px;line-height:1.6;max-width:420px}
.loading-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:60px 24px;
  color:var(--text-muted);
  font-size:14px;
  width:100%;
}
.loading-state i{font-size:24px;opacity:0.5}

/* ── Footer ── */
.footer{
  height:var(--footer-h);
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:var(--text-muted);
  border-top:1px solid var(--border-strong);
  flex-shrink:0;
  background:var(--surface-1);
}
.footer a{color:var(--text-muted);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* ── Mobile (< 600px) — scrollable, 2-column layout ── */
@media(max-width:600px){
  body{overflow:auto}
  .main{overflow:visible}
  #tile-area{
    overflow:visible;
    align-items:flex-start;
    padding:12px;
    height:auto;
  }
  .launcher-box{
    max-width:calc(100vw - 24px);
    height:auto;
  }
  .launcher-grid{
    /* 2-col scrollable grid on mobile — tiles use aspect-ratio to stay square */
    grid-template-columns:1fr 1fr !important;
    grid-template-rows:auto !important;
    height:auto !important;
    gap:10px;
  }
  /* Restore aspect-ratio on mobile since we're back to scroll-based layout */
  .tile{
    aspect-ratio:1 / 1;
    height:auto !important;
    padding:14px;
    gap:8px;
  }
  /* Single-tile hero: full-width square */
  .launcher-grid[data-count="1"]{
    grid-template-columns:1fr !important;
    max-height:none;
  }
  .tile-icon{
    width:clamp(40px,10vw,56px);
    height:clamp(40px,10vw,56px);
  }
  .tile-icon i{font-size:clamp(18px,4vw,24px)}
  .tile-name{font-size:clamp(12px,3.5vw,15px)}
  .tile-desc{
    display:block;
    font-size:12px;
  }
}
</style>
</head>
<body>

<!-- a11y: skip-nav — first focusable element so keyboard users can jump past the top bar -->
<a href="#main-content" class="skip-nav">Skip to main content</a>

<!-- Topbar is mounted by AppShell.init() — see DOMContentLoaded script below. -->

<!-- Main content area -->
<main class="main app-content" id="main-content">
  <div id="tile-area">
    <div class="launcher-box">
      <div class="loading-state">
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        Loading your portals...
      </div>
    </div>
  </div>
</main>

<!-- Request additional access (shown only for locked-down users) -->
<div id="request-access-bar" style="display:none;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-top:1px solid var(--border-strong);background:var(--surface-1);flex-shrink:0">
  <span style="font-size:13px;color:var(--text-muted)">Need access to more than training?</span>
  <button id="request-access-btn" type="button"
    style="display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--font-stack);padding:9px 16px;border-radius:var(--radius-md);border:1px solid var(--brand-primary);background:var(--brand-primary);color:#fff;cursor:pointer">
    <i class="fa-solid fa-unlock-keyhole" aria-hidden="true"></i> Request additional permissions
  </button>
</div>

<!-- Request modal -->
<div id="req-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="req-modal-title"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-lg);max-width:480px;width:100%;padding:22px;box-shadow:var(--shadow-lift)">
    <h2 id="req-modal-title" style="font-size:18px;font-weight:700;color:var(--text-1);margin-bottom:6px">Request additional access</h2>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:14px">
      Tell the admin what you need access to and why. They'll review your request and grant it if appropriate.
    </p>
    <textarea id="req-details" rows="5" maxlength="2000"
      placeholder="e.g. I'm starting field work next week and need the Time Clock portal to log my hours."
      style="width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-1);color:var(--text-1);font-family:var(--font-stack);font-size:14px;resize:vertical;box-sizing:border-box"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button id="req-cancel" type="button"
        style="font:600 13px/1 var(--font-stack);padding:9px 16px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-1);cursor:pointer">Cancel</button>
      <button id="req-send" type="button"
        style="font:600 13px/1 var(--font-stack);padding:9px 16px;border-radius:var(--radius-md);border:1px solid var(--brand-primary);background:var(--brand-primary);color:#fff;cursor:pointer">Send request</button>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer" id="footer-bar">
  <span id="footer-user"></span>
</div>

<!-- AppShell — design system topbar + theme + toast/modal helpers -->
<script src="/js/app-shell.js" defer></script>

<script>
// ── Init AppShell topbar (theme toggle + user menu + sign-out live here) ──
document.addEventListener('DOMContentLoaded', function () {
  if (window.AppShell && typeof AppShell.init === 'function') {
    AppShell.init({ title: 'Launcher', portalId: 'launcher' });
  }
});

// ── Render tiles ──
function renderTile(p) {
  const div = document.createElement('a');
  div.className = 'tile';
  div.href = p.url;
  div.setAttribute('aria-label', p.name);
  div.innerHTML = `
    <div class="tile-icon"><i class="fa-solid fa-${escHtml(p.icon)}"></i></div>
    <div class="tile-name">${escHtml(p.name)}</div>
    <div class="tile-desc">${escHtml(p.description || '')}</div>
  `;
  div.addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = p.url;
  });
  return div;
}

function escHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Request-additional-access (locked-down users only) ──
function setupRequestAccess() {
  const bar = document.getElementById('request-access-bar');
  const overlay = document.getElementById('req-modal-overlay');
  const openBtn = document.getElementById('request-access-btn');
  const cancelBtn = document.getElementById('req-cancel');
  const sendBtn = document.getElementById('req-send');
  const details = document.getElementById('req-details');
  if (!bar || !overlay) return;

  bar.style.display = 'flex';

  const close = () => { overlay.style.display = 'none'; };
  const open = () => { overlay.style.display = 'flex'; setTimeout(() => details && details.focus(), 50); };

  openBtn && openBtn.addEventListener('click', open);
  cancelBtn && cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.style.display === 'flex') close(); });

  sendBtn && sendBtn.addEventListener('click', async () => {
    const text = (details.value || '').trim();
    if (text.length < 5) {
      if (window.AppShell && AppShell.toast) AppShell.toast('Please describe what access you need.', 'error');
      details && details.focus();
      return;
    }
    sendBtn.disabled = true;
    const original = sendBtn.innerHTML;
    sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending…';
    try {
      const r = await fetch('/api/access-requests', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ details: text }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || ('Request failed (' + r.status + ')'));
      }
      details.value = '';
      close();
      if (window.AppShell && AppShell.toast) AppShell.toast('Request sent — the admin will review it.', 'success');
    } catch (e) {
      if (window.AppShell && AppShell.toast) AppShell.toast(e.message || 'Could not send request.', 'error');
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerHTML = original;
    }
  });
}

// ── Main load ──
(async function(){
  // Determine audience from URL (client launcher passes ?audience=client)
  const params = new URLSearchParams(window.location.search);
  const audienceParam = params.get('audience');
  const stay = params.get('stay') === '1';

  const apiUrl = audienceParam
    ? '/api/me/portals?audience=' + encodeURIComponent(audienceParam)
    : '/api/me/portals';

  let data;
  try {
    const r = await fetch(apiUrl, {credentials:'include'});
    if (r.status === 401) { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search); return; }
    data = await r.json();
  } catch(e) {
    document.getElementById('tile-area').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load portals. Please refresh or sign in again.</p></div>`;
    if (window.AppShell && typeof AppShell.toast === 'function') {
      AppShell.toast('Could not load portals. Please refresh or sign in again.', 'error');
    }
    return;
  }

  const portals = data.portals || [];
  const user = data.user || {};
  const canRequestAccess = data.can_request_access === true;

  // Update footer (user menu is handled by AppShell topbar)
  const name = user.name || '';
  const footerEl = document.getElementById('footer-user');
  if (footerEl) footerEl.textContent = name ? `Signed in as ${name}` : '';

  // Locked-down users (trainees / non-admin employees) stay on the launcher so
  // they can see their tile AND request more access — no single-tile redirect.
  if (canRequestAccess) setupRequestAccess();

  // Auto-redirect when exactly 1 portal and ?stay=1 is not set — but never for
  // users who can request access (they need the launcher to make that request).
  if (portals.length === 1 && !stay && !canRequestAccess) {
    window.location.replace(portals[0].url);
    return;
  }

  const area = document.getElementById('tile-area');

  if (portals.length === 0) {
    area.innerHTML = `<div class="launcher-box"><div class="empty-state"><i class="fa-solid fa-lock"></i><p>No portals available — contact your administrator.</p></div></div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'launcher-grid';
  // Cap at 10 — anything 10+ uses the auto-fill fallback
  grid.setAttribute('data-count', String(Math.min(portals.length, 10)));
  portals.forEach(p => grid.appendChild(renderTile(p)));
  const box = document.createElement('div');
  box.className = 'launcher-box';
  box.appendChild(grid);
  area.innerHTML = '';
  area.appendChild(box);
})();
</script>
<script src="/js/impersonation_banner.js"></script>
</body>
</html>
