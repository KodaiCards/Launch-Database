<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Launch Fiber Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
body{
  background:var(--surface-1);color:var(--text-1);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:var(--space-5);
}
.login-card{max-width:420px;width:100%;padding:var(--space-8)}
.logo{display:flex;justify-content:center;margin-bottom:var(--space-6)}
.logo img{height:96px;width:auto;max-width:100%;object-fit:contain}
html[data-theme="dark"] .logo img{filter:brightness(0) invert(1) opacity(0.92)}
h1{font-size:var(--text-2xl);font-weight:600;text-align:center;margin-bottom:var(--space-1);color:var(--text-1)}
.subtitle{font-size:var(--text-sm);color:var(--text-muted);text-align:center;margin-bottom:var(--space-6)}
.field{margin-bottom:var(--space-4)}
.hint{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-1)}
.btn-primary.btn-block{width:100%;justify-content:center}
.error{
  background:var(--danger-light);color:var(--danger-text);border:1px solid var(--danger);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
  font-size:var(--text-sm);margin-bottom:var(--space-4);display:none;
}
.error.show{display:block}
.footer{text-align:center;font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-5)}
.footer a{color:var(--brand-primary);text-decoration:none;font-weight:600}
.theme-toggle{
  position:absolute;top:var(--space-4);right:var(--space-4);background:none;
  border:1px solid var(--border-strong);
  width:36px;height:36px;border-radius:var(--radius-md);cursor:pointer;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
}
.theme-toggle:hover{border-color:var(--brand-primary);color:var(--brand-primary)}
.skip-nav{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999;text-decoration:none}
.skip-nav:focus{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:auto;height:auto;padding:var(--space-2) var(--space-5);background:var(--brand-primary);color:var(--surface-0);font-weight:600;border-radius:var(--radius-sm);font-size:var(--text-base);z-index:9999}
</style>
</head>
<body>

<a href="#main-content" class="skip-nav">Skip to main content</a>

<button class="theme-toggle" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode">
  <i class="fa-solid fa-moon" id="dm-icon" aria-hidden="true"></i>
</button>

<main id="main-content">
<div class="card login-card">
  <div class="logo">
    <img src="/img/launch-fiber-logo-transparent.png" alt="Launch Fiber Services">
  </div>
  <h1>Create your account</h1>
  <p class="subtitle">Sign up to start Launch Fiber training</p>

  <div class="error" id="error-msg" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <form id="signup-form" onsubmit="return doSignup(event)">
    <div class="field form-group">
      <label class="form-label" for="full_name">Full name</label>
      <input class="input" type="text" id="full_name" name="full_name" autocomplete="name" required autofocus>
    </div>
    <div class="field form-group">
      <label class="form-label" for="username">Username</label>
      <input class="input" type="text" id="username" name="username" autocomplete="username" required>
      <div class="hint">Letters, numbers, and . _ - only.</div>
    </div>
    <div class="field form-group">
      <label class="form-label" for="email">Email <span style="color:var(--text-muted)">(optional)</span></label>
      <input class="input" type="email" id="email" name="email" autocomplete="email">
    </div>
    <div class="field form-group">
      <label class="form-label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      <div class="hint">At least 8 characters.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
      <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Create account
    </button>
  </form>

  <p class="footer">Already have an account? <a href="/login.html">Sign in</a></p>
</div>
</main>

<script src="/js/app-shell.js" defer></script>
<script>
(function(){
  try {
    const saved = localStorage.getItem('lfs-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
    else if (saved === 'light') document.documentElement.setAttribute('data-theme','light');
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme','dark');
    }
  } catch(e){}
  const icon = document.getElementById('dm-icon');
  if (document.documentElement.getAttribute('data-theme') === 'dark' && icon) icon.className = 'fa-solid fa-sun';
})();

document.addEventListener('DOMContentLoaded', function(){
  if (window.AppShell && typeof window.AppShell.initTheme === 'function') window.AppShell.initTheme();
});

function toggleDark(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = !isDark;
  document.documentElement.setAttribute('data-theme', next ? 'dark' : 'light');
  try { localStorage.setItem('lfs-theme', next ? 'dark' : 'light'); } catch(e){}
  const icon = document.getElementById('dm-icon');
  if (icon) icon.className = next ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

async function doSignup(ev){
  ev.preventDefault();
  const full_name = document.getElementById('full_name').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Creating account...';
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({ full_name, username, email, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Sign-up failed');
    // Account created + logged in (cookie set server-side). Head into training.
    window.location.href = '/training/';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
    if (window.AppShell && typeof window.AppShell.toast === 'function') window.AppShell.toast(e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus" aria-hidden="true"></i> Create account';
  }
  return false;
}
</script>

</body>
</html>
