<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Launch Time Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#1B5FA0;
  --primary-dark:#134880;
  --primary-light:#E8F0FB;
  --gray:#6B6B6B;
  --gray-light:#F5F7FA;
  --gray-border:#DEE2E6;
  --white:#FFFFFF;
  --success:#28A745;
  --warning:#FFC107;
  --danger:#DC3545;
  --text:#212529;
  --text-muted:#6C757D;
  --font:'Inter',sans-serif;
  --row-alt:#F0F0F0;
}
html[data-theme="dark"]{
  --gray-light:#1A1F26;
  --gray-border:#2D3540;
  --white:#242B36;
  --text:#E8EAED;
  --text-muted:#9BA1A8;
  --primary-light:#1E3A5C;
  --row-alt:#1F2630;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--gray-light);color:var(--text);min-height:100vh}
html[data-theme="dark"] body{background:#0F1419}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--white);color:var(--text);border-color:var(--gray-border)}
html[data-theme="dark"] select option{background:var(--white);color:var(--text)}

/* Header */
.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px;object-fit:contain}
html[data-theme="dark"] .header-logo{filter:brightness(0) invert(1) opacity(0.92)}
.header-title{font-size:16px;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:6px}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:all .15s;text-decoration:none;color:inherit}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--gray-border)}
.btn-secondary:hover{background:var(--gray-light)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-warning{background:var(--warning);color:#000;border-color:var(--warning)}
.btn-icon{padding:6px 8px}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-xl{padding:20px 36px;font-size:18px;font-weight:600}

/* Layout */
.container{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--white);border:1px solid var(--gray-border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:16px}

/* CLOCK CARD — the centerpiece */
.clock-card{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border:none;padding:28px 20px;text-align:center;border-radius:14px;margin-bottom:18px}
html[data-theme="dark"] .clock-card{background:linear-gradient(135deg,#1E3A5C 0%,#0E2440 100%)}
.clock-status-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:6px}
.clock-time{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:4px}
.clock-time-sub{font-size:14px;opacity:.85;margin-bottom:16px}
.clock-project{background:rgba(255,255,255,.15);border-radius:8px;padding:10px 14px;margin:0 auto 16px auto;max-width:480px;font-size:14px}
.clock-project strong{display:block;font-size:16px;margin-bottom:2px}
.clock-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.clock-controls .btn-xl{min-width:170px;justify-content:center}
.clock-out-btn{background:var(--danger);color:#fff;border-color:var(--danger)}
.clock-out-btn:hover{background:#B02A37}
.clock-in-btn{background:var(--success);color:#fff;border-color:var(--success)}
.clock-in-btn:hover{background:#1E7E34}
.clock-switch-btn{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)}
.clock-switch-btn:hover{background:rgba(255,255,255,.28)}

/* Pre-clock-in form */
.pre-clock-form{max-width:480px;margin:0 auto;text-align:left}
.pre-clock-form .form-group{margin-bottom:10px}
.pre-clock-form label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.pre-clock-form select,.pre-clock-form input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:var(--text);font-size:14px}
.pre-clock-form select:focus,.pre-clock-form input:focus{outline:none;border-color:#fff;background:#fff}

/* Week navigator */
.week-nav{display:flex;justify-content:space-between;align-items:center;padding:0 8px;gap:10px;flex-wrap:wrap}
.week-nav-arrows{display:flex;align-items:center;gap:8px}
.week-nav-label{font-size:14px;font-weight:600;min-width:160px;text-align:center}
.week-nav-arrows .btn{padding:6px 10px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px}
.day-cell{background:var(--gray-light);border:1px solid var(--gray-border);border-radius:8px;padding:10px;text-align:center;min-height:78px}
.day-cell.today{background:var(--primary-light);border-color:var(--primary)}
.day-cell.empty{opacity:.5}
.day-name{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.day-date{font-size:18px;font-weight:600;margin:2px 0}
.day-hours{font-size:14px;font-weight:600;color:var(--primary)}
.day-cell.empty .day-hours{color:var(--text-muted)}
.week-total{padding:10px 16px;background:var(--gray-light);border-top:1px solid var(--gray-border);display:flex;justify-content:space-between;font-weight:600;font-size:14px}

/* Entries table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--gray-light);color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-border)}
td{padding:10px 12px;border-bottom:1px solid var(--gray-border)}
tbody tr:hover{background:var(--gray-light)}
.empty-state{text-align:center;color:var(--text-muted);padding:24px;font-style:italic}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-content{background:var(--white);border-radius:12px;max-width:520px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 18px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-border);border-radius:6px;background:var(--white);color:var(--text)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

/* Account modal */
.account-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid var(--gray-border);background:var(--white)}
.account-pill:hover{background:var(--gray-light)}
.account-pill strong{color:var(--text)}

/* Loading state */
.loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-radius:50%;border-right-color:transparent;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Helpful tags */
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--gray-light);color:var(--text);font-size:11px;font-weight:600}
.tag-team-design{background:#E3F2FD;color:#0d47a1}
.tag-team-permitting{background:#FFF3E0;color:#e65100}
.tag-team-inspection{background:#E8F5E9;color:#1b5e20}
html[data-theme="dark"] .tag-team-design{background:#1E3A5C;color:#90CAF9}
html[data-theme="dark"] .tag-team-permitting{background:#3D2F0F;color:#FFCC80}
html[data-theme="dark"] .tag-team-inspection{background:#1B3D24;color:#A5D6A7}

/* Mobile responsive — phone-in-truck workflow.
   Goals: big tap targets, reduce visual noise, make Clock In/Out the
   single most prominent action on the screen. */
@media(max-width:600px){
  .container{margin:10px auto;padding:0 10px}
  .clock-card{padding:18px 12px}
  .clock-time{font-size:32px}
  .clock-time-sub{font-size:13px}
  .week-grid{grid-template-columns:repeat(7,1fr);gap:3px;padding:6px}
  .day-cell{padding:6px;min-height:62px}
  .day-name{font-size:9px}
  .day-date{font-size:14px}
  .day-hours{font-size:11px}
  .header{padding:8px 12px}
  .header-title{font-size:14px}
  /* Full-width primary action on phones; secondary actions stack below */
  .clock-controls{flex-direction:column;gap:8px;width:100%}
  .clock-controls .btn-xl{padding:18px 22px;font-size:16px;min-width:0;width:100%;font-weight:600}
  /* Quick-clock buttons should be thumb-friendly */
  #quick-clock-row .btn{padding:14px 14px !important;font-size:14px;min-height:54px}
  table{font-size:12px}
  th,td{padding:8px 6px}
  /* Form inputs in the pre-clock form should be 44px+ for thumbs */
  .pre-clock-form select,.pre-clock-form input{padding:12px;font-size:16px}
  .pre-clock-form .form-group{margin-bottom:12px}
}
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
// LAUNCH TIME CLOCK PORTAL
//
// State model:
//   - currentUser:       loaded once on page load via /api/auth/me
//   - activeSession:     current open clock session (or null) — drives the
//                        big clock card UI. Updated via 1.5s polling so the
//                        elapsed timer feels live.
//   - currentWeekOffset: 0 = this week, -1 = last week, etc. Bounded by the
//                        scrollback selector (don't allow scrolling further
//                        back than the user picked).
//   - weekData:          response from /api/timeclock/week for the chosen
//                        offset. Cached until the user navigates or polls.
//   - projectsCache:     all projects user can see, used for the picker
//                        dropdowns. Refreshed on demand.
//   - jobsCache:         job definitions per project (loaded lazily).
// ════════════════════════════════════════════════════════════════════════════

let currentUser = null;
let activeSession = null;
let currentWeekOffset = 0;
let weekData = null;
let projectsCache = [];
let jobsCache = {};  // project_id → [{id, name, default_billing_type, default_rate}]
let timerInterval = null;

// ─── DARK MODE ──────────────────────────────────────────────────────────────
function applyDarkMode(on){
  document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light');
  const icon = document.getElementById('dm-icon');
  if (icon) icon.className = on ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function toggleDarkMode(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = !isDark;
  const themeStr = next ? 'dark' : 'light';
  try { localStorage.setItem('lfs-theme', themeStr); } catch(e){}
  applyDarkMode(next);
  // Persist server-side so the choice follows the user across browsers
  try {
    fetch('/api/auth/me/theme', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ theme: themeStr })
    }).catch(()=>{});
  } catch(e) {}
}
(function(){
  try {
    const saved = localStorage.getItem('lfs-theme');
    if (saved === 'dark') applyDarkMode(true);
    else if (saved === 'light') applyDarkMode(false);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applyDarkMode(true);
    }
  } catch(e){}
})();

// ─── HELPERS ────────────────────────────────────────────────────────────────
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDuration(ms){
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtHours(n){
  return (parseFloat(n) || 0).toFixed(2);
}
function fmtDate(d){
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
async function api(path, method='GET', body=null){
  const opts = { method, credentials:'same-origin', headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok){
    let err = `HTTP ${r.status}`;
    try { const j = await r.json(); err = j.error || err; } catch(e){}
    throw new Error(err);
  }
  return r.json();
}

// ─── AUTH + USER PILL ───────────────────────────────────────────────────────
async function loadCurrentUser(){
  try {
    currentUser = await api('/api/auth/me');
    if (currentUser.theme){
      try { localStorage.setItem('lfs-theme', currentUser.theme); } catch(e){}
      applyDarkMode(currentUser.theme === 'dark');
    }
    const pill = document.getElementById('user-pill');
    const pillText = document.getElementById('user-pill-text');
    if (pill && pillText){
      pillText.innerHTML = `<strong>${esc(currentUser.full_name || currentUser.username)}</strong>`;
      pill.style.display = 'flex';
    }
  } catch(e){
    // Not logged in — auth middleware already redirected, but as a safety
    // net send them to login if /api/auth/me 401s
    window.location.href = '/login';
  }
}

// Account modal — same pattern as design/permitting portals
function showAccountMenu(){
  const existing = document.getElementById('account-modal');
  if (existing){ existing.remove(); return; }
  const u = currentUser || {};
  const overlay = document.createElement('div');
  overlay.id = 'account-modal';
  overlay.className = 'modal-overlay';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="modal-content" style="max-width:380px">
      <div class="modal-header">
        <span class="modal-title"><i class="fa-solid fa-user-circle"></i> Account</span>
        <button class="btn btn-icon btn-secondary" onclick="document.getElementById('account-modal').remove()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="text-align:center;padding:8px 0 16px 0;border-bottom:1px solid var(--gray-border);margin-bottom:16px">
          <div style="font-size:18px;font-weight:600;margin-bottom:4px">${esc(u.full_name || u.username || '')}</div>
          <div style="font-size:12px;color:var(--text-muted)">${esc(u.email || u.username || '')}</div>
        </div>
        <button class="btn btn-secondary" style="width:100%;justify-content:flex-start;padding:12px;margin-bottom:8px" onclick="document.getElementById('account-modal').remove();openChangePasswordModal()">
          <i class="fa-solid fa-key" style="margin-right:10px"></i>
          <span>Change Password</span>
        </button>
        <button class="btn btn-secondary" style="width:100%;justify-content:flex-start;padding:12px;color:var(--danger)" onclick="signOut()">
          <i class="fa-solid fa-right-from-bracket" style="margin-right:10px"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}
async function signOut(){
  try { await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'}); } catch(e){}
  try { sessionStorage.removeItem('lfs_token'); } catch(e){}
  window.location.href = '/login';
}

// ─── PROJECT + JOB LOADERS ──────────────────────────────────────────────────
async function loadProjects(){
  try {
    projectsCache = await api('/api/projects?status=active');
  } catch(e){
    projectsCache = [];
  }
}
async function loadJobsForProject(projectId){
  if (jobsCache[projectId]) return jobsCache[projectId];
  // Fetch the full jobs list and filter — simpler than maintaining per-project
  // job APIs for the time clock. Jobs are small enough to cache once globally.
  if (!jobsCache._all){
    try {
      jobsCache._all = await api('/api/jobs');
    } catch(e){ jobsCache._all = []; }
  }
  // Filter jobs by the project's team — same logic the portal Jobs picker uses.
  const proj = projectsCache.find(p => p.id === projectId);
  if (!proj) return [];
  const jobs = jobsCache._all.filter(j => {
    if (!proj.client_id) return true;
    // Match team if known
    return true;
  });
  jobsCache[projectId] = jobs;
  return jobs;
}
function populateProjectSelect(selectEl, selectedId){
  if (!selectEl) return;
  const opts = ['<option value="">— Select project —</option>'];
  // Show only leaf projects (no children) with a name; rollups are folders.
  const leaves = projectsCache.filter(p => !p.is_rollup);
  // Sort by client → name for easier scanning
  leaves.sort((a,b) => {
    const ca = (a.client_name||'').localeCompare(b.client_name||'');
    if (ca) return ca;
    return (a.name||'').localeCompare(b.name||'');
  });
  for (const p of leaves){
    const sel = String(p.id) === String(selectedId) ? ' selected' : '';
    const wo = p.work_order_number ? ` [${esc(p.work_order_number)}]` : '';
    const cli = p.client_name ? `${esc(p.client_name)} — ` : '';
    opts.push(`<option value="${esc(p.id)}"${sel}>${cli}${esc(p.name)}${wo}</option>`);
  }
  selectEl.innerHTML = opts.join('');
}
async function populateJobSelect(selectEl, projectId, selectedId){
  if (!selectEl) return;
  if (!projectId){
    selectEl.innerHTML = '<option value="">— Select project first —</option>';
    return;
  }
  const jobs = await loadJobsForProject(projectId);
  const opts = ['<option value="">— Default (hourly) —</option>'];
  for (const j of jobs){
    const sel = String(j.id) === String(selectedId) ? ' selected' : '';
    opts.push(`<option value="${esc(j.id)}"${sel}>${esc(j.name)}</option>`);
  }
  selectEl.innerHTML = opts.join('');
}

// ─── CLOCK CARD RENDER ──────────────────────────────────────────────────────
async function loadActiveSession(){
  try {
    activeSession = await api('/api/timeclock/active');
  } catch(e){
    activeSession = null;
  }
  renderClockCard();
}

// Cache the last rendered "shape" of the clock card so we don't blow away
// open <select> dropdowns / focused inputs every poll tick. The shape is
// the small set of fields that actually drive what the card looks like —
// if those haven't changed we skip the innerHTML rebuild entirely.
let _lastClockCardShape = null;
function _clockCardShape() {
  if (!activeSession) return 'idle';
  // started_at is the only thing that uniquely identifies an active session
  // shape; the running timer ticks via a separate setInterval that updates
  // just the elapsed-display text node, not the whole card.
  return [
    'active',
    activeSession.id,
    activeSession.started_at,
    activeSession.project_name,
    activeSession.work_order_number,
    activeSession.job_title,
  ].join('|');
}

function renderClockCard(){
  const card = document.getElementById('clock-content');
  if (!card) return;

  // Skip the innerHTML rebuild if nothing meaningful changed — otherwise
  // we destroy any open <select> dropdown the user is interacting with.
  const shape = _clockCardShape();
  if (shape === _lastClockCardShape) return;
  _lastClockCardShape = shape;

  if (activeSession){
    // CLOCKED IN — show running timer + Switch + Clock Out
    const startedMs = new Date(activeSession.started_at).getTime();
    const elapsedMs = Date.now() - startedMs;
    const elapsedHrs = elapsedMs / 3600000;
    card.innerHTML = `
      <div class="clock-status-label"><i class="fa-solid fa-circle" style="color:#4ade80;font-size:8px;margin-right:4px"></i> Clocked In</div>
      <div class="clock-time" id="elapsed-display">${fmtDuration(elapsedMs)}</div>
      <div class="clock-time-sub">${elapsedHrs.toFixed(2)} hours · started ${new Date(activeSession.started_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
      <div class="clock-project">
        <strong>${esc(activeSession.project_name || 'Unknown project')}</strong>
        ${activeSession.work_order_number ? `<span style="opacity:.85">WO# ${esc(activeSession.work_order_number)}</span>` : ''}
        ${activeSession.job_title ? `<br><span style="opacity:.75;font-size:12px">${esc(activeSession.job_title)}</span>` : ''}
      </div>
      <div class="clock-controls">
        <button class="btn btn-xl clock-switch-btn" onclick="openSwitchModal()"><i class="fa-solid fa-arrow-right-arrow-left"></i> Switch Project</button>
        <button class="btn btn-xl clock-out-btn" onclick="clockOut()"><i class="fa-solid fa-stop"></i> Clock Out</button>
      </div>
    `;
    // Start the live timer that updates the display every second
    if (!timerInterval){
      timerInterval = setInterval(() => {
        const el = document.getElementById('elapsed-display');
        if (el && activeSession){
          const ms = Date.now() - new Date(activeSession.started_at).getTime();
          el.textContent = fmtDuration(ms);
        }
      }, 1000);
    }
  } else {
    // CLOCKED OUT — show project + job picker + Clock In button. Quick-clock
    // buttons render asynchronously above the picker once the recents API
    // returns; the picker itself is the always-available fallback.
    if (timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    card.innerHTML = `
      <div class="clock-status-label">Ready to Clock In</div>
      <div class="clock-time" style="font-size:28px">Select Project</div>
      <div class="clock-time-sub">Choose what you'll be working on, then clock in.</div>
      <div id="quick-clock-row"></div>
      <div class="pre-clock-form">
        <div class="form-group">
          <label>Project *</label>
          <select id="ci-project" onchange="ciProjectChanged()"><option value="">— Select project —</option></select>
        </div>
        <div class="form-group">
          <label>Job</label>
          <select id="ci-job"><option value="">— Select a job —</option></select>
        </div>
      </div>
      <div class="clock-controls" style="margin-top:18px">
        <button class="btn btn-xl clock-in-btn" onclick="clockIn()"><i class="fa-solid fa-play"></i> Clock In</button>
      </div>
    `;
    populateProjectSelect(document.getElementById('ci-project'));
    renderQuickClockButtons();
  }
}

// ─── QUICK-CLOCK BUTTONS ────────────────────────────────────────────────────
// Top 3 projects this user has clocked into in the last 14 days, rendered
// as one-tap buttons above the project picker. Cuts clock-in from
// "scroll dropdown → find project → pick job → clock in" to one tap.
let _quickClockCache = null;
async function renderQuickClockButtons(){
  const slot = document.getElementById('quick-clock-row');
  if (!slot) return;
  // Use cache for instant render, then refresh in background
  if (_quickClockCache) renderQuickClockSlot(slot, _quickClockCache);
  try {
    const recents = await api('/api/timeclock/recent');
    _quickClockCache = recents;
    renderQuickClockSlot(slot, recents);
  } catch(e){
    if (!_quickClockCache) slot.innerHTML = '';
  }
}
function renderQuickClockSlot(slot, recents){
  if (!recents || !recents.length){
    slot.innerHTML = '';
    return;
  }
  slot.innerHTML = `
    <div style="margin:14px 0 6px 0;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;text-align:left">Recent</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${recents.map(r => {
        const sub = [r.client_name, r.work_order_number ? 'WO# '+r.work_order_number : null, r.job_title].filter(Boolean).join(' · ');
        return `<button type="button" class="btn" style="text-align:left;padding:10px 12px;background:var(--gray-light,#f1f3f5);border:1px solid var(--gray-border,#dee2e6);border-radius:8px;font-weight:500" onclick="quickClockIn('${esc(r.project_id)}','${esc(r.job_id||'')}','${esc(r.job_title||'')}')">
          <i class="fa-solid fa-bolt" style="color:var(--primary,#1B5FA0);margin-right:6px"></i>
          ${esc(r.project_name)}
          ${sub ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">${esc(sub)}</div>` : ''}
        </button>`;
      }).join('')}
    </div>
  `;
}
async function quickClockIn(projectId, jobId, jobTitle){
  try {
    const body = { project_id: projectId };
    if (jobId) body.job_id = jobId;
    if (jobTitle) body.job_title = jobTitle;
    await api('/api/timeclock/clock-in', { method:'POST', body: JSON.stringify(body) });
    if (window.LFS && window.LFS.toast) window.LFS.toast.success('Clocked in.');
    await loadActiveSession();
    await loadWeek();
  } catch (e){
    if (window.LFS && window.LFS.toast) window.LFS.toast.error('Clock-in failed: ' + (e.message||e));
    else alert('Clock-in failed: ' + (e.message||e));
  }
}

async function ciProjectChanged(){
  const pid = document.getElementById('ci-project').value;
  await populateJobSelect(document.getElementById('ci-job'), pid);
}

async function clockIn(){
  const project_id = document.getElementById('ci-project').value;
  const job_id = document.getElementById('ci-job').value || null;
  if (!project_id){ alert('Please select a project before clocking in.'); return; }
  try {
    await api('/api/timeclock/clock-in', 'POST', { project_id, job_id });
    await loadActiveSession();
    await loadWeek();  // reflect new session immediately
  } catch(e){
    alert('Clock in failed: ' + e.message);
  }
}

async function clockOut(){
  if (!confirm('Clock out now?')) return;
  try {
    await api('/api/timeclock/clock-out', 'POST', {});
    await loadActiveSession();
    await loadWeek();
  } catch(e){
    alert('Clock out failed: ' + e.message);
  }
}

// SWITCH PROJECT MODAL — re-uses entry-modal markup with a different title
function openSwitchModal(){
  const overlay = document.createElement('div');
  overlay.id = 'switch-modal';
  overlay.className = 'modal-overlay';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="modal-content" style="max-width:480px">
      <div class="modal-header">
        <span class="modal-title"><i class="fa-solid fa-arrow-right-arrow-left"></i> Switch Project</span>
        <button class="btn btn-icon btn-secondary" onclick="document.getElementById('switch-modal').remove()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="padding:10px;background:var(--primary-light);color:var(--primary);border-radius:6px;font-size:12px;margin-bottom:14px">
          <i class="fa-solid fa-circle-info"></i> Your current session will close and a new one will start. The hours so far will be saved as a time entry.
        </div>
        <div class="form-group">
          <label>New Project *</label>
          <select id="switch-project" onchange="switchProjectChanged()"><option value="">— Select project —</option></select>
        </div>
        <div class="form-group">
          <label>Job</label>
          <select id="switch-job"><option value="">— Default —</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="document.getElementById('switch-modal').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="doSwitch()"><i class="fa-solid fa-arrow-right-arrow-left"></i> Switch</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  populateProjectSelect(document.getElementById('switch-project'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}
async function switchProjectChanged(){
  const pid = document.getElementById('switch-project').value;
  await populateJobSelect(document.getElementById('switch-job'), pid);
}
async function doSwitch(){
  const project_id = document.getElementById('switch-project').value;
  const job_id = document.getElementById('switch-job').value || null;
  if (!project_id){ alert('Please pick a project to switch to.'); return; }
  try {
    await api('/api/timeclock/switch', 'POST', { project_id, job_id });
    document.getElementById('switch-modal').remove();
    await loadActiveSession();
    await loadWeek();
  } catch(e){
    alert('Switch failed: ' + e.message);
  }
}

// ─── WEEK VIEW ──────────────────────────────────────────────────────────────
function changeWeek(delta){
  const max = parseInt(document.getElementById('scrollback-select').value, 10);
  const next = currentWeekOffset + delta;
  // Allow forward to 0 (current week) but no further; allow back to -max.
  if (next > 0) return;
  if (next < -max) return;
  currentWeekOffset = next;
  loadWeek();
}
function scrollbackChanged(){
  const max = parseInt(document.getElementById('scrollback-select').value, 10);
  // If user shortened the window past their current scroll position, snap back
  if (currentWeekOffset < -max){
    currentWeekOffset = -max;
    loadWeek();
  }
}

async function loadWeek(){
  try {
    weekData = await api('/api/timeclock/week?week_offset=' + currentWeekOffset);
    renderWeek();
    renderEntries();
  } catch(e){
    document.getElementById('week-grid').innerHTML = `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--danger)">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderWeek(){
  if (!weekData) return;
  const grid = document.getElementById('week-grid');
  const label = document.getElementById('week-label');
  // Label the week range
  const startD = new Date(weekData.week_start + 'T00:00:00');
  const endD = new Date(weekData.week_end + 'T00:00:00');
  const sameMonth = startD.getMonth() === endD.getMonth();
  const labelStr = sameMonth
    ? `${startD.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${endD.getDate()}, ${endD.getFullYear()}`
    : `${startD.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${endD.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
  label.textContent = currentWeekOffset === 0 ? `This Week · ${labelStr}` : labelStr;

  // Disable the next-week button when at the current week
  document.getElementById('next-week-btn').disabled = currentWeekOffset >= 0;
  document.getElementById('next-week-btn').style.opacity = currentWeekOffset >= 0 ? '0.4' : '1';

  // Build day cells Mon–Sun
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayKey = new Date().toISOString().slice(0,10);
  let html = '';
  for (let i = 0; i < 7; i++){
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    const dayData = weekData.by_day[key] || { hours: 0, entry_count: 0 };
    const isToday = key === todayKey;
    const isEmpty = dayData.hours === 0;
    html += `<div class="day-cell${isToday ? ' today' : ''}${isEmpty ? ' empty' : ''}">
      <div class="day-name">${dayNames[i]}</div>
      <div class="day-date">${d.getDate()}</div>
      <div class="day-hours">${dayData.hours > 0 ? fmtHours(dayData.hours) + ' h' : '—'}</div>
    </div>`;
  }
  grid.innerHTML = html;
  document.getElementById('week-total-hours').textContent = fmtHours(weekData.total_hours) + ' hrs';
}

function renderEntries(){
  if (!weekData) return;
  const tbody = document.getElementById('entries-body');
  if (!weekData.entries.length){
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No entries for this week yet.</td></tr>';
    return;
  }
  tbody.innerHTML = weekData.entries.map(e => `
    <tr>
      <td>${fmtDate(e.entry_date)}</td>
      <td>${esc(e.project_name || '—')}${e.work_order_number ? `<br><small style="color:var(--text-muted);font-family:monospace">${esc(e.work_order_number)}</small>` : ''}</td>
      <td>${esc(e.job_title || '—')}</td>
      <td style="text-align:right;font-weight:600">${fmtHours(e.hours)}</td>
      <td><small style="color:var(--text-muted)">${esc(e.notes || '')}</small></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-sm btn-secondary btn-icon" onclick="openEditEntryModal('${esc(e.id)}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
      </td>
    </tr>
  `).join('');
}

// ─── ENTRY EDIT MODAL ───────────────────────────────────────────────────────
function openManualEntryModal(){
  document.getElementById('entry-modal-title').textContent = 'Add Time Entry';
  document.getElementById('entry-id').value = '';
  document.getElementById('entry-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('entry-hours').value = '';
  document.getElementById('entry-notes').value = '';
  populateProjectSelect(document.getElementById('entry-project'));
  populateJobSelect(document.getElementById('entry-job'), null);
  document.getElementById('entry-edit-warning').style.display = 'none';
  document.getElementById('entry-delete-btn').style.display = 'none';
  document.getElementById('entry-modal').style.display = 'flex';
}

function openEditEntryModal(id){
  const e = weekData?.entries.find(x => String(x.id) === String(id));
  if (!e){ alert('Entry not found in current view'); return; }
  document.getElementById('entry-modal-title').textContent = 'Edit Time Entry';
  document.getElementById('entry-id').value = e.id;
  document.getElementById('entry-date').value = String(e.entry_date).slice(0,10);
  document.getElementById('entry-hours').value = e.hours;
  document.getElementById('entry-notes').value = e.notes || '';
  populateProjectSelect(document.getElementById('entry-project'), e.project_id);
  populateJobSelect(document.getElementById('entry-job'), e.project_id, null);
  document.getElementById('entry-edit-warning').style.display = '';
  document.getElementById('entry-delete-btn').style.display = '';
  document.getElementById('entry-modal').style.display = 'flex';
}

function closeEntryModal(){
  document.getElementById('entry-modal').style.display = 'none';
}

async function entryProjectChanged(){
  const pid = document.getElementById('entry-project').value;
  await populateJobSelect(document.getElementById('entry-job'), pid);
}

async function saveEntry(){
  const id = document.getElementById('entry-id').value;
  const project_id = document.getElementById('entry-project').value;
  const job_id = document.getElementById('entry-job').value || null;
  const entry_date = document.getElementById('entry-date').value;
  const hours = parseFloat(document.getElementById('entry-hours').value);
  const notes = document.getElementById('entry-notes').value || null;

  if (!project_id){ alert('Project is required'); return; }
  if (!entry_date){ alert('Date is required'); return; }
  if (isNaN(hours) || hours <= 0){ alert('Hours must be greater than 0'); return; }
  if (hours > 24){ alert('Hours cannot exceed 24 per entry'); return; }

  // Resolve job_title from job_id (server stores the title text on the entry)
  let job_title = null;
  if (job_id){
    const jobs = await loadJobsForProject(project_id);
    const j = jobs.find(x => x.id === job_id);
    if (j) job_title = j.name;
  }

  try {
    if (id){
      await api('/api/time-entries/' + id, 'PUT', { project_id, entry_date, hours, job_title, notes });
    } else {
      // Stamp staff_id from currentUser (server uses linked staff record)
      // staff_id is auto-derived server-side via the user's link; we only
      // need to send the project + date + hours payload here.
      await api('/api/time-entries', 'POST', { project_id, entry_date, hours, job_title, notes });
    }
    closeEntryModal();
    await loadWeek();
  } catch(e){
    alert('Save failed: ' + e.message);
  }
}

async function deleteEntry(){
  const id = document.getElementById('entry-id').value;
  if (!id) return;
  if (!confirm('Delete this time entry? This action is logged but cannot be undone.')) return;
  try {
    await api('/api/time-entries/' + id, 'DELETE');
    closeEntryModal();
    await loadWeek();
  } catch(e){
    alert('Delete failed: ' + e.message);
  }
}

// ─── INITIAL LOAD + POLLING ─────────────────────────────────────────────────
async function init(){
  await loadCurrentUser();
  await loadProjects();
  await loadActiveSession();
  await loadWeek();

  // Poll active session every 1.5s so the elapsed timer + clock-in/out state
  // stays current. (The local timer interval already updates the display
  // every second; this one re-fetches in case another browser tab clocked
  // out, or admin made an edit.)
  setInterval(loadActiveSession, 1500);
  // Poll the week view every 5s so newly-committed entries show up without
  // forcing the user to refresh.
  setInterval(loadWeek, 5000);
}

window.addEventListener('load', init);
</script>
