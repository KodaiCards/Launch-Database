<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal - Project Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="client.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-content">
    <div class="logo-section">
      <img id="org-logo" alt="Organization Logo" class="org-logo">
      <h1 id="org-name" class="org-name">Client Portal</h1>
    </div>
    <div class="header-actions">
      <button id="theme-btn" class="theme-btn" title="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button id="logout-btn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        Sign out
      </button>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <div id="loading-state" class="state-container loading-state">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Loading your projects...</p>
  </div>

  <div id="empty-state" class="state-container empty-state" style="display: none;">
    <i class="fa-solid fa-folder-open"></i>
    <p>No projects yet — your team will share project status here as work begins.</p>
  </div>

  <div id="projects-container" class="projects-container" style="display: none;"></div>

  <div id="error-state" class="state-container error-state" style="display: none;">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <p id="error-message">An error occurred. Please try again.</p>
  </div>
</main>

<script src="client.js"></script>
</body>
</html>
