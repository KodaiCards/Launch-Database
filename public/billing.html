<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing — Launch Fiber</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
:root{
  --primary:#1B5FA0;--primary-dark:#134880;--primary-light:#E8F0FB;
  --surface-1:#F5F7FA;--surface-2:#FFFFFF;--surface-3:#F0F0F0;
  --border-strong:#DEE2E6;--border-weak:#EEF1F5;
  --text:#212529;--text-secondary:#495057;--text-muted:#5A6470;
  --success:#28A745;--success-light:#E8F5E9;--success-text:#1B5E20;
  --warning:#FFC107;--warning-light:#FFF8E1;--warning-text:#7A4F0E;
  --info:#1B5FA0;--info-light:#E8F0FB;--info-text:#0D47A1;
  --font:'Inter',sans-serif;
}
html[data-theme="dark"]{
  --primary:#4A90D9;--primary-dark:#1B5FA0;--primary-light:#1E3A5C;
  --surface-1:#1A1F26;--surface-2:#1D2430;--surface-3:#1F2630;
  --border-strong:#2D3540;--border-weak:#252A33;
  --text:#E8EAED;--text-secondary:#C2C7CD;--text-muted:#9BA1A8;
  --success:#5DD27A;--success-light:#1B3D24;--success-text:#A5D6A7;
  --warning:#FFCA28;--warning-light:#3D2F0F;--warning-text:#FFCC80;
  --info:#4A90D9;--info-light:#1E3A5C;--info-text:#90CAF9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:var(--surface-1);color:var(--text)}
.page{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:20px 26px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hdr h1{font-size:20px;font-weight:700}
.tg{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.inv{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;margin-bottom:10px;overflow:hidden}
.inv-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer}
.inv-h:hover{background:var(--surface-1)}
.inv-num{font-weight:600}
.inv-meta{font-size:12px;color:var(--text-muted)}
.inv-total{font-size:16px;font-weight:700}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px}
.pill-draft{background:var(--warning-light);color:var(--warning-text)}
.pill-sent{background:var(--info-light);color:var(--info-text)}
.pill-paid{background:var(--success);color:#fff}
.items{border-top:1px solid var(--border-weak);padding:6px 16px 12px;display:none}
.items.open{display:block}
.item{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border-weak)}
.item:last-child{border-bottom:none}
.muted{color:var(--text-muted)}
</style>
</head>
<body>
  <div class="page" role="main">
    <div class="hdr"><h1>Billing</h1></div>
    <div id="invoiceList"><div class="muted">Loading…</div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/billing_view.js"></script>
  <script src="/js/app_nav.js" data-active="billing"></script>
</body>
</html>
