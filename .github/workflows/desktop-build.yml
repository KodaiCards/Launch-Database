name: Build Desktop Installer

# Builds the proper Windows NSIS installer for the Electron desktop app
# on a Windows runner (where electron-builder works natively, no Wine needed).
# Runs on every push to main that touches desktop/ files, or manually via
# the Actions tab.
#
# Output: Windows .exe installer attached to a GitHub Release tagged
# `desktop-v{version}-{short-sha}`. The Downloads page reads the latest
# release via the GitHub API and shows the .exe as the available download.
#
# First-time setup notes for Carter:
#   - This workflow needs zero secrets. It uses the auto-provisioned
#     GITHUB_TOKEN to create releases.
#   - Releases are public by default. If desktop/ contains anything
#     sensitive, switch to a private release pattern post-demo.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows installer (NSIS) + portable + zip
        run: npx electron-builder --win nsis portable zip --x64
        env:
          # Skip code signing — we don't have a cert yet.
          # Adding a cert post-demo: set CSC_LINK + CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Compute version + tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="desktop-v${VERSION}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (debug / fallback download)
        uses: actions/upload-artifact@v4
        with:
          name: launch-fiber-desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Launch Fiber Desktop ${{ steps.version.outputs.version }} (${{ github.sha }})
          body: |
            Automated build of the Launch Fiber Desktop app.

            **Files**
            - `Launch Fiber Desktop Setup ${{ steps.version.outputs.version }}.exe` — proper Windows installer (recommended)
            - `Launch Fiber Desktop ${{ steps.version.outputs.version }}.exe` — portable single-file build (no install needed)
            - `Launch Fiber Desktop-${{ steps.version.outputs.version }}-win.zip` — full app folder as zip

            Built from commit ${{ github.sha }} on Windows runner via GitHub Actions.
          files: |
            desktop/dist/Launch Fiber Desktop Setup *.exe
            desktop/dist/Launch Fiber Desktop *.exe
            desktop/dist/Launch Fiber Desktop-*-win.zip
          draft: false
          prerelease: false
          make_latest: true
